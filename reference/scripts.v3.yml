            `unknown` consent category do not display on stores with customer cookie consent banners enabled.
        enabled:
          type: boolean
          description: Whether the script is enabled or disabled on the storefront.
        channel_id:
          type: integer
          minimum: 1
        integrity_hashes:
          type: array
          items:
            type: string
          description: >
            Array of [Subresource integrity (SRI)
            hashes](https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity) for external SRC
            scripts that lets browsers validate the contents of the script.


            The hash is the `integrity` attribute on the `script` tag. You can add up to five hashes for a script and
            generate them using any SRI standard-supported algorithm, including SHA-256, SHA-384, and SHA-512. If you
            provide more than one hash, they will all be added to the `integrity` attribute in order, separated by
            whitespace.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The user-friendly name.
        uuid:
          type: string
          format: uuid
          description: The primary identifier.
        date_created:
          type: string
          format: date-time
          description: The date on which this object was initially created.
        date_modified:
          type: string
          format: date-time
          description: The date on which this object was last updated.
      title: script_Full
    Meta:
      type: object
      properties: {}
      description: Response metadata.
      title: Meta
    script_Response:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/script_Full'
        meta:
          $ref: '#/components/schemas/Meta'
      description: >-
        For a list of all locations visit [Scripts
        Visibility](/developer/docs/integrations/scripts#script-visibility-locations).
      title: script_Response
    ContentScriptsPostResponsesContentApplicationJsonSchemaErrors:
      type: object
      properties: {}
      title: ContentScriptsPostResponsesContentApplicationJsonSchemaErrors
    CreateScriptRequestUnprocessableEntityError:
      type: object
      properties:
        status:
          type: integer
          description: |
            The HTTP status code.
        title:
          type: string
          description: |
            The error title describing the particular error.
        type:
          type: string
        instance:
          type: string
        errors:
          $ref: '#/components/schemas/ContentScriptsPostResponsesContentApplicationJsonSchemaErrors'
      description: |
        Error payload for the BigCommerce API.
      title: CreateScriptRequestUnprocessableEntityError
    ContentScriptsGetParametersSort:
      type: string
      enum:
        - name
        - description
        - date_created
        - date_modified
      title: ContentScriptsGetParametersSort
    ContentScriptsGetParametersDirection:
