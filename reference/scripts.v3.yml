        location:
          $ref: '#/components/schemas/ScriptBaseLocation'
          description: Where on the page to place the script. Values are `head` or `footer`.
        visibility:
          $ref: '#/components/schemas/ScriptBaseVisibility'
          description: "Which set of pages the script should load on. \n\nPlease note that you need to have `Checkout content` scope to use `all_pages` and `checkout`.\n\n- The current visibility options are `storefront`, `checkout`, `all_pages` and `order_confirmation`.\n\n     `storefront`: All pages that are not `checkout` or `order_confirmation`.\n\n\t\t \nFor a list of all locations visit [Scripts Visibility](/developer/docs/integrations/scripts#script-visibility-locations)."
        kind:
          $ref: '#/components/schemas/ScriptBaseKind'
          description: >-
            What type of script this is.


            `src` - For scripts that use the src URL. A `script` tag will be generated with its `src` attribute set to
            the value of the `src` property. When your app provides a path to the script, we can optimize and add the
            script automatically for you. The load_method can vary.


            `script_tag` - For scripts that include a raw HTML `script` tag-enclosed block of JavaScript. The value of
            `html` is added directly to the page. The load_method must be default.
        api_client_id:
          type: string
          description: The client id of the API user that created this script, or blank if created by other means.
        consent_category:
          $ref: '#/components/schemas/ScriptBaseConsentCategory'
          description: >-
