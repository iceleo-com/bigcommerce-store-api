openapi: 3.1.0
info:
  title: 'Admin Management: Scripts'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/content/scripts:
    post:
      operationId: scripts_createScript
      summary: Create Script
      description: |-
        Creates a *Script*.

        **Required Fields**
        * name

        **Read Only Fields**
        * uuid

        **Limits**
        * 50 scripts per channel.

        **Notes**
        * If the `kind` is `src`:
          * Specify the `src` property. 
          * Optionally, you can supply a `load_method`. 
          * Do not specify the `html` field.
        * If the `kind` is `script_tag`:
          * Specify the `html` property.
          * Do not specify the `src` field.
        * Each app can have 10 scripts installed.
        * Multiple scripts can be created [per call](/developer/docs/integrations/scripts#notes). 
      tags:
        - scripts
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/script_Response'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScriptRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/script_Post'
      security:
        - X-Auth-Token: []
    get:
      operationId: scripts_getScripts
      summary: List Scripts
      description: >-
        Returns a list of *Scripts*. Optional parameters can be passed in.


        This operation will only return scripts generated by the API key and password used to create the script
        originally. 
      tags:
        - scripts
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          description: >
            Field name to sort the scripts by. Note: Since `id` increments when new scripts are added, you can use that
            field to sort by script create date.
          required: false
          schema:
            $ref: '#/components/schemas/ContentScriptsGetParametersSort'
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/ContentScriptsGetParametersDirection'
        - name: channel_id:in
          in: query
          description: Filters list of scripts by the associated channel ID.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scripts_getScripts_Response_200'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScriptsRequestUnprocessableEntityError'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/content/scripts/{uuid}:
    get:
      operationId: scripts_getScript
      summary: Get Script
      description: Returns a single *Script*.
      tags:
        - scripts
      parameters:
        - name: uuid
          in: path
          description: The identifier for a specific script.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/script_Response'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScriptRequestNotFoundError'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScriptRequestUnprocessableEntityError'
      security:
        - X-Auth-Token: []
    put:
      operationId: scripts_updateScript
      summary: Update Script
      description: Updates a *Script*.
      tags:
        - scripts
      parameters:
        - name: uuid
          in: path
          description: The identifier for a specific script.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/script_Response'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateScriptRequestNotFoundError'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateScriptRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/script_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: scripts_deleteScript
      summary: Delete Script
      description: Deletes a *Script*.
      tags:
        - scripts
      parameters:
        - name: uuid
          in: path
          description: The identifier for a specific script.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScriptRequestNotFoundError'
        '422':
          description: This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScriptRequestUnprocessableEntityError'
      security:
        - X-Auth-Token: []
tags:
  - name: scripts
    description: Manage the scripts injected into storefront pages through Script Manager.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    ScriptBaseLoadMethod:
      type: string
      enum:
        - default
        - async
        - defer
      description: >-
        The load method to use for the script. Values are `default`, `async`, or `defer`. It determines how the script
        should be loaded into the page.
      title: ScriptBaseLoadMethod
    ScriptBaseLocation:
      type: string
      enum:
        - head
        - footer
      description: Where on the page to place the script. Values are `head` or `footer`.
      title: ScriptBaseLocation
    ScriptBaseVisibility:
      type: string
      enum:
        - storefront
        - all_pages
        - checkout
        - order_confirmation
      description: "Which set of pages the script should load on. \n\nPlease note that you need to have `Checkout content` scope to use `all_pages` and `checkout`.\n\n- The current visibility options are `storefront`, `checkout`, `all_pages` and `order_confirmation`.\n\n     `storefront`: All pages that are not `checkout` or `order_confirmation`.\n\n\t\t \nFor a list of all locations visit [Scripts Visibility](/developer/docs/integrations/scripts#script-visibility-locations)."
      title: ScriptBaseVisibility
    ScriptBaseKind:
      type: string
      enum:
        - src
        - script_tag
      description: >-
        What type of script this is.


        `src` - For scripts that use the src URL. A `script` tag will be generated with its `src` attribute set to the
        value of the `src` property. When your app provides a path to the script, we can optimize and add the script
        automatically for you. The load_method can vary.


        `script_tag` - For scripts that include a raw HTML `script` tag-enclosed block of JavaScript. The value of
        `html` is added directly to the page. The load_method must be default.
      title: ScriptBaseKind
    ScriptBaseConsentCategory:
      type: string
      enum:
        - essential
        - functional
        - analytics
        - targeting
      description: >-
        Consent category for GDPR and CCPA compliance. Defaults to `unknown` when not specified. Scripts with an
        `unknown` consent category do not display on stores with customer cookie consent banners enabled.
      title: ScriptBaseConsentCategory
    script_Post:
      type: object
      properties:
        description:
          type: string
          description: The user-friendly description.
        html:
          type: string
          minLength: 0
          maxLength: 65536
          description: An HTML string containing exactly one `script` tag. Present when the script `kind` is `script_tag`.
        src:
          type: string
          description: The `src` attribute of the script to load. Only present if `kind` is `src`.
        auto_uninstall:
          type: boolean
          description: >-
            It will enable automatic cleanup of the script when the single click app is uninstalled or OAuth token is
            revoked.
        load_method:
          $ref: '#/components/schemas/ScriptBaseLoadMethod'
          description: >-
            The load method to use for the script. Values are `default`, `async`, or `defer`. It determines how the
            script should be loaded into the page.
        location:
          $ref: '#/components/schemas/ScriptBaseLocation'
          description: Where on the page to place the script. Values are `head` or `footer`.
        visibility:
          $ref: '#/components/schemas/ScriptBaseVisibility'
          description: "Which set of pages the script should load on. \n\nPlease note that you need to have `Checkout content` scope to use `all_pages` and `checkout`.\n\n- The current visibility options are `storefront`, `checkout`, `all_pages` and `order_confirmation`.\n\n     `storefront`: All pages that are not `checkout` or `order_confirmation`.\n\n\t\t \nFor a list of all locations visit [Scripts Visibility](/developer/docs/integrations/scripts#script-visibility-locations)."
        kind:
          $ref: '#/components/schemas/ScriptBaseKind'
          description: >-
            What type of script this is.


            `src` - For scripts that use the src URL. A `script` tag will be generated with its `src` attribute set to
            the value of the `src` property. When your app provides a path to the script, we can optimize and add the
            script automatically for you. The load_method can vary.


            `script_tag` - For scripts that include a raw HTML `script` tag-enclosed block of JavaScript. The value of
            `html` is added directly to the page. The load_method must be default.
        api_client_id:
          type: string
          description: The client id of the API user that created this script, or blank if created by other means.
        consent_category:
          $ref: '#/components/schemas/ScriptBaseConsentCategory'
          description: >-
            Consent category for GDPR and CCPA compliance. Defaults to `unknown` when not specified. Scripts with an
            `unknown` consent category do not display on stores with customer cookie consent banners enabled.
        enabled:
          type: boolean
          description: Whether the script is enabled or disabled on the storefront.
        channel_id:
          type: integer
          minimum: 1
        integrity_hashes:
          type: array
          items:
            type: string
          description: >
            Array of [Subresource integrity (SRI)
            hashes](https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity) for external SRC
            scripts that lets browsers validate the contents of the script.


            The hash is the `integrity` attribute on the `script` tag. You can add up to five hashes for a script and
            generate them using any SRI standard-supported algorithm, including SHA-256, SHA-384, and SHA-512. If you
            provide more than one hash, they will all be added to the `integrity` attribute in order, separated by
            whitespace.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The user-friendly name.
      required:
        - name
      title: script_Post
    script_Full:
      type: object
      properties:
        description:
          type: string
          description: The user-friendly description.
        html:
          type: string
          minLength: 0
          maxLength: 65536
          description: An HTML string containing exactly one `script` tag. Present when the script `kind` is `script_tag`.
        src:
          type: string
          description: The `src` attribute of the script to load. Only present if `kind` is `src`.
        auto_uninstall:
          type: boolean
          description: >-
