openapi: 3.1.0
info:
  title: 'Admin Content: Pages'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/content/pages:
    get:
      operationId: pagesBulk_getPages
      summary: List Pages
      description: Returns one or more content pages. This endpoint supports bulk operations.
      tags:
        - pagesBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: Return only pages associated with the specified channel.
          required: false
          schema:
            type: integer
        - name: id:in
          in: query
          description: >-
            A comma-separated string of page IDs to fetch. Supports bulk operations. If none of the page IDs passed
            exist, the query will return an empty `data` array.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: name
          in: query
          description: Name of the page.
          required: false
          schema:
            type: string
        - name: name:like
          in: query
          description: Return only pages whose `name` or `body` contain the supplied string.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: The number of results to return per request. See `meta.pagination.per_page` in the response body.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: The ordered grouping of results to return. See `meta.pagination.current_page` in the response body.
          required: false
          schema:
            type: integer
        - name: include
          in: query
          description: >-
            Include the requested property in the response. The `body` property returns the page’s markup, text, or raw
            content.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContentPagesGetParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesCollectionResponse'
        '400':
          description: >-
            Bad Request; reasons for failure include passing query parameters that are not supported on this endpoint,
            but are common on other BigCommerce endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorDetailed'
        '422':
          description: >-
            Invalid input. Reasons for failure include passing supported parameters with values that have the incorrect
            datatype.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorItemized'
      security:
        - X-Auth-Token: []
    post:
      operationId: pagesBulk_createPages
      summary: Create Pages
      description: >-
        Creates one or more content pages. This endpoint supports bulk operations.


        Web pages created via this endpoint are subject to the 4000 web page platform limit. Attempting to create pages
        over the limit will return an error. For more information on platform limits, see [Platform Limits (Help
        Center)](https://support.bigcommerce.com/s/article/Platform-Limits).
      tags:
        - pagesBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            Include the requested property in the response. The `body` property returns the page’s markup, text, or raw
            content.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContentPagesPostParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: >-
            Created.


            Response.data will inherit the data type of the request. A single entry passed as an object will return an
            object for the data property. Any number of entries passed in an array will return an array for the data
            property.


            Properties associated with a page `type` that are not required to create an entry will be created with
            default values. 


            When you make bulk requests, an invalid input in any one entry will return 422. The entries that are valid
            will still be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pages__Bulk__createPages_Response_201'
        '422':
          description: >-
            The input was not valid. This is the result of missing required fields or other invalid arguments. See the
            response for more details.


            When making bulk requests, an invalid input in any one entry will cause the whole request to return 422. The
            entries that are valid will still be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorDetailed'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pages__Bulk__createPages_Request'
      security:
        - X-Auth-Token: []
    put:
      operationId: pagesBulk_updatePages
      summary: Update Pages
      description: Updates one or more content pages. This endpoint supports bulk operations.
      tags:
        - pagesBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            Include the requested property in the response. The `body` property returns the page’s markup, text, or raw
            content.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContentPagesPutParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesCollectionResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorBrief'
        '422':
          description: >-
            The input was not valid. This is the result of missing required fields or other invalid arguments. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorDetailed'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pages__Bulk__updatePages_Request'
      security:
        - X-Auth-Token: []
    delete:
      operationId: pagesBulk_deletePages
      summary: Delete Pages
      description: Deletes one or more content pages. This endpoint supports bulk operations.
      tags:
        - pagesBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: >-
            Request deletion of multiple pages by passing a comma-separated string of corresponding page IDs. Supports
            bulk operations.
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: delete_children
          in: query
          description: >
            When you explicitly set this query parameter to `true`, deleting a parent page will recursively delete all
            its immediate children and their descendants.

            Otherwise, if you set this query parameter to `false` or not provided, deleting a parent page will update
            its immediate children by setting their `parent_id` to `0` and their `is_visible` status to `false`.
          required: false
          schema:
            type: boolean
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No content. A 204 response with no payload indicates successful deletion of all specified pages.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: >-
            Not Found. One of more of the pages specified for deletion did not exist. Specified pages that did exist
            were successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorBrief'
        '422':
          description: Invalid input. See response for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorDetailed'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/content/pages/{pageId}:
    get:
      operationId: pagesSingle_getPage
      summary: Get Page
      description: >-
        Returns one content page.


        > #### Warning

        > **Pay attention to query parameters**

        > This endpoint recognizes the same query parameters as [Get Multiple
        Pages](/developer/api-reference/rest/admin/content/pages/get-pages). If the requested page does not meet the
        query parameters you specify, you will receive a 404 response even if the requested `pageId` does exist.
      tags:
        - pagesSingle
      parameters:
        - name: pageId
          in: path
          description: The ID of the page to be operated on.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            Include the requested property in the response. The `body` property returns the page’s markup, text, or raw
            content.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContentPagesPageIdGetParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePageResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorBrief'
        '422':
          description: Invalid input. One or more path parameter(s) did not have the correct datatype.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorItemized'
      security:
        - X-Auth-Token: []
    put:
      operationId: pagesSingle_updatePage
      summary: Update Page
      description: Updates one content page.
      tags:
        - pagesSingle
      parameters:
        - name: pageId
          in: path
          description: The ID of the page to be operated on.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            Include the requested property in the response. The `body` property returns the page’s markup, text, or raw
            content.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContentPagesPageIdPutParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinglePageResponse'
        '400':
          description: Bad Request; reasons for failure include invalid query parameters. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorDetailed'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorBrief'
        '422':
          description: >-
            The input was not valid. This error is the result of missing required fields or other invalid arguments. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorDetailed'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagePutObj'
      security:
        - X-Auth-Token: []
    delete:
      operationId: pagesSingle_deletePage
      summary: Delete Page
      description: |-
        Deletes one content page.

        > #### Warning
        > **Query parameters not recognized**
        > This endpoint does not recognize query parameters.
      tags:
        - pagesSingle
      parameters:
        - name: pageId
          in: path
          description: The ID of the page to be operated on.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No content. A 204 response with no payload indicates successful deletion of all specified pages.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: The page specified for deletion did not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorBrief'
      security:
        - X-Auth-Token: []
tags:
  - name: pagesBulk
    description: Create, update, and delete storefront content pages in bulk.
  - name: pagesSingle
    description: Create, read, update, and delete individual storefront content pages.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    ContentPagesGetParametersIncludeSchemaItems:
      type: string
      enum:
        - body
      title: ContentPagesGetParametersIncludeSchemaItems
    TypePageType:
      type: string
      enum:
        - page
        - raw
        - contact_form
        - link
        - blog
      description: >-
        Determines the type of page. See [Pages V3 page
        types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
      title: TypePageType
    typePage:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
          default: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the page. Must be unique.
        is_visible:
          type: boolean
          default: true
          description: A boolean value that controls whether the page is available to users or visible in any navigation menus.
        parent_id:
          type: integer
          default: 0
          description: ID of the parent page, if any.
        sort_order:
          type: integer
          description: >-
            Determines the order in which the page is displayed in the parent page’s menu. Pages with lower integers
            display earlier.
        type:
          $ref: '#/components/schemas/TypePageType'
          description: >-
            Determines the type of page. See [Pages V3 page
            types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
        is_homepage:
          type: boolean
          default: false
          description: Determines whether this page loads at the siteʼs root route. For example, at `https://example.com/`.
        is_customers_only:
          type: boolean
          default: false
          description: When `true`, this page is visible only to logged-in customers.
        url:
          type: string
          description: |
            Relative URL on the storefront for this page.
        meta_title:
          type:
            - string
            - 'null'
        meta_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of SEO-relevant keywords to include in the element of this page.
        meta_description:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Description contained within the element of this page.
        search_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of keywords that shoppers can use to locate this page when searching the store.
      required:
        - name
        - type
      description: |
        `type: page`. A user-defined plain-text page.
      title: typePage
    TypeBlogType:
      type: string
      enum:
        - page
        - raw
        - contact_form
        - link
        - blog
      description: >-
        Determines the type of page. See [Pages V3 page
        types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
      title: TypeBlogType
    typeBlog:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
          default: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the page. Must be unique.
        is_visible:
          type: boolean
          default: true
          description: A boolean value that controls whether the page is available to users or visible in any navigation menus.
        parent_id:
          type: integer
          default: 0
          description: ID of the parent page, if any.
        sort_order:
          type: integer
          description: >-
            Determines the order in which the page is displayed in the parent page’s menu. Pages with lower integers
            display earlier.
        type:
          $ref: '#/components/schemas/TypeBlogType'
          description: >-
            Determines the type of page. See [Pages V3 page
            types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
        is_homepage:
          type: boolean
          default: false
          description: Determines whether this page loads at the siteʼs root route. For example, at `https://example.com/`.
        is_customers_only:
          type: boolean
          default: false
          description: When `true`, this page is visible only to logged-in customers.
        url:
          type: string
          description: |
            Relative URL on the storefront for this page.
        meta_title:
          type:
            - string
            - 'null'
        meta_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of SEO-relevant keywords to include in the element of this page.
        meta_description:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Description contained within the element of this page.
        search_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of keywords that shoppers can use to locate this page when searching the store.
      required:
        - name
        - type
      description: >-
        A page that contains blog posts. Use caution; `blog`-type pages can only be created in the store control panel,
        but you may be able to change the type of a blog page to something else with this API. Use the [blog feature of
        the REST Content API](/developer/api-reference/rest/admin/content/store-content/blog-posts/create-blog-posts) to
        work with blog posts and tags.
      title: typeBlog
    TypeContactFormType:
      type: string
      enum:
        - page
        - raw
        - contact_form
        - link
        - blog
      description: >-
        Determines the type of page. See [Pages V3 page
        types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
      title: TypeContactFormType
    typeContactForm:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
          default: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the page. Must be unique.
        is_visible:
          type: boolean
          default: true
          description: A boolean value that controls whether the page is available to users or visible in any navigation menus.
        parent_id:
          type: integer
          default: 0
          description: ID of the parent page, if any.
        sort_order:
          type: integer
          description: >-
            Determines the order in which the page is displayed in the parent page’s menu. Pages with lower integers
            display earlier.
        type:
          $ref: '#/components/schemas/TypeContactFormType'
          description: >-
            Determines the type of page. See [Pages V3 page
            types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
        is_homepage:
          type: boolean
          default: false
          description: Determines whether this page loads at the siteʼs root route. For example, at `https://example.com/`.
        is_customers_only:
          type: boolean
          default: false
          description: When `true`, this page is visible only to logged-in customers.
        url:
          type: string
          description: |
            Relative URL on the storefront for this page.
        meta_title:
          type:
            - string
            - 'null'
        meta_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of SEO-relevant keywords to include in the element of this page.
        meta_description:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Description contained within the element of this page.
        search_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of keywords that shoppers can use to locate this page when searching the store.
        email:
          type: string
          maxLength: 255
          description: >-
            Applicable when the page type is `contact_form`: contact email address that receives messages sent using the
            form. Must be unique.
        contact_fields:
          type: string
          description: >
            A comma-separated list of the contact field forms that are enabled in the store control panel for display on
            the subject storefront. Possible fields include:


            | Field | Description |

            |:------|:------------|

            | `fullname` | The full name of the customer submitting the form. |

            | `phone` | The customer’s phone number. |

            | `companyname` | The customer’s company name. |

            | `orderno` | A field that lets customers specify a subject order number. |

            | `rma` | A customer’s submitted RMA (Return Merchandise Authorization) number. |
      required:
        - name
        - type
      description: '`type: contact_form`. A user-customizable page that contains a contact form. Body content returns HTML.'
      title: typeContactForm
    TypeRawType:
      type: string
      enum:
        - page
        - raw
        - contact_form
        - link
        - blog
      description: >-
        Determines the type of page. See [Pages V3 page
        types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
      title: TypeRawType
    typeRaw:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
          default: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the page. Must be unique.
        is_visible:
          type: boolean
          default: true
          description: A boolean value that controls whether the page is available to users or visible in any navigation menus.
        parent_id:
          type: integer
          default: 0
          description: ID of the parent page, if any.
        sort_order:
          type: integer
          description: >-
            Determines the order in which the page is displayed in the parent page’s menu. Pages with lower integers
            display earlier.
        type:
          $ref: '#/components/schemas/TypeRawType'
          description: >-
            Determines the type of page. See [Pages V3 page
            types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
        is_homepage:
          type: boolean
          default: false
          description: Determines whether this page loads at the siteʼs root route. For example, at `https://example.com/`.
        is_customers_only:
          type: boolean
          default: false
          description: When `true`, this page is visible only to logged-in customers.
        url:
          type: string
          description: |
            Relative URL on the storefront for this page.
        search_keywords:
          type:
            - string
            - 'null'
          default: '""'
          description: |
            Comma-separated list of keywords that shoppers can use to locate this page when searching the store.
        body:
          type:
            - string
            - 'null'
          description: >
            HTML or variable that populates the element of this page, in default/desktop view. Required in a `POST`
            request if the page type is `raw`.
        content_type:
          type: string
          description: The MIME type of the page body.
      required:
        - name
        - type
        - body
      description: '`type: raw`. A user-defined page with a body that contains HTML markup or other stringified code.'
      title: typeRaw
    TypeLinkType:
      type: string
      enum:
        - page
        - raw
        - contact_form
        - link
        - blog
      description: >-
        Determines the type of page. See [Pages V3 page
        types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
      title: TypeLinkType
    typeLink:
      type: object
      properties:
        id:
          type: integer
        channel_id:
          type: integer
          default: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the page. Must be unique.
        is_visible:
          type: boolean
          default: true
          description: A boolean value that controls whether the page is available to users or visible in any navigation menus.
        parent_id:
          type: integer
          default: 0
          description: ID of the parent page, if any.
        sort_order:
          type: integer
          description: >-
            Determines the order in which the page is displayed in the parent page’s menu. Pages with lower integers
            display earlier.
        type:
          $ref: '#/components/schemas/TypeLinkType'
          description: >-
            Determines the type of page. See [Pages V3 page
            types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
        is_homepage:
          type: boolean
          default: false
          description: Determines whether this page loads at the siteʼs root route. For example, at `https://example.com/`.
        is_customers_only:
