      title: PagePutObjType
    PagePutBulk:
      type: object
      properties:
        channel_id:
          type: integer
          default: 1
          description: |
            The ID of the channel where this page should be shown.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            The name of the page. Must be unique.
        is_visible:
          type: boolean
          description: |
            Boolean value that specifies the visibility of the page in the storefront’s navigation menu.
                      
            Indicates whether the page is available to users and visible in any menus.
        parent_id:
          type: integer
          default: 0
          description: |
            ID of any parent Web page.
        sort_order:
          type: integer
          default: 0
          description: >
            Specifies the order in which the page is displayed on the storefront. (Lower integers specify earlier
            display.)
        type:
          $ref: '#/components/schemas/PagePutObjType'
          description: >-
            Specifies the type of page. See [Pages V3 page
            types](/developer/api-reference/rest/admin/content/pages#page-types) for more about the differences.
        body:
          type:
            - string
            - 'null'
          description: >
            HTML or variable that populates the element of this page, in default/desktop view. Required in a `POST`
            request if the page type is `raw`.
        is_homepage:
          type: boolean
          description: |
            Boolean value that specifies whether this page is the storefront’s home page.
        is_customers_only:
          type: boolean
          description: |
            Boolean value. When `true`, this page is visible only to logged-in customers.
        email:
          type: string
          maxLength: 255
          description: >-
            Applicable when the page type is `contact_form`: contact email address that receives messages sent via the
            form. Must be unique.
        meta_title:
          type:
            - string
            - 'null'
        link:
          type: string
          description: |
            Required in a `POST` request to create a link if the page type is `link`.
        contact_fields:
          type: string
          description: >
            Applicable when the page type is `contact_form`: comma-separated list of keywords representing the fields
            enabled in the control panel for storefront display. Possible fields include:


            |Field|Description|

            |-|-|

            |`fullname`|Full name of the customer submitting the form|

            |`phone`|Customer’s phone number, as submitted on the form|

            |`companyname`|Customer’s submitted company name|

            |`orderno`|Customer’s submitted order number|

            |`rma`|Customer’s submitted RMA (Return Merchandise Authorization) number|
        meta_keywords:
          type:
            - string
            - 'null'
          default: ''
          description: |
            Comma-separated list of SEO-relevant keywords to include in the element of this page.
        meta_description:
          type:
            - string
            - 'null'
          description: |
            Description contained within the element of this page.
        search_keywords:
          type:
            - string
            - 'null'
          description: |
            Comma-separated list of keywords that shoppers can use to locate this page when searching the store.
        url:
          type: string
          description: |
            Relative URL on the storefront for this page.
        id:
          type: integer
          description: The ID of the target page.
      required:
        - id
      title: PagePutBulk
