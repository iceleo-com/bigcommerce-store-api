openapi: 3.1.0
info:
  title: "Admin Management: Tax"
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/tax/properties:
    get:
      operationId: taxProperties_getTaxProperties
      summary: List Tax Properties
      description: Retrieve all tax properties defined in this store.
      tags:
        - taxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: ID of tax property. To target multiple tax properties, provide a comma-separated list of IDs such as `12,34,56`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: type:in
          in: query
          description: Filter result by the type of tax property. To target multiple types, provide a comma-separated list of types such as `customer,product`.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Properties_getTaxProperties_Response_200"
        "400":
          description: Request parameters invalid
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
    post:
      operationId: taxProperties_createTaxProperties
      summary: Create Tax Properties
      description: Create one or more tax properties. A **code** and a **display name** must be included when creating tax properties.
      tags:
        - taxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Properties_createTaxProperties_Response_200"
        "422":
          description: The request body does not meet specifications.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PropertyPOST"
      security:
        - X-Auth-Token: []
    put:
      operationId: taxProperties_updateTaxProperties
      summary: Update Tax Properties
      description: Update one or more tax properties. Only fields specified will be adjusted.
      tags:
        - taxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Properties_updateTaxProperties_Response_200"
        "422":
          description: The request body does not meet specifications.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PropertyPUT"
      security:
        - X-Auth-Token: []
    delete:
      operationId: taxProperties_deleteTaxProperties
      summary: Delete Tax Properties
      description: Delete one or multiple tax properties. A tax property must have zero usages within product tax properties before you can delete it.
      tags:
        - taxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: ID of tax property. To target multiple tax properties, provide a comma-separated list of IDs such as `12,34,56`.
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        "400":
          description: Request parameters invalid
          content:
            application/json:
              schema:
                description: Any type
        "409":
          description: Tax Property is in use and cannot be deleted.
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/tax/products/properties:
    get:
      operationId: productTaxProperties_getProductsTaxProperties
      summary: List Product Tax Properties
      description: Retrieve the tax properties that are associated with one or more products.
      tags:
        - productTaxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: product_id:in
          in: query
          description: ID of product. To target multiple products, provide a comma-separated list of IDs such as `12,34,56`.
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product_Tax_Properties_getProductsTaxProperties_Response_200"
        "400":
          description: Request parameters invalid
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
    put:
      operationId: productTaxProperties_updateProductTaxProperties
      summary: Update Product Tax Properties
      description: Update the tax properties associated with one or more products. This operation will be additive to any tax property values already associated with the product, overwriting any existing tax property values.
      tags:
        - productTaxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product_Tax_Properties_updateProductTaxProperties_Response_200"
        "422":
          description: The request body does not meet specifications.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProductTaxProperty"
      security:
        - X-Auth-Token: []
    delete:
      operationId: productTaxProperties_deleteProductTaxProperties
      summary: Delete Product Tax Properties
      description: Delete tax properties that are associated with one or more products.
      tags:
        - productTaxProperties
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: product_id:in
          in: query
          description: ID of product. To target multiple products, provide a comma-separated list of IDs such as `12,34,56`.
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        "400":
          description: Request parameters invalid
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
tags:
  - name: taxCustomers
    description: Retrieve the customer tax information used by tax providers.
  - name: taxProperties
    description: Create and manage the tax properties used to classify products.
  - name: productTaxProperties
    description: Assign tax properties to individual products.
  - name: taxZones
    description: Create and manage the geographic zones a store applies tax rates to.
  - name: taxRates
    description: Create and manage the tax rates applied within a tax zone.
  - name: taxSettings
    description: Manage store-level tax settings.
  - name: taxZoneCheck
    description: Determine which tax zone applies to a given address.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    ProductTaxProperty:
      type: object
      properties:
        product_id:
          type: integer
          description: A reference to the product that the product tax properties are associated with.
        tax_properties:
          $ref: "#/components/schemas/ProductTaxPropertyTaxProperties"
          description: A simple key-value pairing. The tax property must be defined to associate a value. These values will be sent to the active tax provider during Tax Provider API operations whenever the associated product is included in the operation.
      required:
        - product_id
        - tax_properties
      description: A collection of tax property values associated with a product.
      title: ProductTaxProperty
    ProductTaxPropertyTaxProperties:
      type: object
      properties: {}
      description: A simple key-value pairing. The tax property must be defined to associate a value. These values will be sent to the active tax provider during Tax Provider API operations whenever the associated product is included in the operation.
      title: ProductTaxPropertyTaxProperties
    Product_Tax_Properties_updateProductTaxProperties_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductTaxProperty"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Product Tax Properties_updateProductTaxProperties_Response_200
    MetaOpen:
      type: object
      properties: {}
      description: Response metadata.
      title: MetaOpen
    Product_Tax_Properties_getProductsTaxProperties_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductTaxProperty"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Product Tax Properties_getProductsTaxProperties_Response_200
    PropertyPUT:
      type: object
      properties:
        id:
          type: integer
          description: An internal identifier used by other operations.
        code:
          type: string
          description: The unique string programmatically references this unique tax property by the tax provider. Merchants should liaise with their tax provider to explore supported values and functions.
        display_name:
          type: string
          description: The human-readable name for this property. This string will be displayed on the Products screen as a field label.
        description:
          type: string
          description: Optional. Additional detail about this tax property may help guide merchants. This string will be displayed on the Products screen as a tooltip associated with the relevant field.
      required:
        - id
      title: PropertyPUT
    Tax_Properties_updateTaxProperties_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Properties_updateTaxProperties_Response_200
    Property:
      type: object
      properties:
        id:
          type: integer
          description: An internal identifier used by other operations.
        code:
          type: string
          description: The unique string programmatically references this unique tax property by the tax provider. Merchants should liaise with their tax provider to explore supported values and functions.
        display_name:
          type: string
          description: The human-readable name for this property. This string will be displayed on the Products screen as a field label.
        description:
          type: string
          description: Optional. Additional detail about this tax property may help guide merchants. This string will be displayed on the Products screen as a tooltip associated with the relevant field.
        created_at:
          type: string
          format: date-time
          description: Datetime.
        updated_at:
          type: string
          format: date-time
          description: Datetime.
        type:
          $ref: "#/components/schemas/PropertyType"
          description: The type of entity that the tax property can be associated with.
      title: Property
    PropertyType:
      type: string
      enum:
        - PRODUCT
        - CUSTOMER
      description: The type of entity that the tax property can be associated with.
      title: PropertyType
    PropertyPOST:
      type: object
      properties:
        code:
          type: string
          description: The unique string programmatically references this unique tax property by the tax provider. Merchants should liaise with their tax provider to explore supported values and functions.
        display_name:
          type: string
          description: The human-readable name for this property. This string will be displayed on the Products screen as a field label.
        description:
          type: string
          description: Additional detail about this tax property may help guide merchants. This string will be displayed on the Products screen as a tooltip associated with the relevant field.
        type:
          $ref: "#/components/schemas/PropertyPostType"
          description: The type of entity that the tax property can be associated with. Default
      required:
        - code
        - display_name
        - type
      title: PropertyPOST
    PropertyPostType:
      type: string
      enum:
        - PRODUCT
        - CUSTOMER
      description: The type of entity that the tax property can be associated with. Default
      title: PropertyPostType
    Tax_Properties_createTaxProperties_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Properties_createTaxProperties_Response_200
    Tax_Properties_getTaxProperties_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Properties_getTaxProperties_Response_200
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |-
        ### OAuth scopes

        | UI Name | Permission | Parameter |
        |:--------|:-----------|:----------|
        |  Information & Settings | modify | `store_v2_information` |
        |  Information & Settings | read-only | `store_v2_information_read_only` |

        ### Authentication header

        | Header | Argument | Description |
        |:-------|:---------|:------------|
        | `X-Auth-Token` | `access_token` | For more about API accounts that generate `access_token`s, see our [Guide to API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#api-accounts). |

        ### Further reading

        For example requests and more information about authenticating BigCommerce APIs, see [Authentication and Example Requests](/developer/docs/overview/api-fundamentals/api-accounts#x-auth-token-header-example-requests).

        For more about BigCommerce OAuth scopes, see our [Guide to API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#oauth-scopes).

        For a list of API status codes, see [API Status Codes](/developer/api-reference/rest/overview#rest-http-status-codes).
