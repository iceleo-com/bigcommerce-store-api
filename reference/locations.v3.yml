openapi: 3.1.0
info:
  title: "Admin Management: Inventory"
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/inventory/locations:
    post:
      operationId: locations_createLocations
      summary: Create Locations
      description: |
        Create new locations.

        **Limits**
        * Limit of 50 concurrent requests.
        * Limit of 100 active locations.
      tags:
        - locations
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Locations have been successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTransactionResponse"
        "422":
          description: |
            Incorrect entity. Locations were not valid. This results from missing required fields, invalid data, or partial error. See the response for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationsCreateRequest"
      security:
        - X-Auth-Token: []
    get:
      operationId: locations_getLocations
      summary: List Locations
      description: |
        List locations. You can use optional filter parameters.

        **Limits**
        * Limit of 50 concurrent requests.
        * Limit of 1000 items for payload length.
      tags:
        - locations
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: location_id:in
          in: query
          description: Comma separated list of `location_id`.
          required: false
          schema:
            type: integer
        - name: location_code:in
          in: query
          description: Comma separated list of `location_code`.
          required: false
          schema:
            type: string
        - name: type_id:in
          in: query
          description: Comma separated list of locations type codes.
          required: false
          schema:
            type: string
        - name: managed_by_external_source
          in: query
          description: Filter whether an external source manages location inventory levels.
          required: false
          schema:
            type: boolean
        - name: is_active
          in: query
          description: Filter by active locations flag; return both if not specified.
          required: false
          schema:
            type: boolean
        - name: storefront_visibility
          in: query
          description: Filter by storefront_visibility flag; return both if not specified.
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: The request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locations_getLocations_Response_200"
      security:
        - X-Auth-Token: []
    put:
      operationId: locations_updateLocations
      summary: Update Locations
      description: |
        
        Update existing locations.

        **Limits**
        * Limit of 50 concurrent requests.
        * Limit of 100 active locations.
      tags:
        - locations
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: The request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTransactionResponse"
        "422":
          description: |
            Incorrect entity. Locations were not valid. This results from missing required fields, invalid data, or partial error. See the response for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationsUpdateRequest"
      security:
        - X-Auth-Token: []
    delete:
      operationId: locations_deleteLocations
      summary: Delete Locations
      description: |
        Delete existing locations. 

        You cannot delete locations that are shipping origins or have open order transactions. The location with a `location_id` of 1 is the storeʼs default shipping origin, and you cannot change the shipping origin.

        You can delete locations assigned to pickup methods.

        > Warning:
        >
        > Deleting locations that have inventory also deletes its stock.
      tags:
        - locations
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: location_id:in
          in: query
          description: Comma separated list of `location_id`.
          required: true
          schema:
            type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "204":
          description: The locations were deleted. The response has no body.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        "404":
          description: Request has been rejected due to resource not being found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Incorrect entity. The location is not valid. This error is the result of missing required fields or  invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/inventory/locations/{location_id}/metafields:
    get:
      operationId: metafields_getLocationMetafields
      summary: List Metafields
      description: Retrieve metafields for a location.
      tags:
        - metafields
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: The request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metafields_getLocationMetafields_Response_200"
      security:
        - X-Auth-Token: []
    post:
      operationId: metafields_createLocationMetafield
      summary: Create Metafield
      description: Create a location metafield.
      tags:
        - metafields
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: The request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metafields_createLocationMetafield_Response_200"
        "400":
          description: Bad Request. Metafield is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLocationMetafieldRequestBadRequestError"
        "409":
          description: |
            The `Metafield` conflicted with another `Metafield`. This can result from duplicate unique key combinations of the appʼs client id, namespace, key, resource_type, and resource_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLocationMetafieldRequestConflictError"
        "422":
          description: |
            The `Metafield` was not valid. This is the result of missing required fields or invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetafieldBase"
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/inventory/locations/{location_id}/metafields/{metafield_id}:
    get:
      operationId: metafields_getLocationMetafield
      summary: Get Metafield
      description: Get a metafield by location.
      tags:
        - metafields
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: metafield_id
          in: path
          description: Unique identifier for a metafield.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: The request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metafields_getLocationMetafield_Response_200"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - X-Auth-Token: []
    put:
      operationId: metafields_updateLocationMetafield
      summary: Update Metafield
      description: Update a metafield.
      tags:
        - metafields
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: metafield_id
          in: path
          description: Unique identifier for a metafield.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: The request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metafields_updateLocationMetafield_Response_200"
        "400":
          description: Bad Request. Metafield is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLocationMetafieldRequestBadRequestError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetafieldBase"
      security:
        - X-Auth-Token: []
    delete:
      operationId: metafields_deleteLocationMetafield
      summary: Delete Metafield
      description: Delete a metafield.
      tags:
        - metafields
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: metafield_id
          in: path
          description: Unique identifier for a metafield.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/inventory/locations/metafields:
    get:
      operationId: batchMetafields_getLocationsMetafields
      summary: List Metafields
      description: Get all location metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla 'key' query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespaces.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: Filter based on comma-separated metafieldʼs namespaces. Could be used with vanilla 'namespace' query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: "#/components/schemas/InventoryLocationsMetafieldsGetParametersDirection"
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/InventoryLocationsMetafieldsGetParametersIncludeFieldsSchemaItems"
        - name: date_modified:min
          in: query
          description: |
            'Query parameter that lets you filter by the minimum date modified, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or `2024-05-14`. Returns metafields modified after this date.' 
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: |
            'Query parameter that lets you filter by the maximum date modified, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or `2024-05-14`. Returns metafields modified before this date.' 
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: |
            'Query parameter that lets you filter by the minimum date created, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or `2024-05-14`. Returns metafields created after this date.'
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: |
            'Query parameter that lets you filter by the maximum date created, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or `2024-05-14`. Returns metafields created before this date.'
          required: false
          schema:
            type: string
      responses:
        "200":
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionResponse"
      security:
        - X-Auth-Token: []
    post:
      operationId: batchMetafields_createLocationsMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            List of created `Metafield` objects. # TODO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionResponse_POST_PUT"
        "400":
          description: Bad Request. Metafield is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLocationsMetafieldsRequestBadRequestError"
        "422":
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/InventoryLocationsMetafieldsPostRequestBodyContentApplicationJsonSchemaItems"
      security:
        - X-Auth-Token: []
    put:
      operationId: batchMetafields_updateLocationsMetafields
      summary: Update Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionResponse_POST_PUT"
        "400":
          description: Bad Request. Metafield is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLocationsMetafieldsRequestBadRequestError"
        "422":
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/InventoryLocationsMetafieldsPutRequestBodyContentApplicationJsonSchemaItems"
      security:
        - X-Auth-Token: []
    delete:
      operationId: batchMetafields_deleteLocationsMetafields
      summary: Delete Multiple Metafields
      description: Delete all location metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionDeleteResponseSuccess"
        "422":
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE"
      requestBody:
        description: List of metafield IDs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
tags:
  - name: adjustments
    description: Make absolute or relative adjustments to inventory levels.
  - name: items
    description: Retrieve inventory levels for items across locations.
  - name: locations
    description: Create and manage the inventory locations a store ships from.
  - name: metafields
    description: Attach custom metafield data to individual locations.
  - name: batchMetafields
    description: Create, update, and delete location metafields in bulk.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    MetaFieldCollectionResponsePartialSuccess_DELETE:
      type: object
      properties:
        data:
          type: array
          items:
            type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Error"
        meta:
          $ref: "#/components/schemas/WriteCollectionPartialSuccessMeta"
      description: |
        Response payload for the BigCommerce API.
      title: MetaFieldCollectionResponsePartialSuccess_DELETE
    WriteCollectionPartialSuccessMeta:
      type: object
      properties:
        total:
          type: integer
          description: |
            Total number of items in the result set.
        success:
          type: integer
          description: |
            Total number of items that were successfully deleted.
        failed:
          type: integer
          description: |
            Total number of items that failed to be deleted.
      description: Additional data about the response.
      title: WriteCollectionPartialSuccessMeta
    Error:
      type: object
      properties:
        status:
          type: integer
          description: |
            The HTTP status code for the error.
        title:
          type: string
          description: |
            The error title.
        type:
          type: string
          description: |
            The error type.
        errors:
          $ref: "#/components/schemas/ErrorDetail"
      description: |
        Error response payload for the BigCommerce API.
      title: Error
    ErrorDetail:
      type: object
      properties: {}
      description: |
        Error detail response payload for the BigCommerce API.
      title: ErrorDetail
    MetaFieldCollectionDeleteResponseSuccess:
      type: object
      properties:
        data:
          type: array
          items:
            type: integer
        errors:
          type: array
          items:
            description: Any type
          description: Empty for 200 responses.
        meta:
          $ref: "#/components/schemas/WriteCollectionSuccessMeta"
      description: |
        Response payload for the BigCommerce API.
      title: MetaFieldCollectionDeleteResponseSuccess
    WriteCollectionSuccessMeta:
      type: object
      properties:
        total:
          type: integer
          description: |
            Total number of items in the result set.
        success:
          type: integer
          description: |
            Total number of items that were successfully deleted.
        failed:
          type: integer
          description: |
            Total number of items that failed to be deleted.
      description: Additional data about the response.
      title: WriteCollectionSuccessMeta
    InventoryLocationsMetafieldsPutRequestBodyContentApplicationJsonSchemaItems:
      type: object
      properties:
        permission_set:
          $ref: "#/components/schemas/InventoryLocationsMetafieldsPutRequestBodyContentApplicationJsonSchemaItemsPermissionSet"
          description: |
            Determines the visibility and writeability of the field by other API consumers.
            | Value | Description |
            | :--- | :--- |
            | `app_only` | Private to the app that owns the field. |
            | `read` | Visible to other API consumers. |
            | `write` | Open for reading and writing by other API consumers. |
            | `read_and_sf_access` | Visible to other API consumers, including on the storefront. |
            | `write_and_sf_access` | Open for reading and writing by other API consumers, including on the storefront. |
        namespace:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Namespace for the metafield, for organizational purposes.
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The name of the field, for example: `location_id`, `color`.
        value:
          type: string
          minLength: 1
          maxLength: 65535
          description: |
            The value of the field, for example: `1`, `blue`.
        description:
          type: string
          minLength: 0
          maxLength: 255
          description: |
            Description for the metafields.
        id:
          type: integer
          description: |
            The ID of metafield to update.
      required:
        - id
      description: |
        Common Metafield properties.
      title: InventoryLocationsMetafieldsPutRequestBodyContentApplicationJsonSchemaItems
    InventoryLocationsMetafieldsPutRequestBodyContentApplicationJsonSchemaItemsPermissionSet:
      type: string
      enum:
        - app_only
        - read
        - write
        - read_and_sf_access
        - write_and_sf_access
      description: |
        Determines the visibility and writeability of the field by other API consumers.
        | Value | Description |
        | :--- | :--- |
        | `app_only` | Private to the app that owns the field. |
        | `read` | Visible to other API consumers. |
        | `write` | Open for reading and writing by other API consumers. |
        | `read_and_sf_access` | Visible to other API consumers, including on the storefront. |
        | `write_and_sf_access` | Open for reading and writing by other API consumers, including on the storefront. |
      title: InventoryLocationsMetafieldsPutRequestBodyContentApplicationJsonSchemaItemsPermissionSet
    UpdateLocationsMetafieldsRequestBadRequestError:
      type: object
      properties:
