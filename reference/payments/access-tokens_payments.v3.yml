openapi: 3.1.0
info:
  title: 'Admin Payments: Payment Access Token'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/payments/access_tokens:
    post:
      operationId: tokens_createPaymentAccessToken
      summary: Create Payment Access Token
      description: >-
        Use this endpoint to create a payment access token. A payment access token is required to process payments with
        the BigCommerce API.


        **Required Fields**

        * order_id
      tags:
        - tokens
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: Payment access token has been successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens_createPaymentAccessToken_Response_201'
        '400':
          description: Request has been rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentAccessTokenRequestBadRequestError'
        '401':
          description: Valid authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentAccessTokenRequestUnauthorizedError'
        '404':
          description: Request has been rejected due to resource not being found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentAccessTokenRequestNotFoundError'
        '409':
          description: Request has been rejected due to conflict with the current state of the target resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentAccessTokenRequestConflictError'
        '422':
          description: Request has been rejected due to missing or invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentAccessTokenRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  $ref: '#/components/schemas/Order'
              required:
                - order
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/payments/stored-instruments/access-tokens:
    post:
      operationId: manageInstruments_create-token
      summary: Create Instrument Access Token
      description: Creates a token.
      tags:
        - manageInstruments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: Created token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create_token_response'
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/payments/stored-instruments:
    get:
      operationId: manageInstruments_list-instruments-for-store
      summary: List Instruments
      description: >-
        Lists all available stored instruments for a store. This list will include all types of stored instruments
        namely card, account, and bank_account instruments.
      tags:
        - manageInstruments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: The requested page.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: The maximum number of results.
          required: false
          schema:
            type: integer
        - name: after
          in: query
          description: >-
            The cursor reference of the last entry for the previous page. Use the `end_cursor` value from the last
            response to get the next page (`end_cursor` is only returned on the first page or when the request contains
            query parameter `before` or `after`). For example `after=ODc%3D`.
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: >-
            The cursor reference of the first entry for the next page. Use the `start_cursor` value from the last
            response to get the previous page (`start_cursor` is only returned on the first page or when the request
            contains query parameter `before` or `after`). For example `before=ODg%3D`.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_stored_instruments_response'
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
      security:
        - X-Auth-Token: []
    post:
      operationId: manageInstruments_bulk-import-instruments
      summary: Bulk Import Instruments
      description: Imports instruments that were vaulted outside the store.
      tags:
        - manageInstruments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: All instruments were successfully imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Instruments_bulk-import-instruments_Response_200'
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
        '422':
          description: Failed responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulk-import-instrumentsRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/import_request_body'
      security:
        - X-Auth-Token: []
    put:
      operationId: manageInstruments_update-instrument
      summary: Update Instrument
      description: >
        Updates an instrument in store and can update billing address in the provider's vault.

        As of this writing, only the Braintree gateway supports updating customer billing addresses.

        If billing_address is included in the request, an attempt will be made to update the billing address at
        provider's vault.
      tags:
        - manageInstruments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Instrument successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Instruments_update-instrument_Response_200'
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
        '422':
          description: Unprocessable entity examples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_request_body'
      security:
        - X-Auth-Token: []
    delete:
      operationId: manageInstruments_bulk-delete-instruments
      summary: Bulk Delete Instruments
      description: Deletes instruments from the store without triggering deletion on the provider side.
      tags:
        - manageInstruments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: token:in
          in: query
          description: Filter by a list of tokens.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bulk-delete-instrumentsRequestNotFoundError'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/payments/stored-instruments/{instrument_token}:
    delete:
      operationId: manageInstruments_unvault-instrument
      summary: Remove Instrument from Store and Gateway
      description: Deletes instrument from store and provider's vault.
      tags:
        - manageInstruments
      parameters:
        - name: instrument_token
          in: path
          description: The token that identifies the stored payment instrument.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
        '422':
          description: Failed to load configuration / Invalid configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/payments/stored-instruments/methods:
    get:
      operationId: manageInstruments_list-methods-for-store
      summary: List Available Payment Method Ids
      description: >-
        Lists all available payment method IDs that support stored instruments. This list will include all types of
        stored instruments namely card, account, and bank_account instruments.
      tags:
        - manageInstruments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: currency_code
          in: query
          description: The store hash.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_available_methods_response'
        '401':
          description: Invalid X-Auth-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/base_error_response'
      security:
        - X-Auth-Token: []
tags:
  - name: tokens
    description: Create the access tokens used to process payments.
  - name: manageInstruments
    description: Store, retrieve, and delete a customer's saved payment instruments.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          description: Identifier for the order
        is_recurring:
          type: boolean
          default: false
          description: >-
            Whether this is a recurring order. If the order is recurring this field should be set to true in order to
            let the payment gateway know.
      required:
        - id
      title: Order
    PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaData:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: >-
            Payment access token. This token is required in the subsequent request to the [Process a
            payment](/developer/api-reference/rest/admin/payments/processing/payments-post) endpoint.
      required:
        - id
      title: PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaData
    PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaMeta:
      type: object
      properties: {}
      description: Response metadata.
      title: PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaMeta
    Tokens_createPaymentAccessToken_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaData'
        meta:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaMeta'
          description: Response metadata.
      title: Tokens_createPaymentAccessToken_Response_201
    PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors:
      type: object
      properties: {}
      title: PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors
    CreatePaymentAccessTokenRequestBadRequestError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Short summary describing the particular error
        detail:
          type: string
          description: Detailed summary describing the particular error
        type:
          type: string
          description: Reference that identifies the particular error
        code:
          type: integer
          description: Code representing the particular error
        errors:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors'
      required:
        - status
        - title
        - type
      title: CreatePaymentAccessTokenRequestBadRequestError
    CreatePaymentAccessTokenRequestUnauthorizedError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Short summary describing the particular error
        detail:
          type: string
          description: Detailed summary describing the particular error
        type:
          type: string
          description: Reference that identifies the particular error
        code:
          type: integer
          description: Code representing the particular error
        errors:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors'
      required:
        - status
        - title
        - type
      title: CreatePaymentAccessTokenRequestUnauthorizedError
    CreatePaymentAccessTokenRequestNotFoundError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Short summary describing the particular error
        detail:
          type: string
          description: Detailed summary describing the particular error
        type:
          type: string
          description: Reference that identifies the particular error
        code:
          type: integer
          description: Code representing the particular error
        errors:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors'
      required:
        - status
        - title
        - type
      title: CreatePaymentAccessTokenRequestNotFoundError
    CreatePaymentAccessTokenRequestConflictError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Short summary describing the particular error
        detail:
          type: string
          description: Detailed summary describing the particular error
        type:
          type: string
          description: Reference that identifies the particular error
        code:
          type: integer
          description: Code representing the particular error
        errors:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors'
      required:
        - status
        - title
        - type
      title: CreatePaymentAccessTokenRequestConflictError
    CreatePaymentAccessTokenRequestUnprocessableEntityError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Short summary describing the particular error
        detail:
          type: string
          description: Detailed summary describing the particular error
        type:
          type: string
          description: Reference that identifies the particular error
        code:
          type: integer
          description: Code representing the particular error
        errors:
          $ref: '#/components/schemas/PaymentsAccessTokensPostResponsesContentApplicationJsonSchemaErrors'
      required:
        - status
        - title
        - type
      title: CreatePaymentAccessTokenRequestUnprocessableEntityError
    create_token_data:
      type: object
      properties:
        access_token:
          type: string
          description: The Instruments Access Token (IAT) for the payments API.
        expires_at:
          type: integer
          description: The expiration time as an integer number of seconds since the Epoch.
      title: create_token_data
    meta_empty:
      type: object
      properties: {}
      description: Response metadata.
      title: meta_empty
    create_token_response:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/create_token_data'
        meta:
          $ref: '#/components/schemas/meta_empty'
      title: create_token_response
    detailed_error:
      type: object
      properties: {}
      title: detailed_error
    base_error_response:
      type: object
      properties:
        status:
          type: integer
          description: The HTTP status code.
        title:
          type: string
          description: The error title describing the particular error.
        type:
          type: string
        errors:
          $ref: '#/components/schemas/detailed_error'
      description: Error payload for the BigCommerce API.
      title: base_error_response
    BillingAddress:
      type: object
      properties:
        first_name:
          type: string
          description: The first name of the cardholder.
        last_name:
          type: string
          description: The last name of the cardholder.
        email:
          type: string
        company:
          type: string
          description: The company of the cardholder.
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state_or_province:
          type: string
          description: Represents the state or province.
        state_or_province_code:
          type: string
        country_code:
          type: string
          description: The ISO-3166-1 2 letter country code.
        phone:
          type: string
        postal_code:
          type: string
      title: BillingAddress
    CardInstrument:
      type: object
      properties:
        customer_id:
          type: integer
          description: The ID of the customer.
        token:
          type: string
          description: An identifier representing this stored instrument.
        type:
          type: string
          description: Type of instrument.
        is_default:
          type: boolean
          description: Identifies whether this stored instrument is default for the customer.
        brand:
          type: string
          description: The card brand.
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
          description: The expiry month for this card.
        expiry_year:
          type: integer
          description: The expiry year for this card.
        iin:
          type: string
          description: The issuer identification number.
        last_4:
          type: string
          description: The last four digits of this card.
        billing_address:
          $ref: '#/components/schemas/BillingAddress'
      description: Details about a stored card instrument which includes details around billing, last four digits, issuer, etc.
      title: CardInstrument
    PayPalAccountInstrument:
      type: object
      properties:
        customer_id:
          type: integer
          description: The ID of the customer.
        token:
          type: string
          description: An identifier representing this stored instrument.
        type:
          type: string
          description: Instrument type
        is_default:
          type: boolean
          description: Identifies whether this stored instrument is default for the customer.
        email:
          type: string
          description: The PayPal email address.
      description: A PayPal account stored instrument
      title: PayPalAccountInstrument
    BankAccountInstrument:
      type: object
      properties:
        customer_id:
          type: integer
          description: The ID of the customer.
        token:
          type: string
          description: An identifier representing this stored instrument.
        type:
          type: string
          description: Instrument type
        is_default:
          type: boolean
          description: Identifies whether this stored instrument is default for the customer.
        issuer:
          type: string
          description: Account issuer number
        masked_account_number:
          type: string
          description: Masked account number
      description: A bank account stored instrument
      title: BankAccountInstrument
    GetStoredInstrumentsResponseDataItems:
      oneOf:
        - $ref: '#/components/schemas/CardInstrument'
        - $ref: '#/components/schemas/PayPalAccountInstrument'
        - $ref: '#/components/schemas/BankAccountInstrument'
      title: GetStoredInstrumentsResponseDataItems
    Links:
      type: object
      properties:
        previous:
          type: string
          description: The link to the previous page is returned in the response.
        current:
          type: string
          description: The link to the current page is returned in the response.
        next:
          type: string
          description: The link to the next page is returned in the response.
      description: Pagination links for the previous and next parts of the whole collection.
      title: Links
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items in the result set.
        count:
          type: integer
          description: Total number of items in the collection response.
        per_page:
          type: integer
          description: The amount of items returned in the collection per page, controlled by the limit parameter.
        current_page:
          type: integer
          description: The page you are currently on within the collection.
        total_pages:
          type: integer
          description: The total number of pages in the collection.
        links:
          $ref: '#/components/schemas/Links'
      description: Data about the response, including pagination and collection totals.
      title: Pagination
    CursorPagination:
      type: object
      properties:
        count:
          type: integer
          description: Total number of items in the collection response.
        per_page:
          type: integer
          description: The amount of items returned in the collection per page, controlled by the limit parameter.
        start_cursor:
          type: string
          description: A string representing the cursor reference to the starting item of the current page in the collection.
        end_cursor:
          type: string
          description: A string representing the cursor reference to the last item of the current page in the collection.
        links:
          $ref: '#/components/schemas/Links'
      description: Data about cursor pagination.
      title: CursorPagination
    Meta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        cursor_pagination:
          $ref: '#/components/schemas/CursorPagination'
      description: >-
        Data about the response, including pagination and collection totals. Both `pagination` and `cursor_pagination`
        would be returned on the first page. Only `pagination` will be returned when you provide the `page` parameter,
        which is greater than the first page. Only `cursor_pagination` would be returned when you provide the `before`
        or `after` parameters in the request that are greater than the first page.
      title: Meta
    get_stored_instruments_response:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GetStoredInstrumentsResponseDataItems'
        meta:
          $ref: '#/components/schemas/Meta'
      title: get_stored_instruments_response
    CreditCardInstrumentImportParam:
      type: object
      properties:
        vault_token:
          type: string
          description: The token from the provider's vault.
        provider_customer_id:
          type: string
          description: The customer ID in the provider's vault.
        type:
          type: string
          description: The instrument type.
        brand:
          type: string
          description: Card brand.
        expiry_year:
          type: integer
          description: Expiration year.
        expiry_month:
          type: integer
          description: Expiration month.
        last_4:
          type: string
          description: Last four digits of card.
        iin:
          type: string
          description: Issuer identification number.
      title: CreditCardInstrumentImportParam
    PaypalAccountInstrumentImportParam:
      type: object
      properties:
        vault_token:
          type: string
          description: The token from the provider's vault.
        provider_customer_id:
          type: string
          description: The customer ID in the provider's vault.
        type:
          type: string
          description: The instrument type.
        email:
          type: string
          description: account email
      description: The parameters for an already vaulted PayPal instrument.
      title: PaypalAccountInstrumentImportParam
    BankAccountInstrumentImportParam:
      type: object
      properties:
        vault_token:
          type: string
          description: The token from the provider's vault.
        provider_customer_id:
          type: string
          description: The customer ID in the provider's vault.
        type:
          type: string
          description: The instrument type.
