openapi: 3.1.0
info:
  title: 'Admin Management: Checkouts'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/checkouts/{checkoutId}:
    get:
      operationId: checkout_getCheckout
      summary: Get Checkout
      description: >-
        Returns a *Checkout*.


        By default, the response omits line item options, stock positions, available shipping options, and promotion
        banners. Use the `include` query parameter to add them. Pass a comma-separated list to request more than one:


        ```http

        GET
        /stores/{store_hash}/v3/checkouts/{checkoutId}?include=consignments.available_shipping_options,cart.line_items.physical_items.stock_position

        ```


        **Notes**


        * The checkout ID is the same as the cart ID. Get it from the `id` returned by [Create a
        cart](/developer/api-reference/rest/admin/management/carts/carts-single/create-cart) or [Get a
        cart](/developer/api-reference/rest/admin/management/carts/carts-single/get-cart), or from the storefront
        checkout: the REST Storefront [Get checkout](/developer/api-reference/rest/storefront/checkouts/get-checkout)
        response or the Checkout SDK's `checkout.id`.
      tags:
        - checkout
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            Comma-separated list of sub-resources to add to the response. The default response omits all of them.


            * `cart.line_items.physical_items.options` - product options on physical line items

            * `cart.line_items.digital_items.options` - product options on digital line items

            * `cart.line_items.physical_items.stock_position` - backorder and stock availability for physical items

            * `cart.line_items.digital_items.stock_position` - backorder and stock availability for digital items
            (backorder values are always zero because digital products cannot be backordered)

            * `consignments.available_shipping_options` - shipping options available to each consignment

            * `promotions.banners` - eligible promotion banners


            Example: `include=consignments.available_shipping_options,promotions.banners`
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutsCheckoutIdGetParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout_getCheckout_Response_200'
        '404':
          description: Error code that is displayed when a given checkout ID is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCheckoutRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: checkout_updateCheckout
      summary: Update Customer Messages
      description: |-
        Change customer message pertaining to an existing *Checkout*.

        **Limits:**
        * 2000 characters for customer message
      tags:
        - checkout
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout_updateCheckout_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckoutRequestConflictError'
      requestBody:
        description: '`customer_message` is required (maximum length is 2000).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout_Put'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/billing-address:
    post:
      operationId: billingAddress_addCheckoutBillingAddress
      summary: Add Checkout Billing Address
      description: >-
        Adds a billing address to an existing checkout.


        **Required Fields**

        * email

        * country_code


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - billingAddress
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing_Address_addCheckoutBillingAddress_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutBillingAddressRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressProperties'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/billing-address/{addressId}:
    put:
      operationId: billingAddress_updateCheckoutBillingAddress
      summary: Update Checkout Billing Address
      description: >-
        Updates an existing billing address on a checkout.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - billingAddress
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: addressId
          in: path
          description: The ID of the address.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing_Address_updateCheckoutBillingAddress_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckoutBillingAddressRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressProperties'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/consignments:
    post:
      operationId: consignments_addCheckoutConsignment
      summary: Add Consignment to Checkout
      description: >-
        Adds a new consignment to a checkout.



        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.


        For more information about working with consignments, see [Checkout
        consignment](/developer/docs/admin/checkout-and-cart/custom-checkouts/consignments).  


        Though the only required `address` properties to create a consignment are `email` and `country_code`, to
        successfully [create an order](/developer/api-reference/rest/admin/management/checkouts/orders/create-order) the
        `address` requires the following properties:

        * `first_name`

        * `last_name`

        * `address1`

        * `city`

        * `country`

        * `email`

        * `country_code`


        Depending on the country, the following `address` properties may also be required:


        * `postal_code`

        * `state_or_province`
      tags:
        - consignments
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: Include the shipping options available to this checkout.
          required: false
          schema:
            $ref: '#/components/schemas/CheckoutsCheckoutIdConsignmentsPostParametersInclude'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignments_addCheckoutConsignment_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutConsignmentRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsignmentRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/consignments/{consignmentId}:
    put:
      operationId: consignments_updateCheckoutConsignment
      summary: Update Checkout Consignment
      description: >-
        Updates an existing consignment. The address, line item IDs, and shipping option ID can be updated using this
        endpoint.


        Use a separate `PUT` request to update the shipping option IDs if you also want to update the address and line
        item IDs.  


        To add new shipping options, complete the following steps: 

        * Use the [Add Consignment to
        Checkout](/developer/api-reference/rest/admin/management/checkouts/consignments/add-checkout-consignment)
        endpoint to add a new [consignment] to a checkout. 

        * Assign a shipping option to the new consignment by sending a `PUT` request to update the consignment's
        `shipping_option_id` with a returned value from `data.consignments[N].available_shipping_option[N].id` obtained
        in the [Add Consignment to
        Checkout](/developer/api-reference/rest/admin/management/checkouts/consignments/add-checkout-consignment)
        endpoint. 


        To update an existing address and line item IDs, assign a new address and line item IDs by sending a `PUT`
        request.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.



        2. Assign a shipping option to the new consignment by sending a `PUT` request to update the consignment's
        `shipping_option_id` with a returned value from `data.consignments[N].available_shipping_option[N].id` obtained
        in Step One. 
      tags:
        - consignments
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: consignmentId
          in: path
          description: The ID of the consignment.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: Include the shipping options available to this checkout.
          required: false
          schema:
            $ref: '#/components/schemas/CheckoutsCheckoutIdConsignmentsConsignmentIdPutParametersInclude'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignments_updateCheckoutConsignment_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckoutConsignmentRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsignmentRequest'
      security:
        - X-Auth-Token: []
    delete:
      operationId: consignments_deleteCheckoutConsignment
      summary: Delete Checkout Consignment
      description: >-
        Removes an existing consignment from a checkout.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - consignments
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: consignmentId
          in: path
          description: The ID of the consignment.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignments_deleteCheckoutConsignment_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteConsignmentRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/coupons:
    post:
      operationId: coupons_addCheckoutCoupon
      summary: Add Coupon to Checkout
      description: >-
        Adds a coupon code to a checkout. 


        You can use multiple coupons by using this endpoint to apply one coupon at a time on your storefront. Ensure you
        enable the [Promotion
        Settings](https://support.bigcommerce.com/s/article/Store-Settings?language=en_US#promotion) in your control
        panel to allow for multiple coupons per order.


        You cannot add a coupon when an item-level manual discount is already applied. The API returns a `422` response
        with the message "Coupon `{coupon_code}` cannot be applied in combination with item level manual discount."


        **Required Fields**

        * coupon_code


        **Limits**

        * Coupon codes have a 50-character limit.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - coupons
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupons_addCheckoutCoupon_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutCouponRequestConflictError'
        '422':
          description: The coupon cannot be combined with an existing item-level manual discount.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCodeRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/coupons/{couponCode}:
    delete:
      operationId: coupons_deleteCheckoutCoupon
      summary: Delete Checkout Coupon
      description: >-
        Deletes a coupon code from a checkout.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - coupons
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: couponCode
          in: path
          description: The actual coupon code value, not the coupon ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupons_deleteCheckoutCoupon_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheckoutCouponRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCouponCodeRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/discounts:
    post:
      operationId: discounts_addCheckoutDiscount
      summary: Add Discount to Checkout
      description: >-
        Adds or replaces manual discounts on an existing checkout.


        Each request sets the checkout's complete manual-discount state. The request is not additive: manual discounts
        from an earlier request that you omit from the new payload are removed. This endpoint does not remove coupons or
        automatic promotions.


        Use the request body to apply:

        * An order-level manual discount with `cart.discounts[].discounted_amount`. BigCommerce distributes the discount
        across line items based on each item's value.

        * An item-level manual discount with `cart.line_items[].id` and `cart.line_items[].discounted_amount`.

        * Order-level and item-level manual discounts together by including both arrays in the same request.


        Manual discounts interact with coupons and automatic promotions as follows:


        | Manual discount level | Coupon or automatic promotion level | Behavior |

        | --- | --- | --- |

        | Order | Order or item | The discounts stack. The result is fully additive and does not depend on which
        discount is applied first. |

        | Item | Order or item | The discounts are mutually exclusive, and the first-applied discount remains. A
        conflicting manual-discount request is rejected, a coupon request returns a `422` response, and an automatic
        promotion does not apply. |


        If an item-level manual discount is already applied, adding a coupon returns a `422` response with the message
        "Coupon `{coupon_code}` cannot be applied in combination with item level manual discount." An eligible automatic
        promotion does not apply while an item-level manual discount exists.


        The required field is `discounted_amount` at the order level, item level, or both.


        To prevent lost updates from concurrent requests, include the optional `version` field in the request payload.
        If the provided version does not match the server's cart version, the API returns a conflict error.
      tags:
        - discounts
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discounts_addCheckoutDiscount_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutDiscountRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cart:
                  $ref: '#/components/schemas/CheckoutsCheckoutIdDiscountsPostRequestBodyContentApplicationJsonSchemaCart'
                  description: The complete manual-discount state to apply to the checkout.
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/fees:
    post:
      operationId: fees_CheckoutsFeesByCheckoutIdPost
      summary: Add Order Level Fees to Checkout
      description: |-
        Adds order level fees to a checkout. 

        Limits: 
          - Maximum of 5 fees per checkout.
      tags:
        - fees
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fees_CheckoutsFeesByCheckoutIdPost_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFeesRequest'
      security:
        - X-Auth-Token: []
    put:
      operationId: fees_CheckoutsFeesByCheckoutIdPut
      summary: Update Order Level Fees in Checkout
      description: |-
        Updates order level fees in a checkout.
        > We do not support partial updates, so please send the total entity values for each fee to be updated.
      tags:
        - fees
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fees_CheckoutsFeesByCheckoutIdPut_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeesRequest'
      security:
        - X-Auth-Token: []
    delete:
      operationId: fees_CheckoutsFeesByCheckoutIdDelete
      summary: Delete Order Level Fees from Checkout
      description: |
        Delete fees from a checkout.

        > #### Note 
        > * The `Try It` feature is not currently supported for this endpoint.  
      tags:
        - fees
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fees_CheckoutsFeesByCheckoutIdDelete_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFeesRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/orders:
    post:
      operationId: orders_createOrder
      summary: Create Order
      description: >-
        Creates an order.


        ## Usage notes

        * Orders created will be set to incomplete order status.

        * You can create as many orders from the same order (cart) as you want.

        * Order duplication copies the existing order, assigns a new order number, and sets the new order status to
        `incomplete`.

        * Once the order is paid, the cart is deleted.

        * Cart deletion occurs if you are using BigCommerce to accept payments on orders.
      tags:
        - orders
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders_createOrder_Response_200'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/settings:
    get:
      operationId: settings_getCheckoutSettings
      summary: Get Checkout Settings
      description: >-
        Returns the store-level checkout settings, including checkout type, guest checkout rules, privacy policy
        consent, order terms and conditions, and custom checkout script and style overrides.


        A channel can override most of these settings. See [Get Channel-Specific Checkout
        Settings](/developer/api-reference/rest/admin/management/checkouts/settings/get-channel-checkout-settings).
      tags:
        - settings
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings_getCheckoutSettings_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: settings_updateCheckoutSettings
      summary: Update Checkout Settings
      description: >-
        Updates the store-level checkout settings. Settings you omit remain unchanged.


        To install a custom checkout, send `checkout_type: custom` with a non-empty `custom_checkout_script_url`. To
        return to Optimized One-Page Checkout, send an empty string for `custom_checkout_script_url` and
        `custom_order_confirmation_script_url`. Sending a non-empty script URL while `checkout_type` is `optimized`
        returns a 422.


        When `is_order_terms_and_conditions_enabled` is `true`, include `order_terms_and_conditions_type` and the
        matching `order_terms_and_conditions_link` or `order_terms_and_conditions_textarea`.
      tags:
        - settings
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings_updateCheckoutSettings_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutsSettingsRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/settings/channels/{channelId}:
    get:
      operationId: settings_get-channel-checkout-settings
      summary: Get Channel-Specific Checkout Settings
      description: >-
        Returns the checkout settings for a given channel (storefront) by channelId.


        Each field is `null` when the channel has no override for it. In that case, the store-level value from [Get
        Checkout Settings](/developer/api-reference/rest/admin/management/checkouts/settings/get-checkout-settings)
        applies.
      tags:
        - settings
      parameters:
        - name: channelId
          in: path
          description: The ID of the channel.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel checkout settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings_get-channel-checkout-settings_Response_200'
        '422':
          description: Invalid channelId or invalid request
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
    put:
      operationId: settings_put-channel-checkout-settings
      summary: Update Channel-Specific Checkout Settings
      description: >-
        Updates the checkout settings for a given channel (storefront) by channelId.


        This endpoint updates every setting included in the request body. Settings you omit remain unchanged. Send
        `null` for a setting to remove the channel override so the channel uses the store-level value again.
      tags:
        - settings
      parameters:
        - name: channelId
          in: path
          description: The ID of the channel.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel checkout settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings_put-channel-checkout-settings_Response_200'
        '422':
          description: Invalid channelId or invalid request
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCheckoutsSettings'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/checkouts/{checkoutId}/token:
    post:
      operationId: token_createCheckoutToken
      summary: Create Checkout Token
      description: >-
        Use the checkout token to display a confirmation page for a guest shopper.

        **Usage Notes** * The response from performing this POST request is a checkout token. * The checkout token is a
        single-use token that is not order-dependent. You cannot create this token after finalizing an order. * After
        completing the order, you can redirect the shopper to /order-confirmation/{orderId}?t={checkoutToken}. * After
        token validation, the /order-confirmation/{orderId} page displays. * The `ORDER_TOKEN` should match the order or
        the logged-in customer can access the order.
      tags:
        - token
      parameters:
        - name: checkoutId
          in: path
          description: ID of the checkout; the same as the cart ID.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token_createCheckoutToken_Response_200'
        '401':
          description: Unauthorized - the v3 Auth client ID or token in the request are not a valid combination for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutTokenRequestUnauthorizedError'
        '422':
          description: Invalid JSON request body - missing or invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutTokenRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUses:
                  type: number
                  format: double
                ttl:
                  type: number
                  format: double
                  minimum: 1
                  maximum: 2592000
                  description: Time-to-live (TTL) is the number of seconds the token is set to exist before being discarded.
      security:
        - X-Auth-Token: []
tags:
  - name: checkout
    description: Retrieve and manage a shopper's checkout.
  - name: billingAddress
    description: Add or update the billing address on a checkout.
  - name: consignments
    description: Manage the consignments that group checkout items by shipping destination.
  - name: coupons
    description: Add and remove the coupons applied to a checkout.
  - name: discounts
    description: Add and remove the manual discounts applied to a checkout.
  - name: fees
    description: Add and remove the fees applied to a checkout.
  - name: orders
    description: Convert a completed checkout into an order.
  - name: settings
    description: Manage store-level checkout settings.
  - name: token
    description: Generate a token that identifies a checkout.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
