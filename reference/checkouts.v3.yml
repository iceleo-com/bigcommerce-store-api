    CheckoutsSettingsCheckoutType:
      type: string
      enum:
        - optimized
        - custom
      description: >-
        The checkout type. `optimized` uses Optimized One-Page Checkout. `custom` loads the script at
        `custom_checkout_script_url`, which must be set when the type is `custom`. Setting a non-empty
        `custom_checkout_script_url` while the type is `optimized` returns a 422.
      title: CheckoutsSettingsCheckoutType
    CheckoutsSettingsGuestCheckoutType:
      type: string
      enum:
        - guest_checkout
        - guest_checkout_account
        - no_guest_checkout
      description: >-
        How guest shoppers can check out. `guest_checkout` allows guest checkout. `guest_checkout_account` allows guest
        checkout and creates a customer account when the order completes. `no_guest_checkout` requires shoppers to sign
        in.
      title: CheckoutsSettingsGuestCheckoutType
    CheckoutsSettingsGuestCheckoutForExistingAccounts:
      type: string
      enum:
        - allow_guest
        - require_login
        - encourage_login
      description: >-
        How checkout treats a guest whose email matches an existing customer account. `allow_guest` lets them continue
        as a guest. `require_login` makes them sign in. `encourage_login` prompts them to sign in but lets them continue
        as a guest. When `guest_checkout_type` is `no_guest_checkout`, the channel-level value is set to
        `require_login`.
      title: CheckoutsSettingsGuestCheckoutForExistingAccounts
    CheckoutsSettingsPolicyConsent:
      type: string
      enum:
        - none
        - standard
        - express
      description: >-
        How checkout collects privacy policy consent. `none` does not show a privacy policy. `standard` shows the
        privacy policy. `express` requires the shopper to actively consent before placing the order.
      title: CheckoutsSettingsPolicyConsent
    CheckoutsSettingsOrderTermsAndConditionsType:
      type: string
      enum:
        - link
        - textarea
        - ''
      description: >-
        How the terms and conditions display at checkout. `link` links to the page at `order_terms_and_conditions_link`.
        `textarea` shows the text in `order_terms_and_conditions_textarea`. Returns an empty string when terms and
        conditions are not configured.
      title: CheckoutsSettingsOrderTermsAndConditionsType
    CheckoutsSettings:
      type: object
      properties:
        checkout_type:
          $ref: '#/components/schemas/CheckoutsSettingsCheckoutType'
          description: >-
            The checkout type. `optimized` uses Optimized One-Page Checkout. `custom` loads the script at
            `custom_checkout_script_url`, which must be set when the type is `custom`. Setting a non-empty
            `custom_checkout_script_url` while the type is `optimized` returns a 422.
        guest_checkout_type:
          $ref: '#/components/schemas/CheckoutsSettingsGuestCheckoutType'
          description: >-
            How guest shoppers can check out. `guest_checkout` allows guest checkout. `guest_checkout_account` allows
            guest checkout and creates a customer account when the order completes. `no_guest_checkout` requires
            shoppers to sign in.
        guest_checkout_for_existing_accounts:
          $ref: '#/components/schemas/CheckoutsSettingsGuestCheckoutForExistingAccounts'
          description: >-
            How checkout treats a guest whose email matches an existing customer account. `allow_guest` lets them
            continue as a guest. `require_login` makes them sign in. `encourage_login` prompts them to sign in but lets
            them continue as a guest. When `guest_checkout_type` is `no_guest_checkout`, the channel-level value is set
            to `require_login`.
        custom_checkout_script_url:
          type: string
          description: >-
            Custom checkout script URL to replace the default checkout. Accepts an `https` URL or a `webdav:` path to a
            file uploaded with WebDAV. To reset a store to Optimized One-Page Checkout, pass an empty string for
            `custom_checkout_script_url` and `custom_order_confirmation_script_url`.
        policy_consent:
          $ref: '#/components/schemas/CheckoutsSettingsPolicyConsent'
          description: >-
            How checkout collects privacy policy consent. `none` does not show a privacy policy. `standard` shows the
            privacy policy. `express` requires the shopper to actively consent before placing the order.
        order_confirmation_contact_email:
          type: string
          format: email
          description: The contact email address shown on the order confirmation page.
        order_confirmation_use_custom_checkout_script:
          type: boolean
          description: >-
            Whether the order confirmation page loads the same script as the custom checkout. When `true`,
            `custom_order_confirmation_script_url` defaults to an empty string.
        custom_order_confirmation_script_url:
          type: string
          description: >-
            Custom order confirmation script URL to replace the default order confirmation page. Accepts an `https` URL
            or a `webdav:` path. To reset a store to Optimized One-Page Checkout, pass an empty string for
            `custom_checkout_script_url` and `custom_order_confirmation_script_url`.
        is_order_terms_and_conditions_enabled:
          type: boolean
          description: >-
            Whether shoppers must accept order terms and conditions before placing an order. When `true`,
            `order_terms_and_conditions_type` is required, and the matching `order_terms_and_conditions_link` or
            `order_terms_and_conditions_textarea` must not be empty.
        order_terms_and_conditions_type:
          $ref: '#/components/schemas/CheckoutsSettingsOrderTermsAndConditionsType'
          description: >-
            How the terms and conditions display at checkout. `link` links to the page at
            `order_terms_and_conditions_link`. `textarea` shows the text in `order_terms_and_conditions_textarea`.
            Returns an empty string when terms and conditions are not configured.
        order_terms_and_conditions_link:
          type: string
          description: The URL of the terms and conditions page. Used when `order_terms_and_conditions_type` is `link`.
        order_terms_and_conditions_textarea:
          type: string
          description: The terms and conditions text shown at checkout. Used when `order_terms_and_conditions_type` is `textarea`.
        custom_checkout_supports_uco_settings:
          type:
            - boolean
            - 'null'
          description: Whether the custom checkout supports Optimized One-Page Checkout settings from the control panel.
        custom_checkout_supports_data_hydration:
          type: boolean
          description: >-
            Whether the custom checkout receives the checkout's initial state when it loads, instead of fetching it
            after load. Takes effect only when initial-state hydration for custom checkouts is enabled for the store.
        should_redirect_to_storefront_for_auth:
          type: boolean
          description: >-
            Whether checkout redirects shoppers to the storefront to sign in, so a headless storefront keeps the
            customer session in sync. Set to `true` for Catalyst and other headless storefronts that manage customer
            authentication.
        support_b2b_settings:
          type: boolean
          description: >-
            Whether checkout applies B2B Edition settings, such as company account rules. Returned only for stores where
            B2B checkout settings are enabled.
        custom_checkout_sri_hash:
          type: string
          description: >-
            The Subresource Integrity (SRI) hash for the custom checkout script. Accepts a `sha256-`, `sha384-`, or
            `sha512-` hash, or an empty string to remove the hash.
        custom_order_confirmation_sri_hash:
          type: string
          description: >-
            The Subresource Integrity (SRI) hash for the custom order confirmation script. Accepts a `sha256-`,
            `sha384-`, or `sha512-` hash, or an empty string to remove the hash.
        checkout_style_override:
          type:
            - string
            - 'null'
          description: >-
            URL of a CSS file that overrides the Optimized One-Page Checkout styles. Accepts an `https` URL or a
            `webdav:` path that ends in `.css`. Pass an empty string to remove the override.
        checkout_style_override_sri_hash:
          type: string
          description: >-
            The Subresource Integrity (SRI) hash for the stylesheet at `checkout_style_override`. Accepts a `sha256-`,
            `sha384-`, or `sha512-` hash, or an empty string when no hash is set.
        enhanced_checkout_experience:
          type: boolean
          description: >-
            Whether the Enhanced Checkout experience is enabled in the control panel. Read-only. Change it under
            **Settings > Checkout** in the control panel.
      description: The store-level checkout settings.
      title: CheckoutsSettings
