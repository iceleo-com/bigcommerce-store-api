openapi: 3.1.0
info:
  title: 'Admin Management: Sites'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/sites:
    post:
      operationId: sites_createSite
      summary: Create Site
      description: >-
        Create a site that links a [headless storefront](/developer/docs/storefront/headless) to a sales
        [channel](/developer/api-reference/rest/admin/management/channels).
      tags:
        - sites
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sites_createSite_Response_201'
        '400':
          description: |-
            Malformed request syntax. Typically need to fix the JSON
            request body to resend successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '403':
          description: The request lacks valid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '404':
          description: Requested resource not founded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetailed_Full'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                description: Any type
        '504':
          description: >-
            If this occurs, you should retry the request. Typically retrying the request several times will result in a
            successful request; However, if you are unable to successfully make a request, please check the BigCommerce
            system status [here](https://status.bigcommerce.com/). A service is likely down and the request will need to
            be made again when it is back up (in several hours usually).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
      security:
        - X-Auth-Token: []
    get:
      operationId: sites_getSites
      summary: List Sites
      description: Get sites linked to a [headless storefront](/developer/docs/storefront/headless) sales channels.
      tags:
        - sites
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of items.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list of items.
          required: false
          schema:
            type: integer
        - name: channel_id:in
          in: query
          description: A comma-separated list that returns sites by channel ID.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: url_type:in
          in: query
          description: A comma-separated list that returns sites by their URL type, specified in the `data.urls` array.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sites_getSites_Response_200'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/sites/{site_id}:
    get:
      operationId: sites_getSite
      summary: Get Site
      description: Get a site with site ID `{site_id}`.
      tags:
        - sites
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sites_getSite_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: sites_updateSite
      summary: Update Site
      description: Update a site with site ID `{site_id}`.
      tags:
        - sites
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sites_updateSite_Response_200'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetailed_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/put_Site'
      security:
        - X-Auth-Token: []
    delete:
      operationId: sites_deleteSite
      summary: Delete Site
      description: Delete a site with site ID `{site_id}`. Remove the URL set for a given site ID.
      tags:
        - sites
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/sites/{site_id}/certificate:
    get:
      operationId: siteCertificate_getSiteCertificate
      summary: Get Site’s SSL TLS Certificate Information
      description: Obtain information about a site’s SSL/TLS certificate.
      tags:
        - siteCertificate
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponse'
      security:
        - X-Auth-Token: []
    put:
      operationId: siteCertificate_upsertSiteCertificate
      summary: Upsert Site’s SSL TLS Certificate Information
      description: >-
        - If a value for `url` is not supplied, the saved certificate is associated with the specified site’s `primary`
        URL.

        - Use caution. Because this endpoint upserts, supplying an SSL certificate for a domain that already has a
        certificate connected overwrites the domain’s extant certificate.'
      tags:
        - siteCertificate
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallCertificateData'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/sites/certificates:
    get:
      operationId: siteCertificate_getSitesCertificates
      summary: List Site Certificates
      description: Return all SSL certificates connected to domains within a store.
      tags:
        - siteCertificate
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: urls:in
          in: query
          description: A comma-separated list that filters certificates by one or more URLs.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCertificatesResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/sites/{site_id}/routes:
    get:
      operationId: siteRoutes_getSiteRoutes
      summary: Get Site’s Routes
      description: Get a site’s routes.
      tags:
        - siteRoutes
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Filter routes by a specified resource type.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of items.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list of items.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site_Routes_getSiteRoutes_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: siteRoutes_createSiteRoute
      summary: Create Site Route
      description: >-
        Create routes that tell BigCommerce how to link to pages on a [headless
        storefront](/developer/docs/storefront/headless).


        ## Usage Notes

        * For a list of supported route types, see [Route
        types](/developer/api-reference/rest/admin/management/sites#route-types).
      tags:
        - siteRoutes
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested site route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site_Routes_createSiteRoute_Response_201'
        '422':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSiteRouteRequestUnprocessableEntityError'
        '502':
          description: >-
            If something happens during the request that causes it to fail, a 502 response will be returned. A new
            request should be made; however, it could fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/siteRoute_Base'
      security:
        - X-Auth-Token: []
    put:
      operationId: siteRoutes_updateSiteRoutes
      summary: Update Site’s Routes
      description: |-
        Upsert routes for site with ID `{site_id}`.

        ## Usage Notes
        * `id` is required when updating an existing route.
      tags:
        - siteRoutes
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site_Routes_updateSiteRoutes_Response_200'
        '422':
          description: An error response for one or more items in a bulk request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSiteRoutesRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/siteRoute_Full'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/sites/{site_id}/routes/{route_id}:
    get:
      operationId: siteRoutes_getSiteRoute
      summary: Get Site Route
      description: Get a site’s route.
      tags:
        - siteRoutes
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: route_id
          in: path
          description: The ID of the site route.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site_Routes_getSiteRoute_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: siteRoutes_updateSiteRoute
      summary: Update Site Route
      description: |
        Update a site’s route.
      tags:
        - siteRoutes
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: route_id
          in: path
          description: The ID of the site route.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested site route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site_Routes_updateSiteRoute_Response_201'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/siteRoutes_Route_Base'
      security:
        - X-Auth-Token: []
    delete:
      operationId: siteRoutes_deleteSiteRoute
      summary: Delete Site Route
      description: Delete a site’s route.
      tags:
        - siteRoutes
      parameters:
        - name: site_id
          in: path
          description: The ID of the site.
          required: true
          schema:
            type: integer
        - name: route_id
          in: path
          description: The ID of the site route.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
tags:
  - name: sites
    description: >-
      Enables creation and management of external sites (domains) where shoppers shop. Allows for the correct shopping
      experience to be delivered and maintained (i.e. redirect URLs, email links) when a shopper goes through the
      purchasing process.
  - name: siteCertificate
    description: Manage the SSL certificate associated with a site.
  - name: siteRoutes
    description: Manage the routes that map a site's URLs to storefront content.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    CertificateWrite:
      type: object
      properties:
        certificate:
          type: string
          description: The primary certificate, as a string.
        private_key:
          type: string
          description: The private key, as a string. Is a "write-only" field, will never be returned after write.
        intermediate_certificates:
          type: string
          description: The intermediate certificate(s), as a string.
      title: CertificateWrite
    SiteCreate:
      type: object
      properties:
        url:
          type: string
          description: >-
            The Fully Qualified URL (including host and scheme) where this site is hosted. All URLs generated for this
            site will be appended to this.
        channel_id:
          type: integer
          description: >-
            The channel this site is attached to. Each site belongs to a single channel, and each channel can have
            either zero or one sites.
        certificate:
          $ref: '#/components/schemas/CertificateWrite'
      title: SiteCreate
    SiteSslStatus:
      type: string
      enum:
        - dedicated
        - shared
      description: Indicates whether a site is using a private/dedicated SSL or a shared SSL.
      title: SiteSslStatus
      deprecated: true
    UrlType:
      type: string
      enum:
        - primary
        - canonical
        - checkout
      description: Specifies the URL type.
      title: UrlType
    Url:
      type: object
      properties:
        url:
          type: string
          description: URL of site.
        type:
          $ref: '#/components/schemas/UrlType'
          description: Specifies the URL type.
        created_at:
          type: string
          format: date-time
          description: >-
            The date-time that this URL was created, formatted as an [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt)
            string.
        updated_at:
          type: string
          format: date-time
          description: >-
            The date-time that this URL was last updated, formatted as an
            [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt) string.
      title: Url
    _site:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          description: >-
            The fully qualified URL (including host and scheme) where this site is hosted. All URLs generated for this
            site will be appended to this.
        channel_id:
          type: integer
          description: >-
            The channel to which this site is attached. Each site belongs to a single channel, and each channel can have
            either zero or more sites.
        created_at:
          type: string
          description: >-
            The date-time that this site was created, formatted as an [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt)
            string.
        updated_at:
          type: string
          description: >-
            The date-time that this site was last updated, formatted as an
            [RFC-3339](https://www.ietf.org/rfc/rfc3339.txt) string.
        ssl_status:
          $ref: '#/components/schemas/SiteSslStatus'
          description: Indicates whether a site is using a private/dedicated SSL or a shared SSL.
          deprecated: true
        urls:
          type: array
          items:
            $ref: '#/components/schemas/Url'
          description: All URLs that belong to the site, including `primary`, `canonical`, and `checkout` URLs.
        is_checkout_url_customized:
          type: boolean
          description: >-
            Indicates whether the channel uses a custom checkout domain. When `false`, the checkout domain falls back to
            the default channel’s primary URL.
      title: _site
    MetaOpen:
      type: object
      properties: {}
      description: Response metadata.
      title: MetaOpen
    Sites_createSite_Response_201:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/_site'
        meta:
          $ref: '#/components/schemas/MetaOpen'
      title: Sites_createSite_Response_201
    error_Full:
      type: object
      properties:
        status:
          type: integer
          description: |
            The HTTP status code.
        title:
          type: string
          description: |
            The error title describing the particular error.
        type:
          type: string
      title: error_Full
    ErrorDetailedFullErrors:
      type: object
      properties: {}
      title: ErrorDetailedFullErrors
    errorDetailed_Full:
      type: object
      properties:
        errors:
          $ref: '#/components/schemas/ErrorDetailedFullErrors'
      title: errorDetailed_Full
    MetaPagination:
      type: object
      properties:
        offset:
          type: integer
          description: The number of items skipped before starting the set of items returned.
        limit:
          type: integer
          description: The maximum number of items returned per page.
        total_items:
          type: integer
          description: The total number of items available across all pages.
      title: MetaPagination
    Meta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/MetaPagination'
      title: Meta
    Sites_getSites_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/_site'
        meta:
          $ref: '#/components/schemas/Meta'
      title: Sites_getSites_Response_200
    Sites_getSite_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/_site'
        meta:
          $ref: '#/components/schemas/MetaOpen'
      title: Sites_getSite_Response_200
    put_Site:
      type: object
      properties:
        url:
          type: string
          description: >-
            The Fully Qualified URL (including host and scheme) where this site is hosted. All URLs generated for this
            site will be appended to this.
      title: put_Site
    Sites_updateSite_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/_site'
        meta:
