          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regions_getContentRegions_Response_200'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '422':
          description: |
