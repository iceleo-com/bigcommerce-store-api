openapi: 3.1.0
info:
  title: 'Admin Content: Widgets'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/content/placements:
    get:
      operationId: placement_getPlacements
      summary: List Placements
      description: Returns a list of **Placements**.
      tags:
        - placement
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: widget_template_kind
          in: query
          description: The kind of widget template.
          required: false
          schema:
            type: string
        - name: template_file
          in: query
          description: 'The template file, for example: `pages/home`.'
          required: false
          schema:
            type: string
        - name: widget_uuid
          in: query
          description: The identifier for a specific widget.
          required: false
          schema:
            type: string
            format: uuid
        - name: widget_template_uuid
          in: query
          description: The identifier for a specific widget template.
          required: false
          schema:
            type: string
            format: uuid
        - name: channel_id:in
          in: query
          description: A comma-separated list of channel ids to filter the results by.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: site_id:in
          in: query
          description: A comma-separated list of site IDs to filter the results by.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of widget placements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement_getPlacements_Response_200'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      security:
        - X-Auth-Token: []
    post:
      operationId: placement_createPlacement
      summary: Create Placement
      description: >-
        Creates a **Placement**.


        **Template Files**


        To view the list of values accepted by the `template_file` property, including **custom** templates, see
        [Placements](/developer/docs/admin/widgets-and-scripts#placements).
      tags:
        - placement
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested widget placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement_createPlacement_Response_200'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/placement_Post'
      security:
        - X-Auth-Token: []
