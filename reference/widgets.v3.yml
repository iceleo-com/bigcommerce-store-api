  /stores/{store_hash}/v3/content/widgets:
    get:
      operationId: widget_getWidgets
      summary: List Widgets
      description: Returns a list of **Widgets**. Optional parameters can be passed in.
      tags:
        - widget
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: widget_template_kind
          in: query
          description: The kind of widget template.
          required: false
          schema:
            type: string
        - name: widget_template_uuid
          in: query
          description: The identifier for a specific widget template.
          required: false
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: The URL-encoded name of the widget.
          required: false
          schema:
            type: string
        - name: name:in
          in: query
          description: >-
            Use to pass in comma-separated list of widget names. Example:
            `/widgets?name:in=test-widget-name,header%20images`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: channel_id:in
          in: query
          description: A comma-separated list of channel ids to filter the results by.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: site_id:in
          in: query
          description: A comma-separated list of site IDs to filter the results by.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of widgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget_getWidgets_Response_200'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      security:
        - X-Auth-Token: []
    post:
      operationId: widget_createWidget
      summary: Create Widget
      description: >-
        Creates a **Widget**.


        **Note:** There is a limit of 100,000 widgets per store and 150 widgets per page. For more information, see
        [Store Limits](https://support.bigcommerce.com/s/article/Platform-Limits#storelimits).
      tags:
        - widget
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget_createWidget_Response_200'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/widget_Post'
      security:
        - X-Auth-Token: []
