            default: application/json
      responses:
        '204':
          description: An empty response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/content/regions:
    get:
      operationId: regions_getContentRegions
      summary: List Theme Regions
      description: Returns a list of unique **Theme Regions** in a file.
      tags:
        - regions
      parameters:
