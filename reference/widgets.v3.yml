          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: template_file
          in: query
          description: 'The template file, for example: `templateFile=pages/home`.'
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: The channel ID.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
