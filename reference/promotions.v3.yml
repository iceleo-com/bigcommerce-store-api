    Customer:
      type: object
      properties:
        group_ids:
          type: array
          items:
            type: integer
          description: >-
            A list of customer group IDs that the promotion targets. Only customers in those groups are eligible for
            this promotion. When unspecified, or set to an empty array, this requirement is not effective, and all
            customers who satisfy the other requirements (minimum_order_count, excluded_group_ids) are eligible for the
            promotion. This has a maximum supported length of 100000 IDs.
        minimum_order_count:
          type: integer
          description: The minimum number of completed orders required of the customer.
        excluded_group_ids:
          type: array
          items:
            type: integer
          description: >-
            A list of customer group IDs that the promotion will exclude. Only customers who are NOT in those groups are
            eligible for this promotion. When unspecified, or set to an empty array, this requirement will not have any
            effects, and all customers who satisfy the other requirements (group_ids, minimum_order_count) are eligible
            for the promotion.
        segments:
          $ref: '#/components/schemas/CustomerSegments'
      description: |-
        Specifies the requirements which make the customer eligible for the promotion.

        Note:
        - Only "group_ids" or "excluded_group_ids" should be specified (have non-empty array data), but not both.
        - group_id zero (0) signifies guest customers or registered customers who are not assigned to any groups.
        - The "group_ids" array has a hard limit of 100000 group ids.
      title: Customer
    Money:
      type: string
      pattern: '[0-9]+(\.[0-9]+)?'
      description: |-
        **Money**
        Represents a monetary value in the store’s default currency.
      title: Money
    FixedDiscount:
      type: object
      properties:
        fixed_amount:
          $ref: '#/components/schemas/Money'
      required:
        - fixed_amount
      description: '**Fixed Discount**'
      title: FixedDiscount
    PercentageDiscount:
      type: object
      properties:
        percentage_amount:
          type: string
          description: The amount of discount (percentage off) to apply.
      required:
