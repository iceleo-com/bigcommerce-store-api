    AvailabilityByWeekDayWeekDaysItems:
      type: string
      enum:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
      title: AvailabilityByWeekDayWeekDaysItems
    AvailabilityByWeekDay:
      type: object
      properties:
        week_frequency:
          type: integer
          minimum: 1
          description: Specifies the recurrence, in number of weeks, during which the promotion is available (every "x" weeks).
        week_days:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityByWeekDayWeekDaysItems'
          description: Specifies the weekdays during which the promotion is available.
        daily_start_time:
          type: string
          format: time
          pattern: ^([0-1][0-9]|[2][0-3]):([0-5][0-9]):([0-5][0-9])$
          minLength: 8
          maxLength: 8
          description: Specifies the time of day from which the promotion is available.
        daily_end_time:
          type: string
          format: time
          pattern: ^([0-1][0-9]|[2][0-3]):([0-5][0-9]):([0-5][0-9])$
          minLength: 8
          maxLength: 8
          description: Specifies the time of day until which the promotion is available.
      required:
        - week_frequency
        - week_days
        - daily_start_time
        - daily_end_time
      description: Specifies the availability by weekdays.
      title: AvailabilityByWeekDay
    SavedAutomaticPromotionPromotionCategory:
      type: string
      enum:
        - cart
        - shipping
      description: >-
        The category of the promotion, determined by the type of discount it applies. Promotions that discount shipping
        (excluding free shipping) are categorized as `shipping`; all other promotions are categorized as `cart`. This
        field is computed from the promotion's rules and is read-only.


        Featured promotions are prioritized within their category — a featured `cart` promotion does not affect the
        priority of `shipping` promotions, and vice versa.
      title: SavedAutomaticPromotionPromotionCategory
    CreatedFrom:
      type: string
      enum:
        - react_ui
        - legacy_ui
        - api
      description: Describes which client originally created the promotion
      title: CreatedFrom
    SavedAutomaticPromotion:
      type: object
      properties:
        id:
          type: integer
          description: An auto-generated unique identifier for the discount rule.
        redemption_type:
          $ref: '#/components/schemas/SavedAutomaticPromotionRedemptionType'
          description: >-
            The type of the promotion. Promotions applied automatically have a value of `AUTOMATIC` whereas promotions
            requiring a coupon have a value of `COUPON`.
        name:
          type: string
          description: An internal name for this rule that the merchant can refer to.
        display_name:
          type: string
          description: Customer-facing name for this rule, that the merchant want to display to customers.
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
          description: >-
            Channels that the promotion targets. Empty array [] means targeting all the channels. In POST request, if
            omitted, this field defaults to an empty array [] value.
        customer:
          $ref: '#/components/schemas/Customer'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
          description: >-
            An ordered list of rules to be executed until the first applicable one applies a discount successfully and
            the rest will be skipped.
        current_uses:
          type: integer
          description: >-
            A read-only count of the times this rule has been used by customers. A rule is considered to be used when a
            customer successfully checks out with a rule that has applied a discount to their cart.
        max_uses:
          type: integer
          description: The maximum number of times this discount can be used by customers.
        status:
          $ref: '#/components/schemas/SavedAutomaticPromotionStatus'
          description: >-
            Controls whether or not a discount rule can be used by customers. `INVALID` is a read-only status into which
            enabled discount rules may transition when they become invalid.
        start_date:
          type: string
          description: The date and time when this rule will become active.
        end_date:
          type: string
          description: The date and time when this rule will expire. If this property is left null, the promotion never expires.
        stop:
          type: boolean
          description: >-
            Boolean value that specifies whether to stop evaluating promotions down the priority list when the promotion
            is applied successfully.
        can_be_used_with_other_promotions:
          type: boolean
          default: true
          description: >-
            Boolean value that specifies whether this promotion can be used with other promotions. When set to false,
            only apply this promotion if there are no discounts applied already, and stop executing other promotions if
            this promotion applies successfully.
        currency_code:
          type: string
          description: The ISO-4217-based transactional currency code to which the promotion applies OR * for all currencies.
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
          description: Notifications to display on the storefront based on the result of the evaluation for promotion eligibility.
        shipping_address:
          $ref: '#/components/schemas/AddressMatcher'
        schedule:
          $ref: '#/components/schemas/AvailabilityByWeekDay'
        promotion_category:
          $ref: '#/components/schemas/SavedAutomaticPromotionPromotionCategory'
          description: >-
            The category of the promotion, determined by the type of discount it applies. Promotions that discount
            shipping (excluding free shipping) are categorized as `shipping`; all other promotions are categorized as
            `cart`. This field is computed from the promotion's rules and is read-only.


            Featured promotions are prioritized within their category — a featured `cart` promotion does not affect the
            priority of `shipping` promotions, and vice versa.
        is_featured_promotion:
          type: boolean
          default: false
          description: >-
            Whether this promotion is a featured promotion. Featured promotion callouts are displayed to shoppers on
            storefront products and are evaluated at the highest priority within their category.


            A store can have a maximum of **5** featured promotions at any time. Featured promotions have specific
            constraints:

            - Must be an `AUTOMATIC` promotion (`redemption_type` must be `AUTOMATIC`).

            - Must allow stacking with other promotions (`can_be_used_with_other_promotions` must be `true`).

            - Must not stop evaluation of other promotions (`stop` must be `false`).

            - Must not have usage limits (`max_uses` must be `0` or unset).

            - Must not target specific shipping countries (`shipping_address` must be null or empty).

            - Must not target customer segments (`customer.segments` must be null or empty).

            - Must not use logical operators (and/or/not) in conditions.

            - Must not target product options or product custom fields in conditions or actions.

            - Must not exclude items on sale in actions.

            - Must contain conditions or actions that target products (brands, categories, products, or variants).


            When `is_featured_promotion` is included in the request, `featured_promotion_callout_message` must also be
            provided, and vice versa.


            **Priority behavior:** When a promotion is featured, it is automatically placed at the highest priority
            position among automatic promotions in its category (CART or SHIPPING). Featured promotions always evaluate
            before non-featured automatic promotions. When a promotion is un-featured, it moves to the bottom of the
            featured band and becomes a regular automatic promotion in the priority list.
        featured_promotion_callout_message:
          type: string
          maxLength: 80
          description: >-
            A short customer-facing message displayed alongside the targeted products in storefront. This message
            highlights the promotion to shoppers.


            Validation rules:

            - Must be included in the request whenever `is_featured_promotion` is also included, and vice versa.

            - Required and must not be empty when `is_featured_promotion` is `true`.

            - Must be empty or omitted when `is_featured_promotion` is `false`.

            - Maximum length is **80** characters.
        created_from:
          $ref: '#/components/schemas/CreatedFrom'
      required:
        - id
