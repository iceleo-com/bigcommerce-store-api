          $ref: '#/components/schemas/SavedCouponPromotionMultipleCodes'
        coupon_type:
          $ref: '#/components/schemas/SavedCouponPromotionCouponType'
          description: The type of the coupon promotion, whether it will have single or multiple codes.
      required:
        - id
        - redemption_type
        - name
        - channels
        - customer
        - rules
        - current_uses
        - status
        - start_date
        - stop
        - can_be_used_with_other_promotions
        - currency_code
        - notifications
        - is_featured_promotion
        - featured_promotion_callout_message
        - created_from
        - coupon_overrides_automatic_when_offering_higher_discounts
        - coupon_type
      description: '**Coupon Promotion** A shopper must manually apply a *coupon promotion* to their cart.'
      title: SavedCouponPromotion
