          description: >-
            If the shopper has multiple items in their cart that could be discounted by this action, strategy will
            determine which items are discounted, for example LEAST_EXPENSIVE will sort items in price ascending order
            and discount the cheapest item first.
        exclude_items_on_sale:
          type: boolean
          description: Enable this option to prevent items already on sale from being further discounted.
        include_items_considered_by_condition:
