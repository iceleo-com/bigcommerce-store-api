servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    CouponCodeSchedule:
      type: object
      properties:
        valid_from:
          type: string
          format: date-time
          description: |-
            The date and time from which the code can be redeemed (RFC3339 UTC).
            Must be within the promotion's schedule.
        valid_until:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            The date and time until which the code can be redeemed (RFC3339 UTC).
            Must be after `valid_from` and within the promotion's schedule.
            `null` means no end, and is only allowed if the parent promotion does not have an end date.
            Must not be `null` if the parent promotion has an end date.
      required:
        - valid_from
        - valid_until
      description: >-
        A custom validity window for a coupon code, independent of (but fully contained within) the parent promotion's
        schedule.
      title: CouponCodeSchedule
    CouponCode:
      type: object
      properties:
        id:
          type: integer
          description: An auto-generated unique identifier for the coupon code.
        code:
          type: string
          pattern: '[a-zA-Z0-9_\ -]'
          maxLength: 50
          description: >-
            A unique code that can be used to manually apply a discount. Only letters, numbers, white spaces,
            underscores and hyphens are allowed.
        current_uses:
          type: integer
          description: A read-only count of the times this coupon code has been used.
        max_uses:
          type: integer
          description: >-
            The maximum number of times you can use this coupon code. The default value is 0, which represents unlimited
            uses.
        max_uses_per_customer:
          type: integer
          description: >-
            The maximum number of times a specific customer can use this coupon code. The default value is 0, which
            represents unlimited uses.
        created:
          type: string
          format: date-time
          description: The date and time when this coupon code was created.
        schedule:
          oneOf:
            - $ref: '#/components/schemas/CouponCodeSchedule'
            - type: 'null'
          description: >-
            The custom validity window of this coupon code.

            `null` when the code inherits the promotion's schedule.

            A code is custom-scheduled if and only if `schedule` is non-null.


            Note: the promotion object also has a field named `schedule`. That field controls on which days of the week
            the promotion is available, and has no relation to this field.
      required:
        - id
        - code
        - current_uses
        - created
      description: A `CouponCode` object encapsulates attributes of a coupon code.
      title: CouponCode
    DeprecatedPaginationLinks:
