openapi: 3.1.0
info:
  title: 'Admin Management: Promotions'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/promotions/{promotion_id}/codes:
    get:
      operationId: couponCodesBulk_getPromotionCodes
      summary: List Coupon Codes
      description: |-
        Get codes for a particular promotion.

        **Note:**
        The default rate limit for this endpoint is 10 concurrent requests.
      tags:
        - couponCodesBulk
      parameters:
        - name: promotion_id
          in: path
          description: The ID of the associated promotion.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: before
          in: query
          description: >
            A cursor that can be used for backwards pagination. Will fetch results before the position corresponding to
            the cursor. Cannot be used with the 'page' query parameter. Cannot be used with the 'after' query parameter.
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >
            A cursor that can be used for forwards pagination. Will fetch results after the position corresponding to
            the cursor. Cannot be used with the 'page' query parameter. Cannot be used with the 'before' query
            parameter.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: >
            Query parameter that specifies the page number in a paginated list of resources. This field is deprecated
            and the 'before' and 'after' cursor parameters should be used instead.
          required: false
          schema:
            type: integer
            minimum: 1
          deprecated: true
        - name: limit
          in: query
          description: >
            Query parameter that limits the number of items displayed per page in a paginated list of resources. When
            none is specified a default value of 50 is used.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: code
          in: query
          description: Filter items by `code`.
          required: false
          schema:
            type: string
        - name: valid_from:min
          in: query
          description: >-
            Return only codes with a custom `valid_from` on or after this value. The value is a positive integer Unix
            timestamp.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: valid_until:max
          in: query
          description: >-
            Return only codes with a custom `valid_until` on or before this value. The value is a positive integer Unix
            timestamp.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of coupon codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon_Codes__Bulk__getPromotionCodes_Response_200'
      security:
        - X-Auth-Token: []
    delete:
      operationId: couponCodesBulk_deleteCouponCodes
      summary: Delete Multiple Coupon Codes
      description: >-
        Deletes multiple coupon codes relating to the given promotion. Currently, batches are limited to 50 coupon
        codes.


        **Notes**

        * "id:in" query param is required to delete coupon codes. If not provided, or provided with the wrong data
        format, a 422 error code is returned.

        * The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - couponCodesBulk
      parameters:
        - name: promotion_id
          in: path
          description: The ID of the associated promotion.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |-
            A comma-separated list of promotions to filter or target with this operation.

            Example: **?id:in=11,12,13,14**
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: code
          in: query
          description: Filter items by `code`.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: A 204 response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: The result of the bulk delete request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCouponCodesRequestUnprocessableEntityError'
      security:
        - X-Auth-Token: []
    post:
      operationId: couponCodesSingle_createPromotionCode
      summary: Create Coupon Code
      description: |-
        Create a new code for the promotion.

        **Note:**
        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - couponCodesSingle
      parameters:
        - name: promotion_id
          in: path
          description: The ID of the associated promotion.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested coupon code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon_Codes__Single__createPromotionCode_Response_201'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '[a-zA-Z0-9_\ -]'
                  maxLength: 50
                  description: >-
                    A unique code that can be used to manually apply a discount. Only letters, numbers, white spaces,
                    underscores, and hyphens are allowed.
                max_uses:
                  type: integer
                  description: >-
                    The maximum number of times you can use this coupon code. The default value is 0, which represents
                    unlimited uses. The parent promotion's `max_uses` field overrides the coupon code's `max_uses`
                    field.
                max_uses_per_customer:
                  type: integer
                  description: >-
                    The maximum number of times a specific customer can use this coupon code. The default value is 0,
                    which represents unlimited uses.
              required:
                - code
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/promotions/{promotion_id}/codegen:
    post:
      operationId: couponCodesBulk_generatePromotionCodesBatch
      summary: Generate Multiple Coupon Codes
      description: >-
        Generate a batch of coupon codes for a particular bulk coupon promotion.


        **Note:**

        * batch_size (number of codes generated per request) is limited to 250. If batch_size is not an integer or
        larger than 250, it will return a 422 error code.

        * The default rate limit for this endpoint is 10 concurrent requests.
      tags:
        - couponCodesBulk
      parameters:
        - name: promotion_id
          in: path
          description: The ID of the associated promotion.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The result of the bulk coupon code request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon_Codes__Bulk__generatePromotionCodesBatch_Response_201'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
        '405':
          description: >-
            Method not allowed. Bulk code generation is only supported for promotions with redemption_type of 'COUPON'
            and coupon_type of 'BULK'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse405'
        '422':
          description: The request payload is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_size:
                  type: integer
                  minimum: 1
                  maximum: 250
                  description: The number of coupon codes to generate in each batch. The maximum value is 250.
                max_uses:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  description: >-
                    The maximum number of times each coupon code can be used. The default value is 1. The value 0 means
                    unlimited usage.
                max_uses_per_customer:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  description: >-
                    The maximum number of times a specific customer can use each coupon code. The default value is 1.
                    The value 0 means unlimited usage.
                prefix:
                  type: string
                  pattern: '[A-Z0-9_-]'
                  maxLength: 20
                  description: >-
                    The fixed text that will appear at the beginning of every generated coupon code. Only capital
                    letters, numbers, underscores and hyphens are allowed.
                suffix:
                  type: string
                  pattern: '[A-Z0-9_-]'
                  maxLength: 20
                  description: >-
                    The fixed text that will appear at the end of every generated coupon code. Only capital letters,
                    numbers, underscores and hyphens are allowed.
                delimiter:
                  type: string
                  pattern: '[_-]'
                  maxLength: 1
                  description: >-
                    An optional single character (_ or -) that will be placed between the prefix and the randomly
                    generated code, and again between the randomly generated code and the suffix. It will only be
                    applied if a valid prefix or suffix is present.
                exclude_characters:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z0-9]$
                  description: >-
                    An optional array of single length string elements to exclude from the randomly generated part. Only
                    capital letters and numbers are allowed. The default value is an empty array [].
                code_length:
                  type: integer
                  minimum: 6
                  maximum: 16
                  description: >-
                    The length of the random string to be generated for each coupon code. The value must be between 6
                    and 16. The default length is 16. The total length of each generated coupon code is calculated as
                    `:` code_length + length of prefix with delimiter + length of suffix with delimiter. The maximum
                    total length of a coupon code is 50.
                schedule:
                  oneOf:
                    - $ref: '#/components/schemas/CouponCodeSchedule'
                    - type: 'null'
                  description: |-
                    Optional custom schedule applied to every code generated in the batch.
                    Omitted or `null` means the codes inherit the promotion's schedule.
              required:
                - batch_size
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/promotions/{promotion_id}/reschedulecodes:
    put:
      operationId: couponCodesBulk_reschedulePromotionCodes
      summary: Reschedule Multiple Coupon Codes
      description: >-
        Sets or clears the custom validity window on up to 250 coupon codes of a bulk coupon promotion in a single
        atomic operation.


        **Notes**

        * Only supported for bulk coupon promotions (`coupon_type` of `BULK`); a 422 is returned otherwise.

        * `schedule: null` resets the selected codes to inherit the promotion's schedule.

        * Batches are limited to 250 coupon code ids; larger batches return a 422.

        * The operation is atomic — any invalid id (including ids that do not exist or belong to another promotion)
        fails the whole request with a 422.

        * Dates must be within the promotion's schedule, and `valid_until` must be after `valid_from`.

        * You cannot reschedule the codes of an archived promotion.
      tags:
        - couponCodesBulk
      parameters:
        - name: promotion_id
          in: path
          description: The ID of the associated promotion.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: The coupon codes have the new schedule. The change applies to redemption immediately.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: The promotion does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The server cannot process the request. Possible causes: the body is invalid, the window is outside the
            promotion schedule, one or more ids do not belong to the promotion, the promotion is not a bulk coupon
            promotion, or the promotion is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: >-
                    The ids of the coupon codes to reschedule. All ids must exist and belong to the promotion. Limited
                    to 250 ids per request.
                schedule:
                  oneOf:
                    - $ref: '#/components/schemas/CouponCodeSchedule'
                    - type: 'null'
                  description: |-
                    The custom schedule to apply to the selected codes.
                    `null` resets the codes to inherit the promotion's schedule.
              required:
                - ids
                - schedule
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/promotions/codes:
    get:
      operationId: couponCodesSingle_getCouponCodeByCode
      summary: Get Coupon Code
      description: |-
        Get a coupon with a given coupon code.

        **Note:**
        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - couponCodesSingle
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: Filter items by `code`.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of coupon codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon_Codes__Single__getCouponCodeByCode_Response_200'
      security:
        - X-Auth-Token: []
    delete:
      operationId: couponCodesSingle_deleteCouponCodeByCode
      summary: Delete Coupon Code
      description: |-
        Deletes a coupon with a given coupon code.

        **Note:**
        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - couponCodesSingle
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: Filter items by `code`.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: The deletion was successful or the resource does not exist.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/promotions/{promotion_id}/codes/{code_id}:
    delete:
      operationId: couponCodesSingle_deleteCouponCode
      summary: Delete Coupon Code by ID
      description: |-
        Deletes a coupon code.

        **Note:**
        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - couponCodesSingle
      parameters:
        - name: promotion_id
          in: path
          description: The ID of the associated promotion.
          required: true
          schema:
            type: string
        - name: code_id
          in: path
          description: The ID of the coupon code to delete.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: The deletion was successful or the resource does not exist.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/promotions:
    get:
      operationId: promotionsBulk_getPromotions
      summary: List Promotions
      description: >-
        Returns a list of *promotions*.


        The response includes the display name and other details about each promotion, and lists the promotions ordered
        by ID by default.


        **Note:**

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - promotionsBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: Filter items by `id`.
          required: false
          schema:
            type: integer
        - name: name
          in: query
          description: Filter items by `name`.
          required: false
          schema:
            type: string
        - name: code
          in: query
          description: Filter items by `code`.
          required: false
          schema:
            type: string
        - name: currency_code
          in: query
          description: Filter items by `currency_code`.
          required: false
          schema:
            type: string
        - name: redemption_type
          in: query
          description: Filter items by `redemption type`
          required: false
          schema:
            $ref: '#/components/schemas/PromotionsGetParametersRedemptionType'
        - name: status
          in: query
          description: Filter items by `status`.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Query parameter that specifies the page number in a paginated list of resources.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: >
            Query parameter that limits the number of items displayed per page in a paginated list of resources. When
            none is specified a default value of 50 is used.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: sort
          in: query
          description: Query parameter that specifies the field name to sort by. The default value is *id*.
          required: false
          schema:
            $ref: '#/components/schemas/PromotionsGetParametersSort'
        - name: direction
          in: query
          description: Query parameter that specifies the sorting direction. The default value is *asc*.
          required: false
          schema:
            $ref: '#/components/schemas/PromotionsGetParametersDirection'
        - name: channels
          in: query
          description: >-
            Filter promotions that target those `channel IDs`.  Example: **?channels=1,2**. Note: promotions that target
            all the channels are included in the filtering result.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: is_featured
          in: query
          description: 'Filter promotions by featured status. Valid values: `true`, `false`.'
          required: false
          schema:
            type: boolean
        - name: query
          in: query
          description: Filter items by both name or code.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of promotions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotions__Bulk__getPromotions_Response_200'
        '422':
          description: Failure due to an invalid query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
    delete:
      operationId: promotionsBulk_deletePromotions
      summary: Delete Multiple Promotions
      description: >-
        Deletes multiple promotions. Currently, batches are limited to 50 promotions.


        **Notes**

        * "id:in" query param is required to delete promotions. If this parameter is not provided, or provided with the
        wrong data format, a 422 error code is returned.

        * You cannot delete promotions that still have coupon codes attached.

        * The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - promotionsBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |-
            A comma-separated list of promotions to filter or target with this operation.

            Example: **?id:in=11,12,13,14**
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: A 204 response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: The result of the bulk delete request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePromotionsRequestUnprocessableEntityError'
      security:
        - X-Auth-Token: []
    post:
      operationId: promotionsSingle_createPromotion
      summary: Create Promotion
      description: >-
        Creates a *promotion*.

        To learn more about how to create a *promotion*, read the [Promotions
        Overview](/developer/docs/admin/catalog-and-inventory/promotions).

        For examples grouped by use case, see the [promotions
        examples](/developer/docs/admin/catalog-and-inventory/promotions/examples/brand).


        **Note:**

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - promotionsSingle
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested promotion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotions__Single__createPromotion_Response_201'
        '400':
          description: The request payload was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '403':
          description: The request payload was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
        '422':
          description: The request payload was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Promotions__Single__createPromotion_Request'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/promotions/archive:
    post:
      operationId: promotionsBulk_archivePromotions
      summary: Archive Multiple Promotions
      description: >-
        Archives multiple promotions. Accepts an array of promotion IDs to archive.


        Archiving a coupon-based promotion deletes all coupon codes created for that promotion before the time of
        archiving. Because a promotion can have a large number of codes, the deletion runs asynchronously and can take a
        few minutes to complete.


        Archiving a promotion also removes it from the featured list, freeing up a seat for another active promotion.
        Its priority is ignored by priority management operations on active promotions. If the promotion is later
        unarchived, it's placed at the bottom of the priority list.


        **Note:**

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - promotionsBulk
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
