      description: '**Percentage Discount**'
      title: PercentageDiscount
    Discount:
      oneOf:
        - $ref: '#/components/schemas/FixedDiscount'
        - $ref: '#/components/schemas/PercentageDiscount'
      description: '**Discount**'
      title: Discount
    MaximumAllowedDiscountAmount:
      type: string
      pattern: ^(0|([1-9][0-9]*))(\.[0-9]+)?$
      description: >
        The maximum monetary value that can be applied as a discount. It can take any value greater than 0, up to
        10000000.

        The application of this maximum depends on the discount type:
          - Discount on shipping:
              - Percent Discount: Maximum discount total applies to ALL shipping destinations combined.
              - Fixed Amount Discount: Maximum total is divided evenly amongst all shipping destinations.
          - Discount on products:
              - Percent Discount: Maximum discount total applies to ALL products combined.
              - Fixed Amount Discount + Each Product's price: Maximum total is divided based on existing weighting logic amongst all products. Applicable only when `as_total` is set to `false`.
          - Discount on order subtotal:
              - Maximum discount total applies to entire order total. Applicable for both Percent and Fixed Amount discounts.
      title: MaximumAllowedDiscountAmount
    CartValueActionCartValue:
      type: object
      properties:
        discount:
          $ref: '#/components/schemas/Discount'
        maximum_allowed_discount_amount:
          $ref: '#/components/schemas/MaximumAllowedDiscountAmount'
      required:
        - discount
      title: CartValueActionCartValue
    CartValueAction:
