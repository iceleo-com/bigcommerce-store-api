openapi: 3.1.0
info:
  title: "Admin Management: Inventory"
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/inventory/adjustments/absolute:
    put:
      operationId: adjustments_put-absolute-adjustment
      summary: Absolute Adjustment
      description: |
        Override the existing inventory levels for an inventory item at a location. Use absolute adjustments as the default method for updating inventory. This endpoint batches requests, making them more resource friendly than the [Catalog API](/developer/api-reference/rest/admin/catalog/products/update-products). Absolute adjustments have lower complexity than [relative adjustments](/developer/api-reference/rest/admin/management/inventory/adjustments/post-relative-adjustment), which synchronize with orders.

        **Limits**
        * For maximum inventory levels, see [Inventory adjustments](/developer/docs/admin/catalog-and-inventory/inventory-adjustments#inventory-adjustments). 
        * Limit of 2000 items for payload length, see [Optimizing performance](/developer/docs/admin/catalog-and-inventory/inventory-adjustments#optimizing-performance) for more information.
      tags:
        - adjustments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTransactionResponse"
        "422":
          description: Incorrect entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentsAbsoluteRequest"
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/inventory/adjustments/relative:
    post:
      operationId: adjustments_post-relative-adjustment
      summary: Relative Adjustment
      description: |
        Add or subtract inventory for an inventory item at a location. Use this endpoint only when you do not know absolute quantities. For example, making order-related inventory changes through a third-party may require relative adjustments. Otherwise, use the [Absolute adjustment](/developer/api-reference/rest/admin/management/inventory/adjustments/put-absolute-adjustment) endpoint for updating inventory.

        **Limits**
        * For maximum inventory levels, see [Inventory adjustments](/developer/docs/admin/catalog-and-inventory/inventory-adjustments#inventory-adjustments). 
        * Limit of 2000 items for payload length, see [Optimizing performance](/developer/docs/admin/catalog-and-inventory/inventory-adjustments#optimizing-performance) for more information.
      tags:
        - adjustments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTransactionResponse"
        "422":
          description: |
            Incorrect entity. The adjustment was not valid. This is the result of missing required fields or invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentsRelativeRequest"
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/inventory/items:
    get:
      operationId: items_get-inventory-items
      summary: List Inventory at Locations
      description: |
        Return a list of inventory and inventory settings for all items in all locations.

        **Limits**
        * Limit of 1000 items for payload length.
      tags:
        - items
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: sku:in
          in: query
          description: List of `sku` separated by comma.
          required: false
          schema:
            type: string
        - name: variant_id:in
          in: query
          description: List of `variant_id` separated by comma.
          required: false
          schema:
            type: integer
        - name: product_id:in
          in: query
          description: List of `product_id` separated by comma.
          required: false
          schema:
            type: integer
        - name: location_id:in
          in: query
          description: Comma separated list of `location_id`.
          required: false
          schema:
            type: integer
        - name: location_code:in
          in: query
          description: Comma separated list of `location_code`.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Items_get-inventory-items_Response_200"
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/inventory/locations/{location_id}/items:
    get:
      operationId: items_get-location-inventory-items
      summary: Get Inventory at Location
      description: |
        Return a list of inventory and inventory settings for all items in a location.

        **Limits**
        * Limit of 1000 items for payload length.
      tags:
        - items
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: variant_id:in
          in: query
          description: List of `variant_id` separated by comma.
          required: false
          schema:
            type: integer
        - name: product_id:in
          in: query
          description: List of `product_id` separated by comma.
          required: false
          schema:
            type: integer
        - name: sku:in
          in: query
          description: List of `sku` separated by comma.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Items_get-location-inventory-items_Response_200"
        "404":
          description: Request has been rejected due to resource not being found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - X-Auth-Token: []
    put:
      operationId: items_put-location-inventory-items
      summary: Update Inventory Settings for Location
      description: |
        
        Update inventory settings for items at a location.

        **Limits**
        * Limit of 2000 items for payload length.
      tags:
        - items
      parameters:
        - name: location_id
          in: path
          description: Unique identifier for a location.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: Request has been successfully processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTransactionResponse"
        "422":
          description: |
            Incorrect entity. Item was not valid due to missing required fields or invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationItemsSettingsRequest"
      security:
        - X-Auth-Token: []
tags:
  - name: adjustments
    description: Make absolute or relative adjustments to inventory levels.
  - name: items
    description: Retrieve inventory levels for items across locations.
  - name: locations
    description: Create and manage the inventory locations a store ships from.
  - name: metafields
    description: Attach custom metafield data to individual locations.
  - name: batchMetafields
    description: Create, update, and delete location metafields in bulk.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    LocationItemsSettingsRequest:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/LocationItemsSettingsRequestSettingsItems"
      required:
        - settings
      title: LocationItemsSettingsRequest
    LocationItemsSettingsRequestSettingsItems:
      type: object
      properties:
        identity:
          $ref: "#/components/schemas/LocationItemsSettingsRequestSettingsItemsIdentity"
          description: One of the `sku`, `product_id`, or `variant_id` is required to identify the item.
        safety_stock:
          type: integer
          description: |
            Safety stock. Decreases the amount available for selling items at that amount. If missing, the value will remain the same.
        is_in_stock:
          type: boolean
          description: |
            Shows whether an item is available for purchase independent of quantity. If missing, the value will remain the same.
        warning_level:
          type: integer
          description: |
            Inventory warning level for the product. The store owner will be informed when the product's inventory level drops below the warning level. If missing, the value will remain the same.
        bin_picking_number:
          type: string
          description: |
            Warehouse location identifier; bin picking number for the item.
        backorder_limit:
          type:
            - integer
            - "null"
          description: |
            Maximum quantity that can be backordered for this item. If missing, the value will remain the same. `null` means unlimited backorder.
      title: LocationItemsSettingsRequestSettingsItems
    LocationItemsSettingsRequestSettingsItemsIdentity:
      oneOf:
        - $ref: "#/components/schemas/LocationItemsSettingsRequestSettingsItemsIdentity0"
        - $ref: "#/components/schemas/LocationItemsSettingsRequestSettingsItemsIdentity1"
        - $ref: "#/components/schemas/LocationItemsSettingsRequestSettingsItemsIdentity2"
      description: One of the `sku`, `product_id`, or `variant_id` is required to identify the item.
      title: LocationItemsSettingsRequestSettingsItemsIdentity
    LocationItemsSettingsRequestSettingsItemsIdentity2:
      type: object
      properties:
        product_id:
          type: integer
          description: ID of product.
      title: LocationItemsSettingsRequestSettingsItemsIdentity2
    LocationItemsSettingsRequestSettingsItemsIdentity1:
      type: object
      properties:
        variant_id:
          type: integer
          description: ID of variant.
      title: LocationItemsSettingsRequestSettingsItemsIdentity1
    LocationItemsSettingsRequestSettingsItemsIdentity0:
      type: object
      properties:
        sku:
          type: string
          description: '"Stock keeping unit" identifier of an item.'
      title: LocationItemsSettingsRequestSettingsItemsIdentity0
    Items_get-location-inventory-items_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LocationItemsResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      title: Items_get-location-inventory-items_Response_200
    Meta:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/MetaPagination"
      title: Meta
    MetaPagination:
      type: object
      properties:
        total:
          type: integer
          description: The total number of items in the result set.
        count:
          type: integer
          description: The total number of items in the collection on current page.
        per_page:
          type: integer
          description: The number of items returned in the collection per page, controlled by the limit parameter.
        current_page:
          type: integer
          description: The page you are currently on within the collection.
        total_pages:
          type: integer
          description: The total number of pages in the collection.
        links:
          $ref: "#/components/schemas/MetaPaginationLinks"
          description: Pagination links for the previous and next parts of the whole collection.
      title: MetaPagination
    MetaPaginationLinks:
      type: object
      properties:
        previous:
          type: string
          description: The link to the previous page is returned in the response.
        current:
          type: string
          description: A link to the current page is returned in the response.
        next:
          type: string
          description: Link to the next page returned in the response.
      description: Pagination links for the previous and next parts of the whole collection.
      title: MetaPaginationLinks
    LocationItemsResponse:
      type: object
      properties:
        identity:
          $ref: "#/components/schemas/LocationItemsResponseIdentity"
        available_to_sell:
          type: integer
          description: Amount of available items.
        total_inventory_onhand:
          type: integer
          description: Amount of available items on hand minus `safety_stock`.
        qty_backordered:
          type: integer
          description: Current quantity of this item on backorder.
        settings:
          $ref: "#/components/schemas/LocationItemsResponseSettings"
      title: LocationItemsResponse
    LocationItemsResponseSettings:
      type: object
      properties:
        safety_stock:
          type: integer
          default: 0
          description: |
            Safety stock. Decreases the amount available for selling an item. If missing, the value will remain the same.
        is_in_stock:
          type: boolean
          default: true
          description: Shows whether an item is available for purchase independent of quantity.
        warning_level:
          type: integer
          default: 0
          description: |
            Inventory warning level for the product. The store owner will be informed when the product's inventory level drops below the warning level. If missing, the value will remain the same.
        bin_picking_number:
          type: string
          description: |
            Warehouse location identifier; bin picking number for the item.
        backorder_limit:
          type:
            - integer
            - "null"
          description: Maximum quantity that can be backordered for this item. `null` means unlimited backorder.
        backorder_message:
          oneOf:
            - $ref: "#/components/schemas/LocationItemsResponseSettingsBackorderMessage"
            - type: "null"
          description: The backorder message assigned to this item.
      title: LocationItemsResponseSettings
    LocationItemsResponseSettingsBackorderMessage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
          description: The shopper-facing backorder message text.
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: The backorder message assigned to this item.
      title: LocationItemsResponseSettingsBackorderMessage
    LocationItemsResponseIdentity:
      type: object
      properties:
        sku:
          type: string
          description: '"Stock keeping unit" identifier of item.'
        variant_id:
          type: integer
          description: ID of variant.
        product_id:
          type: integer
          description: ID of product.
      title: LocationItemsResponseIdentity
    Items_get-inventory-items_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      title: Items_get-inventory-items_Response_200
    ItemResponse:
      type: object
      properties:
        identity:
          $ref: "#/components/schemas/ItemResponseIdentity"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponseLocationsItems"
      title: ItemResponse
    ItemResponseLocationsItems:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location.
        location_code:
          type: string
          description: Code of location.
        location_name:
          type: string
          description: Name of location.
        available_to_sell:
          type: integer
          description: Available to sell. Total inventory on hand minus the safety stock.
        total_inventory_onhand:
          type: integer
          description: Total inventory on hand.
        qty_backordered:
          type: integer
          description: Current quantity of this item on backorder at this location.
        location_enabled:
          type: boolean
          description: Status of the location. Indicates whether a location is enabled.
        settings:
          $ref: "#/components/schemas/ItemResponseLocationsItemsSettings"
      title: ItemResponseLocationsItems
    ItemResponseLocationsItemsSettings:
      type: object
      properties:
        safety_stock:
          type: integer
          description: Decreases the amount available for selling items at that amount.
        is_in_stock:
          type: boolean
          description: Shows whether an item is available for purchase independent of quantity.
        warning_level:
          type: integer
          description: Inventory warning level for the product. The store owner will be informed when the product inventory level drops below the warning level.
        bin_picking_number:
          type: string
          description: Warehouse location identifier; bin picking number for the item.
        backorder_limit:
          type:
            - integer
            - "null"
          description: Maximum quantity that can be backordered for this item at this location. `null` means unlimited backorder.
        backorder_message:
          oneOf:
            - $ref: "#/components/schemas/ItemResponseLocationsItemsSettingsBackorderMessage"
            - type: "null"
          description: The backorder message assigned to this item at this location.
      title: ItemResponseLocationsItemsSettings
    ItemResponseLocationsItemsSettingsBackorderMessage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
          description: The shopper-facing backorder message text.
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: The backorder message assigned to this item at this location.
      title: ItemResponseLocationsItemsSettingsBackorderMessage
    ItemResponseIdentity:
      type: object
      properties:
        sku:
          type: string
          description: '"Stock keeping unit" identifier of an item.'
        variant_id:
          type: integer
          description: ID of variant.
        product_id:
          type: integer
          description: ID of product.
        sku_id:
          type: integer
          description: Read-only reference to Catalog V2 API's SKU ID. `null` if the item is a base variant.
      title: ItemResponseIdentity
    AdjustmentsRelativeRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reason for the adjustment operation.
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdjustmentsRelativeRequestItemsItems"
          description: One of the `sku`, `product_id`, or `variant_id` is required to identify the item.
      required:
        - items
      title: AdjustmentsRelativeRequest
    AdjustmentsRelativeRequestItemsItems:
      oneOf:
        - $ref: "#/components/schemas/AdjustmentsRelativeRequestItemsItems0"
        - $ref: "#/components/schemas/AdjustmentsRelativeRequestItemsItems1"
        - $ref: "#/components/schemas/AdjustmentsRelativeRequestItemsItems2"
      title: AdjustmentsRelativeRequestItemsItems
    AdjustmentsRelativeRequestItemsItems2:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location. This is empty in the case of the default allotment.
        product_id:
          type: integer
          description: ID of product.
        quantity:
          type: integer
          description: Amount of items that will be moved.
      required:
        - location_id
        - product_id
        - quantity
      title: AdjustmentsRelativeRequestItemsItems2
    AdjustmentsRelativeRequestItemsItems1:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location. This is empty in the case of the default allotment.
        variant_id:
          type: integer
          description: ID of variant.
        quantity:
          type: integer
          description: Amount of items that will be moved.
      required:
        - location_id
        - variant_id
        - quantity
      title: AdjustmentsRelativeRequestItemsItems1
    AdjustmentsRelativeRequestItemsItems0:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location. This is empty in the case of the default allotment.
        sku:
          type: string
          description: '"Stock keeping unit" identifier of an item.'
        quantity:
          type: integer
          description: Amount of items that will be moved.
      required:
        - location_id
        - sku
        - quantity
      title: AdjustmentsRelativeRequestItemsItems0
    AdjustmentsAbsoluteRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reason for the adjustment operation.
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdjustmentsAbsoluteRequestItemsItems"
          description: One of the `sku`, `product_id`, or `variant_id` is required to identify the item.
      required:
        - items
      title: AdjustmentsAbsoluteRequest
    AdjustmentsAbsoluteRequestItemsItems:
      oneOf:
        - $ref: "#/components/schemas/AdjustmentsAbsoluteRequestItemsItems0"
        - $ref: "#/components/schemas/AdjustmentsAbsoluteRequestItemsItems1"
        - $ref: "#/components/schemas/AdjustmentsAbsoluteRequestItemsItems2"
      title: AdjustmentsAbsoluteRequestItemsItems
    AdjustmentsAbsoluteRequestItemsItems2:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location. This is empty in the case of the default allotment.
        product_id:
          type: integer
          description: product_id identifier of item.
        quantity:
          type: integer
          description: Amount of items that will be moved.
      required:
        - location_id
        - product_id
        - quantity
      title: AdjustmentsAbsoluteRequestItemsItems2
    AdjustmentsAbsoluteRequestItemsItems1:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location. This is empty in the case of the default allotment.
        variant_id:
          type: integer
          description: variant_id identifier of item.
        quantity:
          type: integer
          description: Amount of items that will be moved.
      required:
        - location_id
        - variant_id
        - quantity
      title: AdjustmentsAbsoluteRequestItemsItems1
    AdjustmentsAbsoluteRequestItemsItems0:
      type: object
      properties:
        location_id:
          type: integer
          description: ID of location. This is empty in the case of the default allotment.
        sku:
          type: string
          description: '"Stock keeping unit" identifier of an item.'
        quantity:
          type: integer
          description: Amount of items that will be moved.
      required:
        - location_id
        - sku
        - quantity
      title: AdjustmentsAbsoluteRequestItemsItems0
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        title:
          type: string
          description: Human readable error message.
        type:
          type: string
          description: |
            URL identifying the error type. Dereferencing the URL leads to documentation about the error type.
        errors:
          $ref: "#/components/schemas/ErrorResponseErrors"
          description: The detailed summary describing the particular error.
      title: ErrorResponse
    ErrorResponseErrors:
      type: object
      properties: {}
      description: The detailed summary describing the particular error.
      title: ErrorResponseErrors
    SimpleTransactionResponse:
      type: object
      properties:
        transaction_id:
          type: string
          description: Unique identifier of performed action.
      title: SimpleTransactionResponse
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |-
        ### OAuth scopes

        | UI Name | Permission | Parameter |
        |:--------|:-----------|:----------|
        |  Store Inventory | read-only | `store_inventory_read_only` |
        |  Store Inventory | modify | `store_inventory` |

        ### Authentication header

        | Header | Argument | Description |
        |:-------|:---------|:------------|
        | `X-Auth-Token` | `access_token` | For more about API accounts that generate `access_token`s, see [API Accounts and OAuth Scopes](/developer/docs/overview/api-fundamentals/api-accounts#api-accounts). |

        ### Further reading

        For example requests and more information about authenticating BigCommerce APIs, see [Authentication and Example Requests](/developer/docs/overview/api-fundamentals/api-accounts).

        For more about BigCommerce OAuth scopes, see [API Accounts and OAuth Scopes](/developer/docs/overview/api-fundamentals/api-accounts#oauth-scopes).

        For a list of API status codes, see [API Status Codes](/developer/api-reference/rest/overview#rest-http-status-codes).
