  /stores/{store_hash}/v3/carts/{cartId}/redirect_urls:
    post:
      operationId: redirects_createCartRedirectURL
      summary: Create Cart Redirect URL
      description: >-
        Creates a **Cart** redirect URL for redirecting a shopper to an already created cart using the `cartId`.


        **Usage Notes**


        * To use redirect URLs, first create the cart using the REST Management API or GraphQL Storefront API.

        * Redirect URLs can also be created with **Create a Cart** requests by appending `include=redirect_urls`.

        * A **Carts** redirect URL is valid for 30 days and may only be used once.

        * Redirect URLs point to either a shared checkout domain or a channel-specific domain, depending on the
        storefront configuration.

        * Once a redirect URL has been visited, it will be invalidated and cannot be used again. 

        * If your application requires URLs to be visited more than once, consider generating a fresh one each time you
        need to restore a cart, and redirecting to the URL from your own application.

        * To restore a cart that was created on the storefront, either by a shopper or a Storefront API, first recreate
        the cart using the **REST Management API**.

        * When redirecting the shopper, you can add a set of `query_params` to the URL. The `query_params` feature
        allows passing additional information to the redirect URL.
      tags:
        - redirects
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The generated cart redirect URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redirects_createCartRedirectURL_Response_201'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Redirect_urls_Post'
      security:
        - X-Auth-Token: []
