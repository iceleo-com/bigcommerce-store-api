openapi: 3.1.0
info:
  title: 'Admin Management: Carts'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/carts/metafields:
    get:
      operationId: batchMetafields_getCartsMetafields
      summary: List Cart Metafields
      description: Get all cart metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla `key` query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespaces.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: >-
            Filter based on comma-separated metafieldʼs namespaces. Could be used with vanilla `namespace` query
            parameter
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/CartsMetafieldsGetParametersDirection'
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsMetafieldsGetParametersIncludeFieldsSchemaItems'
        - name: date_modified:min
          in: query
          description: >
            'Query parameter that lets you filter by the minimum date modified created, for example,
            `2024-05-14T09:34:00` or `2024-05-14`. Returns metafields modified after this date.'
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >
            'Query parameter that lets you filter by the maximum date modified created, for example,
            `2024-05-14T09:34:00` or `2024-05-14`. Returns metafields modified before this date.'
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >
            'Query parameter that lets you filter by the minimum date created, for example, `2024-05-14T09:34:00` or
            `2024-05-14`. Returns metafields created after this date.'
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: >
            'Query parameter that lets you filter by the maximum date created, for example, `2024-05-14T09:34:00` or
            `2024-05-14`. Returns metafields created before this date.'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_Batch'
      security:
        - X-Auth-Token: []
    post:
      operationId: batchMetafields_createCartsMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            List of created `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_Batch_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCartsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CartsMetafieldsPostRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    put:
      operationId: batchMetafields_updateCartsMetafields
      summary: Update Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_Batch_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCartsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CartsMetafieldsPutRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    delete:
      operationId: batchMetafields_deleteCartsMetafields
      summary: Delete Multiple Metafields
      description: Delete all cart metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCartsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE'
      requestBody:
        description: List of metafield `id`s.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/carts:
    post:
      operationId: cartsSingle_createCart
      summary: Create Cart
      description: >-
        Creates a **Cart**. 


        **Required Fields**


        |Field|Details|

        |-|-|

        |`line_item`|Specifies a line item.| 

        |`custom_items`|Specifies a custom item. Only required if adding a custom item to the cart.|

        |`gift_certificates`|Specifies a gift certificate. Only required if adding a gift certificate to the cart.|


        **Usage Notes**


        * A **cart** `id` (UUID) is returned in the response.

        * A **cart** `id` is the same as a **checkout** `id`.

        * A cart can be created by adding an existing **catalog item** or a **custom item**.

        * Images are not supported for custom items. The `image_url` field is accepted but does not render on the
        storefront.

        * Carts are valid for **30 days** from the **last modification** (this includes creating the cart or editing the
        cart).

        * If a product has modifiers, use the `option_selections` array to describe the **modifier** selection(s).

        * The format and data type of a cart’s `option_value` are defined by the `value_data` object of a product’s
        [variant option value](/developer/api-reference/rest/admin/catalog/product-variant-options/values), [modifier
        value](/developer/api-reference/rest/admin/catalog/product-modifiers/values), or a combination of both.

        * Redirect URLs can only be generated from carts that were created using the **REST Management API**. 

        * To get cart `redirect_urls` in the response, append the following query parameter to the request URL:
        `include=redirect_urls`. Redirect URLs point to either a shared checkout domain or a channel-specific domain,
        depending on the storefront configuration.

        * To restore a cart that was created by a shopper or through a Storefront API, first recreate the cart using the
        **REST Management API**.

        * To get cart `promotions` in the response, append the following query parameter to the request URL:
        `include=promotions.banners`.


        **Overridable fields**


        When creating a cart, you can override the following catalog values on each line item:


        | Field | Description |

        |-|-|

        | `list_price` | Override the product's price. By default, overriding a product's `list_price` makes it
        ineligible for V3 product-level promotions. In **Store Settings** under **Promotions and Coupons** in the
        control panel, you can change this behavior to allow promotions on overridden prices. |

        | `name` | Override the product name. Useful for locale-specific product names. |

        | `option_selections.name` | Override the name of an option or modifier selection. Useful for locale-specific
        option labels. |

        | `option_selections.value` | Override the value of an option or modifier selection. Useful for locale-specific
        option values. |
      tags:
        - cartsSingle
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `redirect_urls`: Create a direct link to a cart. This can be used for the /POST request for carts.

            * `line_items.physical_items.options`: The cart returns an abbreviated result. Use this to return physical
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.digital_items.options`: The cart returns an abbreviated result. Use this to return digital
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.physical_items.stock_position`: Returns backorder and stock availability details for physical
            items.

            * `line_items.digital_items.stock_position`: Returns backorder and stock availability details for digital
            items. Since digital products cannot be backordered, backorder values are always zero.

            * `promotions.banners`: Returns a list of eligible banners.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsPostParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carts__Single__createCart_Response_201'
      requestBody:
        description: >-
          **Examples:**


          1. Creating a cart by adding a simple product (a product without option selections).

          2. Creating a cart with a variant. This works when a product can be specified purely by a variant, without any
          other required options.

          3. Creating a cart using a date option. The API supports timestamps, “option_value”: 1743570000, and dates as
          an object literal, “option_value”: {“day”:”01”, “month”:”02”, “year”:”2020”}.

          4. Creating a cart with a variant, a checkbox, and a picklist modifier added.

          5. Creating a cart using a custom item.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCreatePostData'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/carts/{cartId}:
    get:
      operationId: cartsSingle_getCart
      summary: Get Cart
      description: Returns a storeʼs *Cart*.
      tags:
        - cartsSingle
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `redirect_urls`: Create a direct link to a cart. This can be used for the /POST request for carts.

            * `line_items.physical_items.options`: The cart returns an abbreviated result. Use this to return physical
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.digital_items.options`: The cart returns an abbreviated result. Use this to return digital
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.physical_items.stock_position`: Returns backorder and stock availability details for physical
            items.

            * `line_items.digital_items.stock_position`: Returns backorder and stock availability details for digital
            items. Since digital products cannot be backordered, backorder values are always zero.

            * `promotions.banners`: Returns a list of eligible banners.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdGetParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carts__Single__getCart_Response_200'
        '404':
          description: Cart not found.
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
    put:
      operationId: cartsSingle_updateCart
      summary: Update Customer ID
      description: >-
        Updates a *Cartʼs* `customer_id`.


        **Notes**


        Changing the *Cart* `customer_id` will remove any promotions or shipping calculations on the *Cart*. These are
        tied to the customer depending on cart conditions and any customer groups. 


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - cartsSingle
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `redirect_urls`: Create a direct link to a cart. This can be used for the /POST request for carts.

            * `line_items.physical_items.options`: The cart returns an abbreviated result. Use this to return physical
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.digital_items.options`: The cart returns an abbreviated result. Use this to return digital
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.physical_items.stock_position`: Returns backorder and stock availability details for physical
            items.

            * `line_items.digital_items.stock_position`: Returns backorder and stock availability details for digital
            items. Since digital products cannot be backordered, backorder values are always zero.

            * `promotions.banners`: Returns a list of eligible banners.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdPutParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carts__Single__updateCart_Response_201'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdatePutRequestData'
      security:
        - X-Auth-Token: []
    delete:
      operationId: cartsSingle_deleteCart
      summary: Delete Cart
      description: Deletes a *Cart*. Once a *Cart* has been deleted it can’t be recovered.
      tags:
        - cartsSingle
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/carts/{cartId}/items:
    post:
      operationId: items_addCartLineItems
      summary: Add Cart Line Items
      description: >-
        Adds line item to the *Cart*.


        **Usage Notes**


        To add a custom item use `custom_items`. Note that images are not supported for custom items; the `image_url`
        field is accepted but does not render on the storefront.


        If a product has modifiers, omit the `variant_id` and instead use the `option_selections` array to describe both
        the **variant** and the **modifier** selections.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.


        **Overridable fields**


        When adding a line item, you can override the following catalog values:


        | Field | Description |

        |-|-|

        | `list_price` | Override the product's price. By default, overriding a product's `list_price` makes it
        ineligible for V3 product-level promotions. In **Store Settings** under **Promotions and Coupons** in the
        control panel, you can change this behavior to allow promotions on overridden prices. |

        | `name` | Override the product name. Useful for locale-specific product names. |

        | `option_selections.name` | Override the name of an option or modifier selection. Useful for locale-specific
        option labels. |

        | `option_selections.value` | Override the value of an option or modifier selection. Useful for locale-specific
        option values. |
      tags:
        - items
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `redirect_urls`: Create a direct link to a cart. This can be used for the /POST request for carts.

            * `line_items.physical_items.options`: The cart returns an abbreviated result. Use this to return physical
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.digital_items.options`: The cart returns an abbreviated result. Use this to return digital
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.physical_items.stock_position`: Returns backorder and stock availability details for physical
            items.

            * `line_items.digital_items.stock_position`: Returns backorder and stock availability details for digital
            items. Since digital products cannot be backordered, backorder values are always zero.

            * `promotions.banners`: Returns a list of eligible banners.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdItemsPostParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_addCartLineItems_Response_201'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart_Line_Item_Update_Post'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/carts/{cartId}/items/{itemId}:
    put:
      operationId: items_updateCartLineItem
      summary: Update Cart Line Item
      description: >-
        Updates an existing, single line item in the *Cart*. 


        **Notes**


        Currently, only updating `list_price` and `quantity` are supported. By default, overriding a product's
        list_price makes it ineligible for V3 product-level promotions. In **Store Settings** under **Promotions and
        Coupons** in the control panel, you can change this behavior to allow promotions on overridden prices.


        If the product has modifiers, omit the `variant_id` and instead use the `option_selections` array to describe
        both the **variant** and the **modifier** selections.


        If a variant needs to be changed or updated, the product will need to be removed and re-added to the cart with
        the correct variants using the **Add Cart Line Items** endpoint.


        `custom_items` cannot be updated via the API at this time. To update your cart, add a new updated custom item
        and delete the outdated one. If your cart contains only one line item, perform the add operation before the
        delete operation.


        Deleting all line items from the cart will invalidate the cart. 


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - items
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: itemId
          in: path
          description: The ID of the line item.
          required: true
          schema:
            type: string
            format: number
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `redirect_urls`: Create a direct link to a cart. This can be used for the /POST request for carts.

            * `line_items.physical_items.options`: The cart returns an abbreviated result. Use this to return physical
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.digital_items.options`: The cart returns an abbreviated result. Use this to return digital
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.physical_items.stock_position`: Returns backorder and stock availability details for physical
            items.

            * `line_items.digital_items.stock_position`: Returns backorder and stock availability details for digital
            items. Since digital products cannot be backordered, backorder values are always zero.

            * `promotions.banners`: Returns a list of eligible banners.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdItemsItemIdPutParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Items_updateCartLineItem_Response_200'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart_Line_Item_Update_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: items_deleteCartLineItem
      summary: Delete Cart Line Item
      description: >-
        Deletes a *Cart* line item. 


        **Notes**


        Removing the last `line_item` in the *Cart* deletes the *Cart*.


        To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - items
      parameters:
        - name: cartId
          in: path
          description: The identifier of a specific cart.
          required: true
          schema:
            type: string
            format: UUID
        - name: itemId
          in: path
          description: The ID of the line item.
          required: true
          schema:
            type: string
            format: number
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `redirect_urls`: Create a direct link to a cart. This can be used for the /POST request for carts.

            * `line_items.physical_items.options`: The cart returns an abbreviated result. Use this to return physical
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.digital_items.options`: The cart returns an abbreviated result. Use this to return digital
            items product options. To return the extended cart object, use in a /POST request.

            * `line_items.physical_items.stock_position`: Returns backorder and stock availability details for physical
            items.

            * `line_items.digital_items.stock_position`: Returns backorder and stock availability details for digital
            items. Since digital products cannot be backordered, backorder values are always zero.

            * `promotions.banners`: Returns a list of eligible banners.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdItemsItemIdDeleteParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: >-
            NOTE: Discounted line items are re-evaluated on cart actions and may be automatically added back to your
            cart with a new line item ID to satisfy promotional requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartLineItemDelete'
      security:
        - X-Auth-Token: []
