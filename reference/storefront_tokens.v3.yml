        **Required Scopes**

        * `Manage` `Storefront API Customer Impersonation Tokens`


        > NOTE: This endpoint only returns customer impersonation tokens issued by the API account making the request.
        Tokens issued by another API account are never returned. Storefront and private tokens require the `Storefront
        API Tokens` scope and are never returned here.
      tags:
        - customerImpersonationToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: The page of results to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: The number of results to return per page. Values above 250 are capped at 250.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: sort
          in: query
          description: The field to sort the results by.
          required: false
          schema:
            $ref: '#/components/schemas/StorefrontApiTokenCustomerImpersonationGetParametersSort'
            default: issued_at
        - name: direction
          in: query
          description: The direction to sort the results by.
          required: false
          schema:
            $ref: '#/components/schemas/StorefrontApiTokenCustomerImpersonationGetParametersDirection'
            default: asc
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A paginated list of issued tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTokens_Response'
        '422':
