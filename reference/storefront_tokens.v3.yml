          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: customerImpersonationToken_createTokenWithCustomerImpersonation
      summary: Create a token
      description: >-
        Returns a Storefront API token that allows your application to impersonate customers when making GraphQL `POST`
        requests. For more information on how to use the returned token, see [customer impersonation
        tokens](/developer/docs/storefront/guides/graphql-storefront-api/authentication#customer-impersonation-tokens).


        **Required Scopes**

        * `Manage` `Storefront API Customer Impersonation Tokens`


        > NOTE: While neither `channel_id` nor `channel_ids` is labelled as required, one must be included in the
        request body. Including neither will throw an error, and including both will result in unexpected behaviors.
      tags:
        - customerImpersonationToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The newly created customer impersonation token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPostImpersonation'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/storefront/api-token-customer-impersonation/{jti}:
    delete:
      operationId: customerImpersonationToken_revokeCustomerImpersonationTokenByJti
      summary: Revoke a customer impersonation token by ID
      description: >-
        Revokes a single customer impersonation token identified by its `jti`. You do not need the token's JWT string to
        revoke it - only the `jti` returned by the [List customer impersonation
        tokens](#operation/listCustomerImpersonationTokens) endpoint.


        You can only revoke tokens that your own API account issued through this token family. Supplying a `jti` issued
        by a different API account, or belonging to a different token family, returns `404 Not Found`.


        Each store can hold a limited number of revoked tokens that have not yet expired. Once that limit is reached,
