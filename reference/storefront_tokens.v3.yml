openapi: 3.1.0
info:
  title: 'Admin Authentication: Storefront API Tokens'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/storefront/api-token:
    get:
      operationId: apiToken_listTokens
      summary: List tokens
      description: >-
        Returns a paginated list of the storefront API tokens your API account has issued. The token's JWT string is
        never returned; each entry includes a `jti` identifier that you use to revoke the token, as well as `is_revoked`
        and `is_expired` flags. Revoked and expired tokens are included in the list.


        **Required Scopes**

        * `Manage` `Storefront API Tokens`


        > NOTE: This endpoint only returns tokens issued by the API account making the request, and only tokens of the
        family named in its path segment. Tokens issued by another API account are never returned. Customer
        impersonation tokens require the `Storefront API Customer Impersonation Tokens` scope and are never returned
        here.
      tags:
        - apiToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: The page of results to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: The number of results to return per page. Values above 250 are capped at 250.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: sort
          in: query
          description: The field to sort the results by.
          required: false
          schema:
            $ref: '#/components/schemas/StorefrontApiTokenGetParametersSort'
            default: issued_at
        - name: direction
          in: query
          description: The direction to sort the results by.
          required: false
          schema:
            $ref: '#/components/schemas/StorefrontApiTokenGetParametersDirection'
            default: asc
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A paginated list of issued tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedTokens_Response'
        '422':
          description: Unrecognized `sort` field, `direction` value, or query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: apiToken_createToken
      summary: Create a token
      description: >-
        Creates a Storefront API token. This endpoint creates storefront tokens that support CORS via
        `allowed_cors_origins` and are intended for browser-based applications.


        For server-to-server integrations, you must use the [private token
        endpoint](/developer/api-reference/rest/admin/authentication-apis/storefront-api-tokens/private-api-token/create-private-token)
        instead.


        **Required Scopes**

        * `Manage` `Storefront API Tokens`


        > NOTE: While neither `channel_id` nor `channel_ids` is labelled as required, one must be included in the
        request body. Including neither will throw an error, and including both will result in unexpected behaviors.
      tags:
        - apiToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The newly created storefront API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token_Full'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_cors_origins:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  description: >-
                    List of allowed domains for Cross-Origin Request Sharing. Currently accepts a maximum of two domains
                    per created token.
                expires_at:
                  type: integer
                  minimum: 0
                  description: >-
                    Unix timestamp (UTC time) defining when the token should expire. Supports seconds, but does not
                    support milliseconds, microseconds, or nanoseconds.
                name:
                  type: string
                  maxLength: 120
                  description: >-
                    Optional label for the token. Surfaced by the list endpoints to help you identify tokens. Trimmed
                    server-side and never included in the JWT. Must not contain 4-byte characters such as emoji.
                channel_ids:
                  type: array
                  items:
                    type: integer
                  description: >-
                    A list of channel IDs that are valid for the requested token. Use this field for one or more channel
                    IDs. One of `channel_id` or `channel_ids` is required; including neither returns an error, and
                    including both results in unexpected behavior.
                channel_id:
                  type: integer
                  minimum: 1
                  description: >-
                    Channel ID that is valid for the requested token. Use this field to enter a single channel ID. We
                    support this field for backwards compatibility, but `channel_ids` is preferred. One of `channel_id`
                    or `channel_ids` is required; including neither returns an error, and including both results in
                    unexpected behavior.
              required:
                - expires_at
      security:
        - X-Auth-Token: []
    delete:
      operationId: apiToken_revokeToken
      summary: Revoke a token
      description: >-
        Revoke access for a storefront API token or a private API token. Only revoke compromised tokens under emergency
        situations. Let uncompromised short-lived tokens expire naturally, as you do not need to revoke these.
      tags:
        - apiToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
        - name: Sf-Api-Token
          in: header
          description: An existing JWT token that you want to revoke.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A storefront API token or private API token revocation has been scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API_Token_revokeToken_Response_200'
        '422':
          description: >-
            One of the following:

            * The `Sf-Api-Token` header is missing (`Sf-Api-Token header has to be provided.`).

            * The supplied JWT is invalid.

            * The supplied token was issued by a different API account (`The token doesn't belong to the client`).

            * The store has reached its limit of revoked tokens (`Store cannot revoke more tokens. Limit # of revoked
            tokens already reached.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/storefront/api-token/{jti}:
    delete:
      operationId: apiToken_revokeTokenByJti
      summary: Revoke a token by ID
      description: >-
        Revokes a single storefront API token identified by its `jti`. You do not need the token's JWT string to revoke
        it - only the `jti` returned by the [List tokens](#operation/listTokens) endpoint.


        You can only revoke tokens that your own API account issued through this token family. Supplying a `jti` issued
        by a different API account, or belonging to a different token family, returns `404 Not Found`.


        Each store can hold a limited number of revoked tokens that have not yet expired. Once that limit is reached,
        this endpoint returns `422 Unprocessable Entity` until some revoked tokens expire. The revoke-all endpoint is
        not subject to this limit.


        Revocation can take up to approximately 60 seconds to fully propagate because revoked identifiers are held in a
        short-lived cache, so a revoked token may briefly continue to authenticate.


        **Required Scopes**

        * `Manage` `Storefront API Tokens`
      tags:
        - apiToken
      parameters:
        - name: jti
          in: path
          description: Unique identifier (the JWT `jti` claim) of the token to revoke.
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: The token has been revoked.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: The `jti` path parameter is blank (`jti cannot be blank`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            No token with the supplied `jti` was issued by this API account in this token family (`No token found for
            the supplied jti.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The store has reached its limit of revoked tokens that have not yet expired (`Store cannot revoke more
            tokens. Limit # of revoked jtis already reached.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/storefront/api-token/revoke-all:
    post:
      operationId: apiToken_revokeAllTokens
      summary: Revoke all tokens
      description: >-
        Revokes every active storefront API token that your API account has issued. Only tokens issued by the API
        account making the request are revoked, and only tokens in this family (matching the path segment); tokens
        issued by another API account and tokens of other families are unaffected.


        Revocation can take up to approximately 60 seconds to fully propagate because revoked identifiers are held in a
        short-lived cache, so a revoked token may briefly continue to authenticate.


        **Required Scopes**

        * `Manage` `Storefront API Tokens`
      tags:
        - apiToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: All storefront API tokens issued by this API account have been revoked.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/storefront/api-token-customer-impersonation:
    get:
      operationId: customerImpersonationToken_listCustomerImpersonationTokens
      summary: List customer impersonation tokens
      description: >-
