          description: The newly created private storefront API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPostPrivate'
      security:
        - X-Auth-Token: []
