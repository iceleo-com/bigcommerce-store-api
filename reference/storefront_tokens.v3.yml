          required: false
          schema:
            $ref: '#/components/schemas/StorefrontApiTokenPrivateGetParametersDirection'
            default: asc
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
