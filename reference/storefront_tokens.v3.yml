    post:
      operationId: privateApiToken_createPrivateToken
      summary: Create a private API token
      description: >-
        Creates a private token for server-to-server integrations. Private tokens are always stateless (no session
        required) and provide better performance for server-to-server use cases. The API will reject private
        token-authenticated requests that originate from web browsers.


        **Required Scopes**

        * `Manage` `Storefront API Tokens`


        > NOTE: While neither `channel_id` nor `channel_ids` is labelled as required, one must be included in the
        request body. Including neither will throw an error, and including both will result in unexpected behaviors.
      tags:
        - privateApiToken
      parameters:
