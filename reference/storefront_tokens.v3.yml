  /stores/{store_hash}/v3/storefront/api-token-private/revoke-all:
    post:
      operationId: privateApiToken_revokeAllPrivateTokens
      summary: Revoke all private tokens
      description: >-
        Revokes every active private API token that your API account has issued. Only tokens issued by the API account
        making the request are revoked, and only tokens in this family (matching the path segment); tokens issued by
        another API account and tokens of other families are unaffected.


        Revocation can take up to approximately 60 seconds to fully propagate because revoked identifiers are held in a
        short-lived cache, so a revoked token may briefly continue to authenticate.


        **Required Scopes**

        * `Manage` `Storefront API Tokens`
      tags:
        - privateApiToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: All private API tokens issued by this API account have been revoked.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
tags:
  - name: apiToken
    description: Create, list, and revoke storefront API tokens for browser-based access to the GraphQL Storefront API.
  - name: customerImpersonationToken
    description: >-
      Create, list, and revoke customer impersonation tokens for querying the GraphQL Storefront API from a specific
      customer's perspective.
  - name: privateApiToken
    description: Create, list, and revoke private storefront API tokens for server-to-server access to the GraphQL Storefront API.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    StorefrontApiTokenGetParametersSort:
      type: string
      enum:
        - issued_at
        - expires_at
      default: issued_at
      title: StorefrontApiTokenGetParametersSort
    StorefrontApiTokenGetParametersDirection:
      type: string
      enum:
        - asc
        - desc
      default: asc
      title: StorefrontApiTokenGetParametersDirection
    IssuedTokenType:
      type: string
      enum:
        - simple
        - private
        - customer_impersonation
      description: The token family.
      title: IssuedTokenType
    IssuedTokenScopesItems:
      type: string
      enum:
        - Unauthenticated
        - Customer
        - B2B
      title: IssuedTokenScopesItems
    IssuedTokenPrincipal:
      type: object
      properties:
        id:
          type: string
          description: ID of the principal that created the token. For an API account, this is the client ID.
        type:
          type: string
          description: Type of the principal that created the token.
      description: The identity that created the token. Only present when available.
      title: IssuedTokenPrincipal
    IssuedToken:
      type: object
      properties:
        jti:
          type: string
          description: Unique token identifier (the JWT `jti` claim). Use this value to revoke the token.
        type:
          $ref: '#/components/schemas/IssuedTokenType'
          description: The token family.
        name:
          type: string
          maxLength: 120
          description: Optional label set by the store owner. Only present when set. Never included in the JWT.
        channel_ids:
          type: array
          items:
            type: integer
          description: Channel IDs the token is valid for.
        allowed_cors_origins:
          type: array
          items:
            type: string
          description: Allowed CORS origins for the token. Empty for private and customer impersonation tokens.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/IssuedTokenScopesItems'
          description: Access scopes granted to the token. Populated for private tokens; empty for other token types.
        is_revoked:
          type: boolean
          description: Whether the token has been revoked.
        is_expired:
          type: boolean
          description: >-
            Whether the token has expired, evaluated against the server clock when the request is served. A token counts
            as expired from its `expires_at` second onward, matching the JWT `exp` semantics. Independent of
            `is_revoked`.
        principal:
          $ref: '#/components/schemas/IssuedTokenPrincipal'
          description: The identity that created the token. Only present when available.
        issued_at:
          type: integer
          format: int64
          description: Unix timestamp (UTC, seconds) when the token was issued. Only present when available.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp (UTC, seconds) when the token expires. Only present when set.
        revoked_at:
          type: integer
          format: int64
          description: Unix timestamp (UTC, seconds) when the token was revoked. Only present for revoked tokens.
      required:
        - jti
        - type
        - channel_ids
        - allowed_cors_origins
        - scopes
        - is_revoked
        - is_expired
      description: >-
        A storefront API token issued by the requesting API account. The JWT string is never returned; use the `jti` to
        revoke the token.
      title: IssuedToken
