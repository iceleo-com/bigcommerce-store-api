        **Required Scopes**

        * `Manage` `Storefront API Tokens`


        > NOTE: This endpoint only returns tokens issued by the API account making the request, and only tokens of the
        family named in its path segment. Tokens issued by another API account are never returned. Customer
        impersonation tokens require the `Storefront API Customer Impersonation Tokens` scope and are never returned
        here.
      tags:
        - privateApiToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: The page of results to return.
          required: false
          schema:
            type: integer
            minimum: 1
