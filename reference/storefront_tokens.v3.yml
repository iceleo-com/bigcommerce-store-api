          type: array
          items:
            type: integer
          description: >-
            A list of channel IDs that are valid for the requested token. Use this field for one or more channel IDs.
            One of `channel_id` or `channel_ids` is required; including neither returns an error, and including both
            results in unexpected behavior.
        channel_id:
          type: integer
          minimum: 1
          description: >-
