        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: The token has been revoked.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: The `jti` path parameter is blank (`jti cannot be blank`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            No token with the supplied `jti` was issued by this API account in this token family (`No token found for
            the supplied jti.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The store has reached its limit of revoked tokens that have not yet expired (`Store cannot revoke more
            tokens. Limit # of revoked jtis already reached.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/storefront/api-token-customer-impersonation/revoke-all:
    post:
      operationId: customerImpersonationToken_revokeAllCustomerImpersonationTokens
      summary: Revoke all customer impersonation tokens
      description: >-
        Revokes every active customer impersonation token that your API account has issued. Only tokens issued by the
        API account making the request are revoked, and only tokens in this family (matching the path segment); tokens
        issued by another API account and tokens of other families are unaffected.


        Revocation can take up to approximately 60 seconds to fully propagate because revoked identifiers are held in a
        short-lived cache, so a revoked token may briefly continue to authenticate.


        **Required Scopes**

        * `Manage` `Storefront API Customer Impersonation Tokens`
      tags:
        - customerImpersonationToken
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
