        - name
      description: Specifies the Common Price List properties.
      title: PricelistsGetResponsesContentApplicationJsonSchemaDataItems
    PricelistsGetResponsesContentApplicationJsonSchemaMetaPagination:
      type: object
      properties:
        total:
          type: integer
          description: |
            Total number of items in the result set.
        count:
