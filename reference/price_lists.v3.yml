    BulkPricingTierType:
      type: string
      enum:
        - fixed
        - price
        - percent
      description: |-
        The type of adjustment that is made. 
        Acceptable values: 
        * price – the adjustment amount per product 
        * percent – the adjustment as a percentage of the original price 
        * fixed – the adjusted absolute price of the product
      title: BulkPricingTierType
    BulkPricingTier:
      type: object
      properties:
        quantity_min:
          type: integer
          description: The cart's minimum quantity of associated variants needed to qualify for this tier's pricing.
        quantity_max:
          type: integer
          description: The cart's maximum allowed quantity of associated variants to qualify for this tier's pricing.
        type:
          $ref: '#/components/schemas/BulkPricingTierType'
          description: |-
            The type of adjustment that is made. 
            Acceptable values: 
            * price – the adjustment amount per product 
            * percent – the adjustment as a percentage of the original price 
            * fixed – the adjusted absolute price of the product
        amount:
          type: number
          format: double
          description: The price adjustment amount. This value and the type will decide the price per variant for the pricing tier.
      title: BulkPricingTier
    PriceRecordBatchItem:
      type: object
      properties:
        price_list_id:
          type: integer
          description: The price list ID the price record is associated with.
        variant_id:
          type: integer
          description: The variant with which the price record is associated. Either `variant_id` or `sku` is required.
        sku:
          type: string
          description: >-
            The SKU for the variant with which this price record is associated. Either `sku` or `variant_id` is
            required.
        currency:
          type: string
          description: The 3-letter country code with which this price record is associated.
        price:
          type: number
          format: double
          description: >-
            The list price for the variant mapped in a Price List. Overrides any existing or Catalog list price for the
            variant/product. If empty, the sale price will be treated as not being set on this variant.
        sale_price:
          type: number
          format: double
          description: >-
            The sale price for the variant mapped in a Price List. Overrides any existing or Catalog sale price for the
            variant/product. If empty, the sale price will be treated as not being set on this variant.
        retail_price:
          type: number
          format: double
          description: >-
            The retail price for the variant mapped in a Price List. Overrides any existing or Catalog retail price for
            the variant/product.  If empty, the retail price will be treated as not being set on this variant.
        map_price:
          type: number
          format: double
          description: >-
            The MAP (Minimum Advertised Price) for the variant mapped in a Price List. Overrides any existing or Catalog
            MAP price for the variant/product. If empty, the `map_ price` will be treated as not being set on this
            variant.
        bulk_pricing_tiers:
          type: array
          items:
            $ref: '#/components/schemas/BulkPricingTier'
