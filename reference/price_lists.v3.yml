openapi: 3.1.0
info:
  title: 'Admin Management: Price Lists'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/pricelists:
    get:
      operationId: priceLists_getPriceLists
      summary: List Price Lists
      description: Returns a list of *Price Lists*. Optional parameters can be passed in.
      tags:
        - priceLists
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: |
            Filter items by name.
          required: false
          schema:
            type: string
        - name: date_created
          in: query
          description: |
            Filter items by date_created.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified
          in: query
          description: Filter items by date_modified. For example `v3/catalog/products?date_last_imported:min=2018-06-15`
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: >-
            Controls the number of items per page in a limited (paginated) list of products. If you provide only a
            limit, the API returns both paginations while applying that limit.
          required: false
          schema:
            type: integer
        - name: before
          in: query
          description: >-
            A cursor that can be used for backwards pagination. Will fetch results before the position corresponding to
            the cursor. Cannot be used with the 'page' query parameter. Cannot be used with the 'after' query parameter.
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >-
            A cursor that can be used for forwards pagination. Will fetch results after the position corresponding to
            the cursor. Cannot be used with the 'page' query parameter. Cannot be used with the 'before' query
            parameter.
          required: false
          schema:
            type: string
        - name: id:in
          in: query
          description: Filter results to those whose ID is in this list.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: name:like
          in: query
          description: Filter results to those whose name contains this value.
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: Filter results to those created on or before this date.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: Filter results to those created on or after this date.
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: Filter results to those modified on or before this date.
          required: false
          schema:
            type: string
        - name: date_modified:min
          in: query
          description: Filter results to those modified on or after this date.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_getPriceLists_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: priceLists_createPriceList
      summary: Create Price List
      description: |-
        Creates a *Price List*.

        **Required Fields**
        * name
      tags:
        - priceLists
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_createPriceList_Response_200'
        '409':
          description: >
            `Price List` conflicts with another Price List. This is the result of duplicate unique values, such as
            `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePriceListRequestConflictError'
        '422':
          description: >
            `Price List` is not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePriceListRequestUnprocessableEntityError'
      requestBody:
        description: 'Creates a Price List. '
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The unique name of the Price List. Required in a POST request.
                active:
                  type: boolean
                  description: >
                    Boolean value that specifies whether this `Price List` and its prices are active or not. Defaults to
                    `true`.
                layers:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayerItem'
                  description: |
                    Fallback price lists to assign on creation. Maximum one item.
              required:
                - name
      security:
        - X-Auth-Token: []
    delete:
      operationId: priceLists_deletePriceLists
      summary: Delete All Price Lists
      description: Deletes a *Price List*. All associated price records are also removed. Optional parameters can be passed in.
      tags:
        - priceLists
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |
            Filter by ID. Accepts multiple comma-separated values.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: name
          in: query
          description: |
            Filter items by name.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: >-
            `204 No Content`. The action has been performed and no further information will be supplied. `null` is
            returned.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '503':
          description: Service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/pricelists/{price_list_id}:
    get:
      operationId: priceLists_getPriceList
      summary: Get Price List
      description: ' Returns a single *Price List*.'
      tags:
        - priceLists
      parameters:
        - name: price_list_id
          in: path
          description: |
            The ID of the `Price List` requested.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_getPriceList_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: priceLists_updatePriceList
      summary: Update Price List
      description: Updates a *Price List*.
      tags:
        - priceLists
      parameters:
        - name: price_list_id
          in: path
          description: |
            The ID of the `Price List` requested.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_updatePriceList_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePriceListRequestNotFoundError'
        '409':
          description: >
            `Price List` was in conflict with another Price List. This is the result of duplicate unique values, such as
            `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePriceListRequestConflictError'
        '422':
          description: >
            `Price List` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePriceListRequestUnprocessableEntityError'
      requestBody:
        description: Update a PriceList
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The unique name of the Price List. Required in a POST request.
                active:
                  type: boolean
                  description: |
                    Whether or not this `Price List` and its prices are active. Defaults to `true`.
                layers:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayerItem'
                  description: >
                    Controls the fallback price lists assigned to this price list. Behavior depends on the value
                    provided:


                    - **Omitted**: no change to existing layers.

                    - **Empty array** (`[]`): removes all layers.

                    - **Array with items**: replaces the current layers with the provided list.


                    Maximum one item.
              required:
                - name
      security:
        - X-Auth-Token: []
    delete:
      operationId: priceLists_deletePriceList
      summary: Delete Price List
      description: |-
        Deletes a *Price List*. All associated price records are also removed.
        **Limits**
        * Limit of 1 concurrent request.
      tags:
        - priceLists
      parameters:
        - name: price_list_id
          in: path
          description: |
            The ID of the `Price List` requested.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: Action has been enacted and no further information is to be supplied. `null` is returned.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '503':
          description: Service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/pricelists/assignments:
    get:
      operationId: priceListsAssignments_getListOfPriceListAssignments
      summary: Get Price List Assignments
      description: Fetches an array of `Price List Assignments` matching a particular Customer Group and Price List and Channel.
      tags:
        - priceListsAssignments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: The ID of the `Price List Assignment`.
          required: false
          schema:
            type: integer
        - name: price_list_id
          in: query
          description: The ID of the `Price List`.
          required: false
          schema:
            type: integer
        - name: customer_group_id
          in: query
          description: The ID of the `Customer Group`.
          required: false
          schema:
            type: integer
        - name: channel_id
          in: query
          description: The ID of the `Channel`.
          required: false
          schema:
            type: integer
        - name: id:in
          in: query
          description: Filter items by a comma-separated list of IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: customer_group_id:in
          in: query
          description: Filter items by a comma-separated list of customer group IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: price_list_id:in
          in: query
          description: Filter items by a comma-separated list of price list IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: channel_id:in
          in: query
          description: Filter items by a comma-separated list of channel IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: >-
            Controls the number of items per page in a limited (paginated) list of products. If you provide only a
            limit, the API returns both paginations while applying that limit.
          required: false
          schema:
            type: integer
        - name: before
          in: query
          description: >-
            A cursor that can be used for backwards pagination. Will fetch results before the position corresponding to
            the cursor. Cannot be used with the 'page' query parameter. Cannot be used with the 'after' query parameter.
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >-
            A cursor that can be used for forwards pagination. Will fetch results after the position corresponding to
            the cursor. Cannot be used with the 'page' query parameter. Cannot be used with the 'before' query
            parameter.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: An array of price list assignments and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsForGetResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: priceListsAssignments_createPriceListAssignments
      summary: Create Price List Assignments
      description: |-
        Creates a batch of `Price List Assignments`. 
        **Note:** The batch limit for `Price List Assignments` is 25.
      tags:
        - priceListsAssignments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: No content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_Assignments_createPriceListAssignments_Response_200'
        '422':
          description: Error response. Includes the errors for each reference ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListAssignmentsBatchErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchPriceListAssignmentsRequest'
      security:
        - X-Auth-Token: []
    delete:
      operationId: priceListsAssignments_deletePriceListAssignments
      summary: Delete Price List Assignments
      description: >-
        Deletes one or more `Price List Assignments` objects from BigCommerce using a query parameter. You must use at
        least one query parameter.


        **Note:** Although each of the query parameters below is individually optional, you must provide at least one of
        them to identify which assignments to delete.
      tags:
        - priceListsAssignments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: The ID of the `Price List Assignment`.
          required: false
          schema:
            type: integer
        - name: price_list_id
          in: query
          description: The ID of the `Price List`.
          required: false
          schema:
            type: integer
        - name: customer_group_id
          in: query
          description: The ID of the `Customer Group`.
          required: false
          schema:
            type: integer
        - name: channel_id
          in: query
          description: The ID of the `Channel`.
          required: false
          schema:
            type: integer
        - name: channel_id:in
          in: query
          description: Filter results by a comma-separated list of channel IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/pricelists/{price_list_id}/assignments:
    put:
      operationId: priceListsAssignments_upsertPriceListAssignment
      summary: Upsert Price List Assignment
      description: >-
        Upsert a single `Price List Assignment` for a `Price List`.

        **Note:**

        * Supports up to 25 simultaneous PUT requests. Running more than the allowed number of requests concurrently on
        the same store will result in a `429` status error and your additional requests will fail.        
      tags:
        - priceListsAssignments
      parameters:
        - name: price_list_id
          in: path
          description: |
            The ID of the `Price List` requested.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A price list assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentForPutResponse'
        '404':
          description: A matching customer group or channel wasnʼt found, so no assignment is created or returned.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentForPutRequest'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/pricelists/records:
    post:
      operationId: priceListsRecords_createPriceListsRecords
      summary: Create Batch of Price Lists Records
      description: >-
        Creates a batch of `Price Lists Records`; may include price list records from more than one price list.
        Concurrency limit of 10, batch size of 100. Use `PUT` instead to update records that already exist.


        Per-item validation failures — items referencing an unknown price list, unresolved `variant_id` or `sku`, items
        missing `price`, and items that duplicate another item in the same request — are rejected individually; the
        remaining valid items are saved, and `meta.saved_records` reflects the saved count.


        If any otherwise-valid item collides with an existing price record (same `price_list_id` + variant +
        `currency`), the entire batch is rolled back. `meta.saved_records` returns `0`, and the response identifies both
        the conflicting items and the items that would have been saved so you can fix the conflicts and resend the rest.
        See the `422` response for details.
      tags:
        - priceListsRecords
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Success response for batch POST of `Price List Records`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBatchResponse'
        '422':
          description: >
            Error response for batch POST of `Price List Records`. Returned in two cases:


            * **Partial create** — one or more items failed per-item validation (unknown price list, unresolved variant
            or SKU, missing price, duplicate item in batch). The remaining valid items were saved; `meta.saved_records`
            reflects the saved count.

            * **Atomic rollback on conflict** — a database-level uniqueness conflict (an existing record with the same
            `price_list_id` + variant + `currency`) caused the entire batch to be rolled back. `meta.saved_records`
            returns `0`. Each conflicting item is reported with a `uid` error of `"A price record with the same price
            list, variant, and currency already exists."`; each item that would have been saved but was rolled back with
            the batch is reported with a `uid` error of `"Batch rejected, fix other errors and retry."` so you can
            identify the rows to resend after fixing the conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRecordBatchErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PriceRecordBatchItem'
      security:
        - X-Auth-Token: []
    put:
      operationId: priceListsRecords_upsertPriceListsRecords
      summary: Create or Update Batch of Price Lists Records
      description: >-
        Creates or updates a batch of `Price Lists Records`; may include price list records from more than one price
        list. Concurrency limit of 1. It is advised to use POST to get better performance when creating price records.


        <Note>
          Each request must include `price_list_id` and `currency`, plus either `variant_id` or `sku` to identify the variant.
        </Note>
      tags:
        - priceListsRecords
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Success response for batch PUT of `Price List Records`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBatchResponse'
        '422':
          description: >
            Error response for batch PUT of `Price Records`.  May include errors during partial update in non-strict
            mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRecordBatchErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PriceRecordBatchItem'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/pricelists/{price_list_id}/records:
    get:
      operationId: priceListsRecords_getPriceListRecords
      summary: List Price List Records
      description: >-
        Returns a list of *Price List Records* associated with a *Price List*.


        **Notes**

        * Supports up to 10 simultaneous GET requests. Running more than the allowed number of requests concurrently on
        the same store will result in a `429` status error and your additional requests will fail.

        * Store Pricelist Records data to reduce the number of calls and maximize performance.
      tags:
        - priceListsRecords
      parameters:
        - name: price_list_id
          in: path
          description: |
            The ID of the `Price List` requested.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: variant_id:in
          in: query
          description: A comma-separated list of IDs for one or more variants for which prices were requested.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: product_id:in
          in: query
          description: |
            A comma-separated list of IDs for one or more products for which prices were requested.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: currency
          in: query
          description: |
            Filter items by currency.
          required: false
          schema:
            type: string
            format: ISO-4217
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
