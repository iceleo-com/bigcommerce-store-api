                $ref: '#/components/schemas/UpsertPriceListRecordsRequestUnprocessableEntityError'
        '429':
          description: |
            Allowed number of requests exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
