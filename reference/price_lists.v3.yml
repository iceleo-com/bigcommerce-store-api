    post:
      operationId: priceListsRecords_createPriceListRecords
      summary: Create Price List Records
      description: >-
        Creates *Price List Records*. 


        **Required Fields**

        * currency

        * one of `variant_id` or `sku`


        **Notes**

        * Batch requests support up to 100 items per request.

        * Up to 10 concurrent batch create requests are supported with this API. Running more than the allowed
        concurrent requests in parallel on the **same store** will cause a `429` error, and your additional requests
        will fail. You are encouraged to run requests sequentially with as many records per request as possible to
        maximize performance.

        * When creating a product with variants, or multiple SKUs, don't include records for the parent product SKU.
      tags:
        - priceListsRecords
      parameters:
        - name: price_list_id
          in: path
          description: |
            The ID of the `Price List` requested.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Success response for batch POST of `Price List Records`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_Records_createPriceListRecords_Response_200'
        '422':
          description: >-
            Error response for batch POST of `Price List Records`. May include errors during partial create in
            non-strict mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePriceListRecordsRequestUnprocessableEntityError'
        '429':
          description: |
            Allowed number of requests exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PricelistsPriceListIdRecordsPostRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    put:
      operationId: priceListsRecords_upsertPriceListRecords
      summary: Upsert Price List Records
      description: >-
        Creates or updates *Price List Records*. 


        **Required Fields**

        * currency


        **Notes**

        * Batch requests support up to 1,000 items per request.

        * Up to 2 concurrent batch upsert requests are supported with this API. Running more than the allowed concurrent
        requests in parallel on the **same store** will cause a `429` error, and your additional requests will fail. You
        are encouraged to run requests sequentially with as many records per request as possible to maximize
        performance.

        * When updating a product with variants, or multiple SKUs, don't include records for the parent product SKU.
