      title: LayerItem
    PricelistsGetResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties:
        id:
          type: integer
          description: |
            The unique numeric ID of the `Price List`; this number increments sequentially.
        date_created:
          type: string
          format: date-time
          description: |
            The date on which the `Price List` was created.
        date_modified:
          type: string
          format: date-time
          description: |
            The date on which the `Price List` was created.
        name:
          type: string
          description: The unique name of the Price List. Required in a POST request.
        active:
          type: boolean
          description: |
            Boolean value that specifies whether this `Price List` and its prices are active or not. Defaults to `true`.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerItem'
          description: >
            Fallback price lists evaluated in order when a price record is not found in this price list. Maximum one
            layer. Inactive layers are skipped during price resolution but remain assigned.
