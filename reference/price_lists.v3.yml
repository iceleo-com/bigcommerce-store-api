            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Success response for batch PUT requests of Price Records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price_Lists_Records_upsertPriceListRecords_Response_200'
        '422':
          description: >-
