  /checkouts/{checkoutId}/store-credit:
    post:
      operationId: storeCredit_addCheckoutStoreCredit
      summary: Add Store Credit
      description: >-
        Applies any available store credit to a checkout. As on the storefront, all available store credit will be used
        (up to the value of the order) and no amount need be specified.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`.

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - storeCredit
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          description: >-
            * `cart.lineItems.physicalItems.options` - physical options

            * `cart.lineItems.digitalItems.options` - digital options

            * `cart.lineItems.physicalItems.categoryNames` - physical categories

            * `cart.lineItems.digitalItems.categoryNames` - digital categories

            * `cart.lineItems.customItems.categoryNames` - custom categories

            * `cart.lineItems.physicalItems.stockPosition` - backorder and stock availability for physical items

            * `cart.lineItems.digitalItems.stockPosition` - backorder and stock availability for digital items
            (backorder values are always zero since digital products cannot be backordered)

            * `customer` - customer

            * `customer.customerGroup` - customer group

            * `payments` - payments

            * `promotions` - promotions

            * `consignments.availableShippingOptions` - shipping options

            * `consignments.availablePickupOptions` - pickup options
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutsCheckoutIdStoreCreditPostParametersIncludeSchemaItems'
            default:
              - consignments.availableShippingOptions
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Returns the updated checkout object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutStoreCreditRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  description: >-
                    The checkout version that you expect to apply the update to. If the provided version doesn't match
                    the current checkout version, you will receive a conflict error. This field is optional; if not
                    provided, optimistic concurrency control will not apply.
    delete:
      operationId: storeCredit_removeCheckoutStoreCredit
      summary: Remove Store Credit
      description: >-
        Removes store credit from a checkout.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`.

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - storeCredit
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          description: >-
            * `cart.lineItems.physicalItems.options` - physical options

            * `cart.lineItems.digitalItems.options` - digital options

            * `cart.lineItems.physicalItems.categoryNames` - physical categories

            * `cart.lineItems.digitalItems.categoryNames` - digital categories

            * `cart.lineItems.customItems.categoryNames` - custom categories

            * `cart.lineItems.physicalItems.stockPosition` - backorder and stock availability for physical items

            * `cart.lineItems.digitalItems.stockPosition` - backorder and stock availability for digital items
            (backorder values are always zero since digital products cannot be backordered)

            * `customer` - customer

            * `customer.customerGroup` - customer group

            * `payments` - payments

            * `promotions` - promotions

            * `consignments.availableShippingOptions` - shipping options

            * `consignments.availablePickupOptions` - pickup options
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutsCheckoutIdStoreCreditDeleteParametersIncludeSchemaItems'
            default:
              - consignments.availableShippingOptions
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Returns the updated checkout object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveCheckoutStoreCreditRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  description: >-
                    The checkout version that you expect to apply the update to. If the provided version doesn't match
                    the current checkout version, you will receive a conflict error. This field is optional; if not
                    provided, optimistic concurrency control will not apply.
tags:
  - name: checkout
    description: Retrieve and manage the current shopper's checkout from the storefront.
  - name: billingAddress
    description: Add or update the billing address on the shopper's checkout.
  - name: cartItems
    description: Manage the line items in the checkout's cart.
  - name: consignments
    description: Manage the consignments that group checkout items by shipping destination.
  - name: coupons
    description: Add and remove the coupons applied to the checkout.
  - name: giftCertificates
    description: Add and remove the gift certificates applied to the checkout.
  - name: spamProtection
    description: Verify a shopper's reCAPTCHA response during checkout.
  - name: storeCredit
    description: Apply and remove store credit on a shopper's checkout.
servers:
  - url: https://your_store.example.com/api/storefront
    description: https://{store_domain}/api/storefront
components:
  schemas:
    CheckoutsCheckoutIdGetParametersIncludeSchemaItems:
      type: string
      enum:
        - cart.lineItems.physicalItems.options
        - cart.lineItems.digitalItems.options
        - cart.lineItems.physicalItems.categoryNames
        - cart.lineItems.digitalItems.categoryNames
        - cart.lineItems.customItems.categoryNames
        - cart.lineItems.physicalItems.stockPosition
        - cart.lineItems.digitalItems.stockPosition
        - customer
        - customer.customerGroup
        - payments
        - promotions
        - consignments.availableShippingOptions
        - consignments.availablePickupOptions
      title: CheckoutsCheckoutIdGetParametersIncludeSchemaItems
    customFields:
      type: object
      properties:
        fieldId:
          type: string
        fieldValue:
          type: string
          description: >-
            This can also be an array for fields that need to support list of values; for example, a set of checkboxes.
            When doing a PUT or POST to the `fieldValue` with a pick list, the input must be a number. The response will
            be a string.
      description: >-
        When doing a PUT or POST to the `fieldValue` with a pick list, the input must be a number. The response will be
        a string.
      title: customFields
    address_Base:
      type: object
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        company:
          type: string
        country:
          type: string
          description: Country name.
        countryCode:
          type: string
          description: 'ISO 3166-1 alpha-2 country code. (See: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/customFields'
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        stateOrProvince:
          type: string
          description: Represents state or province.
        stateOrProvinceCode:
          type: string
        phone:
          type: string
          pattern: ^\+?[1-9]\d{1,14}(x\d{1-5})?$
        postalCode:
          type: string
      required:
        - countryCode
      title: address_Base
    CartCouponCouponType:
      type: string
      enum:
        - per_item_discount
        - percentage_discount
        - per_total_discount
        - shipping_discount
        - free_shipping
        - promotion
      description: Key name to identify the type of coupon.
      title: CartCouponCouponType
    CartCoupon:
      type: object
      properties:
        id:
          type: integer
          description: The coupon ID.
        code:
          type: string
          description: the coupon code
        displayName:
          type: string
          description: The coupon name displayed on the storefront.
        couponType:
          $ref: '#/components/schemas/CartCouponCouponType'
          description: Key name to identify the type of coupon.
        discountedAmount:
          type: number
          format: double
          description: The discounted amount applied within a given context.
      required:
        - code
      title: CartCoupon
    CheckoutCartCurrency:
      type: object
      properties:
        code:
          type: string
          description: 'ISO-4217 currency code. (See: https://www.iso.org/iso-4217-currency-codes.html.)'
        decimalPlaces:
          type: number
          format: double
          description: The number of decimal places for the currency. For example, the USD currency has two decimal places.
        name:
          type: string
          description: The currency name.
        symbol:
          type: string
          description: The currency symbol.
      description: The currency in which prices are displayed; the store default currency.
      title: CheckoutCartCurrency
    CheckoutCartDiscountsItems:
      type: object
      properties:
        id:
          type: integer
          description: Discount ID.
        discountedAmount:
          type: number
          format: double
          description: The discounted amount applied within a given context.
      title: CheckoutCartDiscountsItems
    CheckoutCartLineItemsCustomItemsItems:
      type: object
      properties:
        id:
          type: string
          description: ID of the custom item.
        listPrice:
          type: string
          description: >-
            The net item price before discounts and coupons. BigCommerce derives an item's list price from the product
            default price or, if applicable, the sale price configured in the admin panel.
        name:
          type: string
          description: Item name.
        quantity:
          type: string
        sku:
          type: string
          description: Custom item SKU.
      description: |-
        Add a custom item to the shoppers cart.
        * Custom items are not added to the catalog.
        * The price should be set to match the store settings for taxes.
      title: CheckoutCartLineItemsCustomItemsItems
    LineItemPhysicalDigitalDiscountsItems:
      type: object
      properties:
        id:
          type: integer
          description: Discount ID.
        discountedAmount:
          type: number
          format: double
          description: The discounted amount applied within a given context.
      title: LineItemPhysicalDigitalDiscountsItems
    LineItemPhysicalDigitalGiftWrapping:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        amount:
          type: number
          format: double
      title: LineItemPhysicalDigitalGiftWrapping
    LineItemPhysicalDigitalOptionsItems:
      type: object
      properties:
        name:
          type: string
          description: Option name.
        nameId:
          type: integer
          description: Option ID.
        value:
          type: string
          description: Option value.
        valueId:
          type: string
          description: Option value ID.
      title: LineItemPhysicalDigitalOptionsItems
    LineItemPhysicalDigitalStockPosition:
      type: object
      properties:
        quantityOnHand:
          type: integer
          description: Number of units currently in stock and available to fulfill this line item without backordering.
        quantityBackordered:
          type: integer
          description: Number of units from this line item that are fulfilled via backorder.
        quantityOutOfStock:
          type: integer
          description: Number of units from this line item that are out of stock and unavailable for backorder.
        backorderMessage:
          type:
            - string
            - 'null'
          description: Backorder messaging shown to the customer for this line item. `null` if no backorder message applies.
      description: >-
        Backorder and stock availability details for this line item. Only returned when explicitly requested via
        `include=cart.lineItems.physicalItems.stockPosition` (or the `digitalItems` equivalent) — not included by
        default.
      title: LineItemPhysicalDigitalStockPosition
    lineItemPhysicalDigital:
      type: object
      properties:
        addedByPromotion:
          type: boolean
          description: If the item was added automatically by a promotion, such as a coupon or buy one, get one.
        categoryNames:
          type: array
          items:
            type: string
        comparisonPrice:
          type: number
          format: double
          description: The itemʼs comparison price
        couponAmount:
          type: number
          format: double
          description: The total value of all coupons applied to this item.
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/LineItemPhysicalDigitalDiscountsItems'
          description: A list of discounts applied to this item, as an array of AppliedDiscount objects.
        discountAmount:
          type: number
          format: double
          description: The total value of all discounts applied to this item (excluding coupon).
        extendedComparisonPrice:
          type: number
          format: double
          description: The itemʼs comparison price multiplied by the quantity.
        extendedListPrice:
          type: number
          format: double
          description: The itemʼs list price multiplied by the quantity.
        extendedSalePrice:
          type: number
          format: double
          description: The itemʼs sale price multiplied by the quantity.
        giftWrapping:
          $ref: '#/components/schemas/LineItemPhysicalDigitalGiftWrapping'
        id:
          type: string
          description: The line-item ID.
        imageUrl:
          type: string
          description: A publicly-accessible URL for an image of this item.
        isMutable:
          type: boolean
        isShippingRequired:
          type: boolean
          description: Whether this item requires shipping to a physical address.
        isTaxable:
          type: boolean
          description: Whether the item is taxable.
        listPrice:
          type: number
          format: double
          description: >-
            The net item price before discounts and coupons. BigCommerce derives an item's list price from the product
            default price or, if applicable, the sale price configured in the admin panel.
        name:
          type: string
          description: The itemʼs product name.
        options:
          type: array
          items:
            $ref: '#/components/schemas/LineItemPhysicalDigitalOptionsItems'
        originalPrice:
          type: number
          format: double
          description: The item’s original price is the same as the product’s default price.
        parentId:
          type: string
          description: >-
            The product is part of a bundle such as a product pick list, then the parentId or the main product ID will
            populate.
        productId:
          type: integer
          description: ID of the product.
        sku:
          type: string
          description: SKU of the variant.
        quantity:
          type: number
          format: double
          description: Quantity of this item.
        stockPosition:
          $ref: '#/components/schemas/LineItemPhysicalDigitalStockPosition'
          description: >-
            Backorder and stock availability details for this line item. Only returned when explicitly requested via
            `include=cart.lineItems.physicalItems.stockPosition` (or the `digitalItems` equivalent) — not included by
            default.
        salePrice:
          type: number
          format: double
          description: The itemʼs price after all discounts are applied. The final price before tax calculation.
        type:
          type: string
          description: the product type - physical or digital
        url:
          type: string
          description: The product URL.
        variantId:
          type: integer
          description: ID of the variant.
      required:
        - quantity
      title: lineItemPhysicalDigital
    CheckoutCartLineItemsGiftCertificatesItemsRecipient:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      title: CheckoutCartLineItemsGiftCertificatesItemsRecipient
    CheckoutCartLineItemsGiftCertificatesItemsSender:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      title: CheckoutCartLineItemsGiftCertificatesItemsSender
    CheckoutCartLineItemsGiftCertificatesItems:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Value must be between $1.00 and $1,000.00.
        id:
          type: string
          description: Gift certificate identifier
        message:
          type: string
          description: Limited to 200 characters.
        name:
          type: string
          description: The name of the purchased gift certificate; for example, `$20 Gift Certificate`.
        recipient:
          $ref: '#/components/schemas/CheckoutCartLineItemsGiftCertificatesItemsRecipient'
        sender:
          $ref: '#/components/schemas/CheckoutCartLineItemsGiftCertificatesItemsSender'
        taxable:
          type: boolean
        theme:
          type: string
          description: Currently supports `Birthday`, `Boy`, `Celebration`, `Christmas`, `General`, and `Girl`.
        type:
          type: string
          description: Explicitly specifying the gift certificate type.
      required:
        - amount
        - recipient
        - sender
        - theme
      title: CheckoutCartLineItemsGiftCertificatesItems
    CheckoutCartLineItems:
      type: object
      properties:
        customItems:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutCartLineItemsCustomItemsItems'
        digitalItems:
          type: array
          items:
            $ref: '#/components/schemas/lineItemPhysicalDigital'
        giftCertificates:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutCartLineItemsGiftCertificatesItems'
        physicalItems:
          type: array
          items:
            $ref: '#/components/schemas/lineItemPhysicalDigital'
      required:
        - digitalItems
        - physicalItems
      title: CheckoutCartLineItems
    checkoutCart:
      type: object
      properties:
        baseAmount:
          type: number
          format: double
          description: Cost of cart’s contents, before applying discounts.
        cartAmount:
          type: number
          format: double
          description: >-
            Sum of line-items amounts, minus cart-level discounts and coupons. This amount includes taxes, where
            applicable.
        createdTime:
          type: string
          description: Time when the cart was created.
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/CartCoupon'
        currency:
          $ref: '#/components/schemas/CheckoutCartCurrency'
          description: The currency in which prices are displayed; the store default currency.
        customerId:
          type: integer
          description: ID of the customer to which the cart belongs.
        discountAmount:
          type: number
          format: double
          description: Order-based discounted amount only - Excludes coupon discounts and product-based discounts.
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutCartDiscountsItems'
        email:
          type: string
          description: The cartʼs email. This is the same email that is used in the billing address.
        id:
          type: string
          format: uuid
          description: Cart ID, provided after creating a cart with a POST.
        isTaxIncluded:
          type: boolean
          description: Boolean representing whether tax information is included.
        lineItems:
          $ref: '#/components/schemas/CheckoutCartLineItems'
        locale:
          type: string
          description: Shopper's locale.
        updatedTime:
          type: string
          description: Time when the cart was last updated.
        version:
          type: integer
          description: Cart version.
      description: A cart contains a collection of items, prices, discounts, etc. It does not contain customer-related data.
      title: checkoutCart
    address_Full:
      type: object
      properties:
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
