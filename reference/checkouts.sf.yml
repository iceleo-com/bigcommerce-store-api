  /checkouts/{checkoutId}/gift-certificates:
    post:
      operationId: giftCertificates_addCheckoutGiftCertificate
      summary: Add Gift Certificate to Checkout
      description: >-
        Adds a *Gift Certificate Code* to *Checkout*.


        > #### Note

        > * *Gift Certificates* are treated as a payment methods.

        > * You are not able to purchase a gift certificate with a gift certificate.

        > * The rate limit is 20/hour (only for unique gift-certificate codes).

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint. 

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - giftCertificates
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '404':
          description: Gift certificate code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutGiftCertificateRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCertificateRequest'
  /checkouts/{checkoutId}/gift-certificates/{giftCertificateCode}:
    delete:
      operationId: giftCertificates_deleteCheckoutGiftCertificate
      summary: Delete Gift Certificate
      description: >-
        Deletes an existing *Gift Certificate*.


        This removes the *Gift Certificate* payment method.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.  
      tags:
        - giftCertificates
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: giftCertificateCode
          in: path
          description: The code of the subject gift certificate.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
  /checkouts/{checkoutId}/spam-protection:
