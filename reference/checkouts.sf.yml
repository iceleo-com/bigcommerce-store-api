openapi: 3.1.0
info:
  title: Storefront Checkouts
  version: 1.0.0
paths:
  /checkouts/{checkoutId}:
    get:
      operationId: checkout_getCheckout
      summary: Get Checkout
      description: >-
        Returns a *Checkout*.


        The cart ID and checkout ID are the same.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - checkout
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          description: >-
            * `cart.lineItems.physicalItems.options` - physical options

            * `cart.lineItems.digitalItems.options` - digital options

            * `cart.lineItems.physicalItems.categoryNames` - physical categories

            * `cart.lineItems.digitalItems.categoryNames` - digital categories

            * `cart.lineItems.customItems.categoryNames` - custom categories

            * `cart.lineItems.physicalItems.stockPosition` - backorder and stock availability for physical items

            * `cart.lineItems.digitalItems.stockPosition` - backorder and stock availability for digital items
            (backorder values are always zero since digital products cannot be backordered)

            * `customer` - customer

            * `customer.customerGroup` - customer group

            * `payments` - payments

            * `promotions` - promotions

            * `consignments.availableShippingOptions` - shipping options

            * `consignments.availablePickupOptions` - pickup options
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutsCheckoutIdGetParametersIncludeSchemaItems'
            default:
              - consignments.availableShippingOptions
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '400':
          description: When a problem arises, returns a generic response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCheckoutRequestBadRequestError'
    put:
      operationId: checkout_updateCheckout
      summary: Update Customer Messages
      description: >-
        Updates *Checkout* customer messages.


        **Limits**


        * 2000 character limit


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - checkout
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckoutRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/checkout_Put'
  /checkouts/{checkoutId}/billing-address:
    post:
      operationId: billingAddress_addCheckoutBillingAddress
      summary: Add Checkout Billing Address
      description: >-
        Adds a billing address to an existing *Checkout*.


        **Required Fields**

        * country_code



        > #### Note

        > * The `email` property is only required if the customer is a guest shopper. Otherwise, it is set
        automatically.

        > * Sending `email` property as a payload in POST request triggers the abandoned cart notification process.

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - billingAddress
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutBillingAddressRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAddressRequest'
  /checkouts/{checkoutId}/billing-address/{addressId}:
    put:
      operationId: billingAddress_updateCheckoutBillingAddress
      summary: Update Checkout Billing Address
      description: >-
        Updates an existing billing address on *Checkout*.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint. 

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - billingAddress
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: addressId
          in: path
          description: The ID of the subject address.
          required: true
          schema:
            type: number
            format: double
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckoutBillingAddressRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAddressRequest'
  /checkouts/{checkoutId}/carts/{cartId}/items/{itemId}:
    put:
      operationId: cartItems_updateCheckoutLineItem
      summary: Update Line Item
      description: >-
        Updates a *Checkout Line Item*. Updates an existing, single line item in the cart.


        If a variant needs to be changed or updated, the product will need to be removed and re-added to the cart with
        the correct variants using the [Add Cart Line
        Items](/developer/api-reference/rest/storefront/carts/cart-items/add-cart-line-item) endpoint or the [GraphQL
        Storefront API](/developer/docs/storefront/guides/graphql-storefront-api/overview).


        > #### Notes

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.  

        > * Please note that this API endpoint is not concurrent safe, meaning multiple simultaneous requests could
        result in unexpected and inconsistent results.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - cartItems
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: cartId
          in: path
          description: The ID of the cart associated with this checkout. Identical to the checkout ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          description: The ID of an item being purchased.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cart_Put'
    delete:
      operationId: cartItems_deleteCheckoutLineItem
      summary: Delete Line Item
      description: >-
        Deletes a *Line Item* from the *Cart*.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - cartItems
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: cartId
          in: path
          description: The ID of the cart associated with this checkout. Identical to the checkout ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          description: The ID of an item being purchased.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: >-
            NOTE: Discounted line items are re-evaluated on cart actions and may be automatically added back to your
            cart with a new line item ID to satisfy promotional requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
  /checkouts/{checkoutId}/consignments:
    post:
      operationId: consignments_createCheckoutConsignment
      summary: Create Consignment
      description: >
        Adds a new *Consignment* to *Checkout*.


        Perform the following two steps to define the fulfillment of the items in the cart.


        ### For shipping consignments:

          1. Add a new Consignment to Checkout.
          
              * Send a `POST` request to `/consignments` with each shipping address, line item IDs, and quantities. Each address can have its own line item IDs.
              * Provide a full valid customer address before placing the order. If provided, the order placement will succeed. 
              * As part of the request URL make sure to add `include=consignments.availableShippingOptions` to return the available shipping options based on the items, the address, and the shipping location. This will return `availableShippingOptions` in the response.

              * Required Fields:
                * `shipping_address` (deprecated) or `address`
                * `lineItems`
              
          2. Update the Consignment with Shipping Options using the [REST Storefront API](/developer/api-reference/rest/storefront/checkouts/consignments/update-checkout-consignment), the [REST Management API](/developer/api-reference/rest/admin/management/checkouts/consignments/update-checkout-consignment) or the [GraphQL Storefront API](/developer/docs/admin/checkout-and-cart/custom-checkouts/graphql-storefront).
                
        ### For pickup consignments:

          Create a new consignment object. 
          
              - Send a `POST` request to `/consignments` with line item IDs and quantities.
              - Provide a `pickupMethodId`. This is the `id` of the Pickup Method provided in the response body of the Storefront Pickup Options API.
              - Required Fields:
                  * `pickupOption`
                  * `lineItems`

        To learn more about creating a Checkout Consignment, see the [Carts and Checkouts
        Tutorial](/developer/docs/admin/checkout-and-cart/custom-checkouts/rest-storefront).


        > #### Notes

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.  

        > * Please note that this API endpoint is not concurrent safe, meaning multiple simultaneous requests could
        result in unexpected and inconsistent results.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - consignments
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          description: >-
            * `cart.lineItems.physicalItems.options` - physical options

            * `cart.lineItems.digitalItems.options` - digital options

            * `cart.lineItems.physicalItems.categoryNames` - physical categories

            * `cart.lineItems.digitalItems.categoryNames` - digital categories

            * `cart.lineItems.customItems.categoryNames` - custom categories

            * `cart.lineItems.physicalItems.stockPosition` - backorder and stock availability for physical items

            * `cart.lineItems.digitalItems.stockPosition` - backorder and stock availability for digital items
            (backorder values are always zero since digital products cannot be backordered)

            * `customer` - customer

            * `customer.customerGroup` - customer group

            * `payments` - payments

            * `promotions` - promotions

            * `consignments.availableShippingOptions` - shipping options

            * `consignments.availablePickupOptions` - pickup options
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutsCheckoutIdConsignmentsPostParametersIncludeSchemaItems'
            default:
              - consignments.availableShippingOptions
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutConsignmentRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateConsignmentRequest'
  /checkouts/{checkoutId}/consignments/{consignmentId}:
    put:
      operationId: consignments_updateCheckoutConsignment
      summary: Update Consignment
      description: >-
        Updates an existing consignment. An update is either one of the following:


        1. Updates the consignment address and/or line items.

        2. Selects a specific fulfillment option.


        ### Update the consignment address and line items

        For this type of update, the payload is the same as when creating a new consignment.         Update each
        *Consignment* `shippingOptionId` (shipping address and line items) with the `availableShippingOption > id` from
        the POST `/consignment` response. 


        **Note:**

        Updating a consignment could invalidate the value for `selectedShippingOption` and `selectedPickupOption`.


        ### Select a specific fulfillment option

        Before placing an order, each consignment must have a `selectedShippingOption` or a `selectedPickupOption`.


        If the consignment already has a pick-up option selected and a shipping option is provided, the pick-up option
        will be deselected and the shipping option will be selected instead (and vice versa). The `PUT` request will
        fail if it contains a shipping option ID and a pickup option ID.


        Required Fields:

        * `shippingOptionId` or `pickupOptionId`

        * `lineItems`


        To learn more about creating a Checkout Consignment see [Checkout Consignment
        API](/developer/docs/admin/checkout-and-cart/custom-checkouts/consignments).


        > #### Notes

        > * You cannot pass both an `address` and a `shippingOptionId` because the shipping option may not be available
        for the new address 

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.  

        > * Please note that this API endpoint is not concurrent safe, meaning multiple simultaneous requests could
        result in unexpected and inconsistent results.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - consignments
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: consignmentId
          in: path
          description: The ID of the subject consignment.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `cart.lineItems.physicalItems.options` - physical options

            * `cart.lineItems.digitalItems.options` - digital options

            * `cart.lineItems.physicalItems.categoryNames` - physical categories

            * `cart.lineItems.digitalItems.categoryNames` - digital categories

            * `cart.lineItems.customItems.categoryNames` - custom categories

            * `cart.lineItems.physicalItems.stockPosition` - backorder and stock availability for physical items

            * `cart.lineItems.digitalItems.stockPosition` - backorder and stock availability for digital items
            (backorder values are always zero since digital products cannot be backordered)

            * `customer` - customer

            * `customer.customerGroup` - customer group

            * `payments` - payments

            * `promotions` - promotions

            * `consignments.availableShippingOptions` - shipping options

            * `consignments.availablePickupOptions` - pickup options
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CheckoutsCheckoutIdConsignmentsConsignmentIdPutParametersIncludeSchemaItems'
            default:
              - consignments.availableShippingOptions
              - consignments.availablePickupOptions
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckoutConsignmentRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUpdateConsignment'
    delete:
      operationId: consignments_deleteCheckoutConsignment
      summary: Delete Consignment
      description: >-
        Removes an existing *Consignment* from *Checkout*.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - consignments
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: consignmentId
          in: path
          description: The ID of the subject consignment.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCheckoutConsignmentRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteConsignmentRequest'
  /checkouts/{checkoutId}/coupons:
    post:
      operationId: coupons_addCheckoutCoupon
      summary: Add Coupon to Checkout
      description: >-
        Adds a *Coupon Code* to *Checkout*.


        **Required Fields**

        * couponCode


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - coupons
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout_Full'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCheckoutCouponRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                couponCode:
                  type: string
                version:
                  type: integer
                  description: >-
                    The cart version that you expect to apply the updates. If the provided version doesn't match the
                    current cart version, you will receive a conflict error. This field is optional; if not provided,
                    optimistic concurrency control will not apply.
  /checkouts/{checkoutId}/coupons/{couponCode}:
    delete:
      operationId: coupons_deleteCheckoutCoupon
      summary: Delete Checkout Coupon
      description: >
        Deletes a *Coupon Code* from *Checkout*.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.

        > * This endpoint runs in the context of an active storefront session and works on any live BigCommerce-hosted
        storefront, not only in a local environment. It uses [same-origin CORS
        authentication](/developer/docs/overview/api-fundamentals/api-accounts#same-origin-cors-authentication), and
        write requests require a CSRF token. Stencil CLI can provide a session and CSRF token for local theme
        development.
      tags:
        - coupons
      parameters:
        - name: checkoutId
          in: path
          description: The ID of the subject checkout. Identical to the cart ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: couponCode
          in: path
          description: The code of the subject coupon.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
