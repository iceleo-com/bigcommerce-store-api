openapi: 3.1.0
info:
  title: 'Admin Management: Settings'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/settings/analytics:
    get:
      operationId: analytics_getAnalyticsProviders
      summary: List Web Analytics Providers
      description: Returns a list of web analytics providers.
      tags:
        - analytics
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics_getAnalyticsProviders_Response_200'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/settings/analytics/{id}:
    get:
      operationId: analytics_getAnalyticsProvider
      summary: Get Web Analytics Provider
      description: Returns a single web analytics provider data for a default channel.
      tags:
        - analytics
      parameters:
        - name: id
          in: path
          description: Web Analytics Provider ID.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsProvider'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '404':
          description: The requested resource was not found. Please specify valid Web Analytics Provider ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
      security:
        - X-Auth-Token: []
    put:
      operationId: analytics_updateAnalyticsProvider
      summary: Update Web Analytics Provider
      description: Updates a single web analytics provider data for a default channel.
      tags:
        - analytics
      parameters:
        - name: id
          in: path
          description: Web Analytics Provider ID.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsProvider'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '404':
          description: The requested resource was not found. Please specify valid Web Analytics Provider ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '409':
          description: >-
            Web Analytics Provider was in conflict with another Web Analytics Provider. This can be caused by duplicated
            unique values (such as ID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse409'
        '422':
          description: >-
            Web Analytics Provider data was not valid. This is the result of missing required fields, or of invalid
            data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse422'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                data_tag_enabled:
                  type: boolean
                enabled:
                  type: boolean
                is_oauth_connected:
                  description: Any type
                name:
                  type: string
                  minLength: 1
                version:
                  type: number
                  format: double
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/settings/catalog:
    get:
      operationId: catalog_getSettingsCatalog
      summary: Get Catalog Settings
      description: |-
        Returns catalog settings.

         - Channel ID can be used as a query parameter for getting channel-specific settings. If omitted, you will interact with the global settings only. 

         - `null` indicates that a particular field has not been overridden on a channel level when channel level settings are requested and values are inherited from global level.
      tags:
        - catalog
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: >-
            OK. `null` indicates that a particular field has not been overridden on a channel level when channel level
            settings are requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog_getSettingsCatalog_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: catalog_updateSettingsCatalog
      summary: Update Catalog Settings
      description: |-
        Updates catalog settings.

         - Channel ID can be used as a query parameter for updating channel-specific settings. If omitted, you will interact with the global settings only. 

         - `null` should be supplied to delete overrides per given channel and to inherit values from global level. Partial updates are not supported and all settings should be supplied with `null` value in order to delete overrides per channel.
      tags:
        - catalog
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: >-
            OK. `null` indicates that a particular field has not been overridden on a channel level when channel level
            settings are requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog_updateSettingsCatalog_Response_200'
      requestBody:
        description: null set for a particular field removes override on a channel level and means inheritance from a global level
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogSettings'
      security:
        - X-Auth-Token: []
