    InventorySettingsProductOutOfStockBehavior:
      type: string
      enum:
        - do_nothing
        - hide_product
        - hide_product_and_accessible
        - hide_product_and_redirect
      description: Describes storefront behavior when product is out of stock.
      title: InventorySettingsProductOutOfStockBehavior
    InventorySettingsOptionOutOfStockBehavior:
      type: string
      enum:
        - do_nothing
        - hide_option
        - label_option
      description: Describes storefront behavior when variant is out of stock.
      title: InventorySettingsOptionOutOfStockBehavior
    InventorySettingsUpdateStockBehavior:
      type: string
      enum:
        - order_placed
        - order_completed_or_shipped
      description: >-
        Describes when stock levels are updated.


        Global settings apply when inventory changes through a [manual
        order](https://support.bigcommerce.com/s/article/Creating-a-Manual-Order?language=en_US). Settings for a channel
        apply when inventory changes through an order in a channel. These settings affect webhooks that trigger from
        order-related events, including [product](/developer/docs/integrations/webhooks/event-reference#products),
        [SKU](/developer/docs/integrations/webhooks/event-reference#skus), and
        [inventory](/developer/docs/integrations/webhooks/event-reference/inventory-and-location-events#inventory)
        webhooks.  
      title: InventorySettingsUpdateStockBehavior
    InventorySettingsStockLevelDisplay:
      type: string
      enum:
        - dont_show
        - show
        - show_when_low
      description: Describes whether a storefront displays stock levels.
      title: InventorySettingsStockLevelDisplay
    InventorySettings:
      type: object
      properties:
        product_out_of_stock_behavior:
          $ref: '#/components/schemas/InventorySettingsProductOutOfStockBehavior'
          description: Describes storefront behavior when product is out of stock.
        option_out_of_stock_behavior:
          $ref: '#/components/schemas/InventorySettingsOptionOutOfStockBehavior'
          description: Describes storefront behavior when variant is out of stock.
        update_stock_behavior:
          $ref: '#/components/schemas/InventorySettingsUpdateStockBehavior'
          description: >-
            Describes when stock levels are updated.


            Global settings apply when inventory changes through a [manual
            order](https://support.bigcommerce.com/s/article/Creating-a-Manual-Order?language=en_US). Settings for a
            channel apply when inventory changes through an order in a channel. These settings affect webhooks that
            trigger from order-related events, including
            [product](/developer/docs/integrations/webhooks/event-reference#products),
            [SKU](/developer/docs/integrations/webhooks/event-reference#skus), and
            [inventory](/developer/docs/integrations/webhooks/event-reference/inventory-and-location-events#inventory)
            webhooks.  
        edit_order_stock_adjustment:
          type: boolean
          description: >-
            Describes whether stock levels automatically adjust when you edit an order.


            Global settings apply when inventory changes through a [manual
            order](https://support.bigcommerce.com/s/article/Creating-a-Manual-Order?language=en_US). Settings for a
            channel apply when inventory changes through an order in a channel. These settings affect webhooks that
            trigger from order-related events, including
            [product](/developer/docs/integrations/webhooks/event-reference#products),
            [SKU](/developer/docs/integrations/webhooks/event-reference#skus), and
            [inventory](/developer/docs/integrations/webhooks/event-reference/inventory-and-location-events#inventory)
            webhooks.  
        refund_order_stock_adjustment:
          type: boolean
          description: >-
            Describes whether stock levels automatically adjust when you refund or cancel an order.


            Global settings apply when inventory changes through a [manual
            order](https://support.bigcommerce.com/s/article/Creating-a-Manual-Order?language=en_US). Settings for a
            channel apply when inventory changes through an order in a channel. These settings affect webhooks that
            trigger from order-related events, including
            [product](/developer/docs/integrations/webhooks/event-reference#products),
            [SKU](/developer/docs/integrations/webhooks/event-reference#skus), and
            [inventory](/developer/docs/integrations/webhooks/event-reference/inventory-and-location-events#inventory)
            webhooks.  
        stock_level_display:
          $ref: '#/components/schemas/InventorySettingsStockLevelDisplay'
          description: Describes whether a storefront displays stock levels.
        default_out_of_stock_message:
          type: string
          description: Out of stock message displayed to shoppers.
        hide_in_product_filtering:
          type: boolean
          description: >-
            Describes whether an option is hidden in product filtering. Applies when `option_out_of_stock_behavior` is
            set to `label_option`. 
        show_pre_order_stock_levels:
          type: boolean
          default: false
          description: Describes whether pre-order stock levels are shown.
        show_out_of_stock_message:
          type: boolean
          default: false
          description: Describes whether out-of-stock messages are shown on product listing pages.
        show_quantity_on_backorder:
          type: boolean
          default: false
          description: >-
            Shows the quantity of an item that will be backordered, on the product detail page and in cart line items.


            Backorder display settings are omitted from the response entirely when the store's backorder feature is not
            enabled. See [Backorders](/developer/docs/admin/catalog-and-inventory/backorders).
        show_quantity_on_hand:
          type: boolean
          default: false
          description: Shows the quantity of an item that is ready to ship, in cart line items.
        show_backorder_message:
          type: boolean
          default: false
          description: Shows the per-variant backorder message on the product detail page, cart, and product cards.
        show_backorder_availability_prompt:
          type: boolean
          default: false
          description: Shows the availability prompt next to the stock level on the product detail page.
        backorder_availability_prompt:
          type: string
          default: More available for backorder
          description: >-
            Text of the availability prompt shown on the product detail page. Only shown when
            `show_backorder_availability_prompt` is `true`.
        show_default_shipping_expectation_prompt:
          type: boolean
          default: false
          description: Shows the shipping expectation message in cart totals when any item in the cart is backordered.
        default_shipping_expectation_prompt:
          type: string
          default: We ship available items right away, and backordered items as soon as they're in stock
          description: >-
            Text of the shipping expectation message shown in cart totals. Only shown when
            `show_default_shipping_expectation_prompt` is `true`.
