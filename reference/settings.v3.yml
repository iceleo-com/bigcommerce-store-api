         - You can use `channel_id` in the request body of a headless channel of this endpoint to control the `www_redirect` settings for the headless channel's unique checkout URL.

         - `null` should be supplied to delete overrides per given channel and to inherit values from a global level. 
      tags:
        - storefrontSeo
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storefront_SEO_updateSettingsStorefrontSeo_Response_200'
        '422':
          description: >
            `422 Unprocessable Entity` Provided settings could not be applied for some reason - detailed errors in the
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettingsStorefrontSeoRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SEOSettings'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/settings/storefront/status:
