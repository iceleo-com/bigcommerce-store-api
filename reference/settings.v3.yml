  /stores/{store_hash}/v3/settings/search/filters:
    get:
      operationId: searchFilters_getSettingsEnabledSearchFilters
      summary: List Enabled Filters
      description: >-
        Returns a list of enabled default [Product
        Filtering](https://support.bigcommerce.com/s/article/Product-Filtering-Settings) filters. These filters will be
        used if a store does not have contextual overrides.
      tags:
        - searchFilters
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search_Filters_getSettingsEnabledSearchFilters_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: searchFilters_updateSettingsEnabledSearchFilters
      summary: Update Enabled Filters
      description: >-
        Updates enabled default [Product
        Filtering](https://support.bigcommerce.com/s/article/Product-Filtering-Settings) filters.
      tags:
        - searchFilters
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search_Filters_updateSettingsEnabledSearchFilters_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguredFilters'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/settings/search/filters/available:
    get:
      operationId: searchFilters_getSettingsAvailableFilters
      summary: List Available Filters
      description: >-
        Returns a list of filters available to power [Product
        Filtering](https://support.bigcommerce.com/s/article/Product-Filtering-Settings).
      tags:
        - searchFilters
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Narrows the list of available filters based on channel ID. Only products currently assigned to the given
            Channel will be considered.
          required: false
          schema:
            type: integer
        - name: category_id
          in: query
          description: >-
            Narrows the list of available filters based on category ID. You can display settings to show products from
            the provided category, subcategories only, or both the category and its child categories.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search_Filters_getSettingsAvailableFilters_Response_200'
      security:
