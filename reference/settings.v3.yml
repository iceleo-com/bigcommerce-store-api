  /stores/{store_hash}/v3/settings/inventory/notifications:
    get:
      operationId: inventoryNotifications_getSettingsInventoryNotifications
      summary: Get Inventory Notifications Settings
      description: >-
        Returns inventory notification settings. 

        * `channel_id` can be used as a query parameter to get inventory notification settings per channel. If omitted,
        you will interact with the global settings only.
      tags:
        - inventoryNotifications
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: >-
            OK. `null` indicates that a particular field has not been overridden on a channel level when channel level
            settings are requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory_Notifications_getSettingsInventoryNotifications_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: inventoryNotifications_updateSettingsInventoryNotifications
      summary: Update Inventory Notifications Settings
      description: >-
        Updates inventory notification settings. 

        * `channel_id` can be used as a query parameter to get inventory notification settings per channel. If omitted,
        you will interact with the global settings only. 

        * Supplying `null` settings values per channel will delete overrides per given channel and values will be
        inherited from global level. 

        * Partial updates are not supported within the given endpoint. In order to delete overrides per channel, `null`
        should be supplied for all the settings within the given endpoint.
      tags:
        - inventoryNotifications
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory_Notifications_updateSettingsInventoryNotifications_Response_200'
      requestBody:
        description: null set for a particular field removes override on a channel level and means inheritance from a global level
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryNotificationsSettings'
      security:
        - X-Auth-Token: []
