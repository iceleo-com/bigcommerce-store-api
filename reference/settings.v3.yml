          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email_Statuses_updateSettingsEmailStatuses_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledTransactionalEmails'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/settings/favicon/image:
    post:
      operationId: faviconImage_createSettingsFaviconImage
      summary: Create Favicon Image
      description: |-
        Uploads an image file to use as the storefront favicon. Supported MIME types include GIF, JPEG, and PNG. 

          - Channel ID can be used as a query parameter for updating channel-specific settings. If omitted, you will interact with the global settings only.
          - The uploaded image can be up to 10 MB. Larger files result in an error.
      tags:
        - faviconImage
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: channel_id
          in: query
          description: >-
            Channel ID to use for channel-specific settings. If omitted, you will interact with the global settings
            only.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: Failed to save!
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                FaviconFile:
                  type: string
                  format: binary
      security:
        - X-Auth-Token: []
