  /stores/{store_hash}/v2/customers/{customer_id}/addresses:
    get:
      operationId: customerAddresses_getCustomerAddresses
      summary: List Customer Addresses
      description: >-
        Returns a list of *Customer Addresses*. Returns the addresses belonging to a customer. Default sorting is by
        address id, from lowest to highest. 

        The maximum limit is 250. If a limit isn’t provided, up to 50 `customer_addresses` are returned by default.
      tags:
        - customerAddresses
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Number of pages.
          required: false
          schema:
            type: number
            format: double
        - name: limit
          in: query
          description: Count per page.
          required: false
          schema:
            type: number
            format: double
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/customerAddress_Full'
      deprecated: true
      security:
        - X-Auth-Token: []
    post:
      operationId: customerAddresses_createCustomerAddress
      summary: Create Customer Address
      description: >-
        Creates a new *Customer Address*. (Note: The “state” property cannot be null. As a workaround for addresses that
        include no state/province string, pass a space as the “state” value.)


        **Required Fields**

        *   first_name

        *   last_name

        *   phone

        *   street_1

        *   city

        *   state

        *   zip

        *   country


        **Read Only Fields**

        *   id

        *   country_iso2
      tags:
        - customerAddresses
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customerAddress_Full'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customerAddress_Base'
      security:
        - X-Auth-Token: []
    delete:
      operationId: customerAddresses_deleteCustomerAddresses
      summary: Delete Customer Address
      description: By default, it deletes all *Customer Addresses*.
      tags:
        - customerAddresses
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Number of pages.
          required: false
          schema:
            type: number
            format: double
        - name: limit
          in: query
          description: Count per page.
          required: false
          schema:
            type: number
            format: double
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      deprecated: true
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/customers/{customer_id}/addresses/{customer_address_id}:
    get:
      operationId: customerAddresses_getCustomerAddress
      summary: Get Customer Address
      description: Returns a *Customer Address*.
      tags:
        - customerAddresses
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: customer_address_id
          in: path
          description: ID of the customer address.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Number of pages.
          required: false
          schema:
            type: number
            format: double
        - name: limit
          in: query
          description: Count per page.
          required: false
          schema:
            type: number
            format: double
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customerAddress_Full'
      deprecated: true
      security:
        - X-Auth-Token: []
    put:
      operationId: customerAddresses_updateCustomerAddress
      summary: Update Customer Address
      description: |-
        Updates a *Customer Address*. 

        **Read Only Fields**
        *   id
        *   country_iso2
      tags:
        - customerAddresses
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: customer_address_id
          in: path
          description: ID of the customer address.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customerAddress_Full'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: ID of this customer address. Read-Only.
                customer_id:
                  type: integer
                  description: ID of the associated customer.
                first_name:
                  type: string
                  description: The customer’s first name.
                last_name:
                  type: string
                  description: The customer’s last name.
                company:
                  type: string
                  description: The customer’s company name.
                street_1:
                  type: string
                  description: The customer’s street address, line 1.
                street_2:
                  type: string
                  description: The customer’s street address, line 2.
                city:
                  type: string
                  description: The customer’s city/town/suburb.
                state:
                  type: string
                  description: >-
                    The customer’s state/province. Do not abbreviate the state; spell out the entire word. For example,
                    California. (Cannot be null. As a workaround for addresses that include no state/province string,
                    pass a space as the “state” value.)
                zip:
                  type: string
                  description: The customer’s ZIP or postal code.
                country:
                  type: string
                  description: The customer’s country. Must be the full country name.
                country_iso2:
                  type: string
                  description: 2-letter ISO Alpha-2 code for the customer’s country. Read-Only.
                phone:
                  type: string
                  description: The customer’s phone number.
                address_type:
                  $ref: >-
                    #/components/schemas/CustomersCustomerIdAddressesCustomerAddressIdPutRequestBodyContentApplicationJsonSchemaAddressType
              required:
                - first_name
                - last_name
                - street_1
                - city
                - state
                - zip
                - country
                - phone
      security:
        - X-Auth-Token: []
    delete:
      operationId: customerAddresses_deletesCustomerAddress
      summary: Delete Customer Address
      description: Deletes a *Customer Address*.
      tags:
        - customerAddresses
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: customer_address_id
          in: path
          description: ID of the customer address.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      deprecated: true
      security:
        - X-Auth-Token: []
