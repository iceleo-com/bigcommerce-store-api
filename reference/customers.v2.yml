openapi: 3.1.0
info:
  title: 'Admin Management: Customers V2'
  version: 1.0.0
paths:
  /stores/{store_hash}/v2/customers:
    get:
      operationId: customers_getCustomers
      summary: List Customers
      description: >-
        Returns a list of all *Customers*. Default sorting is by `customer_ID`, from lowest to highest. Optional
        parameters can be passed in.
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: first_name
          in: query
          description: Filter customers by first name.
          required: false
          schema:
            type: string
        - name: last_name
          in: query
          description: Filter customers by last name.
          required: false
          schema:
            type: string
        - name: company
          in: query
          description: Filter customers by company name.
          required: false
          schema:
            type: string
        - name: email
          in: query
          description: Filter customers by email address.
          required: false
          schema:
            type: string
        - name: phone
          in: query
          description: Filter customers by phone number.
          required: false
          schema:
            type: string
        - name: store_credit
          in: query
          description: Filter customers by store credit amount.
          required: false
          schema:
            type: string
        - name: customer_group_id
          in: query
          description: Filter customers by customer group ID.
          required: false
          schema:
            type: integer
        - name: min_id
          in: query
          description: Filter results to those with an ID greater than or equal to this value.
          required: false
          schema:
            type: integer
        - name: max_id
          in: query
          description: Filter results to those with an ID less than or equal to this value.
          required: false
          schema:
            type: integer
        - name: min_date_created
          in: query
          description: Filter results to those created on or after this date.
          required: false
          schema:
            type: string
        - name: max_date_created
          in: query
          description: Filter results to those created on or before this date.
          required: false
          schema:
            type: string
        - name: min_date_modified
          in: query
          description: Filter results to those modified on or after this date.
          required: false
          schema:
            type: string
        - name: max_date_modified
          in: query
          description: Filter results to those modified on or before this date.
          required: false
          schema:
            type: string
        - name: tax_exempt_category
          in: query
          description: Filter customers by tax exempt category code.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/customer_Full'
      deprecated: true
      security:
        - X-Auth-Token: []
    post:
      operationId: customers_createCustomer
      summary: Create Customer
      description: >-
        Creates a *Customer*.

        **Required Fields**

        *   `first_name`

        *   `last_name`

        *   `email`

        **Read Only Fields**

        *   `id`

        *   `date_created`

        *   `date_modified`

        *   `accepts_marketing`

        *   `addresses`

        *   `form_fields`

        ## Notes 

        The `_authentication` object exposes functionality associated with the customer’s ability to log in to the
        store. All properties of the `_authentication` object are optional.

        When the `_authentication` object is not supplied with an update request, then the existing customer password
        remains the same.

        ## Updating Passwords 

        To manually update a customer password in the same way as the control panel, supply a value for the password
        field:

        ```json

        {
            "_authentication": {
                "password": "12w69Y217PYR96J"
            }
        }

        ```

        ## Confirming Passwords 

        An additional optional `password_confirmation` field can also be sent, providing password confirmation as a
        service:

        ```json

        {
            "_authentication": {
               "password": "12w69Y217PYR96J",
               "password_confirmation": "12w69Y217PYR96J"
            }
        }

        ```

        ## Forcing Password Resets 

        To force a customer to reset their password upon their next login attempt, give the `force_reset` field a value
        of true, as shown here:

        ```js showLineNumbers copy

        {
            "_authentication": {
                "force_reset": true
            }
        }

        ```
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_Full'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _authentication:
                  $ref: '#/components/schemas/CustomersPostRequestBodyContentApplicationJsonSchemaAuthentication'
                  description: >-
                    This can vary depending on the action being taken to update, validate or force a password change.
                    See [Customers V2, Update a customer
                    (Deprecated)](/developer/api-reference/rest/admin/management/customers/v2/update-customer).
                company:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                date_modified:
                  type: string
                store_credit:
                  type: integer
                registration_ip_address:
                  type: string
                customer_group_id:
                  type: integer
                notes:
                  type: string
                tax_exempt_category:
                  type: string
      security:
        - X-Auth-Token: []
    delete:
      operationId: customers_deleteCustomers
      summary: Delete Customers
      description: By default, it deletes all *Customers*. Up to 100 customers per batch can be deleted.
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      deprecated: true
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/customers/{customer_id}:
    get:
      operationId: customers_getCustomer
      summary: Get Customer
      description: Returns a single *Customer*.
      tags:
        - customers
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_Full'
      deprecated: true
      security:
        - X-Auth-Token: []
    put:
      operationId: customers_updateCustomer
      summary: Update Customer
      description: >-
        Updates a *Customer*.


        **Read Only Fields**

        *   id

        *   date_created

        *   date_modified

        *   accepts_marketing

        *   addresses

        *   form_fields


        ## Notes 

        The `_authentication` object exposes functionality associated with the customer’s ability to log in to the
        store. All properties of the `_authentication` object are optional.

        When the `_authentication` object is not supplied with an update request, then the existing customer password
        remains the same.

        ## Updating Passwords 

        To manually update a customer password in the same way as the control panel, supply a value for the `password`
        field:


        ```js showLineNumbers copy

        {
            "_authentication": {
                "password": "12w69Y217PYR96J"
            }
        }


        ```


        #### Confirming Passwords 

        An additional optional `password_confirmation` field can also be sent, providing password confirmation as a
        service:

        ```js showLineNumbers copy

        {
            "_authentication": {
               "password": "12w69Y217PYR96J"
               "password_confirmation": "12w69Y217PYR96J"
            }
        }

        ```

        #### Forcing Password Resets 

        To force a customer to reset their password upon their next login attempt, give the `force_reset` field a value
        of true, as shown here:

        ```js showLineNumbers copy

        {
            "_authentication": {
                "force_reset": true
            }
        }

        ```
      tags:
        - customers
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_Base'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customer_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: customers_deleteCustomer
      summary: Delete Customer
      description: Deletes a *Customer*.
      tags:
        - customers
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      deprecated: true
      security:
        - X-Auth-Token: []
