          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/count_Full'
      deprecated: true
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/customer_groups:
    get:
      operationId: customerGroups_getCustomerGroups
      summary: List Customer Groups
      description: |-
        Returns a list of *Customer Groups*. Default sorting is by customer-group ID, from lowest to highest.

        **Note:**
        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - customerGroups
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Number of pages.
          required: false
          schema:
            type: number
            format: double
        - name: limit
          in: query
          description: Count per page.
          required: false
          schema:
            type: number
            format: double
        - name: name
          in: query
          description: Filter customer groups by exact name match.
          required: false
          schema:
            type: string
        - name: name:like
          in: query
          description: Filter customer groups by name, using a fuzzy matching method.
          required: false
          schema:
            type: string
        - name: is_default
          in: query
          description: Filter by customers who sign up are added to this group by default.
          required: false
          schema:
            type: boolean
        - name: date_created
          in: query
          description: Filter customer groups by date_created. `date_created=2018-09-05T13:43:54`
          required: false
          schema:
            type: string
            format: date-time
        - name: date_created:max
          in: query
          description: Filter customer groups by maximum date_created. `date_created:max=2018-09-10`
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: Filter customer groups by date_created. `date_created:min=2018-09-05`
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified
          in: query
          description: Filter customer groups by date_modified. `date_modified=2018-09-05T13:45:03`
          required: false
          schema:
            type: string
