  /stores/{store_hash}/v2/customers/{customer_id}/validate:
    post:
      operationId: customerPasswords_validateCustomerPassword
      summary: Validate Password
      description: >-
        **This endpoint has special rate limiting protections to protect against abuse.**


        Provided a password, will return a true/false response indicating if the provided password matches the
        customer’s current password. This endpoint is useful if you want to power the login of another system using
        BigCommerce’s stored customer accounts, or as a safe way to migrate passwords to another system (by checking
        them against BigCommerce’s password, and if correct, storing it in another system securely.) If the password
        matches what’s stored against the customer account, the response will be:


        ```js showLineNumbers copy

        {
            "success": "true"
        }

        ```

        If the password does NOT match, the response will instead be:


        ```js showLineNumbers copy

        {
            "success": "false"
        }

        ```
      tags:
        - customerPasswords
      parameters:
        - name: customer_id
          in: path
          description: Unique numeric ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validatePassword'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: String to run against customer password. Will return a true or false.
      security:
        - X-Auth-Token: []
