  /stores/{store_hash}/v2/order_statuses:
    get:
      operationId: orderStatus_getOrderStatuses
      summary: List Order Statuses
      description: >-
        Returns a Collection of All Order Statuses.


        **Order Status Descriptions:**


        |Status ID | Name  | Description |

        |-|-|-|

        | 0 | Incomplete  | An incomplete order happens when a shopper reached the payment page, but did not complete
        the transaction. |

        | 1 | Pending |Customer started the checkout process, but did not complete it. |

        | 2 | Shipped | Order has been shipped, but receipt has not been confirmed; seller has used the Ship Items
        action. |

        | 3 | Partially Shipped | Only some items in the order have been shipped, due to some products being pre-order
        only or other reasons. |

        | 4 | Refunded | Seller has used the Refund action. |

        | 5 | Cancelled | Seller has cancelled an order, due to a stock inconsistency or other reasons. |

        | 6 | Declined | Seller has marked the order as declined for lack of manual payment, or other reasons. |

        | 7 | Awaiting Payment | Customer has completed checkout process, but payment has yet to be confirmed. |

        | 8 | Awaiting Pickup | Order has been pulled, and is awaiting customer pickup from a seller-specified location.
        |

        | 9 | Awaiting Shipment | Order has been pulled and packaged, and is awaiting collection from a shipping
        provider. |

        | 10 | Completed | Client has paid for their digital product and their file(s) are available for download. |

        | 11 | Awaiting Fulfillment | Customer has completed the checkout process and payment has been confirmed. |

        | 12 | Manual Verification Required | Order is on hold while some aspect needs to be manually confirmed. |

        | 13 | Disputed | Customer has initiated a dispute resolution process for the PayPal transaction that paid for
        the order. |

        | 14 | Partially Refunded | Seller has partially refunded the order. |
      tags:
        - orderStatus
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Get All Order Status Collection Response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/orderStatus_Base'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/order_statuses/{status_id}:
    get:
      operationId: orderStatus_getOrderStatusesStatus
      summary: Get Single Order Status by ID
      description: >-
        Returns a single order status.


        **Order Status Descriptions**

        |Status ID | Name  | Description |

        |:--|:--|:--|

        | 0 | Incomplete  | An incomplete order happens when a shopper reached the payment page, but did not complete
        the transaction. |

        | 1 | Pending |Customer started the checkout process, but did not complete it. |

        | 2 | Shipped | Order has been shipped, but receipt has not been confirmed; seller has used the Ship Items
        action. |

        | 3 | Partially Shipped | Only some items in the order have been shipped, due to some products being pre-order
        only or other reasons. |

        | 4 | Refunded | Seller has used the Refund action. |

        | 5 | Cancelled | Seller has cancelled an order, due to a stock inconsistency or other reasons. |

        | 6 |Declined | Seller has marked the order as declined for lack of manual payment, or other reasons. |

        | 7 | Awaiting Payment | Customer has completed checkout process, but payment has yet to be confirmed. |

        | 8 | Awaiting Pickup | Order has been pulled, and is awaiting customer pickup from a seller-specified location.
        |

        | 9 | Awaiting Shipment | Order has been pulled and packaged, and is awaiting collection from a shipping
        provider. |

        | 10 | Completed | Client has paid for their digital product and their file(s) are available for download. |

        | 11 | Awaiting Fulfillment | Customer has completed the checkout process and payment has been confirmed. |

        | 12 | Manual Verification Required | Order is on hold while some aspect needs to be manually confirmed. |

        | 13 | Disputed | Customer has initiated a dispute resolution process for the PayPal transaction that paid for
        the order. |

        | 14 | Partially Refunded | Seller has partially refunded the order. |
      tags:
        - orderStatus
      parameters:
        - name: status_id
          in: path
          description: The status ID of the order. You can get the status id from the `/orders` endpoints.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested order status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderStatus_Base'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/orders/{order_id}/taxes:
    get:
      operationId: orderTaxes_getOrderTaxes
      summary: List Order Taxes
      description: |-
        Gets all order taxes using `order_id`.
        Each tax applied to an order. This information can be useful for reporting purposes.
        Pass in the query parameter `?details=true` to return extra details about order taxes.
        `order_product_id` and `line_item_type` are also returned.

        All values are read-only.
      tags:
        - orderTaxes
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: The page to return in the response.
          required: false
          schema:
            type: number
            format: double
            default: 1
        - name: limit
          in: query
          description: Number of results to return.
          required: false
          schema:
            type: number
            format: double
            default: 50
        - name: details
          in: query
          description: To return detailed tax information, pass in the details query.
          required: false
          schema:
            type: string
            default: 'false'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of the taxes applied to the order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/orderTaxes_Base'
      security:
        - X-Auth-Token: []
