          description: Numeric ID of the associated order.
        code:
          type:
            - string
            - 'null'
          description: Coupon code, as a string.
        amount:
          $ref: '#/components/schemas/OrderCouponsBaseAmount'
          description: >-
            Amount of the discount. This information is returned as in integer. Dollar and percentage discounts will
            return the same. For example, $3 returns as `3` while 5% will return as `5`. Check the discount type to see
            what type of discount is available.
        type:
          $ref: '#/components/schemas/OrderCouponsBaseType'
          description: |-
