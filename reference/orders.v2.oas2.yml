        sku:
          type: string
          description: User-defined product code/stock keeping unit (SKU).
        type:
          $ref: '#/components/schemas/OrderProductsType'
          description: Type of product.
        base_price:
          type: string
          description: The product’s base price. (Float, Float-As-String, Integer)
        price_ex_tax:
          type: string
          description: The product’s price excluding tax. The value can't be negative. (Float, Float-As-String, Integer)
        price_inc_tax:
          type: string
          description: The product’s price including tax. The value can't be negative. (Float, Float-As-String, Integer)
        price_tax:
          type: string
          description: |-
            Amount of tax applied to a single product.

            Price tax is calculated as:
            `price_tax = price_inc_tax - price_ex_tax`

            (Float, Float-As-String, Integer)
        base_total:
          type: string
          description: >-
            Total base price. (Float, Float-As-String, Integer)


            **Note**: The `base_total` is affected by the tax options set up in the control panel and is altered on
            tax-free orders. See more details on how `base_total` is affected by visiting the [Responsive Tax Display
            Settings](https://support.bigcommerce.com/s/article/Manual-Tax-Setup) overview. If the `base_total` is `$0`,
            it's due to the store's tax settings. To learn more about tax settings in the control panel, check out this
            [Tax Settings](https://support.bigcommerce.com/s/article/Tax-Overview?language=en_US#tax-settings) support
            article.
        total_ex_tax:
          type: string
          description: Total base price excluding tax. The value can't be negative. (Float, Float-As-String, Integer)
        total_inc_tax:
          type: string
          description: Total base price including tax. The value can't be negative. (Float, Float-As-String, Integer)
