          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/orderShipment'
      security:
        - X-Auth-Token: []
    post:
      operationId: orderShipments_createOrderShipments
      summary: Create Order Shipment
      description: >
        Creates an *Order Shipment*. For more details, see [Shipping an
        Order](/developer/docs/admin/checkout-and-cart/orders#creating-order-shipments).


        **Required Fields**

        *   order_address_id

        *   items


        **Usage notes**


        There are three methods for generating a tracking link for a shipment:


        1. Use `shipping_provider` and `tracking_number`: This generates a link to one of our integrated providers that
        you can click from the BigCommerce control panel and customer-facing emails. If a merchant still needs to set up
        a shipping provider or if the provider is not one of our natively integrated providers, you will click on an
        Aftership tracking link instead. The `generated_tracking_link` property in the API response represents one of
        these tracking links. The `tracking_link` property in the API response will remain empty.


        2. Use `tracking_carrier` and `tracking_number`: This also creates a link to one of our integrated providers or
        an Aftership tracking link that you can click in both the BigCommerce control panel and customer-facing emails.
        Like the previous method, the `generated_tracking_link` property in the API response represents this tracking
        link. The `tracking_link` property in the API response will remain empty.


        3. Supply a custom `tracking_link`: By providing a value for the `tracking_link` property, you can use your own
        tracking link within the BigCommerce control panel and in customer-facing emails. The API response will return
        your supplied tracking link as part of the `tracking_link` property in the response. In situations when there
        isn't a `generated_tracking_link`, the property in the API response will remain empty. 


        Acceptable values for `shipping_provider` include the following, and this list may be updated at any time: 
         - `""`, an empty string
         - `auspost`
         - `canadapost`
         - `endicia`
         - `usps`
         - `fedex`
         - `royalmail`
         - `ups`
         - `upsready`
         - `shipperhq`
         - `carrier_{your_carrier_id}`, when the carrier is a [third-party Shipping Provider](/developer/docs/integrations/shipping-providers) 

        Acceptable values for `tracking_carrier` include an empty string (`""`) or one of the valid [tracking-carrier
        values](https://www.aftership.com/docs/tracking/others/supported-couriers).
      tags:
        - orderShipments
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: The requested order shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderShipment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderShipment_Post'
      security:
        - X-Auth-Token: []
