          type: string
          maxLength: 255
          description: Street address (second line).
        city:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 50
        country_alpha2:
          type: string
          minLength: 2
          maxLength: 2
          description: 2-letter ISO Alpha-2 code for the country.
        email:
          type: string
          maxLength: 255
          description: Pickup locationʼs email address.
        phone:
          type: string
          maxLength: 125
          description: Pickup locationʼs phone number.
      title: pickupConsignmentLocation_Put
    orderCustomProduct_Put:
      type: object
      properties:
        name:
          type: string
          description: |
            Alias for name_customer. The product name that is shown to customer in storefront.
        name_customer:
          type: string
          description: The product name that is shown to customer in storefront.
        name_merchant:
          type: string
          description: The product name that is shown to the merchant in the control panel.
        quantity:
          type: integer
        price_ex_tax:
          type: number
          format: double
        price_inc_tax:
          type: number
          format: double
        sku:
          type: string
        upc:
          type: string
        id:
          type: integer
          description: ID of the product line.
      required:
        - name
        - quantity
        - price_ex_tax
        - price_inc_tax
      description: >-
        **Usage notes:**


        To `add` a custom product to an existing order, don't include `id` in the payload. You must provide a non-empty
        value for at least one of these fields: `name`, `name_customer`, or `name_merchant`.

        To `update` an order product line, `id` is required. The payload should only contain the fields that need to be
        updated. You cannot change omitted fields.


        Note the following constraints and default field values:
         - Empty strings `''` and `null` are invalid for `xxx`, `xxx_customer`, and `xxx_merchant`.
         - `name` and `name_customer` always hold the same value; updating either `name` or `name_customer` will change the value for both of those fields.
         - If both fields `name` and `name_customer` are present, they must have the same value.
         - When updating an existing order product, if you omit both fields `name` and `name_customer` from the request, they will not be updated.
         - When updating an existing order product, if you omit `name_merchant` from the request, it will not be updated.
         - When adding a product, if you omit `name_merchant`, it will be set to the value of `name` (or `name_customer`).
         - When adding a new product to an existing order, if you omit both fields `name` and `name_customer`, they will be set to the value of `name_merchant`.
      title: orderCustomProduct_Put
    OrderCatalogProductPostProductOptionsItems:
      type: object
      properties:
        id:
          type: integer
          description: >-
            Numeric ID of an option applied to the product from a list of options available to the product. This field
            has the same value as `product_option_id` when [retrieving products in an
            order](/developer/api-reference/rest/admin/management/orders/order-products/get-order-products).
        value:
          type: string
          description: >-
            Depending on the option type, value can be one of the following:

            - The variant option value id or the modifier value id for modifier types with a list of defined values,
            such as drop down or checkbox modifiers.

            - The modifier value for modifier types without a list of defined values, such as text field or date field
            modifiers.


            Notes:

            - The API does not currently support the following option types:
              - File upload
              - Pick list
            - For date modifiers use either the `YYYY-MM-DDThh:mm:ss±hh:mm` or the `YYYY-MM-DD` ISO-8601 formats. The
            date field modifier values are saved and returned as timestamps. For values entered using the YYYY-MM-DD
            format, the store timezone is used when creating the timestamp.

            - For multi-line text field modifiers, use the `\n` characters for separating the lines.
        display_name:
          type: string
          minLength: 1
          description: >-
            Alias for display_name_customer. The product option name that is shown to customer in storefront. `xxx` and
            `xxx_customer` always hold the same value, updating either `xxx` or `xxx_customer` will change value for
            both of those fields.
        display_name_customer:
          type: string
          minLength: 1
          description: >-
            The product option name that is shown to customer in storefront. `xxx` and `xxx_customer` always hold the
            same value, updating either `xxx` or `xxx_customer` will change value for both of those fields.
        display_name_merchant:
          type: string
          description: The product option name that is shown to the merchant in the control panel.
        display_value:
          type: string
          minLength: 1
          description: >-
            Alias for display_value_customer. The product option value that is shown to customer in storefront. `xxx`
            and `xxx_customer` always hold the same value, updating either `xxx` or `xxx_customer` will change value for
            both of those fields.
        display_value_merchant:
          type: string
          minLength: 1
          description: The product option value that is shown to the merchant in the control panel.
        display_value_customer:
          type: string
          minLength: 1
          description: >-
            The product option value that is shown to a customer in storefront.`xxx` and `xxx_customer` always hold the
            same value, updating either `xxx` or `xxx_customer` will change value for both of those fields.
      title: OrderCatalogProductPostProductOptionsItems
    orderCatalogProduct_Put:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
          minLength: 1
          description: >-
            Alias for `name_customer`. The product name that is shown to customer in storefront. `xxx` and
            `xxx_customer` always hold the same value, updating either `xxx` or `xxx_customer` will change value for
            both of those fields.
        name_customer:
          type: string
          minLength: 1
          description: >-
            The product name that is shown to customer in storefront. `xxx` and `xxx_customer` always hold the same
            value, updating either `xxx` or `xxx_customer` will change value for both of those fields.
        name_merchant:
          type: string
          description: The product name that is shown to the merchant in the control panel.
        product_options:
          type: array
          items:
            $ref: '#/components/schemas/OrderCatalogProductPostProductOptionsItems'
          description: >-
            List of product variant options and modifiers. `product_options` are required when adding a product with
            variants and not specifying the `variant_id`, or when products have mandatory modifiers.
        quantity:
          type: integer
        price_inc_tax:
          type: number
          format: double
        price_ex_tax:
          type: number
          format: double
        upc:
          type: string
        variant_id:
          type: integer
          description: Products `variant_id`. PUT or POST. This field is not available for custom products.
        wrapping_id:
          type: integer
          description: >-
            ID of the gift wrapping that will be used for this product. If provided, then `wrapping_cost_ex_tax` and
            `wrapping_cost_inc_tax` are required. When updating an order product line item, if `wrapping_id` is set to
            `0` and no other wrapping fields are provided,then the wrapping will be removed from the order product.
        wrapping_name:
          type: string
          description: >-
            If the `wrapping_id` is provided, this field will populate with the name of the gift wrapping that is to be
            used.
        wrapping_message:
          type: string
        wrapping_cost_ex_tax:
          type: number
          format: double
          description: >-
            When provided, this value should be equal to `wrapping_cost_ex_tax` times quantity to accurately reflect
            wrapping cost per unit. The value can't be negative.
        wrapping_cost_inc_tax:
          type: number
          format: double
          description: >-
            When provided, this value should be equal to `wrapping_cost_inc_tax` times quantity to accurately reflect
            wrapping cost per unit. The value can't be negative.
        id:
          type: integer
          description: >-
            The order product `id`. To add a product to an existing order, donʼt include `id` in the payload. `id` is
            required when updating an order product.
      description: |
        **Usage notes**

         To `add` a product to an existing order, don't include `id` in the payload. When adding a product with variants, `product_options` are required.
         To `update` an order product line, `id` is required. The payload should only contain the fields that need to be updated. The fields that you omit will not be changed.

         Note the following constraints and default field values:
         - `xxx` and `xxx_customer` always hold the same value. Updating either `xxx` or `xxx_customer` will change the value of both fields.
         - If both fields `xxx` and `xxx_customer` are present, they must have same value.
         - Empty strings `''` and `null` are invalid for `xxx`, `xxx_customer`, and `xxx_merchant`.
         - When updating an existing order product without changing the variant, product, or product options, requests that do not contain `xxx_merchant` will fail.
         - When updating an existing order product, requests that do not contain both fields `xxx` and `xxx_customer` will fail.
         - Empty strings `''` and `null` are invalid for `xxx`, `xxx_customer, and `xxx_merchant`. If `xxx_merchant` is omitted, it will default to have the catalog value.
         - If both fields `xxx` and `xxx_customer` are omitted from the request, they will default to the catalog value.
      title: orderCatalogProduct_Put
    orderProduct_Put:
      oneOf:
        - $ref: '#/components/schemas/orderCustomProduct_Put'
        - $ref: '#/components/schemas/orderCatalogProduct_Put'
      title: orderProduct_Put
    pickupConsignment_Put:
