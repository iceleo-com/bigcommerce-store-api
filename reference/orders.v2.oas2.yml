      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/ordersCountStatus'
        count:
          type: number
          format: double
          description: Total number of orders in the store.
      title: ordersCount_Full
    OrdersGetParametersSort:
      type: string
      enum:
        - id
        - customer_id
        - date_created
