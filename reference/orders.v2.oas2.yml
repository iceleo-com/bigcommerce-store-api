    OrderPutPaymentProviderId:
      oneOf:
        - type: string
        - type: number
          format: double
      description: The external Transaction ID/Payment ID within this order’s payment provider (if a payment provider was used).
      title: OrderPutPaymentProviderId
    OrderRemoveProductPutProductOptionsItems:
      type: object
      properties:
        cost_price_inc_tax:
