    order_Resp:
      type: object
      properties:
        id:
          type: integer
          description: Read-only. The ID of the order.
        date_modified:
          type: string
          description: >-
            A read-only value representing the last modification of the order. Do not attempt to modify or set this
            value in a POST or PUT request. RFC-2822. This date time is always in UTC in the api response.
        date_shipped:
          type: string
          description: >
            A read-only value representing the date when the order is fully shipped. Do not attempt to modify or set
            this value in a POST or PUT request. RFC-2822
        cart_id:
          type: string
          description: >-
            The cart ID from which this order originated, if applicable. Correlates with the Cart API. This is a
            read-only field; do not set or modify its value in a POST or PUT request.
        status:
          type: string
          description: >-
            The status will include one of the (string, options) - values defined under Order Statuses. This value is
            read-only. Do not attempt to modify or set this value in a POST or PUT operation.
        subtotal_tax:
          type: string
          description: >-
            A read-only value. Do not attempt to set or modify this value in a POST or PUT request. (Float,
            Float-As-String, Integer)
        shipping_cost_tax:
          type: string
          description: >-
            A read-only value. Do not attempt to modify or set this value in a POST or PUT request. (Float,
            Float-As-String, Integer)
        shipping_cost_tax_class_id:
          type: integer
          description: >-
            Shipping-cost tax class. A read-only value. Do not attempt to modify or set this value in a POST or PUT
            request. (NOTE: Value ignored if automatic tax is enabled on the store.)
        handling_cost_tax:
          type: string
          description: >-
            A read-only value. Do not attempt to modify or set this value in a POST or PUT request. (Float,
            Float-As-String, Integer)
        handling_cost_tax_class_id:
          type: integer
          description: |-
            A read-only value. Do not attempt to set or modify this value in a POST or PUT request. 

            (NOTE: Value ignored if automatic tax is enabled on the store.)
        wrapping_cost_tax:
          type: string
          description: >-
            A read-only value. Do not attempt to modify or set this value in a POST or PUT request. (Float,
            Float-As-String, Integer)
        wrapping_cost_tax_class_id:
          type: integer
          description: |-
            A read-only value. Do not attempt to set or modify this value in a POST or PUT request.  

            NOTE: Value ignored if automatic tax is enabled on the store.
        payment_status:
          $ref: '#/components/schemas/OrderRespOnlyPaymentStatus'
          description: A read-only value. Do not attempt to set or modify this value in a POST or PUT request.
        store_credit_amount:
          type: string
          description: >-
            Represents the store credit that the shopper has redeemed on this individual order. This is a read-only
            value. Do not pass in a POST or PUT request. (Float, Float-As-String, Integer)
        gift_certificate_amount:
          type: string
          description: A read-only value. Do not pass in a POST or PUT request. (Float, Float-As-String, Integer)
        currency_id:
          type: integer
          description: >-
            The display currency ID. Depending on the currency selected, the value can be different from the
            transactional currency. A read-only value. Do not pass in a POST or PUT request. In v2 display currency is
            set to the transactional currency, ''default_currency_id''.
        currency_code:
          type: string
          description: >-
            The currency code of the display currency used to present prices to the shopper on the storefront. Depending
            on the currency selected, the value can be different from the transactional currency. A read-only value. Do
            not pass in a POST or PUT request.
        currency_exchange_rate:
          type: string
          description: >-
            The exchange rate between the store’s default currency and the display currency. A read-only value. Do not
            pass in a POST or PUT request. For orders created using the V2 endpoints, this value is always 1 (only in
            the storefront this value can be different to 1). (Float, Float-As-String, Integer)
        default_currency_id:
          type: integer
          description: The transactional currency ID. A read-only value. Do not pass in a POST or PUT request.
        default_currency_code:
          type: string
          description: The currency code of the transactional currency the shopper pays in.
        store_default_currency_code:
          type: string
          description: The currency code of the storeʼs default currency.
        store_default_to_transactional_exchange_rate:
          type: string
          description: The exchange rate between the storeʼs default currency and the transactional currency used in the order.
        coupon_discount:
          type: string
          description: A read-only value. Do not pass in a POST or PUT request. (Float, Float-As-String, Integer)
        shipping_address_count:
          type: number
          format: double
          description: >-
            The number of shipping addresses associated with this transaction. A read-only value. Do not pass in a POST
            or PUT.
        is_deleted:
          type: boolean
          description: >-
            Indicates whether the order is deleted/archived. When set to true in a PUT request, it has the same result
            as the DELETE an order request.
        total_tax:
          type: string
          description: >-
            Total tax amount for the order. A value of `0` doesn't indicate a tax-exempt customer; tax-exempt status
            lives in the `tax_exempt_category` field of the customer record, not on the order.
        is_tax_inclusive_pricing:
          type: boolean
          description: >-
            Indicate whether the order's base prices include tax.


            If true, the base prices are inclusive of tax, and the values of `subtotal_inc_tax`,
            `shipping_cost_inc_tax`, `handling_cost_inc_tax`, `wrapping_cost_inc_tax` and `total_inc_tax` are not
            estimated but actual values and can be reliable for accounting purposes.


            If false, the base prices are exclusive of tax, and the values of `subtotal_ex_tax`, `shipping_cost_ex_tax`,
            `handling_cost_ex_tax`, `wrapping_cost_ex_tax` and `total_ex_tax` are not estimated but actual values and
            can be reliable for accounting purposes.
        is_email_opt_in:
          type: boolean
          description: >-
            Indicates whether the shopper has selected an opt-in check box (on the checkout page) to receive emails. A
            read-only value. Do not pass in a POST or PUT.
        order_source:
          type: string
          description: >-
            The `order_source` reflects the origin of the order. It will indicate whether the order was created by one
            of the following:

            * storefront 

            * control panel

            * manual order

            * /v2/orders API

            * Checkout API

            * or by an integration with an external platform such as Facebook by Meta or Amazon.
        consignments:
          $ref: '#/components/schemas/OrderRespOnlyConsignments'
        products:
          $ref: '#/components/schemas/products_Resource'
        shipping_addresses:
          $ref: '#/components/schemas/shippingAddresses_Resource'
        coupons:
          $ref: '#/components/schemas/coupons_Resource'
        status_id:
          type: integer
          description: The status ID of the order.
        billing_address:
          $ref: '#/components/schemas/billingAddress_Resp'
        fees:
          $ref: '#/components/schemas/OrderRespOnlyFees'
        backorder_shipping_expectation_message:
          type:
            - string
            - 'null'
          description: >-
            The shipping expectation message shown to the customer when the order contains a backordered item. `null`
            when the order has no backordered items.
        base_handling_cost:
          type: string
          description: The value of the base handling cost. The value can't be negative. (Float, Float-As-String, Integer)
        base_shipping_cost:
          type: string
          description: The value of the base shipping cost. The value can't be negative. (Float, Float-As-String, Integer)
        base_wrapping_cost:
          type: string
          description: >-
            The value of the base wrapping cost expressed as a floating point number to four decimal places in string
            format. The value can't be negative.
        channel_id:
          type: integer
          description: >-
            Shows where the order originated. The channel_id defaults to 1. The value must match the ID of a valid and
            enabled channel. If the ID refers to a non-existing or disconnected channel, the POST and PUT `/v2/orders`
            endpoints return a validation error.
        customer_id:
          type: number
          format: double
          description: >-
            The ID of the customer who placed the order. `0` indicates a guest checkout. Use this ID with the Customers
            API to look up customer attributes that aren't stored on the order, such as `tax_exempt_category`.
        customer_message:
          type: string
          description: Message that the customer entered (number, options) -o the `Order Comments` box during checkout.
        date_created:
          type: string
          description: >-
            The date the order was created, formatted in the RFC-2822 standard. You set this attribute on Order creation
            (POST) to support the migration of historical orders. If you do not provide a value, then it will default to
            the current date/time. e.g., `Tue, 20 Nov 2012 00:00:00 +0000`. This date time is always in UTC in the api
            response.
        discount_amount:
          type: string
          description: Amount of discount for this transaction. The value can't be negative. (Float, Float-As-String, Integer)
        ebay_order_id:
          type: string
          description: >-
            If the order was placed through eBay, the eBay order number will be included. Otherwise, the value will be
            `0`.
        external_id:
          type:
            - string
            - 'null'
          description: (Read-only) The order ID in another system, such as the Amazon order ID if this is an Amazon order.
        external_merchant_id:
          type:
            - string
            - 'null'
          description: >-
            The merchant ID represents an upstream order from an external system. It is the source of truth for orders.
            After setting it, you cannot write to or update the `external_merchant_id`. For example, you can update the
            Facebook by Meta page ID in a POST request, but a PUT request to update the order will return a 400 error.
            Please remove it from your request before trying again.
        external_source:
          type:
            - string
            - 'null'
          description: >-
            This value identifies an external system that generated the order and submitted it to BigCommerce with the
            Orders API.

            * When supplying the value, we recommend combining the type of system and vendor, e.g., ERP (Acumatica) or
            POS (Square).

            * If you are migrating historical orders processed on another eCommerce platform to BigCommerce, supply the
            following code as the value: M-MIG. This code will exclude historical orders from the store’s GMV/order
            count, which factors into pricing.

            * If you do not provide a value, then it will default to null.
        geoip_country:
          type: string
          description: The full name of the country where the customer made the purchase, based on the IP.
        geoip_country_iso2:
          type: string
          description: The country where the customer made the purchase, in ISO2 format, based on the IP.
        handling_cost_ex_tax:
          type: string
          description: >-
            The value of the handling cost, excluding tax. The value can't be negative. (Float, Float-As-String,
            Integer)
        handling_cost_inc_tax:
          type: string
          description: >-
            The value of the handling cost, including tax. The value can't be negative. (Float, Float-As-String,
            Integer)
        ip_address:
          type: string
          maxLength: 30
          description: >-
            IPv4 Address of the customer, if known.


            Note: You can set either `ip_address` or `ip_address_v6`. Setting the `ip_address` value will reset the
            `ip_address_v6` value and vice versa.
        ip_address_v6:
          type: string
          maxLength: 39
          description: >-
            IPv6 Address of the customer, if known.


            Note: You can set either `ip_address` or `ip_address_v6`. Setting the `ip_address_v6` value will reset the
            `ip_address` value and vice versa.
        items_shipped:
          type: number
          format: double
          description: The number of items that have been shipped.
        items_total:
          type: number
          format: double
          description: The total number of items in the order.
        order_is_digital:
          type: boolean
          description: Whether this is an order for digital products.
        payment_method:
          type: string
          description: >-
            The payment method for this order. For example, `Manual`, `Credit Card`, `cash`, `Test Payment Gateway`,
            etc.
        payment_provider_id:
          $ref: '#/components/schemas/OrderSharedPaymentProviderId'
          description: >-
            The external Transaction ID/Payment ID within this order’s payment provider (if a payment provider was
            used).
        refunded_amount:
          type: string
          description: >-
            The amount refunded from this transaction; always returns `0`. The value can't be negative. (Float,
            Float-As-String, Integer)
        shipping_cost_ex_tax:
          type: string
          description: >
            The value of shipping cost, excluding tax. When specified in a POST or PUT request, the field
            `shipping_cost_inc_tax` is also required. The value can't be negative (Float, Float-As-String, Integer)
        shipping_cost_inc_tax:
          type: string
          description: >
            The value of shipping cost, including tax. When specified in a POST or PUT request, the field
            `shipping_cost_ex_tax` is also required. The value can't be negative. (Float, Float-As-String, Integer)
        staff_notes:
          type: string
          maxLength: 65535
          description: Any additional notes for staff.
        subtotal_ex_tax:
          type: string
          description: >-
            Override value for subtotal excluding tax. The value can't be negative. If specified, the field
            `subtotal_inc_tax` is also required. (Float, Float-As-String, Integer)
        subtotal_inc_tax:
          type: string
          description: >-
            Override value for subtotal including tax. The value can't be negative. If specified, the field
            `subtotal_ex_tax` is also required. (Float, Float-As-String, Integer)
        tax_provider_id:
          type: string
          description: |
            Read-only.
            BasicTaxProvider - Tax is set to manual and order is created in the store.

            AvaTaxProvider - Tax is set to automatic and order is created in the store. Used for Avalara.

            "" (empty string) - The order is created with the API, or the tax provider is unknown.
        customer_locale:
          type: string
          description: >
            The customer’s locale. The supported formats are:

            - 2-char lowercase characters. e.g., `en`

            - 3-char lowercase characters. e.g., `asa`

            - 5-char the language code is 2 lowercase characters and the region code is 2 uppercase characters, with `-`
            in the middle. e.g., `en-US`

            - 6-char the language code is 2 lowercase character and the region code is three digit number, with `-` in
            the middle. e.g., `es-419`
        external_order_id:
          type: string
          description: >-
            The order ID in another system, such as the Amazon Order ID if this is an Amazon order. After setting it,
            you can update this field using a POST or PUT request.
        total_ex_tax:
          type: string
          description: >-
            Override value for the total, excluding tax. If specified, the field `total_inc_tax` is also required. The
            value can't be negative. (Float, Float-As-String, Integer)
        total_inc_tax:
          type: string
          description: >-
            Override value for the total, including tax. If specified, the field `total_ex_tax` is also required. The
            value can't be negative. (Float, Float-As-String, Integer)
        wrapping_cost_ex_tax:
          type: string
          description: >-
            The value of the wrapping cost, excluding tax. The value can't be negative. (Float, Float-As-String,
            Integer)
        wrapping_cost_inc_tax:
          type: string
          description: >-
            The value of the wrapping cost, including tax. The value can't be negative. (Float, Float-As-String,
            Integer)
      description: Order object returned in responses.
      title: order_Resp
