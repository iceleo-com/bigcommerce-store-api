    orderCatalogProduct_Post:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
          minLength: 1
          description: >-
            Alias for `name_customer`. The product name that is shown to customer in storefront. `xxx` and
            `xxx_customer` always hold the same value, updating either `xxx` or `xxx_customer` will change value for
            both of those fields.
        name_customer:
          type: string
          minLength: 1
          description: >-
            The product name that is shown to customer in storefront. `xxx` and `xxx_customer` always hold the same
            value, updating either `xxx` or `xxx_customer` will change value for both of those fields.
        name_merchant:
          type: string
          description: The product name that is shown to the merchant in the control panel.
        product_options:
          type: array
          items:
            $ref: '#/components/schemas/OrderCatalogProductPostProductOptionsItems'
          description: >-
            List of product variant options and modifiers. `product_options` are required when adding a product with
            variants and not specifying the `variant_id`, or when products have mandatory modifiers.
        quantity:
          type: integer
        price_inc_tax:
          type: number
          format: double
        price_ex_tax:
          type: number
          format: double
        upc:
          type: string
        variant_id:
          type: integer
          description: Products `variant_id`. PUT or POST. This field is not available for custom products.
        wrapping_id:
          type: integer
          description: >-
            ID of the gift wrapping that will be used for this product. If provided, then `wrapping_cost_ex_tax` and
            `wrapping_cost_inc_tax` are required. When updating an order product line item, if `wrapping_id` is set to
            `0` and no other wrapping fields are provided,then the wrapping will be removed from the order product.
        wrapping_name:
          type: string
          description: >-
            If the `wrapping_id` is provided, this field will populate with the name of the gift wrapping that is to be
            used.
        wrapping_message:
          type: string
        wrapping_cost_ex_tax:
          type: number
          format: double
          description: >-
            When provided, this value should be equal to `wrapping_cost_ex_tax` times quantity to accurately reflect
            wrapping cost per unit. The value can't be negative.
        wrapping_cost_inc_tax:
          type: number
          format: double
          description: >-
            When provided, this value should be equal to `wrapping_cost_inc_tax` times quantity to accurately reflect
            wrapping cost per unit. The value can't be negative.
      description: >
        Note:

        - `xxx` and `xxx_customer` always hold the same value, updating either `xxx` or `xxx_customer` will change value
        for both of those fields.

        - If both fields `xxx` and `xxx_customer` are present, they must have same value.

        - Empty strings `''` and `null` are invalid for `xxx` and `xxx_customer, and `xxx_merchant`.

        - `xxx`, `xxx_customer`, and `xxx_merchant` default to the value from `catalog` if not supplied in the request.
      title: orderCatalogProduct_Post
    orderCustomProduct_Post:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 250
          description: Alias for name_customer. The product name that is shown to customer in storefront.
        name_customer:
          type: string
          description: The product name that is shown to customer in storefront.
        name_merchant:
          type: string
          description: The product name that is shown to the merchant in the control panel.
        quantity:
          type: integer
        price_inc_tax:
          type: number
          format: double
        price_ex_tax:
          type: number
          format: double
        upc:
          type: string
        sku:
          type: string
      required:
        - name
        - quantity
        - price_inc_tax
        - price_ex_tax
      description: |-
        **Usage notes**

        Provide one of these fields with a non-empty value:
          - `name`
          - `name_customer`
          - `name_merchant`

        Note the following constraints and default field values:
          - Null and `''` empty strings are invalid for `name`, `name_customer`, and `name_merchant`.
          - `name` and `name_customer` always share the same value; updating one updates the other.
          - When you omit both `name` and `name_customer`, they default to the value of `name_merchant`. 
          - When you omit `name_merchant`, it defaults to the value that `name` and `name_customer` share.
      title: orderCustomProduct_Post
