openapi: 3.1.0
info:
  title: 'Admin Management: Orders'
  version: 1.0.0
paths:
  /stores/{store_hash}/v2/orders/{order_id}:
    get:
      operationId: orders_getOrder
      summary: Get Order
      description: >-
        Gets an *Order*. To learn more about creating or updating orders, see [Orders
        Overview](/developer/docs/admin/checkout-and-cart/orders).


        > #### Note

        > * The order object doesn't include a tax-exempt status. Tax exemption is a customer attribute, stored in the
        `tax_exempt_category` field of the customer record. To check whether the shopper is tax exempt, use the order's
        `customer_id` with the [Get
        Customers](/developer/api-reference/rest/admin/management/customers/v3/get-customers) endpoint. An empty
        `tax_exempt_category` means the customer isn't exempt.

        > * A `total_tax` of `0` doesn't indicate a tax-exempt customer. Tax can also be zero because of the shipping
        destination, tax settings, or the tax provider's calculation.

        > * Guest orders have a `customer_id` of `0` and no customer record. The order doesn't store the exemption
        category in effect at checkout, so the customer's current value may differ from what applied to the order.
      tags:
        - orders
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `consignments` - include the response returned from the request to the `/orders/{order_id}/consignments`
            endpoint. Current default array structure is legacy and will be deprecated from **1 Feb 2026**. Specify
            `consignment_structure=object` as a request parameter when including consignments.

            * `consignments.line_items` - include the response returned from the request to the
            `/orders/{order_id}/products` endpoint in consignments. This will also includes the resources associated
            with `include=consignments`. Current default array structure is legacy and will be deprecated from **1 Feb
            2026**. Specify `consignment_structure=object` as a request parameter when including consignments.

            * `fees` - include the response returned from the request to the `/orders/{order_id}/fees` endpoint.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrdersOrderIdGetParametersIncludeSchemaItems'
        - name: consignment_structure
          in: query
          description: >-
            Should be specified along with `include=consignments` or `include=consignments.line_items` to return
            consignments in the supported object structure. The default array structure provided is legacy and may not
            be supported in the future.
          required: false
          schema:
            $ref: '#/components/schemas/OrdersOrderIdGetParametersConsignmentStructure'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Order Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order_Resp'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                description: Any type
      security:
        - X-Auth-Token: []
    put:
      operationId: orders_updateOrder
      summary: Update Order
      description: >-
        Updates an *Order*. 


        To add a product to an existing order, don't include `id` in the body. Include `product_options` if adding a
        product with variants.


        To update a product in an order, include `id` in the body. The body should only contain the fields that need to
        be updated. Those fields that are omitted will not be changed.


        To remove a product from an order, set that product’s `quantity` to `0`.


        After the update, the PUT request clears all discounts and promotions applied to the changed order line items.
        Since the order data syncs with other ERP systems, like Amazon or eBay, the updated order returns to the default
        setting, removing any applied discounts.


        To update order fees, include the fee id in the request body along with all relevant fee fields. Fees not
        included will be deleted. Fees with an id will be updated, and fees without an id will be created as new.


        **Notes**


        * Sub-resources like products in the /v2/orders PUT request behave like PATCH, updating only the provided
        fields. Fees, however, follow standard PUT semantics and fees in the request body will fully replace existing
        ones. 

        To retain an existing fee, include it in the body with its associated id. 

        * The values for cost_ex_tax, cost_inc_tax and cost_tax in the fees payload should reflect the tax rate
        associated with the tax_class_id. For a 10% tax rate, the difference between cost_inc_tax and cost_ex_tax should
        be 10%. If no tax_class_id is provided, the store's default "tax class for fee" will apply. Incorrect data may
        lead to issues in downstream operations like refunds.


        To learn more about creating or updating orders, see [Orders
        Overview](/developer/docs/admin/checkout-and-cart/orders).


        > #### Note

        > * If historical orders processed on another eCommerce platform are being migrated to BigCommerce, supply the
        `external_source` field with the code **M-MIG**. This code will exclude the historical orders from the store’s
        GMV/order count, which factors into pricing.
      tags:
        - orders
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Order Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order_Resp'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: orders_deleteOrder
      summary: Archive Order
      description: Archives an order. To remove a single product from an order, see `PUT /orders/{order_id}`.
      tags:
        - orders
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/orders/count:
    get:
      operationId: orders_getOrdersCount
      summary: Get Count of Orders
      description: Gets an array of orders in the store organized by order status.
      tags:
        - orders
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: min_id
          in: query
          description: The minimum order ID.
          required: false
          schema:
            type: integer
        - name: max_id
          in: query
          description: The maximum order ID.
          required: false
          schema:
            type: integer
        - name: min_total
          in: query
          description: The minimum order total in floating point format. eg. 12.50
          required: false
          schema:
            type: string
            title: float
        - name: max_total
          in: query
          description: The maximum order total in floating point format. eg. 12.50
          required: false
          schema:
            type: number
            format: double
        - name: customer_id
          in: query
          description: Customer ID.
          required: false
          schema:
            type: integer
        - name: email
          in: query
          description: The email of the customer.
          required: false
          schema:
            type: string
        - name: status_id
          in: query
          description: The status ID of the order. You can get the status id from the `/orders` endpoints.
          required: false
          schema:
            type: integer
        - name: cart_id
          in: query
          description: The cart ID of the order.
          required: false
          schema:
            type: string
        - name: payment_method
          in: query
          description: >-
            The display name of the payment method used on the order. For example, `Manual`, `Credit Card`, `cash`,
            `Test Payment Gateway`, etc.'
          required: false
          schema:
            type: string
        - name: min_date_created
          in: query
          description: |-
            Minimum date the order was created in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: max_date_created
          in: query
          description: |-
            Maximum date the order was created in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: min_date_modified
          in: query
          description: |-
            Minimum date the order was modified in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: max_date_modified
          in: query
          description: |-
            Maximum date the order was modified in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: channel_id
          in: query
          description: The channel ID of the sales channel the shopper used to place the order.
          required: false
          schema:
            type: integer
        - name: external_order_id
          in: query
          description: >-
            The order ID in another system, such as the Amazon Order ID if this is an Amazon order. After setting it,
            you can update this field using a POST or PUT request.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Order Counter response collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ordersCount_Full'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/orders:
    get:
      operationId: orders_getOrders
      summary: List Orders
      description: |-
        Gets a list of orders using the filter query.

        **Notes**

        * The default sort is by order id, from lowest to highest.
        * By default, requests sent without parameters will only return 50 orders. 
      tags:
        - orders
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: min_id
          in: query
          description: The minimum order ID.
          required: false
          schema:
            type: integer
        - name: max_id
          in: query
          description: The maximum order ID.
          required: false
          schema:
            type: integer
        - name: min_total
          in: query
          description: The minimum order total in floating point format. eg. 12.50
          required: false
          schema:
            type: string
            title: float
        - name: max_total
          in: query
          description: The maximum order total in floating point format. eg. 12.50
          required: false
          schema:
            type: number
            format: double
        - name: customer_id
          in: query
          description: Customer ID.
          required: false
          schema:
            type: integer
        - name: email
          in: query
          description: The email of the customer.
          required: false
          schema:
            type: string
        - name: status_id
          in: query
          description: The status ID of the order. You can get the status id from the `/orders` endpoints.
          required: false
          schema:
            type: integer
        - name: cart_id
          in: query
          description: The cart ID of the order.
          required: false
          schema:
            type: string
        - name: payment_method
          in: query
          description: >-
            The display name of the payment method used on the order. For example, `Manual`, `Credit Card`, `cash`,
            `Test Payment Gateway`, etc.'
          required: false
          schema:
            type: string
        - name: min_date_created
          in: query
          description: |-
            Minimum date the order was created in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: max_date_created
          in: query
          description: |-
            Maximum date the order was created in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: min_date_modified
          in: query
          description: |-
            Minimum date the order was modified in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: max_date_modified
          in: query
          description: |-
            Maximum date the order was modified in RFC-2822 or ISO-8601.

            RFC-2822: `Thu, 20 Apr 2017 11:32:00 -0400`

            ISO-8601: `2017-04-20T11:32:00.000-04:00`
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: The page to return in the response.
          required: false
          schema:
            type: number
            format: double
            default: 1
        - name: limit
          in: query
          description: Number of results to return.
          required: false
          schema:
            type: number
            format: double
            default: 50
        - name: sort
          in: query
          description: >-
            Field and direction to sort orders. To specify the direction, add `:asc` or `:desc` to the end of the query
            parameter. e.g., `sort=date_created:desc`.
          required: false
          schema:
            $ref: '#/components/schemas/OrdersGetParametersSort'
        - name: channel_id
          in: query
          description: The channel ID of the sales channel the shopper used to place the order.
          required: false
          schema:
            type: integer
        - name: include
          in: query
          description: >-
            * `consignments` - include the response returned from the request to the `/orders/{order_id}/consignments`
            endpoint. Current default array structure is legacy and will be deprecated from **1 Feb 2026**. Specify
            `consignment_structure=object` as a request parameter when including consignments.

            * `consignments.line_items` - include the response returned from the request to the
            `/orders/{order_id}/products` endpoint in consignments. This will also includes the resources associated
            with `include=consignments`. Current default array structure is legacy and will be deprecated from **1 Feb
            2026**. Specify `consignment_structure=object` as a request parameter when including consignments.

            * `fees` - include the response returned from the request to the `/orders/{order_id}/fees` endpoint.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrdersGetParametersIncludeSchemaItems'
        - name: consignment_structure
          in: query
          description: >-
            Should be specified along with `include=consignments` or `include=consignments.line_items` to return
            consignments in the supported object structure. The default array structure provided is legacy and may not
            be supported in the future.
          required: false
          schema:
            $ref: '#/components/schemas/OrdersGetParametersConsignmentStructure'
        - name: external_order_id
          in: query
          description: >-
            The order ID in another system, such as the Amazon Order ID if this is an Amazon order. After setting it,
            you can update this field using a POST or PUT request.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/order_Resp'
      security:
        - X-Auth-Token: []
    post:
      operationId: orders_createOrder
      summary: Create Order
      description: >-
        Creates an *Order*. To learn more about creating or updating orders, see [Orders
        Overview](/developer/docs/admin/checkout-and-cart/orders).


        Create an order with an existing catalog product or a custom product.


        **Required Fields**


        * `products` or `consignments`

        * `billing_address`


        When you create an order, the `consignment(s)` array allows you to create pickup consignments.

        - An order can have either a pickup or a shipping fulfillment method, but not both.

        - An order can have only one pickup consignment.


        Choose from one of the following:

        1. Create order with a shipping fulfillment method using `shipping_addresses` and `products`, i.e. legacy mode

        2. Create order with a pickup fulfillment method using `consignments`, i.e. Consignment mode


        You can fulfill an order with shipping or pickup, but not both.


        This means that if the `consignments` array is present in the request, then _none_ of the following may be
        present and vice-versa:

        - `shipping_addresses`

        - `products`


        Include the `fees` object along with all its attributes in the request to create order-level fees for the newly
        created order.


        **Notes**


        * The values for cost_ex_tax, cost_inc_tax and cost_tax in the fees payload should reflect the tax rate
        associated with the tax_class_id. For a 10% tax rate, the difference between cost_inc_tax and cost_ex_tax should
        be 10%. If no tax_class_id is provided, the store's default "tax class for fee" will apply. Incorrect data may
        lead to issues in downstream operations like refunds.


        The V2 Orders API will not trigger the typical [Order
        Email](https://support.bigcommerce.com/s/article/Customizing-Emails?language=en_US) when creating orders. To
        create an order that does trigger this email, you can instead [create a
        cart](/developer/api-reference/rest/admin/management/carts/carts-single/create-cart) and [convert that cart into
        an order](/developer/api-reference/rest/admin/management/checkouts/orders/create-order).


        If you are building an app that creates orders, it must include your app's ID in the `external_source` field of
        new orders to be approved for the App Marketplace. See [App Store Approval
        Requirements](/developer/docs/integrations/apps/guide/approval-requirements#functionality) to learn more.


        > #### Note

        > * If historical orders processed on another eCommerce platform are being migrated to BigCommerce, supply the
        `external_source` field with the code **M-MIG**. This code will exclude the historical orders from the store’s
        GMV/order count, which factors into pricing.
      tags:
        - orders
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `consignments` - include the response returned from the request to the `/orders/{order_id}/consignments`
            endpoint. Current default array structure is legacy and will be deprecated from **1 Feb 2026**. Specify
            `consignment_structure=object` as a request parameter when including consignments.

            * `consignments.line_items` - include the response returned from the request to the
            `/orders/{order_id}/products` endpoint in consignments. This will also includes the resources associated
            with `include=consignments`. Current default array structure is legacy and will be deprecated from **1 Feb
            2026**. Specify `consignment_structure=object` as a request parameter when including consignments.

            * `fees` - include the response returned from the request to the `/orders/{order_id}/fees` endpoint.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrdersPostParametersIncludeSchemaItems'
        - name: consignment_structure
          in: query
          description: >-
            Should be specified along with `include=consignments` or `include=consignments.line_items` to return
            consignments in the supported object structure. The default array structure provided is legacy and may not
            be supported in the future.
          required: false
          schema:
            $ref: '#/components/schemas/OrdersPostParametersConsignmentStructure'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Order Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order_Resp'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order_Post'
      security:
        - X-Auth-Token: []
    delete:
      operationId: orders_deleteOrders
      summary: Delete All Orders
      description: Archives all orders.
      tags:
        - orders
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Number of results to return.
          required: false
          schema:
            type: number
            format: double
            default: 50
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/orders/{order_id}/consignments:
    get:
      operationId: orderConsignments_getOrderConsignments
      summary: List Consignments
      description: 'Get all consignments for an order. '
      tags:
        - orderConsignments
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            * `consignments.line_items` - include the response returned from the request to the
            `/orders/{order_id}/products` endpoint in consignments.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrdersOrderIdConsignmentsGetParametersIncludeSchemaItems'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderConsignment_Get'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdersOrderIdConsignmentsGetResponsesContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/orders/{order_id}/consignments/shipping/{shipping_consignment_id}/shipping_quotes:
    get:
      operationId: orderConsignments_getOrderConsignmentShippingQuotes
      summary: List Consignment Shipping Quotes
      description: >-
        Get all shipping quotes persisted on an order for a shipping consignment.

        This is a read-only endpoint whose response depends on the shipping quote. You can only generate a shipping
        quote using the storefront at this time. Orders that are created in the control panel, or using the API, return
        a 204 status response since you can't generate a shipping quote during that process.
      tags:
        - orderConsignments
      parameters:
        - name: order_id
          in: path
          description: ID of the order.
          required: true
          schema:
            type: integer
        - name: shipping_consignment_id
          in: path
          description: Shipping consignment ID.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shippingQuotes_Base'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/OrdersOrderIdConsignmentsShippingShippingConsignmentIdShippingQuotesGetResponsesContentApplicationJsonSchemaItems
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/orders/{order_id}/coupons:
