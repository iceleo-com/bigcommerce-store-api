openapi: 3.1.0
info:
  title: "Admin Management: Tax"
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/tax/zonecheck:
    post:
      operationId: taxZoneCheck_zone-check
      summary: Check Zone for Address
      description: Check the applicable tax zone for a given address and customer group.
      tags:
        - taxZoneCheck
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Zone_Check_zone-check_Response_200"
        "422":
          description: The request body does not meet specifications.
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ZoneCheck"
      security:
        - X-Auth-Token: []
tags:
  - name: taxCustomers
    description: Retrieve the customer tax information used by tax providers.
  - name: taxProperties
    description: Create and manage the tax properties used to classify products.
  - name: productTaxProperties
    description: Assign tax properties to individual products.
  - name: taxZones
    description: Create and manage the geographic zones a store applies tax rates to.
  - name: taxRates
    description: Create and manage the tax rates applied within a tax zone.
  - name: taxSettings
    description: Manage store-level tax settings.
  - name: taxZoneCheck
    description: Determine which tax zone applies to a given address.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    ZoneCheck:
      type: object
      properties:
        country_code:
          type: string
          description: Two-letter ISO 3166-1 country code.
        subdivision_code:
          type: string
          description: ISO 3166-2 subdivision code, up to three alphanumeric characters.
        postal_code:
          type: string
          description: Postal code.
        customer_group_id:
          type: integer
          description: Customer Group ID to which the customer is belongs.
      required:
        - country_code
      title: ZoneCheck
    Tax_Zone_Check_zone-check_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TaxZone"
      title: Tax Zone Check_zone-check_Response_200
    TaxZone:
      type: object
      properties:
        id:
          type: integer
          description: Tax Zone ID. Internal identifier used to get, update, or delete a specific tax zone.
        name:
          type: string
          description: The human-readable name for this tax zone. The name displays on the merchant's control panel.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax zone is enabled. Tax operations are only for enabled zones.
        price_display_settings:
          $ref: "#/components/schemas/TaxZonePriceDisplaySettings"
          description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
        shopper_target_settings:
          $ref: "#/components/schemas/TaxZoneShopperTargetSettings"
          description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper. You cannot define shopper target settings for the default tax zone because it must accommodate all shoppers who donʼt qualify for any other zone.
      title: TaxZone
    TaxZoneShopperTargetSettings:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/TaxZoneShopperTargetSettingsLocationsItems"
          description: A tax zone may target shoppers in one or more locations.
        customer_groups:
          type: array
          items:
            type: integer
          description: One or more customer groups that a tax zone targets. Empty array if zone applies to all customers.
      description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper. You cannot define shopper target settings for the default tax zone because it must accommodate all shoppers who donʼt qualify for any other zone.
      title: TaxZoneShopperTargetSettings
    TaxZoneShopperTargetSettingsLocationsItems:
      type: object
      properties:
        country_code:
          type: string
          description: Two-letter ISO 3166-1 country code
        subdivision_codes:
          type: array
          items:
            type: string
          description: Three-letter ISO 3166-2 subdivision code
        postal_codes:
          type: array
          items:
            type: string
      title: TaxZoneShopperTargetSettingsLocationsItems
    TaxZonePriceDisplaySettings:
      type: object
      properties:
        show_inclusive:
          type: boolean
          description: Indicates whether to show prices as tax inclusive or tax exclusive to shoppers matched with this tax zone.
        show_both_on_detail_view:
          type: boolean
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing product detail; for example, on product pages. This view applies to shoppers matched with this tax zone.
        show_both_on_list_view:
          type: boolean
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing a list of products; for example, on category and brand pages. This view applies to shoppers matched with this tax zone.
      description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
      title: TaxZonePriceDisplaySettings
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |-
        ### OAuth scopes

        | UI Name | Permission | Parameter |
        |:--------|:-----------|:----------|
        |  Information & Settings | modify | `store_v2_information` |
        |  Information & Settings | read-only | `store_v2_information_read_only` |

        ### Authentication header

        | Header | Argument | Description |
        |:-------|:---------|:------------|
        | `X-Auth-Token` | `access_token` | For more about API accounts that generate `access_token`s, see our [Guide to API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#api-accounts). |

        ### Further reading

        For example requests and more information about authenticating BigCommerce APIs, see [Authentication and Example Requests](/developer/docs/overview/api-fundamentals/api-accounts#x-auth-token-header-example-requests).

        For more about BigCommerce OAuth scopes, see our [Guide to API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#oauth-scopes).

        For a list of API status codes, see [API Status Codes](/developer/api-reference/rest/overview#rest-http-status-codes).
