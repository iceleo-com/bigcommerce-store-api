openapi: 3.1.0
info:
  title: 'Admin Management: Customer Segmentation'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/segments:
    get:
      operationId: segments_GetPaginatedSegmentsList
      summary: List Segments
      description: Returns a paginated *Segments List*.
      tags:
        - segments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Page number.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Items count per page.
          required: false
          schema:
            type: integer
        - name: id:in
          in: query
          description: |
            Comma separated IDs.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            A paginated array of *Segments* and collection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: segments_SegmentsPostRequest
      summary: Create Segments
      description: |
        Creates *Segments*.

        **Limits**
        * Limit of 10 concurrent requests.
        * Max total segments allowed per store is 1000.
      tags:
        - segments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: |
            An array of created *Segments*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsPostRequestRequestConflictError'
        '422':
          description: >
            The *Segment* was not valid. This is the result of either missing required fields, or because of invalid
            data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsWithErrorsResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentsPostRequest'
      security:
        - X-Auth-Token: []
    put:
      operationId: segments_PutSegmentObjects
      summary: Update Segments
      description: |
        Updates *Segments*.

         **Limits**
         * Limit of 10 concurrent requests.
      tags:
        - segments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: |
            An array of created *Segments*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsResponse'
        '422':
          description: >
            The *Segment* was not valid. This is the result of either missing required fields, or because of invalid
            data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsWithErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentsPutRequest'
      security:
        - X-Auth-Token: []
    delete:
      operationId: segments_DeleteStoreSegment
      summary: Delete Segments
      description: |
        Deletes one or more *Segments* from a store. This will not delete any associated *Shopper Profiles*.
      tags:
        - segments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |
            Comma separated IDs.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            The *Segments* were deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsRemoveResponse'
        '422':
          description: |
            Unable to delete some or all *Segments* due to invalid request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentsRemoveWithErrorsResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/shopper-profiles/{shopperProfileId}/segments:
    get:
      operationId: segmentsForAShopperProfile_GetListShopperProfile
      summary: List Segments for Shopper Profile
      description: Returns a paginated *Segments* list for a *Shopper Profile*.
      tags:
        - segmentsForAShopperProfile
      parameters:
        - name: shopperProfileId
          in: path
          description: The *Shopper Profile* ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Page number.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Items count per page.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            An array of *Segments* objects and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentCollectionResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/shopper-profiles:
    get:
      operationId: shopperProfiles_GetShopperList
      summary: List Shopper Profiles
      description: |
        Returns a paginated *Shopper Profiles* list.
      tags:
        - shopperProfiles
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Page number.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Items count per page.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            An array of *Shopper Profiles* objects and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: shopperProfiles_ShopperProfilesRequest
      summary: Create Shopper Profiles
      description: |
        Creates a *Shopper Profile*.
      tags:
        - shopperProfiles
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: |
            An array of created *Shopper Profiles*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesResponse'
        '422':
          description: >
            The *Shopper Profile* was not valid. This is the result of either missing required fields, or because of
            invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesWithErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperProfilesPostRequest'
      security:
        - X-Auth-Token: []
    delete:
      operationId: shopperProfiles_DeleteStoreShopperProfile
      summary: Delete Shopper Profiles
      description: |
        Deletes one or more *Shopper Profiles* from a store.
      tags:
        - shopperProfiles
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |
            Comma separated IDs.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            The *Shopper Profiles* were removed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesRemoveResponse'
        '422':
          description: |
            Unable to remove some or all *Shopper Profiles* due to invalid request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesRemoveWithErrorsResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/segments/{segmentId}/shopper-profiles:
    get:
      operationId: shopperProfilesForASegment_GetSegmentProfiles
      summary: List Shopper Profiles in Segment
      description: |
        Returns a list of *Shopper Profiles* that are associated with a given *Segment*.

        **NOTE**: The `modify` Customers OAuth scope is a requirement for this endpoint.
      tags:
        - shopperProfilesForASegment
      parameters:
        - name: segmentId
          in: path
          description: The *Segment* ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Page number.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Items count per page.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            An array of *Shopper Profiles* objects and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesGetResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: shopperProfilesForASegment_PostShopperProfile
      summary: Add Shopper Profiles to Segment
      description: |-
        Add *Shopper Profiles* to a specific *Segment*.

        **Limits**
        * Limit of *Shopper Profiles* per request is `50`.
        * Limit of 10 concurrent requests.
      tags:
        - shopperProfilesForASegment
      parameters:
        - name: segmentId
          in: path
          description: The *Segment* ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: An array of *Shopper Profiles* added to a *Segment*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesAddResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostShopperProfileRequestConflictError'
        '422':
          description: |
            Unable to add some or all *Shopper Profiles* to the *Segment* due to invalid request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesAddWithErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopperProfilesAddRequest'
      security:
        - X-Auth-Token: []
    delete:
      operationId: shopperProfilesForASegment_DeleteShopperProfile
      summary: Remove Shopper Profiles from Segment
      description: >
        Remove one or more *Shopper Profiles* that are associated with a *Segment*. This operation only removes the
        association; it doesn't delete the *Shopper Profiles*.
      tags:
        - shopperProfilesForASegment
      parameters:
        - name: segmentId
          in: path
          description: The *Segment* ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |
            Comma separated IDs.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            The *Shopper Profiles* were removed from the *Segment* successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesRemoveResponse'
        '422':
          description: |
            Unable to remove some or all *Shopper Profiles* due to invalid request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopperProfilesRemoveWithErrorsResponse'
      security:
        - X-Auth-Token: []
tags:
  - name: segments
    description: Create, list, update, and delete customer *Segments*.
  - name: segmentsForAShopperProfile
    description: List the *Segments* that a specific *Shopper Profile* belongs to.
  - name: shopperProfiles
    description: Create, list, and delete *Shopper Profiles* for a store.
  - name: shopperProfilesForASegment
    description: Manage the *Shopper Profiles* associated with a specific *Segment*.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    Segment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: |
            The ID of the segment.
        name:
          type: string
          description: |
            The name of the segment.
        description:
          type: string
          description: |
            The description of the segment.
        created_at:
          type: string
          format: date-time
          description: |
            The date of which the segment was created.
        updated_at:
          type: string
          format: date-time
          description: |
            The date of which the segment was updated.
      title: Segment
    PaginationLinks:
      type: object
      properties:
        previous:
          type: string
          description: |
            Link to the previous page returned in the response.
        current:
          type: string
          description: |
            Link to the current page returned in the response.
        next:
          type: string
          description: |
            Link to the next page returned in the response.
      description: |
        Pagination links for the previous and next parts of the whole collection.
      title: PaginationLinks
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: |
            Total number of items in the result set.
        count:
          type: integer
          description: |
            Total number of items in the collection response.
        per_page:
          type: integer
          description: |
            The amount of items returned in the collection per page, controlled by the limit parameter.
        current_page:
          type: integer
          description: |
            The page you are currently on within the collection.
        total_pages:
          type: integer
          description: |
            The total number of pages in the collection.
        links:
          $ref: '#/components/schemas/PaginationLinks'
          description: |
            Pagination links for the previous and next parts of the whole collection.
      description: |
        Data about the response including pagination, and collection totals.
      title: Pagination
    CollectionMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
      description: |
        Data about the response including pagination, and collection totals.
      title: CollectionMeta
    SegmentCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        meta:
          $ref: '#/components/schemas/CollectionMeta'
      description: |
        Response payload for the BigCommerce API.
      title: SegmentCollectionResponse
    SegmentPost:
      type: object
      properties:
        name:
          type: string
          description: Name of the segment
        description:
          type: string
          description: Description of the segment
      required:
        - name
      title: SegmentPost
    SegmentsPostRequest:
      type: array
      items:
        $ref: '#/components/schemas/SegmentPost'
      description: |
        Request payload for the BigCommerce API.
      title: SegmentsPostRequest
    BatchResultMeta:
      type: object
      properties:
        total:
          type: integer
          description: The number of items in the batch request.
        success:
          type: integer
          description: The number of items that were processed successfully.
        failed:
          type: integer
          description: The number of items that were not processed successfully.
      description: |
        The number of items (total, successes, failures) in a batch request.
      title: BatchResultMeta
    SegmentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        meta:
          $ref: '#/components/schemas/BatchResultMeta'
      description: |
        Response payload for the BigCommerce API.
      title: SegmentsResponse
    SegmentsPostResponsesContentApplicationJsonSchemaDataItems:
      type: object
      properties: {}
      title: SegmentsPostResponsesContentApplicationJsonSchemaDataItems
    SegmentsPostResponsesContentApplicationJsonSchemaErrorsItemsErrors:
      type: object
      properties: {}
      title: SegmentsPostResponsesContentApplicationJsonSchemaErrorsItemsErrors
    SegmentsPostResponsesContentApplicationJsonSchemaErrorsItems:
      type: object
      properties:
        status:
          type: number
          format: double
        title:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        errors:
          $ref: '#/components/schemas/SegmentsPostResponsesContentApplicationJsonSchemaErrorsItemsErrors'
      required:
        - status
      title: SegmentsPostResponsesContentApplicationJsonSchemaErrorsItems
    SegmentsPostResponsesContentApplicationJsonSchemaMeta:
      type: object
      properties:
        total:
          type: number
          format: double
        success:
          type: number
          format: double
        failed:
          type: number
          format: double
      title: SegmentsPostResponsesContentApplicationJsonSchemaMeta
    SegmentsPostRequestRequestConflictError:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SegmentsPostResponsesContentApplicationJsonSchemaDataItems'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SegmentsPostResponsesContentApplicationJsonSchemaErrorsItems'
        meta:
          $ref: '#/components/schemas/SegmentsPostResponsesContentApplicationJsonSchemaMeta'
      required:
        - data
        - errors
        - meta
      title: SegmentsPostRequestRequestConflictError
    DetailedErrors:
      type: object
      properties: {}
      title: DetailedErrors
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: |
            The HTTP status code.
        title:
          type: string
          description: |
            The error title describing the particular error.
        type:
          type: string
        instance:
          type: string
        errors:
          $ref: '#/components/schemas/DetailedErrors'
      description: |
        Error payload for the BigCommerce API.
      title: ErrorResponse
    SegmentsWithErrorsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        meta:
          $ref: '#/components/schemas/BatchResultMeta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
      description: |
        A partial-success response returned when some items in the batch fail validation.
      title: SegmentsWithErrorsResponse
    SegmentPut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the segment.
        name:
          type: string
          description: Name of the segment.
        description:
          type: string
          description: Description of the segment.
      required:
        - id
      title: SegmentPut
    SegmentsPutRequest:
      type: array
      items:
        $ref: '#/components/schemas/SegmentPut'
      description: |
        Request payload for the BigCommerce API.
      title: SegmentsPutRequest
    SegmentsRemoveResponseDataItems:
      type: object
      properties: {}
      title: SegmentsRemoveResponseDataItems
    SegmentsRemoveResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SegmentsRemoveResponseDataItems'
          description: |
            Empty on success.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
          description: |
            Empty on success. Populated when one or more *Segments* could not be deleted.
        meta:
          $ref: '#/components/schemas/BatchResultMeta'
      description: |
        The response payload returned when *Segments* are deleted.
      title: SegmentsRemoveResponse
    SegmentsRemoveWithErrorsResponseDataItems:
      type: object
      properties: {}
      title: SegmentsRemoveWithErrorsResponseDataItems
    SegmentsRemoveWithErrorsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SegmentsRemoveWithErrorsResponseDataItems'
          description: |
            Empty on success.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
          description: |
            Empty on success. Populated when one or more *Segments* could not be deleted.
        meta:
          $ref: '#/components/schemas/BatchResultMeta'
      description: >
        A partial-success response returned when some *Segments* cannot be deleted. The `errors` array is populated and
        `meta.failed` is greater than zero.
      title: SegmentsRemoveWithErrorsResponse
    ShopperProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: |
            The ID of the *Shopper Profile*.
        customer_id:
          type: integer
          description: |
            The ID of the registered *Customer* associated with this *Shopper Profile*.
        created_at:
          type: string
          format: date-time
          description: |
            The date and time when the *Shopper Profile* was created.
        updated_at:
          type: string
          format: date-time
          description: |
            The date and time when the *Shopper Profile* was last updated.
      title: ShopperProfile
    ShopperProfilesCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShopperProfile'
        meta:
          $ref: '#/components/schemas/CollectionMeta'
      description: |
        Response payload for the BigCommerce API.
      title: ShopperProfilesCollectionResponse
    ShopperProfilePost:
      type: object
      properties:
        customer_id:
          type: number
          format: double
          description: The ID of a registered Customer to associate with the new *Shopper Profile*.
      title: ShopperProfilePost
    ShopperProfilesPostRequest:
      type: array
      items:
        $ref: '#/components/schemas/ShopperProfilePost'
      description: |
        Request payload for the BigCommerce API.
      title: ShopperProfilesPostRequest
    ShopperProfilesResponse:
      type: object
      properties:
