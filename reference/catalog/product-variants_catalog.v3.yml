openapi: 3.1.0
info:
  title: 'Admin Catalog: Product Variants'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/catalog/products/{product_id}/variants:
    get:
      operationId: productVariants_getProductVariants
      summary: List Product Variants
      description: Returns a list of product variants. Optional parameters can be passed in.
      tags:
        - productVariants
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variants_getProductVariants_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductVariantsRequestNotFoundError'
      security:
        - X-Auth-Token: []
    post:
      operationId: productVariants_createProductVariant
      summary: Create Product Variant
      description: >-
        Creates a product variant.


        **Required Fields**

        * sku

        * option_values


        **Read-Only Fields**

        * id


        **Limits**

        * 600 SKUs per product limit.

        * 255 characters SKU length limit.


        Variants need to be created one at a time using this endpoint. To use a variant array, create products, and
        variants in the same call use the [Create
        Products](/developer/api-reference/rest/admin/catalog/products/create-product) endpoint during the initial
        product creation. To obtain the `option_values` to include in this request, use the [Create a product variant
        option](/developer/api-reference/rest/admin/catalog/product-variant-options/create-product-variant-option)
        endpoint.
      tags:
        - productVariants
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variants_createProductVariant_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/productVariant_Post'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/variants/{variant_id}:
    get:
      operationId: productVariants_getProductVariant
      summary: Get Product Variant
      description: Returns a single product variant. Optional parameters can be passed in.
      tags:
        - productVariants
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: variant_id
          in: path
          description: |
            ID of the variant on a product, or on an associated Price List Record.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variants_getProductVariant_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductVariantRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: productVariants_updateProductVariant
      summary: Update Product Variant
      description: Updates a product variant.
      tags:
        - productVariants
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: variant_id
          in: path
          description: |
            ID of the variant on a product, or on an associated Price List Record.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variants_updateProductVariant_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductVariantRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/productVariant_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: productVariants_deleteProductVariant
      summary: Delete Product Variant
      description: Deletes a product variant.
      tags:
        - productVariants
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: variant_id
          in: path
          description: |
            ID of the variant on a product, or on an associated Price List Record.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/variants/metafields:
    get:
      operationId: batchMetafields_getVariantsMetafields
      summary: List Product Variant Metafields
      description: Get all variant metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla `key` query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespaces.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: >-
            Filter based on comma-separated metafieldʼs namespaces. Could be used with vanilla `namespace` query
            parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/CatalogVariantsMetafieldsGetParametersDirection'
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CatalogVariantsMetafieldsGetParametersIncludeFieldsSchemaItems'
        - name: date_created:min
          in: query
          description: >
            'Query parameter that lets you filter by the minimum date created, for example, `2024-05-14T09:34:00` or
            `2024-05-14`. Returns metafields created after this date.'
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: >
            'Query parameter that lets you filter by the maximum date created, for example, `2024-05-14T09:34:00` or
            `2024-05-14`. Returns metafields created before this date.'
          required: false
          schema:
            type: string
        - name: date_modified:min
          in: query
          description: >
            'Query parameter that lets you filter by the minimum date modified, for example, `2024-05-14T09:34:00` or
            `2024-05-14`. Returns metafields modified after this date.'
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >
            'Query parameter that lets you filter by the maximum date modified, for example, `2024-05-14T09:34:00` or
            `2024-05-14`. Returns metafields modified before this date.'
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: batchMetafields_createVariantsMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            List of created `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVariantsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CatalogVariantsMetafieldsPostRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    put:
      operationId: batchMetafields_updateVariantsMetafields
      summary: Update Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVariantsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CatalogVariantsMetafieldsPutRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    delete:
      operationId: batchMetafields_deleteVariantsMetafields
      summary: Delete Multiple Metafields
      description: Delete all variant metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVariantsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE'
      requestBody:
        description: List of metafield IDs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/variants/{variant_id}/image:
    post:
      operationId: images_createProductVariantImage
      summary: Create Product Variant Image
      description: >-
        Creates a *Variant Image*.


        Only one image can be explicitly associated with a Variant. If the Variant already has an associated image,
        overwrites the existing Variant Image.


        The image displays on the storefront when the Variant is selected.

         **Required Fields**
        - image_file: Form posts. Files larger than 1 MB are not accepted

        - image_url: Any publicly available URL
      tags:
        - images
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: variant_id
          in: path
          description: |
            ID of the variant on a product, or on an associated Price List Record.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: '`image_url` is returned for both `image_file` and `image_url`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images_createProductVariantImage_Response_200'
        '400':
          description: >-
            Bad Request. The requested resource could not be downloaded and may be invalid. Possible reasons include
            malformed request syntax or the file host blocking requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantImageRequestBadRequestError'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantImageRequestNotFoundError'
        '422':
          description: >
            Image was not valid. This is the result of a missing `image_file` field or of an incorrect file type. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantImageRequestUnprocessableEntityError'
        '500':
          description: Returns for an `image_file` larger than 1 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantImageRequestInternalServerError'
      requestBody:
        description: An object containing a publicly accessible image URL, or a form post that contains an image file.
        content:
          application/json:
            schema:
              type: object
              properties:
                image_url:
                  type: string
                  description: |
                    A public URL for a GIF, JPEG, or PNG image. Limit of 8MB per file.
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/variants/{variant_id}/metafields:
    get:
      operationId: metafields_getProductVariantMetafields
      summary: List Product Variant Metafields
      description: Returns a list of product variant *Metafields*. Optional parameters can be passed in.
      tags:
        - metafields
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: variant_id
          in: path
          description: |
            ID of the variant on a product, or on an associated Price List Record.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespaces.
          required: false
          schema:
            type: string
        - name: resource_id:in
          in: query
          description: >-
            A comma-separated list of entity ID values that filter results to metafields that belong to one of the
            matching entities.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metafields_getProductVariantMetafields_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: metafields_createProductVariantMetafield
      summary: Create Product Variant Metafield
      description: >-
        Creates a product variant *Metafield*.


        **Required Fields:**

        * permission_set

        * namespace

        * key

        * value


        **Read-Only Fields**

        * id


        **Note:** The maxiumum number of metafields allowed on each order, product, category, variant, or brand is 250
        per client ID. For more information, see [Platform
        Limits](https://support.bigcommerce.com/s/article/Platform-Limits) in the Help Center.
      tags:
        - metafields
      parameters:
        - name: product_id
          in: path
          description: >
            The ID of the `Product` to which the resource belongs. Product variant metafield endpoints that have the
            `product_id` in the request path are successful as long as the parameter is not empty. The `product_id`
            segment is there only for path consistency.
          required: true
          schema:
            type: integer
        - name: variant_id
          in: path
          description: |
            ID of the variant on a product, or on an associated Price List Record.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metafields_createProductVariantMetafield_Response_200'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantMetafieldRequestBadRequestError'
        '409':
          description: >
            The `Metafield` was in conflict with another `Metafield`. This can be the result of duplicate unique-key
