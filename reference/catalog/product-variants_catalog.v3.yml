    productVariant_Put:
      type: object
      properties:
        cost_price:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >-
            The cost price of the variant. It is not affected by Price List prices. This value displays as null in the
            control panel when `cost_price` equals zero.
        price:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >-
            This variant’s base price on the storefront. If a Price List ID is used, the Price List value will be used.
            If a Price List ID is not used, and this value is `null`, the product’s default price (set in the Product
            resource’s `price` field) will be used as the base price.
        sale_price:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >-
            This variant’s sale price on the storefront. If a Price List ID is used, the Price List value will be used.
            If a Price List ID is not used, and this value is null, the product’s sale price (set in the Product
            resource’s `price` field) will be used as the sale price.
        retail_price:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >-
            This variant’s retail price on the storefront. If a Price List ID is used, the Price List value will be
            used. If a Price List ID is not used, and this value is null, the product’s retail price (set in the Product
            resource’s `price` field) will be used as the retail price.
        weight:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >-
            This variant’s base weight on the storefront. If this value is null, the product’s default weight (set in
            the Product resource’s weight field) will be used as the base weight.
        width:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >
            Width of the variant, which can be used when calculating shipping costs. If this value is `null`, the
            productʼs default width (set in the Product resourceʼs `width` field) will be used as the base width.
        height:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >
            Height of the variant, which can be used when calculating shipping costs. If this value is `null`, the
            productʼs default height (set in the Product resourceʼs `height` field) will be used as the base height.
        depth:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >
            Depth of the variant, which can be used when calculating shipping costs. If this value is `null`, the
            productʼs default depth (set in the Product resourceʼs `depth` field) will be used as the base depth.
        is_free_shipping:
          type: boolean
          description: >
            Flag used to indicate whether the variant has free shipping. If `true`, the shipping cost for the variant
            will be zero.
        fixed_cost_shipping_price:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: >
            A fixed shipping cost for the variant. If defined, this value will be used during checkout instead of normal
            shipping-cost calculation.
        purchasing_disabled:
          type: boolean
          description: If `true`, this variant will not be purchasable on the storefront.
        purchasing_disabled_message:
          type: string
          minLength: 0
          maxLength: 255
          description: If `purchasing_disabled` is `true`, this message should show on the storefront when the variant is selected.
        upc:
          type:
            - string
            - 'null'
          minLength: 0
          maxLength: 14
          description: The UPC code used in feeds for shopping comparison sites and external channel integrations.
        image_url:
          type: string
          description: Publicly available image url
        inventory_level:
          type:
            - integer
            - 'null'
          maximum: 2147483647
          description: >-
            Inventory level for the variant, which is used when the product’s inventory_tracking is set to `variant`.
            The Catalog API returns the inventory for only the default location.


            The inventory for a variant cannot exceed 2,147,483,647 in the catalog. The sum of the variant inventories,
            or the total inventory for a product, cannot exceed 2,147,483,647. 


            If you exceed the limit, the store sets the variant inventory to the limit if no other variant inventories
            are set. If other variant inventories are set, the store does not save the variant inventory rather than
            setting the variant inventory to the remaining limit.


            The Catalog API handles limits in a different way than the Inventory API. For more information, see [Limit
            handling](/developer/docs/admin/catalog-and-inventory/inventory-adjustments#limit-handling-in-inventory-versus-catalog-api). 
        inventory_warning_level:
          type:
            - integer
            - 'null'
          maximum: 2147483647
          description: When the variant hits this inventory level, it is considered low stock.
        bin_picking_number:
          type:
            - string
            - 'null'
          minLength: 0
          maxLength: 255
          description: Identifies where in a warehouse the variant is located.
        mpn:
          type:
            - string
            - 'null'
          description: The Manufacturer Part Number (MPN) for the variant.
        gtin:
          type:
            - string
            - 'null'
          minLength: 0
          maxLength: 14
        product_id:
          type: integer
        sku:
          type: string
          minLength: 1
          maxLength: 255
