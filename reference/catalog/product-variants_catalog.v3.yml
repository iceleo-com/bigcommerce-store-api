  /stores/{store_hash}/v3/catalog/variants:
    get:
      operationId: variantsBatch_getVariants
      summary: List Variants
      description: Returns a list of all variants in your catalog. Optional parameters can be passed in.
      tags:
        - variantsBatch
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: Filter items by variant ID.
          required: false
          schema:
            type: integer
        - name: sku
          in: query
          description: >-
            Filter items by variant SKU. To filter by product / base variant SKU, see [Get all
            products](/developer/api-reference/rest/admin/catalog/products/get-products). 
          required: false
          schema:
            type: string
        - name: upc
          in: query
          description: |
            Filter items by UPC.
          required: false
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: product_id:in
          in: query
          description: A comma-separated list of IDs of products you want to request. For example, `?product_id:in=77,80,81`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variants__Batch__getVariants_Response_200'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVariantsRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: variantsBatch_updateVariantsBatch
      summary: Update Variants (batch)
      description: |-
        Updates a batch of `variant` objects. Currently the limit is 50 variants however this is subject to change.

        **Required Fields**

        To update an existing variant:
        * id (variant ID)

        To create a new variant:
        * product_id
        * sku
        * option_values
          - id (option_value ID - Example: 146)
          - option_id (Option ID - Example: 151)
      tags:
        - variantsBatch
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variants__Batch__updateVariantsBatch_Response_200'
        '422':
          description: |
            This is the result of missing required fields, or of invalid data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVariantsBatchRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CatalogVariantsPutRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
