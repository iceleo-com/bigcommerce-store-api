openapi: 3.1.0
info:
  title: 'Admin Catalog: Product Variant Options'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/catalog/products/{product_id}/options:
    get:
      operationId: productVariantOptions_getProductVariantOptions
      summary: List Product Variant Options
      description: 'Returns a list of product *Variant Options*. Optional parameters can be passed in. '
      tags:
        - productVariantOptions
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
            maximum: 250
            default: 50
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variant_options_getProductVariantOptions_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductVariantOptionsRequestNotFoundError'
      security:
        - X-Auth-Token: []
    post:
      operationId: productVariantOptions_createProductVariantOption
      summary: Create Product Variant Option
      description: >-
        Creates a *Variant Option*.


        **Required Fields**

        * display_name

        * type

        * option_values


        **Read-Only Fields**

        * id


        **Limits**

        * 255 characters option name length.


        **Notes**


        * Only one variant option at a time can be created; individual variant options will contain an array of multiple
        values.

        * There are several examples listed below that create options, but the SKUs are not updated and they are not a
        variant on the product. Variant SKUs must be created with a separate request.

        * Variant options will show on the storefront as an option that can be selected by the customer. A request like
        this could be used to add new choices to a variant that has already been created.

        * If more than one variant needs to be created, use the [Create a
        Product](/developer/api-reference/rest/admin/catalog/products/create-product) endpoint.
      tags:
        - productVariantOptions
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variant_options_createProductVariantOption_Response_200'
        '409':
          description: |
            Option was in conflict with another option. This is the result of duplicate unique fields, such as `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantOptionRequestConflictError'
        '422':
          description: >
            Option was not valid. This is the result of missing required fields, or of invalid data. See the response
            for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantOptionRequestUnprocessableEntityError'
      requestBody:
        description: The model for a POST to create options on a product.
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                  description: |
                    The unique numerical ID of the product to which the option belongs.
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: |
                    The name of the option shown on the storefront.
                type:
                  $ref: '#/components/schemas/CatalogProductsProductIdOptionsPostRequestBodyContentApplicationJsonSchemaType'
                  description: >
                    The type of option, which determines how it will display on the storefront. Acceptable values:
                    `radio_buttons`, `rectangles`, `dropdown`, `product_list`, `product_list_with_images`, `swatch`. For
                    reference, the former v2 API values are: RB = radio_buttons, RT = rectangles, S = dropdown, P =
                    product_list, PI = product_list_with_images, CS = swatch.
                config:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdOptionsPostRequestBodyContentApplicationJsonSchemaConfig
                  description: The values for option config can vary based on the Modifier created.
                sort_order:
                  type: integer
                  description: 'Order in which the option is displayed on the storefront. '
                option_values:
                  type: array
                  items:
                    $ref: >-
                      #/components/schemas/CatalogProductsProductIdOptionsPostRequestBodyContentApplicationJsonSchemaOptionValuesItems
                image_url:
                  type: string
                  description: Publicly available image url
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/options/{option_id}:
    get:
      operationId: productVariantOptions_getProductVariantOption
      summary: Get Product Variant Option
      description: Returns a single *Variant Option*. Optional parameters can be passed in.
      tags:
        - productVariantOptions
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variant_options_getProductVariantOption_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductVariantOptionRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: productVariantOptions_updateProductVariantOption
      summary: Update Product Variant Option
      description: |-
        Updates a *Variant Option*.

        **Read-Only Fields**
        * id
      tags:
        - productVariantOptions
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_variant_options_updateProductVariantOption_Response_200'
        '409':
          description: >
            The `Option` was in conflict with another option. This is the result of duplicate unique fields, such as
            `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductVariantOptionRequestConflictError'
        '422':
          description: >
            The `Option` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductVariantOptionRequestUnprocessableEntityError'
      requestBody:
        description: The model for a PUT to update options on a product.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type:
                    - integer
                    - 'null'
                  description: |
                    The unique numerical ID of the option, increments sequentially.
                product_id:
                  type: integer
                  description: |
                    The unique numerical ID of the product to which the option belongs.
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: |
                    The name of the option shown on the storefront.
                type:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdOptionsOptionIdPutRequestBodyContentApplicationJsonSchemaType
                  description: >
                    The type of option, which determines how it will display on the storefront. Acceptable values:
                    `radio_buttons`, `rectangles`, `dropdown`, `product_list`, `product_list_with_images`, `swatch`. For
                    reference, the former v2 API values are: RB = radio_buttons, RT = rectangles, S = dropdown, P =
                    product_list, PI = product_list_with_images, CS = swatch.
                config:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdOptionsOptionIdPutRequestBodyContentApplicationJsonSchemaConfig
                  description: The values for option config can vary based on the Modifier created.
                sort_order:
                  type: integer
                  description: 'Order in which the option is displayed on the storefront. '
                option_values:
                  type: array
                  items:
                    $ref: >-
                      #/components/schemas/CatalogProductsProductIdOptionsOptionIdPutRequestBodyContentApplicationJsonSchemaOptionValuesItems
                image_url:
                  type: string
                  description: Publicly available image url
      security:
        - X-Auth-Token: []
    delete:
      operationId: productVariantOptions_deleteProductVariantOption
      summary: Delete Product Variant Option
      description: Deletes a *Variant Option*.
      tags:
        - productVariantOptions
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/options/{option_id}/values:
    get:
      operationId: values_getProductVariantOptionValues
      summary: List Product Variant Option Values
      description: Returns a list of all *Variant Option Values*. Optional parameters can be passed in.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
            maximum: 250
            default: 50
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CatalogProductsProductIdOptionsOptionIdValuesGetParametersIncludeFieldsSchemaItems'
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CatalogProductsProductIdOptionsOptionIdValuesGetParametersExcludeFieldsSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_getProductVariantOptionValues_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: values_createProductVariantOptionValue
      summary: Create Product Variant Option Value
      description: >-
        Creates a *Variant Option Value*.


        **Required Fields**

        * label

        * sort_order


        **Read-Only Fields**

        * id

        * is_default


        **Limits**

        * 250 option values per option limit.


        > `is_default` is derived from the parent option configuration and cannot be set on individual values. To change
        which value is the default, use [Update Product Variant
        Option](/developer/api-reference/rest/admin/catalog/product-variant-options/update-product-variant-option) and
        include the full `option_values` array with the desired `is_default` flags.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_createProductVariantOptionValue_Response_200'
        '422':
          description: >
            The `OptionValue` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductVariantOptionValueRequestUnprocessableEntityError'
      requestBody:
        description: The model for a POST to create option values on a product.
        content:
          application/json:
            schema:
              type: object
              properties:
                is_default:
                  type: boolean
                  description: >
                    The flag for preselecting a value as the default on the storefront. This field is not supported for
                    swatch options/modifiers. Read-only on this endpoint; use [Update Product Variant
                    Option](/developer/api-reference/rest/admin/catalog/product-variant-options/update-product-variant-option)
                    with the full `option_values` array to change the default.
                label:
                  type: string
                  description: |
                    The text display identifying the value on the storefront. Required in a /POST.
                sort_order:
                  type: integer
                  minimum: -2147483648
                  maximum: 2147483647
                  description: |
                    The order in which the value will be displayed on the product page. Required in a /POST.
                value_data:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdOptionsOptionIdValuesPostRequestBodyContentApplicationJsonSchemaValueData
                  description: >
                    Extra data describing the value, based on the type of option or modifier with which the value is
                    associated. The `swatch` type option can accept an array of `colors`, with up to three hexidecimal
                    color keys; or an `image_url`, which is a full image URL path including protocol. The `product list`
                    type option requires a `product_id`. The `checkbox` type option requires a boolean flag, called
                    `checked_value`, to determine which value is considered to be the checked state.
              required:
                - label
                - sort_order
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/options/{option_id}/values/{value_id}:
    get:
      operationId: values_getProductVariantOptionValue
      summary: Get Product Variant Option Value
      description: Returns a single *Variant Option Value*. Optional parameters can be passed in.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: value_id
          in: path
          description: |
            The ID of the `Modifier/Option Value`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: >-
                #/components/schemas/CatalogProductsProductIdOptionsOptionIdValuesValueIdGetParametersIncludeFieldsSchemaItems
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              $ref: >-
                #/components/schemas/CatalogProductsProductIdOptionsOptionIdValuesValueIdGetParametersExcludeFieldsSchemaItems
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_getProductVariantOptionValue_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductVariantOptionValueRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: values_updateProductVariantOptionValue
      summary: Update Product Variant Option Value
      description: >-
        Updates a *Variant Option Value*.


        **Read-Only Fields**

        * id

        * is_default


        > `is_default` is derived from the parent option configuration and cannot be set on individual values. To change
        which value is the default, use [Update Product Variant
        Option](/developer/api-reference/rest/admin/catalog/product-variant-options/update-product-variant-option) and
        include the full `option_values` array with the desired `is_default` flags.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: value_id
          in: path
          description: |
            The ID of the `Modifier/Option Value`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_updateProductVariantOptionValue_Response_200'
        '422':
          description: >
            The `OptionValue` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductVariantOptionValueRequestUnprocessableEntityError'
      requestBody:
        description: |
          A BigCommerce `OptionValue` object.
        content:
          application/json:
            schema:
              type: object
              properties:
                is_default:
                  type: boolean
                  description: >
                    The flag for preselecting a value as the default on the storefront. This field is not supported for
                    swatch options/modifiers. Read-only on this endpoint; use [Update Product Variant
                    Option](/developer/api-reference/rest/admin/catalog/product-variant-options/update-product-variant-option)
                    with the full `option_values` array to change the default.
                label:
                  type: string
                  description: |
                    The text display identifying the value on the storefront. Required in a /POST.
                sort_order:
                  type: integer
                  minimum: -2147483648
                  maximum: 2147483647
                  description: |
                    The order in which the value will be displayed on the product page. Required in a /POST.
                value_data:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdOptionsOptionIdValuesValueIdPutRequestBodyContentApplicationJsonSchemaValueData
                  description: >
                    Extra data describing the value, based on the type of option or modifier with which the value is
                    associated. The `swatch` type option can accept an array of `colors`, with up to three hexidecimal
                    color keys; or an `image_url`, which is a full image URL path including protocol. The `product list`
                    type option requires a `product_id`. The `checkbox` type option requires a boolean flag, called
                    `checked_value`, to determine which value is considered to be the checked state.
                id:
                  type: integer
                  description: |
                    The unique numeric ID of the value; increments sequentially.
              required:
                - label
                - sort_order
      security:
        - X-Auth-Token: []
    delete:
      operationId: values_deleteProductVariantOptionValue
      summary: Delete Product Variant Option Value
      description: >
        Deletes a *Variant Option Value*. Rejects removing the last remaining value of a variant option; delete the
        option itself to simplify the product.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the `Product` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: option_id
          in: path
          description: |
            The ID of the `Option`.
          required: true
          schema:
            type: integer
        - name: value_id
          in: path
          description: |
            The ID of the `Modifier/Option Value`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: |
            The value could not be deleted because it is the last remaining value of the variant option.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProductVariantOptionValueRequestUnprocessableEntityError'
      security:
        - X-Auth-Token: []
tags:
  - name: productVariantOptions
    description: Create and manage the options that generate a product's variants.
  - name: values
    description: Manage the selectable values available for a variant option.
servers:
