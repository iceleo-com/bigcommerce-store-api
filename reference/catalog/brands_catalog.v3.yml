openapi: 3.1.0
info:
  title: 'Admin Catalog: Brands'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/catalog/brands:
    get:
      operationId: brands_getBrands
      summary: List Brands
      description: Returns a list of brands. Optional filter parameters can be passed in.
      tags:
        - brands
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: |
            Filter items by ID.
          required: false
          schema:
            type: integer
        - name: id:in
          in: query
          description: Filter results to those whose ID is in this list.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:not_in
          in: query
          description: Filter results to those whose ID is not in this list.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:min
          in: query
          description: Filter results to those whose ID is greater than or equal to this value.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:max
          in: query
          description: Filter results to those whose ID is less than or equal to this value.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:greater
          in: query
          description: Filter results to those whose ID is greater than this value.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:less
          in: query
          description: Filter results to those whose ID is less than this value.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: name
          in: query
          description: |
            Filter items by name.
          required: false
          schema:
            type: string
        - name: name:like
          in: query
          description: Filter items by part of a name. For example, `name:like=new` returns brands with names that include `new`.
          required: false
          schema:
            type: string
        - name: page_title
          in: query
          description: |
            Filter items by page_title.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          description: Field name to sort by.
          required: false
          schema:
            $ref: '#/components/schemas/CatalogBrandsGetParametersSort'
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/CatalogBrandsGetParametersDirection'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brands_getBrands_Response_200'
        '403':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      security:
        - X-Auth-Token: []
    post:
      operationId: brands_createBrand
      summary: Create Brand
      description: |-
        Creates a brand.

        **Required Fields**
        - name

        **Limits**
        - 30,000 brands per store limit
      tags:
        - brands
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brands_createBrand_Response_200'
        '403':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Brand was in conflict with another brand. This is the result of duplicate unique fields such as name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandRequestConflictError'
        '422':
          description: >-
            Brand was not valid. This is the result of missing required fields, or of invalid data. See the response for
            more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandRequestUnprocessableEntityError'
      requestBody:
        description: Common brand properties.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: |-
                    The name of the brand. Must be unique.
                    Required in POST.
                page_title:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: |
                    The title shown in the browser while viewing the brand.
                meta_keywords:
                  type: array
                  items:
                    type: string
                  description: |
                    An array of meta keywords to include in the HTML.
                meta_description:
                  type: string
                  minLength: 0
                  maxLength: 65535
                  description: |
                    A meta description to include.
                search_keywords:
                  type: string
                  minLength: 0
                  maxLength: 65535
                  description: |
                    A comma-separated list of keywords that can be used to locate this brand.
                image_url:
                  type: string
                  description: >
                    Image URL used for this category on the storefront. Images can be uploaded via form file post to
                    `/brands/{brandId}/image`, or by providing a publicly accessible URL in this field.
                custom_url:
                  $ref: '#/components/schemas/CatalogBrandsPostRequestBodyContentApplicationJsonSchemaCustomUrl'
                  description: >-
                    The custom URL for the brand on the storefront. If not provided, the URL will be autogenerated from
                    the brand name.
              required:
                - name
      security:
        - X-Auth-Token: []
    delete:
      operationId: brands_deleteBrands
      summary: Delete Brands
      description: To delete brand objects, you must include a value for the name filter.
      tags:
        - brands
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: |
            Filter items by name.
          required: true
          schema:
            type: string
        - name: page_title
          in: query
          description: |
            Filter items by page_title.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '422':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/brands/{brand_id}:
    get:
      operationId: brands_getBrand
      summary: Get Brand
      description: Returns a single brand. Optional filter parameters can be passed in.
      tags:
        - brands
      parameters:
        - name: brand_id
          in: path
          description: |
            The ID of the brand to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brands_getBrand_Response_200'
        '403':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrandRequestNotFoundError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: An error response with additional detail about what went wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - X-Auth-Token: []
    put:
      operationId: brands_updateBrand
      summary: Update Brand
      description: |-
        Updates a brand.

        To update a brand image, send a request with an `image_url`.
      tags:
        - brands
      parameters:
        - name: brand_id
          in: path
          description: |
            The ID of the brand to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brands_updateBrand_Response_200'
        '403':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBrandRequestNotFoundError'
        '409':
          description: >
            The `Brand` was in conflict with another product. This is the result of duplicate unique values, such as
            `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBrandRequestConflictError'
        '422':
          description: >
            The `Brand` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBrandRequestUnprocessableEntityError'
      requestBody:
        description: Common Brand properties.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Unique ID of the brand.
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: |-
                    The name of the brand. Must be unique.
                    Required in POST.
                page_title:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: |
                    The title shown in the browser while viewing the brand.
                meta_keywords:
                  type: array
                  items:
                    type: string
                  description: |
                    An array of meta keywords to include in the HTML.
                meta_description:
                  type: string
                  minLength: 0
                  maxLength: 65535
                  description: |
                    A meta description to include.
                search_keywords:
                  type: string
                  minLength: 0
                  maxLength: 65535
                  description: |
                    A comma-separated list of keywords that can be used to locate this brand.
                image_url:
                  type: string
                  description: >
                    Image URL used for this category on the storefront. Images can be uploaded via form file post to
                    `/brands/{brandId}/image`, or by providing a publicly accessible URL in this field.
                custom_url:
                  $ref: '#/components/schemas/CatalogBrandsBrandIdPutRequestBodyContentApplicationJsonSchemaCustomUrl'
                  description: The custom URL for the brand on the storefront.
              required:
                - name
      security:
        - X-Auth-Token: []
    delete:
      operationId: brands_deleteBrand
      summary: Delete Brand
      description: Deletes a brand.
      tags:
        - brands
      parameters:
        - name: brand_id
          in: path
          description: |
            The ID of the brand to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: An error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/brands/metafields:
    get:
      operationId: batchMetafields_getBrandsMetafields
      summary: List Brand Metafields
      description: Get all brand metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla `key` query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespaces.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: >-
            Filter based on comma-separated metafieldʼs namespaces. Could be used with vanilla `namespace` query
            parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/CatalogBrandsMetafieldsGetParametersDirection'
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CatalogBrandsMetafieldsGetParametersIncludeFieldsSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBrandsMetafieldsRequestBadRequestError'
      security:
        - X-Auth-Token: []
    post:
      operationId: batchMetafields_createBrandsMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            List of created `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CatalogBrandsMetafieldsPostRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    put:
      operationId: batchMetafields_updateBrandsMetafields
      summary: Update Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBrandsMetafieldsRequestBadRequestError'
        '422':
          description: JSON data is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBrandsMetafieldsRequestUnprocessableEntityError'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CatalogBrandsMetafieldsPutRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    delete:
      operationId: batchMetafields_deleteBrandsMetafields
      summary: Delete Multiple Metafields
      description: Delete all brand metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBrandsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE'
      requestBody:
        description: List of metafield IDs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/brands/{brand_id}/image:
    post:
      operationId: images_createBrandImage
      summary: Create Brand Image
      description: >-
        Creates a brand image.


        **Required Fields**

        - image_file: Form posts are the only accepted upload option. For more information on how to upload an image see
        [Adding product images](/developer/docs/admin/catalog-and-inventory/products-overview#adding-product-images).
        NOTE:  Ensure you set the `Content-Type` header to `multipart/form-data; boundary=--example-boundary--` and set
        the correct URL for this endpoint.


        **Read-Only Fields**

        - id


        Only one image at a time can be created. To update a brand image, use the [Update a
        brand](/developer/api-reference/rest/admin/catalog/brands/update-brand) endpoint and an `image_url`.
      tags:
        - images
      parameters:
        - name: brand_id
          in: path
          description: |
            The ID of the brand to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images_createBrandImage_Response_200'
        '400':
          description: >-
            Bad Request. The requested resource could not be downloaded and may be invalid. Possible reasons include
            malformed request syntax or the file host blocking requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandImageRequestBadRequestError'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandImageRequestNotFoundError'
        '422':
          description: >-
            Image was not valid. This is the result of a missing `image_file` field, or of an incorrect file type. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBrandImageRequestUnprocessableEntityError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image_file:
                  type: string
                  format: binary
      security:
        - X-Auth-Token: []
    delete:
      operationId: images_deleteBrandImage
      summary: Delete Brand Image
      description: Deletes a brand image.
      tags:
        - images
      parameters:
        - name: brand_id
          in: path
          description: |
            The ID of the brand to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
