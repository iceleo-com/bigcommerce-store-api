openapi: 3.1.0
info:
  title: 'Admin Catalog: Product Modifiers'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/catalog/products/{product_id}/modifiers:
    get:
      operationId: productModifiers_getProductModifiers
      summary: List Product Modifiers
      description: Returns a list of all product modifiers. Optional parameters can be passed in.
      tags:
        - productModifiers
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
            maximum: 250
            default: 50
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_modifiers_getProductModifiers_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: productModifiers_createProductModifier
      summary: Create Product Modifier
      description: >-
        Creates a product modifier.


        **Notes**

        It takes two separate requests to create a new checkbox modifier with option values. Perform a request to create
        a modifier, then perform a second request to update option values.


        Date modifiers are required to be provided in [ISO-8601
        ATOM](https://www.php.net/manual/en/class.datetimeinterface.php#datetimeinterface.constants.atom) format.
        Excluding them in a request will throw a server error.


        **Setting an option value image**

        `adjusters.image_url` is read-only on this endpoint. To attach or replace the image shown on the storefront for
        an option value, upload it via [Create Product Modifier
        Image](/developer/api-reference/rest/admin/catalog/product-modifiers/images/create-product-modifier-image). The
        upload binds the image to the value automatically; no follow-up call is needed.
      tags:
        - productModifiers
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_modifiers_createProductModifier_Response_200'
        '409':
          description: >
            The `Modifier` was in conflict with another option. This is the result of duplicate unique fields, such as
            `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductModifierRequestConflictError'
        '422':
          description: >
            The `Modifier` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductModifierRequestUnprocessableEntityError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/productModifier_Post'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/modifiers/{modifier_id}:
    get:
      operationId: productModifiers_getProductModifier
      summary: Get Product Modifier
      description: Returns a single product modifier. Optional parameters can be passed in.
      tags:
        - productModifiers
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_modifiers_getProductModifier_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductModifierRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: productModifiers_updateProductModifier
      summary: Update Product Modifier
      description: >-
        Updates a product modifier.


        Date modifiers are required to be provided in [ISO-8601
        ATOM](https://www.php.net/manual/en/class.datetimeinterface.php#datetimeinterface.constants.atom) format.
        Excluding them in a request will throw a server error.


        **Setting an option value image**

        `adjusters.image_url` is read-only on this endpoint. To attach or replace the image shown on the storefront for
        an option value, upload it via [Create Product Modifier
        Image](/developer/api-reference/rest/admin/catalog/product-modifiers/images/create-product-modifier-image). The
        upload binds the image to the value automatically; no follow-up call is needed.
      tags:
        - productModifiers
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product_modifiers_updateProductModifier_Response_200'
        '409':
          description: >
            The `Modifier` was in conflict with another modifier or option. This is the result of duplicate unique
            fields, such as `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductModifierRequestConflictError'
        '422':
          description: >
            The `Modifier` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductModifierRequestUnprocessableEntityError'
      requestBody:
        description: Common Modifier properties.
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdModifiersModifierIdPutRequestBodyContentApplicationJsonSchemaType
                  description: >
                    BigCommerce API, which determines how it will display on the storefront. Acceptable values: `date`,
                    `checkbox`, `file`, `text`, `multi_line_text`, `numbers_only_text`, `radio_buttons`, `rectangles`,
                    `dropdown`, `product_list`, `product_list_with_images`, `swatch`. Required in a /POST.
                required:
                  type: boolean
                  description: |
                    Whether or not this modifier is required at checkout. Required in a /POST.
                sort_order:
                  type: integer
                  description: The order the modifiers display on the product detail page.
                config:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdModifiersModifierIdPutRequestBodyContentApplicationJsonSchemaConfig
                  description: >-
                    The values for option config can vary based on the Modifier created. See [Configs](#configs) to
                    learn more about the type-specific `config` fields.
                option_values:
                  type: array
                  items:
                    $ref: '#/components/schemas/productModifierOptionValue_Full'
                  description: >-
                    Contains information about the values for modifier types with options. Certain fields are not used
                    for specific modifier types. See [Option Values](#option-values) for more details.
                display_name:
                  type: string
                  description: |
                    The name of the option shown on the storefront.
      security:
        - X-Auth-Token: []
    delete:
      operationId: productModifiers_deleteProductModifier
      summary: Delete Product Modifier
      description: Deletes a product modifier.
      tags:
        - productModifiers
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/modifiers/{modifier_id}/values/{value_id}/image:
    post:
      operationId: images_createProductModifierImage
      summary: Create Product Modifier Image
      description: >-
        Creates a *Modifier Image*.


        The image will show on the storefront when the value is selected. Upload via multipart form post; this is the
        only accepted upload method.
      tags:
        - images
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: value_id
          in: path
          description: |
            The ID of the product modifier value.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images_createProductModifierImage_Response_200'
        '400':
          description: >-
            Bad Request. The requested resource could not be downloaded and may be invalid. Possible reasons include
            malformed request syntax or the file host blocking requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductModifierImageRequestBadRequestError'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductModifierImageRequestNotFoundError'
        '422':
          description: >
            Modifier image was not valid. This is the result of missing `image_file` fields, or of a non-URL value for
            the `image_file` field. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductModifierImageRequestUnprocessableEntityError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image_file:
                  type: string
                  format: binary
                  description: The image file to upload. Maximum 8 MB.
              required:
                - image_file
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/modifiers/{modifier_id}/values:
    get:
      operationId: values_getProductModifierValues
      summary: List Product Modifier Values
      description: Returns a list of all product *Modifier Values*. Optional parameters can be passed in.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
            maximum: 250
            default: 50
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_getProductModifierValues_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: values_createProductModifierValue
      summary: Create Product Modifier Value
      description: >-
        Creates a modifier value.


        **Read-Only Fields**

        * is_default


        **Setting an option value image**

        `adjusters.image_url` is read-only on this endpoint. To attach the image shown on the storefront for the value,
        upload it via [Create Product Modifier
        Image](/developer/api-reference/rest/admin/catalog/product-modifiers/images/create-product-modifier-image) after
        creating the value.


        > `is_default` is derived from the parent modifier configuration and cannot be set on individual values. To
        change which value is the default, use [Update Product
        Modifier](/developer/api-reference/rest/admin/catalog/product-modifiers/update-product-modifier) and include the
        full `option_values` array with the desired `is_default` flags.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_createProductModifierValue_Response_200'
        '422':
          description: >
            The `ModifierValue` was not valid. This is the result of missing required fields, or of invalid data. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductModifierValueRequestUnprocessableEntityError'
      requestBody:
        description: The model for a POST to create a modifier value on a product.
        content:
          application/json:
            schema:
              type: object
              properties:
                is_default:
                  type: boolean
                  description: >
                    The flag for preselecting a value as the default on the storefront. This field is not supported for
                    swatch options/modifiers. Read-only on this endpoint; use [Update Product
                    Modifier](/developer/api-reference/rest/admin/catalog/product-modifiers/update-product-modifier)
                    with the full `option_values` array to change the default.
                label:
                  type: string
                  description: |
                    The text display identifying the value on the storefront. Required in a /POST.
                sort_order:
                  type: integer
                  description: |
                    The order in which the value will be displayed on the product page. Required in a /POST.
                value_data:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdModifiersModifierIdValuesPostRequestBodyContentApplicationJsonSchemaValueData
                  description: >
                    Extra data describing the value, based on the type of option or modifier with which the value is
                    associated. The `swatch` type option can accept an array of `colors`, with up to three hexadecimal
                    color keys; or an `image_url`, which is a full image URL path including protocol. The `product list`
                    type option requires a `product_id`. The `checkbox` type option requires a boolean flag, called
                    `checked_value`, to determine which value is considered to be the checked state.
                adjusters:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdModifiersModifierIdValuesPostRequestBodyContentApplicationJsonSchemaAdjusters
              required:
                - label
                - sort_order
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/products/{product_id}/modifiers/{modifier_id}/values/{value_id}:
    get:
      operationId: values_getProductModifierValue
      summary: Get Product Modifier Value
      description: Returns a single modifier value. Optional parameters can be passed in.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: value_id
          in: path
          description: |
            The ID of the product modifier value.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_getProductModifierValue_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductModifierValueRequestNotFoundError'
      security:
        - X-Auth-Token: []
    put:
      operationId: values_updateProductModifierValue
      summary: Update Product Modifier Value
      description: >-
        Updates a modifier value.


        **Read-Only Fields**

        * is_default


        **Setting an option value image**

        `adjusters.image_url` is read-only on this endpoint. To replace the image shown on the storefront for the value,
        upload a new image via [Create Product Modifier
        Image](/developer/api-reference/rest/admin/catalog/product-modifiers/images/create-product-modifier-image). The
        upload binds the image to the value automatically; no follow-up call is needed.


        > `is_default` is derived from the parent modifier configuration and cannot be set on individual values. To
        change which value is the default, use [Update Product
        Modifier](/developer/api-reference/rest/admin/catalog/product-modifiers/update-product-modifier) and include the
        full `option_values` array with the desired `is_default` flags.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: modifier_id
          in: path
          description: |
            The ID of the product modifier.
          required: true
          schema:
            type: integer
        - name: value_id
          in: path
          description: |
            The ID of the product modifier value.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Values_updateProductModifierValue_Response_200'
        '422':
          description: >
            The `ModifierValue` was not valid. This is the result of missing required fields, or of invalid data. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProductModifierValueRequestUnprocessableEntityError'
      requestBody:
        description: The model for a PUT to update a modifier value on a product.
        content:
          application/json:
            schema:
              type: object
              properties:
                is_default:
                  type: boolean
                  description: >
                    The flag for preselecting a value as the default on the storefront. This field is not supported for
                    swatch options/modifiers. Read-only on this endpoint; use [Update Product
                    Modifier](/developer/api-reference/rest/admin/catalog/product-modifiers/update-product-modifier)
                    with the full `option_values` array to change the default.
                label:
                  type: string
                  description: |
                    The text display identifying the value on the storefront. Required in a /POST.
                sort_order:
                  type: integer
                  description: |
                    The order in which the value will be displayed on the product page. Required in a /POST.
                value_data:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdModifiersModifierIdValuesValueIdPutRequestBodyContentApplicationJsonSchemaValueData
                  description: >
                    Extra data describing the value, based on the type of option or modifier with which the value is
                    associated.  See [Option Values](#option-values) for more details.
                adjusters:
                  $ref: >-
                    #/components/schemas/CatalogProductsProductIdModifiersModifierIdValuesValueIdPutRequestBodyContentApplicationJsonSchemaAdjusters
                id:
                  type: integer
                  description: |
                    The unique numeric ID of the value; increments sequentially.
              required:
                - label
                - sort_order
      security:
        - X-Auth-Token: []
    delete:
      operationId: values_deleteProductModifierValue
      summary: Delete Product Modifier Value
      description: Deletes a modifier value.
      tags:
        - values
      parameters:
        - name: product_id
          in: path
          description: |
            The ID of the product to which the resource belongs.
          required: true
