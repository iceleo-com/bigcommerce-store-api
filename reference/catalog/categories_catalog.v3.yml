  /stores/{store_hash}/v3/catalog/categories/{category_id}/products/sort-order:
    get:
      operationId: sortOrder_getCategorySortOrders
      summary: Get Product Sort Order
      description: >-
        Returns a list of products and their sort order for a specific category.


        **Limits**


        - page=2&limit=250 will return page 2 of the results with 250 items per page.


        **Usage Notes**


        * Product sort order only takes effect on the storefront when sorting by **Featured Items** in the category. See
        [Sort Order](https://support.bigcommerce.com/s/article/Sort-Order) for more information.

        * Data pairs are displayed in ascending order based on products' `sort_order` values.

        * `null` values are allowed for products without specified `sort_order` values.

        * Products with `sort_order` value of `null` will be displayed after products with valid numerical values.

        * The priorities for determining product sort order on a storefront are the following:
            * Priority 1: Manually specified sort order on Category Level (API).
            * Priority 2: Manually specified sort order on Product (Global) Level (UI/API).
            * Priority 3: Default sorting by Product ID (newly added products go first) (UI/API).
            
      tags:
        - sortOrder
      parameters:
        - name: category_id
          in: path
          description: |
            The ID of the `Category` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of results.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sort_order_getCategorySortOrders_Response_200'
        '403':
          description: Forbidden
          content:
