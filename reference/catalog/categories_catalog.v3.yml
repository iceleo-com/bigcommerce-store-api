openapi: 3.1.0
info:
  title: 'Admin Catalog: Categories'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/catalog/categories:
    get:
      operationId: categories_getCategories
      summary: List Categories
      description: >-
        When possible, use the [Catalog Trees - Get all
        categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/get-all-categories) endpoint
        instead.


        Returns a list of *Categories*. Optional filter parameters can be passed in.


        **Note:**

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - categories
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: |
            Filter items by category ID.
          required: false
          schema:
            type: integer
        - name: id:in
          in: query
          description: Explicitly include objects by passing a comma-separated list of IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:not_in
          in: query
          description: Exclude objects by passing a comma-separated list of IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:min
          in: query
          description: Filter results to those whose ID is greater than or equal to this value.
          required: false
          schema:
            type: integer
        - name: id:max
          in: query
          description: Filter results to those whose ID is less than or equal to this value.
          required: false
          schema:
            type: integer
        - name: id:greater
          in: query
          description: Filter results to those whose ID is greater than this value.
          required: false
          schema:
            type: integer
        - name: id:less
          in: query
          description: Filter results to those whose ID is less than this value.
          required: false
          schema:
            type: integer
        - name: name
          in: query
          description: |
            Filter items by name.
          required: false
          schema:
            type: string
        - name: name:like
          in: query
          description: >-
            Filter items by substring in the name property. `name:like=stick` returns both `Stickers` and `Lipstick
            colors`.
          required: false
          schema:
            type: string
        - name: parent_id
          in: query
          description: Filter items by parent_id. If the category is a child or sub-category it can be filtered with the parent_id.
          required: false
          schema:
            type: integer
        - name: parent_id:in
          in: query
          description: Filter results to those whose parent ID is in this list.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: parent_id:min
          in: query
          description: Filter results to those whose parent ID is greater than or equal to this value.
          required: false
          schema:
            type: integer
        - name: parent_id:max
          in: query
          description: Filter results to those whose parent ID is less than or equal to this value.
          required: false
          schema:
            type: integer
        - name: parent_id:greater
          in: query
          description: Filter results to those whose parent ID is greater than this value.
          required: false
          schema:
            type: integer
        - name: parent_id:less
          in: query
          description: Filter results to those whose parent ID is less than this value.
          required: false
          schema:
            type: integer
        - name: page_title
          in: query
          description: |
            Filter items by page_title.
          required: false
          schema:
            type: string
        - name: page_title:like
          in: query
          description: >-
            Filter items by substring in the page title property. `page_title:like=oil` returns both `Soil and mulch`
            and `Oil pastels`.
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          description: Filter items by keywords found in the `name`, `description`, or `sku` fields, or in the brand name.
          required: false
          schema:
            type: string
        - name: is_visible
          in: query
          description: Filter items based on whether the product is currently visible on the storefront.
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          description: |-
            Controls the sort order of the response, for example, `sort=name`.

            Allowed values: 
            - `name`: sort categories in alphabetical order by category name.
            - `id`: sort in ascending order by category ID.
            - `parent_id`: sort in ascending order by the ID of the parent category.
            - `sort_order`: sort in ascending order by sort order value.
          required: false
          schema:
            $ref: '#/components/schemas/CatalogCategoriesGetParametersSort'
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of results.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of results.
          required: false
          schema:
            type: integer
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_getCategories_Response_200'
      deprecated: true
      security:
        - X-Auth-Token: []
    post:
      operationId: categories_createCategory
      summary: Create Category
      description: "When possible, use the [Category Trees - Create categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/create-categories) endpoint instead.\n\nCreates a *Category*.\n\nUse this endpoint when an API only works with categories of a default BigCommerce storefront (`channel_id=1`). \n\nUse the [Create categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/create-categories) endpoint when an API works with categories across different category trees that belong to different storefront channels.\n\n**Required Fields**:\n- `parent_id`: \n\t- To create a child category, set the `parent_id` to the parent category.\n\t- To create a top level category, set the `parent_id` to `0`.\n- `name`\n\n**Read-Only Fields**:\n- `id`\n\n**Limits**:\n- 16,000 categories per store limit.\n- 1,000 categories per product limit.\n- 50 characters category name length.\n- 8 levels of child categories depth limit.\n- 65,535 characters category description length limit."
      tags:
        - categories
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_createCategory_Response_200'
        '409':
          description: >
            The `Category` was in conflict with another category. This is the result of duplicate unique values, such as
            `name` or `custom_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCategoryRequestConflictError'
        '422':
          description: >
            The `Category` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCategoryRequestUnprocessableEntityError'
      deprecated: true
      requestBody:
        description: Common Category object properties.
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: >-
                    The unique numeric ID of the categoryʼs parent. This field controls where the category sits in the
                    tree of categories that organize the catalog.

                    Required in a POST if creating a child category.
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: >-
                    The name displayed for the category. The name must be unique with respect to the category of
                    siblings on the same level (you can duplicate the name for other siblings on another level).
                    Required in a POST.
                description:
                  type: string
                  description: |
                    The category description, which can include HTML formatting.
                views:
                  type: integer
                  description: |
                    Number of views the category has on the storefront.
                sort_order:
                  type: integer
                  minimum: -2147483648
                  maximum: 2147483647
                  description: >
                    Priority this category will be given when included in the menu and category pages. The lower the
                    number, the closer to the top of the results the category will be.
                page_title:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: >
                    Custom title for the category page. If not defined, the category name will be used as the meta
                    title.
                search_keywords:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: |
                    A comma-separated list of keywords that can be used to locate the category when searching the store.
                meta_keywords:
                  type: array
                  items:
                    type: string
                  description: >
                    Custom meta keywords for the category page. If not defined, the storeʼs default keywords will be
                    used. Must post as an array like: ["awesome","sauce"].
                meta_description:
                  type: string
                  minLength: 0
                  maxLength: 65535
                  description: >
                    Custom meta description for the category page. If not defined, the storeʼs default meta description
                    will be used.
                layout_file:
                  type: string
                  minLength: 0
                  maxLength: 50
                  description: >
                    A valid layout file. Please refer to [the article on creating category files (Help
                    Center)](https://support.bigcommerce.com/articles/Public/Creating-Custom-Template-Files/). This
                    field is writable only for stores with a Blueprint theme applied. For stores with a Stencil theme
                    applied, see [Custom Template
                    Associations](/developer/api-reference/rest/admin/content/custom-template-associations).
                is_visible:
                  type: boolean
                  description: >
                    Flag to determine whether the category should be displayed to customers browsing the store. If
                    `true`, the category will be displayed. If `false`, the category will be hidden from view.
                default_product_sort:
                  $ref: '#/components/schemas/CatalogCategoriesPostRequestBodyContentApplicationJsonSchemaDefaultProductSort'
                  description: |
                    Determines how the products are sorted on category page load.
                image_url:
                  type: string
                  description: >
                    Image URL used for this category on the storefront. Images can be uploaded using form file post to
                    `/categories/{categoryId}/image`, or by providing a publicly accessible URL in this field. An image
                    extension like .jpg or .png is required.
                custom_url:
                  $ref: '#/components/schemas/CatalogCategoriesPostRequestBodyContentApplicationJsonSchemaCustomUrl'
                  description: >-
                    The custom URL for the category on the storefront. If not provided, the URL will be autogenerated
                    from the category name.
              required:
                - parent_id
                - name
      security:
        - X-Auth-Token: []
    delete:
      operationId: categories_deleteCategories
      summary: Delete Categories
      description: >-
        When possible, use the [Category Trees - Delete
        categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/delete-tree-categories)
        endpoint instead.


        Deletes *Category* objects. At least one filter parameter is required to perform the `DELETE` operation.


        **Usage Notes**


        - Sending a `DELETE`request without specifying a filter parameter will result in a `422` error. 

        - Sending a `DELETE` request for a category that contains products will result in a `422` error. Move products
        to a new category by sending a `PUT` request to the `/catalog/products/{product_id}` endpoint before deleting a
        category.
      tags:
        - categories
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: |
            Filter items by category ID.
          required: false
          schema:
            type: integer
        - name: id:in
          in: query
          description: Explicitly include objects by passing a comma-separated list of IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:not_in
          in: query
          description: Exclude objects by passing a comma-separated list of IDs.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:min
          in: query
          description: Filter results to those whose ID is greater than or equal to this value.
          required: false
          schema:
            type: integer
        - name: id:max
          in: query
          description: Filter results to those whose ID is less than or equal to this value.
          required: false
          schema:
            type: integer
        - name: id:greater
          in: query
          description: Filter results to those whose ID is greater than this value.
          required: false
          schema:
            type: integer
        - name: id:less
          in: query
          description: Filter results to those whose ID is less than this value.
          required: false
          schema:
            type: integer
        - name: name
          in: query
          description: |
            Filter items by name.
          required: false
          schema:
            type: string
        - name: parent_id
          in: query
          description: Filter items by parent_id. If the category is a child or sub-category it can be filtered with the parent_id.
          required: false
          schema:
            type: integer
        - name: page_title
          in: query
          description: |
            Filter items by page_title.
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          description: Filter items by keywords found in the `name`, `description`, or `sku` fields, or in the brand name.
          required: false
          schema:
            type: string
        - name: is_visible
          in: query
          description: Filter items based on whether the product is currently visible on the storefront.
          required: false
          schema:
            type: boolean
        - name: name:like
          in: query
          description: >-
            Filter items by substring in the name property. `name:like=stick` returns both `Stickers` and `Lipstick
            colors`.
          required: false
          schema:
            type: string
        - name: parent_id:in
          in: query
          description: Filter results to those whose parent ID is in this list.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: parent_id:min
          in: query
          description: Filter results to those whose parent ID is greater than or equal to this value.
          required: false
          schema:
            type: integer
        - name: parent_id:max
          in: query
          description: Filter results to those whose parent ID is less than or equal to this value.
          required: false
          schema:
            type: integer
        - name: parent_id:greater
          in: query
          description: Filter results to those whose parent ID is greater than this value.
          required: false
          schema:
            type: integer
        - name: parent_id:less
          in: query
          description: Filter results to those whose parent ID is less than this value.
          required: false
          schema:
            type: integer
        - name: page_title:like
          in: query
          description: >-
            Filter items by substring in the page title property. `page_title:like=oil` returns both `Soil and mulch`
            and `Oil pastels`.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      deprecated: true
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/categories/{category_id}:
    get:
      operationId: categories_getCategory
      summary: Get Category
      description: >-
        When possible, use the [Catalog Trees - Get all
        categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/get-all-categories) endpoint
        instead. You can provide a category identifier using query parameters to retrieve a single category.


        Returns a single *Category*. Optional parameters can be passed in.


        **Note:**

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - categories
      parameters:
        - name: category_id
          in: path
          description: |
            The ID of the `Category` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: exclude_fields
          in: query
          description: >-
            Fields to exclude, in a comma-separated list. The specified fields will be excluded from a response. The ID
            cannot be excluded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_getCategory_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCategoryRequestNotFoundError'
      deprecated: true
      security:
        - X-Auth-Token: []
    put:
      operationId: categories_updateCategory
      summary: Update Category
      description: >-
        When possible, use the [Catalog Trees - Update
        categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/update-categories) endpoint
        instead.


        Updates a *Category*.


        **Required Fields**

        * none


        **Read-Only Fields**

        - id


        **Note:** 

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - categories
      parameters:
        - name: category_id
          in: path
          description: |
            The ID of the `Category` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categories_updateCategory_Response_200'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCategoryRequestNotFoundError'
        '409':
          description: >-
            The `Category` was in conflict with another category. This is the result of duplicate unique values, such as
            `name` or `custom_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCategoryRequestConflictError'
        '422':
          description: >-
            The `Category` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCategoryRequestUnprocessableEntityError'
      deprecated: true
      requestBody:
        description: Common Category object properties.
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: |-
                    Unique ID of the *Category*. Increments sequentially.
                    Read-Only.
                parent_id:
                  type: integer
                  description: >-
                    The unique numeric ID of the categoryʼs parent. This field controls where the category sits in the
                    tree of categories that organize the catalog.

                    Required in a POST if creating a child category.
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: >-
                    The name displayed for the category. The name must be unique with respect to the category of
                    siblings on the same level (you can duplicate the name for other siblings on another level).
                    Required in a POST.
                description:
                  type: string
                  description: |
                    The product description, which can include HTML formatting.
                views:
                  type: integer
                  description: |
                    Number of views the category has on the storefront.
                sort_order:
                  type: integer
                  minimum: -2147483648
                  maximum: 2147483647
                  description: >
                    Priority this category will be given when included in the menu and category pages. The lower the
                    number, the closer to the top of the results the category will be.
                page_title:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: >
                    Custom title for the category page. If not defined, the category name will be used as the meta
                    title.
                search_keywords:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: |
                    A comma-separated list of keywords that can be used to locate the category when searching the store.
                meta_keywords:
                  type: array
                  items:
                    type: string
                  description: >
                    Custom meta keywords for the category page. If not defined, the storeʼs default keywords will be
                    used. Must post as an array like: ["awesome","sauce"].
                meta_description:
                  type: string
                  minLength: 0
                  maxLength: 65535
                  description: >
                    Custom meta description for the category page. If not defined, the storeʼs default meta description
                    will be used.
                layout_file:
                  type: string
                  minLength: 0
                  maxLength: 500
                  description: >
                    A valid layout file. Please refer to [the article on creating category files (Help
                    Center)](https://support.bigcommerce.com/articles/Public/Creating-Custom-Template-Files/). This
                    field is writable only for stores with a Blueprint theme applied. For stores with a Stencil theme
                    applied, see [Custom Template
                    Associations](/developer/api-reference/rest/admin/content/custom-template-associations).
                is_visible:
                  type: boolean
                  description: >
                    Flag to determine whether the product should be displayed to customers browsing the store. If
                    `true`, the category will be displayed. If `false`, the category will be hidden from view.
                default_product_sort:
                  $ref: >-
                    #/components/schemas/CatalogCategoriesCategoryIdPutRequestBodyContentApplicationJsonSchemaDefaultProductSort
                  description: |
                    Determines how the products are sorted on category page load.
                image_url:
                  type: string
                  description: >
                    Image URL used for this category on the storefront. Images can be uploaded using form file post to
                    `/categories/{categoryId}/image`, or by providing a publicly accessible URL in this field. An image
                    extension like .jpg or .png is required.
                custom_url:
                  $ref: '#/components/schemas/CatalogCategoriesCategoryIdPutRequestBodyContentApplicationJsonSchemaCustomUrl'
                  description: The custom URL for the category on the storefront.
              required:
                - parent_id
                - name
      security:
        - X-Auth-Token: []
    delete:
      operationId: categories_deleteCategory
      summary: Delete Category
      description: >-
        When possible, use the [Category Trees - Delete
        categories](/developer/api-reference/rest/admin/catalog/category-trees/categories/delete-tree-categories)
        endpoint instead. You can provide a category identifier using query parameters to delete a single category.


        Deletes a *Category*.


        **Note:**

        The default rate limit for this endpoint is 40 concurrent requests.
      tags:
        - categories
      parameters:
        - name: category_id
          in: path
          description: |
            The ID of the `Category` to which the resource belongs.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      deprecated: true
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/catalog/categories/metafields:
    get:
      operationId: batchMetafields_getCategoriesMetafields
      summary: List Category Metafields
      description: Get all category metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of results.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of results.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla `key` query parameter.
