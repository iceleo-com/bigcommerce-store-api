              schema:
                $ref: '#/components/schemas/Attributes_createCustomersAttributes_Response_200'
        '422':
          description: >
            The `Attribute` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/attribute_Post'
      security:
        - X-Auth-Token: []
    put:
      operationId: attributes_updateCustomersAttributes
      summary: Update Customer Attribute
      description: >-
        Updates a Customer Attribute. Multiple customer attributes can be updated in one call.


        **Required Fields**

        * id -- ID of the *Customer Attribute*


        Once the data type is set, it can not be changed. The attribute will need to be deleted then created again with
        the new data type. This will also delete it from the customer.


        **Limits**

        * Limit of 3 concurrent requests.
      tags:
        - attributes
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of customer attributes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attributes_updateCustomersAttributes_Response_200'
        '422':
          description: >
            The `Attribute` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
