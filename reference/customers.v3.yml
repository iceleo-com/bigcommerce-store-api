          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The customer's form field values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form_Field_Values_updateCustomerFormFieldValues_Response_200'
        '422':
          description: >-
            The form field value was not valid. This is the result of missing required fields, or of invalid data. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/formFieldValue_Full'
      security:
        - X-Auth-Token: []
