  /stores/{store_hash}/v3/customers/form-field-values:
    get:
      operationId: formFieldValues_getCustomersFormFieldValues
      summary: List Customer Form Field Values
      description: >-
        Returns a list of form field values for the Customer or Customer Address object.


        To learn about adding and managing form fields, see [Adding and Editing Fields in the Account Signup
        Form](https://support.bigcommerce.com/s/article/Editing-Form-Fields).
      tags:
        - formFieldValues
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: >-
            Page number (`page` will be ignored if you provide `before` or `after` in the request). For example
            `page=1`.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Items count per page. `limit=50`
          required: false
          schema:
            type: number
            format: double
        - name: customer_id
          in: query
          description: Filter by the customer ID.
          required: false
          schema:
            type: integer
        - name: address_id
          in: query
          description: Filter by the ID of the customer address.
          required: false
          schema:
            type: integer
        - name: field_name
          in: query
          description: Filter by the field name.
          required: false
          schema:
            type: string
        - name: field_type
          in: query
          description: |-
            Filter by the field type.
             * `checkboxes` - checkboxes field
             * `date` - date field
             * `multiline` - multiline text field
             * `numbers` - numbers only field
             * `password` - password field
             * `radiobuttons` - radio buttons field
             * `text` - text field
             * `picklist` - pick list field
          required: false
          schema:
            $ref: '#/components/schemas/CustomersFormFieldValuesGetParametersFieldType'
        - name: after
          in: query
          description: >-
            The cursor reference of the last entry for the previous page. Use the `end_cursor` value from the last
            response to get the next page (`end_cursor` is only returned on the first page or when the request contains
            query parameter `before` or `after`). For example `after=eyJzZXNzaW9uSWQiOjM4LCJmaWVsZElkIjo0MH0`. 
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: >-
            The cursor reference of the first entry for the next page. Use the `start_cursor` value from the last
            response to get the previous page (`start_cursor` is only returned on the first page or when the request
            contains query parameter `before` or `after`). For example `before=eyJzZXNzaW9uSWQiOjgsImZpZWxkSWQiOjMxfQ`.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of form field values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form_Field_Values_getCustomersFormFieldValues_Response_200'
        '422':
          description: >-
            The form field value was not valid. This is the result of missing required fields, or of invalid data. See
            the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
    put:
      operationId: formFieldValues_updateCustomerFormFieldValues
      summary: Upsert Customer Form Field Values
      description: >-
        This endpoint is deprecated. Use [Update a Customer
        Address](/developer/api-reference/rest/admin/management/customers/v3/addresses/update-customers-addresses) and
        [Update Customers](/developer/api-reference/rest/admin/management/customers/v3/update-customers) endpoints
        instead.


        To learn more about editing form fields, see [Adding and Editing Fields in the Account Signup
        Form](https://support.bigcommerce.com/s/article/Editing-Form-Fields).


        **Limits**

        * Limit of 10 concurrent requests.
      tags:
        - formFieldValues
      parameters:
