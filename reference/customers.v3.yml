              schema:
                $ref: '#/components/schemas/MetaFieldCollectionPostPutResponses'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomerMetafieldRequestBadRequestError'
        '404':
          description: |
            Not found (A metafield was not found with this query).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                permission_set:
                  $ref: >-
                    #/components/schemas/CustomersCustomerIdMetafieldsMetafieldIdPutRequestBodyContentApplicationJsonSchemaPermissionSet
                  description: >
                    Determines the visibility and writeability of the field by other API consumers.


                    | Value | Description |

                    | :--- | :--- |

                    | `app_only` | Private to the app that owns the field. |

                    | `read` | Visible to other API consumers. |

                    | `write` | Open for reading and writing by other API consumers. |

                    | `read_and_sf_access` | Visible to other API consumers, including on the storefront. |

                    | `write_and_sf_access` | Open for reading and writing by other API consumers, including on the
                    storefront. |
                namespace:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: |
                    Namespace for the metafield, for organizational purposes.
                key:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: |
                    The name of the field, for example: `location_id`, `color`.
                value:
                  type: string
                  minLength: 1
                  maxLength: 65535
                  description: |
                    The value of the field, for example: `1`, `blue`.
                description:
                  type: string
                  minLength: 0
                  maxLength: 255
                  description: |
                    Description for the metafields.
                id:
                  type: integer
                  description: |
                    The ID of metafield to update.
              required:
                - id
      security:
        - X-Auth-Token: []
    delete:
      operationId: metafields_deleteCustomerMetafieldsId
      summary: Delete Customer Metafield
      description: >
        Deletes a customer metafield. To delete a customer metafield, use 'customerId' and 'metafieldId' in the query
        parameters.
      tags:
        - metafields
      parameters:
        - name: customerId
          in: path
          description: The ID of the customer.
          required: true
          schema:
            type: integer
        - name: metafieldId
          in: path
          description: >-
            The ID of the metafield belonging to the customer. The metafieldId is a generated response when sending a
            POST query to the Create a Customer Metafields endpoint.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: |
            Response object for customer metafields deletion with success.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: |
            Not found (A metafield was not found with this query).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/customers/metafields:
    get:
      operationId: metafieldsBatch_getAllCustomersMetafields
      summary: List Customer Metafields
      description: Get all customer metafields.
      tags:
        - metafieldsBatch
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla 'key' query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespaces.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: >-
            Filter based on comma-separated metafieldʼs namespaces. Could be used with vanilla `namespace` query
            parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/CustomersMetafieldsGetParametersDirection'
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CustomersMetafieldsGetParametersIncludeFieldsSchemaItems'
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum date modified. For example, `date_modified:min=`2024-05-14T09:34:00` or
            `date_modified:min=2019-09-04`. Returns metafields modified after this date.
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum date modified. For example, `date_modified:max=2019-09-04T00:00:00` or
            `date_modified:max=2019-09-04`. Returns metafields modified before this date.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >-
            Filter items by minimum date created. For example, `date_created:min=2019-09-04T00:00:00` or
            `date_created:min=2019-09-04`. Returns metafields created after this date.
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum date created. For example, `date_created:max=`2024-05-14T09:34:00` or
            `date_created:max=2019-09-04`. Returns metafields created before this date.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: metafieldsBatch_createCustomersMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - metafieldsBatch
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response payload for the BigCommerce API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionPostPutResponses'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomersMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CustomersMetafieldsPostRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    put:
      operationId: metafieldsBatch_updateCustomersMetafields
      summary: Update Multiple Metafields
      description: Create multiple metafields.
      tags:
        - metafieldsBatch
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response payload for the BigCommerce API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionPostPutResponses'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomersMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CustomersMetafieldsPutRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    delete:
      operationId: metafieldsBatch_deleteCustomersMetafields
      summary: Delete Multiple Metafields
      description: Delete all customer metafields.
      tags:
        - metafieldsBatch
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCustomersMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE'
      requestBody:
        description: List of metafield IDs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/customers/{customerId}/stored-instruments:
    get:
      operationId: storedInstruments_getCustomerStoredInstruments
      summary: List Stored Instruments
      description: >-
        Lists all available stored instruments for a customer. This list will include all types of stored instruments
        namely card, account and bank_account instruments
      tags:
        - storedInstruments
      parameters:
        - name: customerId
          in: path
          description: The ID of the customer.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/CustomersCustomerIdStoredInstrumentsGetResponsesContentApplicationJsonSchemaItems
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing scope - the v3 Auth token is valid but does not have proper permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/customers/validate-credentials:
    post:
      operationId: validateCredentials_validateCustomerCredentials
      summary: Validate Customer Credentials
      description: Validate a customer credentials - This endpoint has special rate limiting protections to protect against abuse.
      tags:
        - validateCredentials
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns if the customer credentials provided are valid or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCustomerCredentialsResponseObject'
        '422':
          description: This is the result of missing required fields. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Allowed number of requests exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCustomerCredentialsObject'
      security:
        - X-Auth-Token: []
tags:
  - name: customers
    description: Create, read, update, and delete customer records.
  - name: addresses
    description: Manage the addresses saved to a customer.
  - name: attributeValues
    description: Set the attribute values assigned to individual customers.
  - name: attributes
    description: Define the custom attributes that store additional customer data.
  - name: channelSettings
    description: Manage per-channel customer settings.
  - name: consent
    description: Retrieve and update a customer's consent to data processing and marketing.
  - name: formFieldValues
    description: Set the form field values saved to individual customers.
  - name: globalSettings
    description: Manage store-wide customer settings.
  - name: metafields
    description: Attach custom metafield data to individual customers.
  - name: metafieldsBatch
    description: Create, update, and delete customer metafields in bulk.
  - name: storedInstruments
    description: Retrieve the payment instruments saved to a customer.
  - name: validateCredentials
    description: Validate a customer's login credentials.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
