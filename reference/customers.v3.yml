openapi: 3.1.0
info:
  title: 'Admin Management: Customers V3'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/customers:
    get:
      operationId: customers_getCustomers
      summary: List Customers
      description: |-
        Returns a list of Customers. Optional filter parameters can be passed in.

        **Notes**

        Attribute names are not available on the customer object.
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: >-
            Page number (`page` will be ignored if you provide `before` or `after` in the request). For example
            `page=1`.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Items count per page. `limit=50`
          required: false
          schema:
            type: number
            format: double
        - name: id:in
          in: query
          description: |-
            Filter items by ID.
            `id:in=4,5,6`
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: company:in
          in: query
          description: Filter items by company. `company:in=bigcommerce,commongood`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: customer_group_id:in
          in: query
          description: Filter items by customer_group_id. `customer_group_id:in=5,6`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: date_created
          in: query
          description: Filter items by date created, for example, `2024-05-14T09:34:00` or `2024-05-14`.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum date created, for example, `2024-05-14T09:34:00` or `2024-05-14`. Returns customers
            created before this date.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >-
            Filter items by date created for example, `2024-05-14T09:34:00` or `2024-05-14`. Returns customers created
            after this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified
          in: query
          description: Filter items by date modified, for example, `2024-05-14T09:34:00` or `2024-05-14`.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum date modified, for example, `2024-05-14T09:34:00` or `2024-05-14`. Returns customers
            modified after this date.
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum date modified, for example, `2024-05-14T09:34:00` or `2024-05-14`. Returns customers
            modified before this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: email:in
          in: query
          description: Filter items by email. `email:in=janedoe@example.com`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: name:in
          in: query
          description: Filter items by first_name and last_name. `name=james moriarty`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: name:like
          in: query
          description: |-
            Filter items by substring in first_name and last_name.
            `name:like=moriarty,sherlock`
            Concatenates the first_name and last_name fields.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: phone:in
          in: query
          description: Filter items by phone number. `phone:in=555-55-5555`
          required: false
          schema:
            type: string
        - name: registration_ip_address:in
          in: query
          description: >-
            Filter items by registration_ip_address. If the customer was created using the API, then registration
            address is blank.

            `registration_ip_address:in=12.345.6.789`
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: include
          in: query
          description: |-
            Indicates whether to include customer sub-resources:
             * `addresses` - customer addresses
             * `storecredit` - store credit
             * `attributes` - customer attributes and address attributes
             * `formfields` - customer and address form fields
             * `shopper_profile_id` - the ID of the shopper profile associated with the customer (Beta)
             * `segment_ids`- segments the customer belongs to (Beta)

             `include=addresses,storecredit,attributes,formfields,shopper_profile_id,segment_ids`
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CustomersGetParametersIncludeSchemaItems'
        - name: sort
          in: query
          description: >-
            Sort items by date_created, date_modified, or last_name:* `date_created:asc` - date created, ascending*
            `date_created:desc` - date created, descending* `last_name:asc` - last name, ascending* `last_name:desc` -
            last name, descending * `date_modified:asc` - date modified, ascending* `date_modified:desc`- date modified,
            descending  Example: `sort=last_name:asc`
          required: false
          schema:
            $ref: '#/components/schemas/CustomersGetParametersSort'
        - name: after
          in: query
          description: >-
            The cursor reference of the last entry for the previous page. Use the `end_cursor` value from the last
            response to get the next page (`end_cursor` is only returned on the first page or when the request contains
            query parameter `before` or `after`). For example `after=eyJpZCI6MjA0fQ`. 
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: >-
            The cursor reference of the first entry for the next page. Use the `start_cursor` value from the last
            response to get the previous page (`start_cursor` is only returned on the first page or when the request
            contains query parameter `before` or `after`). For example `before=eyJpZCI6MjA1fQ`.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Get Customer Collection Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers_getCustomers_Response_200'
        '422':
          description: >
            The optional filter parameter was not valid. This is the result of missing required fields, or of invalid
            data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - X-Auth-Token: []
    post:
      operationId: customers_createCustomers
      summary: Create Customers
      description: >-
        Creates Customers. Create up to 10 customers in one call.


        **Required Fields**

        * last_name

        * first_name

        * email


        **Required Fields Customer Address**

        * first_name

        * city

        * country_code

        * last_name

        * address1


        **Required Fields Attributes**

        * Attributes must be
        [created](/developer/api-reference/rest/admin/management/customers/v3/attributes/create-customers-attributes)
        **BEFORE** creating a customer.

        * attribute_id

        * attribute_value -- This is input as a string, regardless of the
        [Type](/developer/api-reference/rest/admin/management/customers/v3/attributes/create-customers-attributes).


        **Notes**


        A customer can be created with global access or channel-specific access.

        * **Global access:**
          * Make sure the channel has `allow_global_logins` enabled. This is on by default only for the default storefront. Find more info at [Customer Settings > Channel](/developer/api-reference/rest/admin/management/customers/v3/channel-settings).
          * Omit `channel_ids` field, or provide `channel_ids: null`.
        * **Channel-specific access:**
          * Provide a `channel_ids` array containing the channels accessible by the customer. This array cannot be empty.
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer Collection Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers_createCustomers_Response_200'
        '413':
          description: The request payload is too large. The maximum number of items allowed in the array is 10.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: >-
            The *Customer* was not valid. This is the result of missing required fields or trying to edit a read only
            field. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/customer_Post'
      security:
        - X-Auth-Token: []
    put:
      operationId: customers_updateCustomers
      summary: Update Customers
      description: >-
        Updates Customers. Subresource updates are not supported. 


        **Required Fields**

        * id -- ID of the *Customer* This must be included in the request body


        **Read Only Fields**

        * id

        * registration_ip_address

        * date_created

        * date_modified

        * origin_channel_id


        **Limits**

        * Limit of 10 customers per call.

        * Limit of 3 concurrent requests


        **Notes**


        * Attributes Values can not be updated using Update a Customer. Use the [Update customer attribute
        values](/developer/api-reference/rest/admin/management/customers/v3/attribute-values/upsert-customers-attribute-values)
        endpoint.

        * channel_ids -- Updating the list of channels a customer can access may create some side effects in a
        multi-storefront situation. This list determines which customer account we will use to authenticate a shopper
        given a channel.

        * origin_channel_id -- This is an immutable value set as a reference to the channel of origin when a customer is
        created.
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer Collection Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers_updateCustomers_Response_200'
        '413':
          description: The request payload is too large. The maximum number of items allowed in the array is 10.
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: >
            The `Customer` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/customer_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: customers_deleteCustomers
      summary: Delete Customers
      description: |-
        Deletes Customers.

        **Required Query**
        * id:in -- ID of the customer

        **Notes**

        A query is required to delete customers. If not provided, a 204 is returned, with no changes to the data.
      tags:
        - customers
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |-
            Filter items by ID.
            `id:in=4,5,6`
          required: true
          schema:
            type: array
            items:
              type: integer
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: >-
            The `id:in` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/customers/addresses:
    get:
      operationId: addresses_getCustomersAddresses
      summary: List Customer Addresses
      description: Returns a list of Customer Addresses. Optional filter parameters can be passed in.
      tags:
        - addresses
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number. `page=1`
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Items count per page. `limit=50`
          required: false
          schema:
            type: number
            format: double
        - name: company:in
          in: query
          description: Filter items by company. `company:in=bigcommerce,commongood`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: name:in
          in: query
          description: Filter items by first_name and last_name. `name:in=James+Moriarty`
          required: false
          schema:
            type: array
            items:
              type: string
        - name: customer_id:in
          in: query
          description: >-
            Filter by the ID of the customer. Also accepts comma-separated IDs to filter for multiple customers.
            `customer_id:in=23,24,55`
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: include
          in: query
          description: |-
            Indicates whether to include customer address sub-resources:
            * `formfields` - address form fields
            `include=formfields`
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CustomersAddressesGetParametersIncludeSchemaItems'
        - name: id:in
          in: query
          description: |-
            Filter items by ID.
            `id:in=4,5,6`
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of customer addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addresses_getCustomersAddresses_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: addresses_createCustomersAddresses
      summary: Create Customer Address
      description: >-
        Creates a Customer Address. Multiple customer addresses can be created in one call.


        **Required Fields**

        * **customer_id**

        * **first_name**

        * **last_name**

        * **city**

        * **country_code**

        * **address1**

        * **state_or_province**

        * **postal_code**


        **Notes**

        * A unique customer address is a combination of the following core address fields:
          * **customer_id**
          * **first_name**
          * **last_name**
          * **company**
          * **phone**
          * **address_type**
          * **address1**
          * **address2**
          * **city**
          * **country_code**
          * **state_or_province**
          * **postal_code**
        * An attempt to create an address that already exists will result in no change to the address or custom form
        field values, an HTTP 200 return code, and the address will be absent from the response body.

        * The default rate limit for this endpoint is 10 concurrent requests.
      tags:
        - addresses
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The created or updated customer addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addresses_createCustomersAddresses_Response_200'
        '422':
          description: >
            The `Address` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/address_Post'
      security:
        - X-Auth-Token: []
    put:
      operationId: addresses_updateCustomersAddresses
      summary: Update Customer Address
      description: >-
        Updates a Customer Address. Multiple customer addresses can be updated in one call.


        **Required Fields**

        * **id** -- ID of the *Customer Address*


        **Limits**

        * Limit of **3** concurrent requests.


        **Notes**

        * A unique customer address is a combination of the following core address fields:
          * **first_name**
          * **last_name**
          * **company**
          * **phone**
          * **address_type**
          * **address1**
          * **address2**
          * **city**
          * **country_code**
          * **state_or_province**
          * **postal_code**
        * An attempt to update an address such that it becomes identical to another address that already exists will
        result in no change to the target address or custom form field values. The response will have an HTTP 200 return
        code, and the address will be absent from the response body.
      tags:
        - addresses
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The created or updated customer addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addresses_updateCustomersAddresses_Response_200'
        '422':
          description: >
            The `Address` was not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/address_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: addresses_deleteCustomersAddresses
      summary: Delete Customer Address
      description: |-
        Deletes a Customer Address.

        **Required Query**
        * id:in -- ID of the *Customer Address*
      tags:
        - addresses
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |-
            Filter items by ID.
            `id:in=4,5,6`
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/customers/attribute-values:
    get:
      operationId: attributeValues_getCustomersAttributeValues
      summary: List Customer Attribute Values
      description: Returns a list of Customer Attribute Values. Optional filter parameters can be passed in.
      tags:
        - attributeValues
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number. `page=1`
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Items count per page. `limit=50`
          required: false
          schema:
            type: number
            format: double
        - name: customer_id:in
          in: query
          description: Filter items by the customer ID. `customer_id:in=23,24,55`
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: attribute_id:in
          in: query
          description: Filter items by the attribute ID. `attribute_id:in=1,2`
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: name
          in: query
          description: Filter items by the attribute name. `name=age`
          required: false
          schema:
            type: string
        - name: date_created
          in: query
          description: Filter items by `date_created`, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or `2024-05-14`.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum `date_created`, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or
            `2024-05-14`. ISO 8601 full-date is required, ISO 8601 full-time is not required. UNIX timestamp also
            accepted. Returns metafields created before this date.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >-
            Filter items by minimum `date_created`, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or
            `2024-05-14`. ISO 8601 full-date is required, ISO 8601 full-time is not required. UNIX timestamp also
            accepted. Returns metafields created after this date
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified
          in: query
          description: Filter items by `date_modified`, for example, `2024-05-14T09:34:00` or `2024-05-14`.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum `date_modified`, for example, `2024-05-14T09:34:00` or `2024-05-14`. ISO 8601
            full-date is required, ISO 8601 full-time is not required. UNIX timestamp also accepted. Returns metafields
            modified before this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum `date_modified`, for example, `2024-05-14T09:34:00` or `2024-05-14`. ISO 8601
            full-date is required, ISO 8601 full-time is not required. UNIX timestamp also accepted. Returns metafields
            modified after this date.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of customer attribute values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attribute_Values_getCustomersAttributeValues_Response_200'
      security:
        - X-Auth-Token: []
    put:
      operationId: attributeValues_upsertCustomersAttributeValues
      summary: Upsert Customer Attribute Values
      description: >-
        Upserts Customer Attribute Values. Updates the attribute values on the Customer. Multiple customer attribute
        values can be updated in one call.


        Upsert checks for an existing record. If there is none, it creates the record, if there is a matching record, it
        updates that record.


        **Limits**

        * Limit of 10 customers per call.

        * Limit of 3 concurrent requests.
      tags:
        - attributeValues
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of customer attribute values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attribute_Values_upsertCustomersAttributeValues_Response_200'
        '422':
          description: >
            The `CustomerAttributeValue` was not valid. This is the result of missing required fields, or of invalid
            data. See the response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/attributeValue_Base'
      security:
        - X-Auth-Token: []
    delete:
      operationId: attributeValues_deleteCustomersAttributeValues
      summary: Delete Customer Attribute Values
      description: |-
        Deletes Customer Attribute Values. Deletes the attribute value from the customer.

        **Required Query**
        * id:in - ID of the *Customer Attribute Value*
      tags:
        - attributeValues
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: |-
            Filter items by ID.
            `id:in=4,5,6`
          required: true
