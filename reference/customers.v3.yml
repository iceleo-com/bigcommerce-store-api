  /stores/{store_hash}/v3/customers/attributes:
    get:
      operationId: attributes_getCustomersAttributes
      summary: List Customer Attributes
      description: Returns a list of Customer Attributes. You can pass in optional filter parameters.
      tags:
        - attributes
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number. `page=1`
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Items count per page. `limit=50`
          required: false
          schema:
            type: number
            format: double
        - name: name
          in: query
          description: Filter items by customer attribute name. `name=Date+Joined`
          required: false
          schema:
            type: string
        - name: name:like
          in: query
          description: Filter items by substring in customer attribute name. `name:like=join`
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: The type of the customer attribute.
          required: false
          schema:
            type: string
        - name: date_created
          in: query
          description: Filter items by `date_created`, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or `2024-05-14`.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum `date_created`, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or
            `2024-05-14`. ISO 8601 full-date is required, ISO 8601 full-time is not required. UNIX timestamp also
            accepted. Returns metafields created before this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_created:min
          in: query
          description: >-
            Filter items by minimum `date_created`, for example, `2024-05-14T09:34:00`, `2024-05-14T09:34:00` or
            `2024-05-14`. ISO 8601 full-date is required, ISO 8601 full-time is not required. UNIX timestamp also
            accepted. Returns metafields created after this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified
          in: query
          description: Filter items by `date_modified`, for example, `2024-05-14T09:34:00` or `2024-05-14`.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum `date_modified`, for example, `2024-05-14T09:34:00` or `2024-05-14`. ISO 8601
            full-date is required, ISO 8601 full-time is not required. UNIX timestamp also accepted. Returns metafields
            modified before this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum `date_modified`, for example, `2024-05-14T09:34:00` or `2024-05-14`. ISO 8601
            full-date is required, ISO 8601 full-time is not required. UNIX timestamp also accepted. Returns metafields
            modified after this date.
          required: false
          schema:
            type: string
            format: date-time
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of customer attributes.
          content:
