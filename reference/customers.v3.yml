            type: string
        - name: id:in
          in: query
          description: Filter items by ID.
          required: true
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '204':
