openapi: 3.1.0
info:
  title: Storefront Carts
  version: 1.0.0
paths:
  /carts:
    get:
      operationId: cart_getCart
      summary: Get Cart
      description: |-
        Returns a *Cart*.

        > #### Note
        > * Substitute your storefront domain for `yourstore.example.com`. 
        > * The Send a Test Request feature is not currently supported for this endpoint.  
      tags:
        - cart
      parameters:
        - name: include
          in: query
          description: >-
            Sub-resources to include in the Cart response, in a comma-separated list.


            `lineItems.physicalItems.options`: The Cart returns an abbreviated result. Use this to return physical items
            product options. Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options`:  The Cart returns an abbreviated result. Use this to return digital items
            product options.  Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options,lineItems.physicalItems.options`:  The Cart returns an abbreviated result.
            Use this to return digital and physical options. Can also be used in a /POST to have the extended Cart
            object return.


            `lineItems.physicalItems.stockPosition`: Returns backorder and stock availability details for physical
            items.


            `lineItems.digitalItems.stockPosition`: Returns backorder and stock availability details for digital items.
            Since digital products cannot be backordered, backorder values are always zero.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsGetParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of the shopper's carts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/responseCart'
    post:
      operationId: cart_createCart
      summary: Create Cart
      description: |-
        Creates a *Cart*.

        > #### Note
        > * Substitute your storefront domain for `yourstore.example.com`. 
        > * The Send a Test Request feature is not currently supported for this endpoint.  
      tags:
        - cart
      parameters:
        - name: include
          in: query
          description: >-
            Sub-resources to include in the Cart response, in a comma-separated list.


            `lineItems.physicalItems.options`: The Cart returns an abbreviated result. Use this to return physical items
            product options. Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options`:  The Cart returns an abbreviated result. Use this to return digital items
            product options.  Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options,lineItems.physicalItems.options`:  The Cart returns an abbreviated result.
            Use this to return digital and physical options. Can also be used in a /POST to have the extended Cart
            object return.


            `lineItems.physicalItems.stockPosition`: Returns backorder and stock availability details for physical
            items.


            `lineItems.digitalItems.stockPosition`: Returns backorder and stock availability details for digital items.
            Since digital products cannot be backordered, backorder values are always zero.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsPostParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Post Carts Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCart'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestCart'
  /carts/{cartId}:
    delete:
      operationId: cart_deleteCart
      summary: Delete Cart
      description: |-
        Deletes a *Cart*. Once a *Cart* has been deleted it can not be recovered.


        > #### Note
        > * Substitute your storefront domain for `yourstore.example.com`. 
        > * The Send a Test Request feature is not currently supported for this endpoint.  
      tags:
        - cart
      parameters:
        - name: cartId
          in: path
          description: This cartʼs unique ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /carts/{cartId}/currency:
    post:
      operationId: cartCurrency_updateCartCurrency
      summary: Update Cart Currency
      description: |-
        Update currency of the *Cart*. 
        Promotions and gift certificates that don't apply to the new currency will be removed from your cart.
        You cannot update the cart currency if the draft order cart or the cart contains a manual discount.

        > #### Note
        > * Substitute your storefront domain for `yourstore.example.com`. 
        > * The Send a Test Request feature is not currently supported for this endpoint.  
      tags:
        - cartCurrency
      parameters:
        - name: cartId
          in: path
          description: This cartʼs unique ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          description: >-
            Sub-resources to include in the Cart response, in a comma-separated list.


            `lineItems.physicalItems.options`: The Cart returns an abbreviated result. Use this to return physical items
            product options. Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options`:  The Cart returns an abbreviated result. Use this to return digital items
            product options.  Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options,lineItems.physicalItems.options`:  The Cart returns an abbreviated result.
            Use this to return digital and physical options. Can also be used in a /POST to have the extended Cart
            object return.


            `lineItems.physicalItems.stockPosition`: Returns backorder and stock availability details for physical
            items.


            `lineItems.digitalItems.stockPosition`: Returns backorder and stock availability details for digital items.
            Since digital products cannot be backordered, backorder values are always zero.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdCurrencyPostParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of the shopper's carts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/responseCart'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Currency not found
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Missing or invalid data
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                currencyCode:
                  type: string
                  description: currency code
              required:
                - currencyCode
  /carts/{cartId}/items:
    post:
      operationId: cartItems_addCartLineItem
      summary: Add Cart Line Items
      description: >-
        Adds a line items to the *Cart*.


        > #### Notes

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.  

        > * To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - cartItems
      parameters:
        - name: cartId
          in: path
          description: This cartʼs unique ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          description: >-
            Sub-resources to include in the Cart response, in a comma-separated list.


            `lineItems.physicalItems.options`: The Cart returns an abbreviated result. Use this to return physical items
            product options. Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options`:  The Cart returns an abbreviated result. Use this to return digital items
            product options.  Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options,lineItems.physicalItems.options`:  The Cart returns an abbreviated result.
            Use this to return digital and physical options. Can also be used in a /POST to have the extended Cart
            object return.


            `lineItems.physicalItems.stockPosition`: Returns backorder and stock availability details for physical
            items.


            `lineItems.digitalItems.stockPosition`: Returns backorder and stock availability details for digital items.
            Since digital products cannot be backordered, backorder values are always zero.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdItemsPostParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The cart, including the newly added items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCart'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddCartLineItemRequestConflictError'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineItemsRequest'
  /carts/{cartId}/items/{itemId}:
    put:
      operationId: cartItems_updateCartLineItem
      summary: Update Cart Line Item
      description: >-
        Updates a *Cart* line item. Updates an existing, single line item quantity and the price of custom items in a
        cart.


        If a modified product or variant needs to be changed or updated, you can remove and re-add the product to the
        cart with the correct variants using the [Delete Cart Line
        Item](/developer/api-reference/rest/storefront/carts/cart-items/delete-cart-line-item) and the [Add Cart Line
        Items](/developer/api-reference/rest/storefront/carts/cart-items/add-cart-line-item) endpoints. You can also use
        carts mutations that are part of the [GraphQL Storefront
        API](/developer/docs/storefront/guides/graphql-storefront-api/overview).



        > #### Notes

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint. 

        > * To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - cartItems
      parameters:
        - name: cartId
          in: path
          description: This cartʼs unique ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          description: The ID of the subject item.
          required: true
          schema:
            type: string
            format: number
        - name: include
          in: query
          description: >-
            Sub-resources to include in the Cart response, in a comma-separated list.


            `lineItems.physicalItems.options`: The Cart returns an abbreviated result. Use this to return physical items
            product options. Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options`:  The Cart returns an abbreviated result. Use this to return digital items
            product options.  Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options,lineItems.physicalItems.options`:  The Cart returns an abbreviated result.
            Use this to return digital and physical options. Can also be used in a /POST to have the extended Cart
            object return.


            `lineItems.physicalItems.stockPosition`: Returns backorder and stock availability details for physical
            items.


            `lineItems.digitalItems.stockPosition`: Returns backorder and stock availability details for digital items.
            Since digital products cannot be backordered, backorder values are always zero.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdItemsItemIdPutParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The cart, including the updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCart'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCartLineItemRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestLineItemPut'
    delete:
      operationId: cartItems_deleteCartLineItem
      summary: Delete Cart Line Item
      description: >-
        Deletes a *Cart* line item.


        Removing the last `line_item` in the *Cart* deletes the *Cart*.


        > #### Note

        > * Substitute your storefront domain for `yourstore.example.com`. 

        > * The Send a Test Request feature is not currently supported for this endpoint.  

        > * To prevent lost updates due to concurrent requests overriding changes made by others, it is recommended to
        enable optimistic concurrency control by including the `version` field in the request payload. If the provided
        version does not match the version on the server, a conflict error will be returned, which the client can handle
        accordingly.
      tags:
        - cartItems
      parameters:
        - name: cartId
          in: path
          description: This cartʼs unique ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          description: The ID of the subject item.
          required: true
          schema:
            type: string
            format: number
        - name: include
          in: query
          description: >-
            Sub-resources to include in the Cart response, in a comma-separated list.


            `lineItems.physicalItems.options`: The Cart returns an abbreviated result. Use this to return physical items
            product options. Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options`:  The Cart returns an abbreviated result. Use this to return digital items
            product options.  Can also be used in a /POST to have the extended Cart object return.


            `lineItems.digitalItems.options,lineItems.physicalItems.options`:  The Cart returns an abbreviated result.
            Use this to return digital and physical options. Can also be used in a /POST to have the extended Cart
            object return.


            `lineItems.physicalItems.stockPosition`: Returns backorder and stock availability details for physical
            items.


            `lineItems.digitalItems.stockPosition`: Returns backorder and stock availability details for digital items.
            Since digital products cannot be backordered, backorder values are always zero.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CartsCartIdItemsItemIdDeleteParametersIncludeSchemaItems'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: >-
            NOTE: Discounted line items are re-evaluated on cart actions and may be automatically added back to your
            cart with a new line item ID to satisfy promotional requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCart'
        '409':
          description: Cart conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCartLineItemRequestConflictError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestLineItemDelete'
tags:
  - name: cart
    description: Create and manage the current shopper's cart from the storefront.
  - name: cartCurrency
    description: Retrieve and set the currency of the shopper's cart.
  - name: cartItems
    description: Add, update, and remove line items in the shopper's cart.
servers:
  - url: https://your_store.example.com/api/storefront
    description: https://{store_domain}/api/storefront
components:
  schemas:
    CartsGetParametersIncludeSchemaItems:
      type: string
      enum:
        - lineItems.physicalItems.options
        - lineItems.digitalItems.options
        - lineItems.physicalItems.stockPosition
        - lineItems.digitalItems.stockPosition
      title: CartsGetParametersIncludeSchemaItems
    responseCartCurrency:
      type: object
      properties:
        code:
          type: string
          format: ISO-4217
          description: 'ISO-4217 currency code. (See: https://www.iso.org/iso-4217-currency-codes.html.)'
        decimalPlaces:
          type: integer
          description: The number of decimal places that prices have when you use the currency.
        name:
          type: string
          description: The name for the currency that the merchant entered in the control panel.
        symbol:
          type: string
          description: The currency symbol displayed on the storefront.
      description: This will always be the same between cart and checkout.
      title: responseCartCurrency
    ResponseCartCouponsItems:
      type: object
      properties:
        code:
          type: string
          description: The coupon code.
        couponType:
          type: integer
          description: |-
            |Type `int`|Type Name|
            |-|-|
            |`0`|`per_item_discount`|
            |`1`|`percentage_discount`|
            |`2`|`per_total_discount`|
            |`3`|`shipping_discount`|
            |`4`|`free_shipping`|
            |`5`|`promotion`|
        discountedAmount:
          type: string
          title: float
          description: The discounted amount applied within a given context.
        displayName:
          type: string
          description: The coupon name displayed on the storefront.
        id:
          type: string
          description: The coupon ID.
      required:
        - code
      title: ResponseCartCouponsItems
    responseCartCoupons:
      type: array
      items:
        $ref: '#/components/schemas/ResponseCartCouponsItems'
      title: responseCartCoupons
    ResponseCartDiscountsItems:
      type: object
      properties:
        discountedAmount:
          type: string
          title: float
          description: The discounted amount applied within a given context.
        id:
          type: string
          description: ID of the applied discount.
      title: ResponseCartDiscountsItems
    responseCartDiscounts:
      type: array
      items:
        $ref: '#/components/schemas/ResponseCartDiscountsItems'
      title: responseCartDiscounts
    responseCartLineItemsCustomItems:
      type: object
      properties:
        extendedListPrice:
          type: integer
        id:
          type: string
          description: ID of the custom item
        listPrice:
          type: integer
          description: Price of the item. With or without tax depending on your stores set up.
        name:
          type: string
          description: Name of the custom item.
        quantity:
          type: integer
        sku:
          type: string
          description: SKU of the custom item.
      description: >-
        **Read Only**


        This will return in the Cart Response if the Cart was created using the [REST Management
        API](/developer/api-reference/rest/admin/management/carts). A custom item can only be added to a cart using the
        REST Management API.
      title: responseCartLineItemsCustomItems
    responseCartLineItemsDigitalItemsAllOf0OptionsItems:
      type: object
      properties:
        name:
          type: string
          description: The product option name. For example, Color or Size
        nameId:
          type: number
          format: double
          description: 'The product option identifier. It is the same as the `optionId` used in the request. '
        value:
          type: string
          description: The product option value. For example, Red or Medium
        valueId:
          type: number
          format: double
          description: The product option value identifier. It is the same as the `optionValue` used in the request.
      title: responseCartLineItemsDigitalItemsAllOf0OptionsItems
    responseCartLineItemsDigitalItemsAllOf0DiscountsItems:
      type: object
      properties:
        discountedAmount:
          type: string
          title: float
          description: The discounted amount applied within a given context.
        id:
          type: number
          format: double
          description: ID of the applied discount.
      title: responseCartLineItemsDigitalItemsAllOf0DiscountsItems
    ResponseCartLineItemsDigitalItemsAllOf0StockPosition:
      type: object
      properties:
        quantityOnHand:
          type: integer
          description: Number of units currently in stock and available to fulfill this line item without backordering.
        quantityBackordered:
          type: integer
          description: Number of units from this line item that are fulfilled via backorder.
        quantityOutOfStock:
          type: integer
          description: Number of units from this line item that are out of stock and unavailable for backorder.
        backorderMessage:
          type:
            - string
            - 'null'
          description: Backorder messaging shown to the customer for this line item. `null` if no backorder message applies.
      description: >-
        Backorder and stock availability details for this line item. Only returned when explicitly requested via
        `include=lineItems.digitalItems.stockPosition` — not included by default. Since digital products cannot be
        backordered, backorder values are always zero for digital items.
      title: ResponseCartLineItemsDigitalItemsAllOf0StockPosition
    ResponseCartLineItemsDigitalItemsAllOf0Type:
      type: string
      enum:
        - digital
      description: The type of line item.
      title: ResponseCartLineItemsDigitalItemsAllOf0Type
    responseCartLineItemsDigitalItems:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/responseCartLineItemsDigitalItemsAllOf0OptionsItems'
          description: The list of selected options for this product.
        brand:
          type: string
          description: The products brand
        couponAmount:
          type: number
          format: double
          description: The total value of all coupons applied to this item.
        discountAmount:
          type: string
          title: float
          description: The total value of all discounts applied to this item (excluding coupon).
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/responseCartLineItemsDigitalItemsAllOf0DiscountsItems'
          description: List of discounts applied to this item, as an array of AppliedDiscount objects.
        extendedListPrice:
          type: number
          format: double
          description: Item's list price multiplied by the quantity.
        extendedSalePrice:
          type: number
          format: double
          description: Item's sale price multiplied by the quantity.
        id:
          type: string
          description: The line-item ID.
        imageUrl:
          type: string
          format: uri
          description: URL of an image of this item, accessible on the internet.
        isMutable:
          type: boolean
          description: >-
            Whether or not you can change or remove the item from the cart. Items that are immutable include those added
            automatically by promotions.
        isTaxable:
          type: boolean
          description: Whether the item is taxable.
        listPrice:
          type: number
          format: double
          description: >-
            The net item price before discounts and coupons. BigCommerce derives an item’s list price from the product
            default price or, if applicable, the sale price configured in the admin panel.
        originalPrice:
          type: number
          format: double
          description: An item’s original price is the same as the product default price in the admin panel.
        name:
          type: string
          description: The item's product name.
        parentId:
          type: string
          description: >-
            The product is part of a bundle such as a product pick list, then the parentId or the main product id will
            populate.
        productId:
          type: number
          format: double
          description: ID of the product.
        quantity:
          type: number
          format: double
          description: Quantity of this item.
        stockPosition:
          $ref: '#/components/schemas/ResponseCartLineItemsDigitalItemsAllOf0StockPosition'
          description: >-
            Backorder and stock availability details for this line item. Only returned when explicitly requested via
            `include=lineItems.digitalItems.stockPosition` — not included by default. Since digital products cannot be
            backordered, backorder values are always zero for digital items.
        salePrice:
          type: number
          format: double
          description: Item's price after all discounts are applied. (The final price before tax calculation.)
        sku:
          type: string
          description: SKU of the variant.
        type:
          $ref: '#/components/schemas/ResponseCartLineItemsDigitalItemsAllOf0Type'
          description: The type of line item.
        url:
          type: string
          format: uri
          description: The product URL.
        variantId:
          type: number
          format: double
          description: ID of the variant.
      required:
        - quantity
      title: responseCartLineItemsDigitalItems
    responseCartLineItemsGiftCertificatesRecipient:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Contact's email address.
        name:
          type: string
          description: Contact's name.
      title: responseCartLineItemsGiftCertificatesRecipient
    responseCartLineItemsGiftCertificatesSender:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Contact's email address.
        name:
          type: string
          description: Contact's name.
      title: responseCartLineItemsGiftCertificatesSender
    ResponseCartLineItemsGiftCertificatesType:
      type: string
      enum:
        - giftCertificate
      description: The type of line item.
      title: ResponseCartLineItemsGiftCertificatesType
    responseCartLineItemsGiftCertificates:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Value must be between 1.00 and 1,000.00 in the storeʼs default currency.
        id:
          type: string
          description: ID of this gift certificate.
        taxable:
          type: boolean
          description: Whether or not the gift certificate is taxable.
        message:
          type: string
          description: Message that will be sent to the gift certificate's recipient. Limited to 200 characters.
        name:
          type: string
          description: Name provided for the gift certificate that appears in the control panel.
