openapi: 3.1.0
info:
  title: 'Admin Content: Store Content'
  version: 1.0.0
paths:
  /stores/{store_hash}/v2/blog/posts:
    get:
      operationId: blogPosts_getBlogPosts
      summary: List Blog Posts
      description: Returns all *Blog Posts*. Default sorting is by published_date, beginning with the most recent post.
      tags:
        - blogPosts
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: is_published
          in: query
          description: Filter param.
          required: false
          schema:
            type: boolean
        - name: url
          in: query
          description: Filter param. Value must be URL encoded.
          required: false
          schema:
            type: string
        - name: tag
          in: query
          description: Filter param.
          required: false
          schema:
            type: string
        - name: published_date
          in: query
          description: Filter param.
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Filter param.
          required: false
          schema:
            type: integer
            maximum: 50
        - name: limit
          in: query
          description: Filter param.
          required: false
          schema:
            type: integer
            maximum: 250
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/blogPost_Full'
      security:
        - X-Auth-Token: []
    post:
      operationId: blogPosts_createBlogPosts
      summary: Create Blog Post
      description: >-
        Creates a *Blog Post*.


        **Required Fields**

        *   `title`

        *   `body`


        **Notes**


        * When including `published_date` in a request, supply it as a flat date string (not an object) in valid <a
        href="http://tools.ietf.org/html/rfc2822#section-3.3" target="_blank">RFC 2822</a>. The following example
        request includes a `published_date` in RFC 2822 format.

        * Blog posts default to draft status. To publish blog posts to the storefront, set the `is_published` property
        to `true`.

        * If a custom URL is not provided, the post’s URL will be generated based on the value of `title`.
      tags:
        - blogPosts
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blogPost_Base_Res'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/blogPost_Base_Post'
      security:
        - X-Auth-Token: []
    delete:
      operationId: blogPosts_deleteBlogPosts
      summary: Delete Blog Posts
      description: Deletes a page of `Blog Posts`.
      tags:
        - blogPosts
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Filter param.
          required: false
          schema:
            type: integer
            maximum: 250
        - name: limit
          in: query
          description: Filter param.
          required: false
          schema:
            type: integer
            maximum: 50
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v2/blog/posts/{id}:
    get:
      operationId: blogPosts_getBlogPost
      summary: Get Blog Post
      description: Returns a single *Blog Post*.
      tags:
        - blogPosts
      parameters:
        - name: id
          in: path
          description: ID of the blog post.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blogPost_Full'
      security:
        - X-Auth-Token: []
    put:
      operationId: blogPosts_updateBlogPost
      summary: Update Blog Post
      description: >-
        Updates a *Blog Post*.


        **Notes**


        * To include `published_date` in a request, provide a flat date string (not an object) in valid <a
        href="http://tools.ietf.org/html/rfc2822#section-3.3" target="_blank">RFC 2822</a>. The following example
        request includes a `published_date` in RFC 2822 format.


        * Blog posts default to draft status. To publish blog posts to the storefront, set the `is_published` property
        to `true`.
      tags:
        - blogPosts
      parameters:
        - name: id
          in: path
          description: ID of the blog post.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/blogPost_Base_Res'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/blogPost_Base_Post'
      security:
        - X-Auth-Token: []
    delete:
      operationId: blogPosts_deleteBlogPost
      summary: Delete Blog Post
      description: Deletes a *Blog Post*.
      tags:
        - blogPosts
      parameters:
        - name: id
          in: path
          description: ID of the blog post.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
