          in: query
          description: Filter param.
          required: false
          schema:
            type: number
            format: double
        - name: limit
          in: query
          description: Filter param.
          required: false
          schema:
            type: number
            format: double
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/page_Full'
      deprecated: true
      security:
        - X-Auth-Token: []
    post:
      operationId: pages_createPage
      summary: Create Page (deprecated)
      description: >-
        Creates a *Page*. The request payload limit is 1MB.


        **Required Fields**

        *   `type`

        *   `name`

        *   `link` (for a page of `type: link`)

        *   `body` (for a page of `type: raw`)


        **Read Only Fields**

        *   `id`


        ## Content Type


        The default value for `content_type` is `text/html`; however, if `page_type` is set to `raw`, `content_type` can
        be changed to `text/javascript` or `application/json`. Updating this field lets you place a JavaScript or a JSON
        file in the root directory.


        > #### Warning

        > **Deprecated**

        > * This API operation is deprecated. Avoid using this API operation if possible. It will be removed in a future
        version.

        > * To create one or more pages, use Pages V3ʼs [Create
        pages](/developer/api-reference/rest/admin/content/pages/create-pages) endpoint.
      tags:
        - pages
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
