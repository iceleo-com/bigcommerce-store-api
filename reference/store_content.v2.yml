  /stores/{store_hash}/v2/pages:
    get:
      operationId: pages_getPages
      summary: List Pages (deprecated)
      description: >
        Returns a list of *Pages*. Default sorting is by auto-generated ID from oldest to newest.


        > #### Warning

        > **Deprecated**

        > * This API operation is deprecated. Avoid using this API operation if possible. It will be removed in a future
