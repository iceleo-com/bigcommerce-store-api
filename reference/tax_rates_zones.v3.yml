openapi: 3.1.0
info:
  title: "Admin Management: Tax"
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/tax/zones:
    get:
      operationId: taxZones_getTaxZones
      summary: List Tax Zones
      description: Retrieve a selection of tax zones when you provide a list of tax zone IDs. Otherwise, retrieve all tax zones defined on the store.
      tags:
        - taxZones
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: Filter by tax zone `id`. Use a comma-separated CSV string of IDs for multiple tax zones. For example, `5` or `12,34,56`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Zones_getTaxZones_Response_200"
      security:
        - X-Auth-Token: []
    post:
      operationId: taxZones_createTaxZones
      summary: Create Tax Zones
      description: |-
        Create one or more tax zones.

        > #### Note
        > You cannot create a default tax zone.
      tags:
        - taxZones
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Zones_createTaxZones_Response_200"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Tax_ZonePOST"
      security:
        - X-Auth-Token: []
    put:
      operationId: taxZones_updateTaxZones
      summary: Update Tax Zones
      description: Update one or more tax zones. Only the tax zone `id` field is required. Fields unspecified by the request will retain their current state.
      tags:
        - taxZones
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Zones_updateTaxZones_Response_200"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Tax_ZonePUT"
      security:
        - X-Auth-Token: []
    delete:
      operationId: taxZones_deleteTaxZones
      summary: Delete Tax Zones
      description: |-
        Delete one or more tax zones. Deleting a tax zone removes all associated tax rates.

        > You must specify which zone(s) to delete using the `id:in` query parameter.
      tags:
        - taxZones
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: Filter by tax zone `id`. Use a comma-separated CSV string of IDs for multiple tax zones. For example, `5` or `12,34,56`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/tax/rates:
    get:
      operationId: taxRates_getTaxRates
      summary: List Tax Rates
      description: Retrieve a list of tax rates.
      tags:
        - taxRates
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: Filter by tax rate `id`. Use a comma-separated CSV string of IDs for multiple tax rates. For example, `5` or `12,34,56`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: tax_zone_id:in
          in: query
          description: Filter by tax zone `id`. Use a comma-separated CSV string of IDs for multiple tax zones. For example, `5` or `12,34,56`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Rates_getTaxRates_Response_200"
      security:
        - X-Auth-Token: []
    post:
      operationId: taxRates_createTaxRates
      summary: Create Tax Rates
      description: Create one or more tax rates. Tax rates must be associated with a `tax_zone_id`.
      tags:
        - taxRates
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Rates_createTaxRates_Response_200"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Tax_RatePOST"
      security:
        - X-Auth-Token: []
    put:
      operationId: taxRates_updateTaxRates
      summary: Update Tax Rates
      description: Update one or more tax rates. Only the tax rate `id` field is required. Fields unspecified by the request will retain their current state.
      tags:
        - taxRates
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tax_Rates_updateTaxRates_Response_200"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Tax_RatePUT"
      security:
        - X-Auth-Token: []
    delete:
      operationId: taxRates_deleteTaxRates
      summary: Delete Tax Rates
      description: |-
        Delete one or more tax rates.

        > You must specify which rate(s) to delete using the `id:in` query parameter.
      tags:
        - taxRates
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: id:in
          in: query
          description: Filter by tax rate `id`. Use a comma-separated CSV string of IDs for multiple tax rates. For example, `5` or `12,34,56`.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: Accept
          in: header
          description: The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
        - X-Auth-Token: []
tags:
  - name: taxCustomers
    description: Retrieve the customer tax information used by tax providers.
  - name: taxProperties
    description: Create and manage the tax properties used to classify products.
  - name: productTaxProperties
    description: Assign tax properties to individual products.
  - name: taxZones
    description: Create and manage the geographic zones a store applies tax rates to.
  - name: taxRates
    description: Create and manage the tax rates applied within a tax zone.
  - name: taxSettings
    description: Manage store-level tax settings.
  - name: taxZoneCheck
    description: Determine which tax zone applies to a given address.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    Tax_RatePUT:
      type: object
      properties:
        class_rates:
          type: array
          items:
            $ref: "#/components/schemas/TaxRatePutClassRatesItems"
          description: Tax rates for tax classes. You must assign at least one tax rate for each tax class defined on a store.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax rate is enabled. Tax operations are only for enabled zones.
        id:
          type: integer
          description: Tax Rate ID. Internal identifier to update and delete a specific tax rate.
        name:
          type: string
          description: The human-readable name for this tax zone. The name appears in the store control panel and may be visible to shoppers, depending on store tax settings.
        priority:
          type: integer
          default: 1
          description: Allows for compounding tax rates, common in certain jurisdictions.
        tax_zone_id:
          type: integer
          description: ID of an associated tax zone. You must associate a tax rate with a tax zone.
      required:
        - id
      title: Tax_RatePUT
    TaxRatePutClassRatesItems:
      type: object
      properties:
        rate:
          type: number
          format: double
          description: The tax rate that you apply to the items in a tax class.
        tax_class_id:
          type: integer
          description: ID of a tax class. You must associate a tax rate with a tax class. The rate will apply to all the items in this tax class.
      title: TaxRatePutClassRatesItems
    Tax_Rates_updateTaxRates_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tax_Rate"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Rates_updateTaxRates_Response_200
    MetaOpen:
      type: object
      properties: {}
      description: Response metadata.
      title: MetaOpen
    Tax_Rate:
      type: object
      properties:
        class_rates:
          type: array
          items:
            $ref: "#/components/schemas/TaxRateClassRatesItems"
          description: Tax rates for tax classes. You must assign at least one tax rate for each tax class defined on a store.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax rate is enabled. Tax operations are only for enabled zones.
        id:
          type: integer
          description: Tax Rate ID. Internal identifier to update and delete a specific tax rate.
        name:
          type: string
          description: The human-readable name for this tax zone. The name appears in the store control panel and may be visible to shoppers, depending on store tax settings.
        priority:
          type: integer
          default: 1
          description: Allows for compounding tax rates, common in certain jurisdictions.
        tax_zone_id:
          type: integer
          description: ID of an associated tax zone. You must associate a tax rate with a tax zone.
      title: Tax_Rate
    TaxRateClassRatesItems:
      type: object
      properties:
        rate:
          type: number
          format: double
          description: The tax rate that you apply to the items in a tax class.
        tax_class_id:
          type: integer
          description: ID of a tax class. You must associate a tax rate with a tax class. The rate will apply to all the items in this tax class.
      title: TaxRateClassRatesItems
    Tax_RatePOST:
      type: object
      properties:
        class_rates:
          type: array
          items:
            $ref: "#/components/schemas/TaxRatePostClassRatesItems"
          description: Tax rates for tax classes. You must assign at least one tax rate for each tax class defined on a store.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax rate is enabled. Tax operations are only for enabled zones.
        name:
          type: string
          description: The human-readable name for this tax zone. The name appears in the store control panel and may be visible to shoppers, depending on store tax settings.
        priority:
          type: integer
          default: 1
          description: Allows for compounding tax rates, common in certain jurisdictions.
        tax_zone_id:
          type: integer
          description: ID of an associated tax zone. You must associate a tax rate with a tax zone.
      required:
        - class_rates
        - name
        - tax_zone_id
      title: Tax_RatePOST
    TaxRatePostClassRatesItems:
      type: object
      properties:
        rate:
          type: number
          format: double
          description: The tax rate that you apply to the items in a tax class.
        tax_class_id:
          type: integer
          description: ID of a tax class. You must associate a tax rate with a tax class. The rate will apply to all items in this tax class.
      required:
        - rate
        - tax_class_id
      title: TaxRatePostClassRatesItems
    Tax_Rates_createTaxRates_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tax_Rate"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Rates_createTaxRates_Response_200
    Tax_Rates_getTaxRates_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tax_Rate"
        meta:
          $ref: "#/components/schemas/Meta"
      title: Tax Rates_getTaxRates_Response_200
    Meta:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/MetaPagination"
      title: Meta
    MetaPagination:
      type: object
      properties:
        total:
          type: integer
        count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
        links:
          $ref: "#/components/schemas/MetaPaginationLinks"
      title: MetaPagination
    MetaPaginationLinks:
      type: object
      properties:
        current:
          type: string
      title: MetaPaginationLinks
    Tax_ZonePUT:
      type: object
      properties:
        id:
          type: integer
          description: Tax Zone ID. Internal identifier used to get, update, or delete a specific tax zone.
        name:
          type: string
          description: The human-readable name for this tax zone. The name appears in the store control panel.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax zone is enabled. Tax operations are only for enabled zones.
        price_display_settings:
          $ref: "#/components/schemas/TaxZonePutPriceDisplaySettings"
          description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
        shopper_target_settings:
          $ref: "#/components/schemas/TaxZonePutShopperTargetSettings"
          description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper. You cannot define shopper target settings for the default tax zone because it must accommodate all shoppers who donʼt qualify for any other zone.
      required:
        - id
      title: Tax_ZonePUT
    TaxZonePutShopperTargetSettings:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/TaxZonePutShopperTargetSettingsLocationsItems"
          description: A tax zone may target shoppers in one or more locations.
        customer_groups:
          type: array
          items:
            type: integer
          description: One or more customer groups that a tax zone targets. Empty array if zone applies to all customers.
      description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper. You cannot define shopper target settings for the default tax zone because it must accommodate all shoppers who donʼt qualify for any other zone.
      title: TaxZonePutShopperTargetSettings
    TaxZonePutShopperTargetSettingsLocationsItems:
      type: object
      properties:
        country_code:
          type: string
          description: Two-letter ISO 3166-1 country code
        subdivision_codes:
          type: array
          items:
            type: string
          description: Three-letter ISO 3166-2 subdivision code
        postal_codes:
          type: array
          items:
            type: string
      title: TaxZonePutShopperTargetSettingsLocationsItems
    TaxZonePutPriceDisplaySettings:
      type: object
      properties:
        show_inclusive:
          type: boolean
          description: Indicates whether to show prices as tax inclusive or tax exclusive to shoppers matched with this tax zone.
        show_both_on_detail_view:
          type: boolean
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing product detail; for example, on product pages. This view applies to shoppers matched with this tax zone.
        show_both_on_list_view:
          type: boolean
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing a list of products; for example, on category and brand pages. This view applies to shoppers matched with this tax zone.
      description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
      title: TaxZonePutPriceDisplaySettings
    Tax_Zones_updateTaxZones_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tax_Zone"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Zones_updateTaxZones_Response_200
    Tax_Zone:
      type: object
      properties:
        id:
          type: integer
          description: Tax Zone ID. Internal identifier used to get, update, or delete a specific tax zone.
        name:
          type: string
          description: The human-readable name for this tax zone. The name appears in the store control panel.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax zone is enabled. Tax operations are only for enabled zones.
        price_display_settings:
          $ref: "#/components/schemas/TaxZonePriceDisplaySettings"
          description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
        shopper_target_settings:
          $ref: "#/components/schemas/TaxZoneShopperTargetSettings"
          description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper. You cannot define shopper target settings for the default tax zone because it must accommodate all shoppers who donʼt qualify for any other zone.
      title: Tax_Zone
    TaxZoneShopperTargetSettings:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/TaxZoneShopperTargetSettingsLocationsItems"
          description: A tax zone may target shoppers in one or more locations.
        customer_groups:
          type: array
          items:
            type: integer
          description: One or more customer groups that a tax zone targets. Empty array if zone applies to all customers.
      description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper. You cannot define shopper target settings for the default tax zone because it must accommodate all shoppers who donʼt qualify for any other zone.
      title: TaxZoneShopperTargetSettings
    TaxZoneShopperTargetSettingsLocationsItems:
      type: object
      properties:
        country_code:
          type: string
          description: Two-letter ISO 3166-1 country code
        subdivision_codes:
          type: array
          items:
            type: string
          description: Three-letter ISO 3166-2 subdivision code
        postal_codes:
          type: array
          items:
            type: string
      title: TaxZoneShopperTargetSettingsLocationsItems
    TaxZonePriceDisplaySettings:
      type: object
      properties:
        show_inclusive:
          type: boolean
          description: Indicates whether to show prices as tax inclusive or tax exclusive to shoppers matched with this tax zone.
        show_both_on_detail_view:
          type: boolean
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing product detail; for example, on product pages. This view applies to shoppers matched with this tax zone.
        show_both_on_list_view:
          type: boolean
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing a list of products; for example, on category and brand pages. This view applies to shoppers matched with this tax zone.
      description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
      title: TaxZonePriceDisplaySettings
    Tax_ZonePOST:
      type: object
      properties:
        name:
          type: string
          description: The human-readable name for this tax zone. The name appears in the store control panel.
        enabled:
          type: boolean
          default: true
          description: Indicates whether a tax zone is enabled. Tax operations are only for enabled zones.
        price_display_settings:
          $ref: "#/components/schemas/TaxZonePostPriceDisplaySettings"
          description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
        shopper_target_settings:
          $ref: "#/components/schemas/TaxZonePostShopperTargetSettings"
          description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper.
      required:
        - name
      title: Tax_ZonePOST
    TaxZonePostShopperTargetSettings:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/TaxZonePostShopperTargetSettingsLocationsItems"
          description: A tax zone may target shoppers in one or more locations.
        customer_groups:
          type: array
          items:
            type: integer
          description: One or more customer groups that a tax zone targets. Empty array if zone applies to all customers.
      required:
        - locations
      description: Settings that describe which shoppers match this tax zone and help determine the most appropriate target for a shopper.
      title: TaxZonePostShopperTargetSettings
    TaxZonePostShopperTargetSettingsLocationsItems:
      type: object
      properties:
        country_code:
          type: string
          description: Two-letter ISO 3166-1 country code
        subdivision_codes:
          type: array
          items:
            type: string
          description: Three-letter ISO 3166-2 subdivision code
        postal_codes:
          type: array
          items:
            type: string
      title: TaxZonePostShopperTargetSettingsLocationsItems
    TaxZonePostPriceDisplaySettings:
      type: object
      properties:
        show_inclusive:
          type: boolean
          description: Indicates whether to show prices as tax inclusive or tax exclusive to shoppers matched with this tax zone.
        show_both_on_detail_view:
          type: boolean
          default: false
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing product detail; for example, on product pages. This view applies to shoppers matched with this tax zone.
        show_both_on_list_view:
          type: boolean
          default: false
          description: Indicates whether to show both tax inclusive and tax exclusive prices when viewing a list of products; for example, on category and brand pages. This view applies to shoppers matched with this tax zone.
      required:
        - show_inclusive
      description: Settings that describe how a store displays prices to shoppers matched with this tax zone.
      title: TaxZonePostPriceDisplaySettings
    Tax_Zones_createTaxZones_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tax_Zone"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Zones_createTaxZones_Response_200
    Tax_Zones_getTaxZones_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tax_Zone"
        meta:
          $ref: "#/components/schemas/MetaOpen"
      title: Tax Zones_getTaxZones_Response_200
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |-
        ### OAuth scopes

        | UI Name | Permission | Parameter |
        |:--------|:-----------|:----------|
        |  Information & Settings | modify | `store_v2_information` |
        |  Information & Settings | read-only | `store_v2_information_read_only` |

        ### Authentication header

        | Header | Argument | Description |
        |:-------|:---------|:------------|
        | `X-Auth-Token` | `access_token` | For more about API accounts that generate `access_token`s, see our [Guide to API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#api-accounts). |

        ### Further reading

        For example requests and more information about authenticating BigCommerce APIs, see [Authentication and Example Requests](/developer/docs/overview/api-fundamentals/api-accounts#x-auth-token-header-example-requests).

        For more about BigCommerce OAuth scopes, see our [Guide to API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#oauth-scopes).

        For a list of API status codes, see [API Status Codes](/developer/api-reference/rest/overview#rest-http-status-codes).
