    MerchantOverride:
      type: object
      properties:
        total_amount:
          type: string
          title: float
          description: >-
            A non-negative 2 decimal place rounded value that represents the amount that to be used as override for the
            refund.
        total_tax:
          type: number
          format: double
          description: >-
            Total tax amount refunded back to the shopper. Use 0 value if there is no tax liability change for the
            refund or tax does not need to be recorded on the refund and would be handled externally.
      required:
        - total_amount
        - total_tax
      description: >-
        Merchant explicitly provided override based on their own calculation.


        This override gives merchants the flexibility to

        - bypass any tax correction due to tax rate/providers changes between when a customer places an order and a
        merchant initiates a refund

        - use explicit values calculated by external systems (e.g., merchants' own Extended Producer Responsibility or
        Order Management System)


        When using this when submitting refunds, please update the amount in payments section of the request payload to
        match the override value.


        Note: when using the override, BC internal tax based refund calculation is skipped and therefore order/taxes
        records are not updated.
      title: MerchantOverride
    RefundRequest_Post_Items:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemsRefund'
        payments:
