    RefundIdGetDataPaymentsItems:
      type: object
      properties:
        id:
          type: integer
          description: |
            Reference to refund payment ID.
        provider_id:
          type: string
          description: |
            Reference to payment provider.
            example: storecredit
        amount:
          type: number
          format: double
          description: >
            A non-negative two decimal place rounded value represents the amount that can be charged/refunded with
            payment providers.
        offline:
          type: boolean
          description: |
            Indicates whether the payment was offline.
        is_declined:
          type: boolean
          description: |
            Indicates if this payment has been declined by the payment provider.
        declined_message:
          type: string
          description: |
            Message indicates why the payment was declined.
      title: RefundIdGetDataPaymentsItems
    RefundIdGetDataItemsItemsItemType:
      type: string
      enum:
        - PRODUCT
        - GIFT_WRAPPING
        - SHIPPING
        - HANDLING
        - ORDER
        - FEE
      description: |
        Type of item that was refunded.
      title: RefundIdGetDataItemsItemsItemType
    RefundIdGetDataItemsItems:
      type: object
      properties:
        item_type:
          $ref: '#/components/schemas/RefundIdGetDataItemsItemsItemType'
          description: |
            Type of item that was refunded.
        item_id:
          type: integer
          description: >
            `order_product.id` corresponding to the item_types of PRODUCT, GIFT_WRAPPING. `order_address.id`
            corresponding to the item_types of SHIPPING, HANDLING. `order.id` corresponding to the item_type of ORDER,
            FEE.
        quantity:
          type: integer
          description: |
            Quantity of item refunded. Note: this will only be populated for item_type PRODUCT.
        requested_amount:
          type:
            - string
            - 'null'
          description: >
            A non-negative two decimal place rounded value that represents the amount that can be refunded with the
            payment provider(s).
        reason:
          type: string
          description: |
            Reason for refunding an item.
      title: RefundIdGetDataItemsItems
    RefundIdGetData:
      type: object
      properties:
        id:
          type: integer
          description: |
            Refund ID for the returned refund.
        order_id:
          type: integer
          description: Order ID associated with the refund.
        user_id:
          type: integer
          description: |
            Reference to the user ID who created the refund. This is automatically populated by BigCommerce.
        created:
          type: string
          format: date-time
          description: |
            Timestamp of when the refund was created.
        reason:
          type: string
          description: |
            Reason for refund.
        total_amount:
          type: number
          format: double
          description: >
            A non-negative 2 decimal place rounded value that represents the amount that can be refunded with the
            correct payment provider(s).
        total_tax:
          type: number
          format: double
          description: >
            Total tax amount refunded back to the shopper. This can be a negative amount indicating we have collected
            tax by refunding less to the customer.
        uses_merchant_override_values:
          type: boolean
          description: |
            Whether refund amount and tax are provided explicitly by merchant override.
        payments:
          type: array
          items:
            $ref: '#/components/schemas/RefundIdGetDataPaymentsItems'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RefundIdGetDataItemsItems'
          description: >-
            Array of items refunded. In cases when `tax_refund_adjustment` was used to create the refund, this array
            will be empty.
      title: RefundIdGetData
    RefundID_Get:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RefundIdGetData'
