    TaxAdjustmentAmount:
      type: string
      title: TaxAdjustmentAmount
      description: >-
        Amount to be used when tax may have been overcharged for an order, such as when the value for a partial refund
        is overridden. This amount should be equal to the calculated overcharged value, or should be used with
        `merchant_calculated_override` to override the value. If not, this will result in a `422` error.
    RefundQuote_TaxAdjustmentAmount:
      type: object
      properties:
        tax_adjustment_amount:
          $ref: '#/components/schemas/TaxAdjustmentAmount'
      required:
        - tax_adjustment_amount
      title: RefundQuote_TaxAdjustmentAmount
    RefundQuote_Post:
      oneOf:
        - $ref: '#/components/schemas/RefundQuote_ItemsRefund'
        - $ref: '#/components/schemas/RefundQuote_TaxAdjustmentAmount'
      description: Request body for refund quotes.
      title: RefundQuote_Post
    AdjustmentAmount:
      type: string
      title: AdjustmentAmount
      description: >-
        A negative or positive 2 decimal place rounded value that represents the difference between the refund amount
        requested in the refund quote and the actual amount that is refundable on the order. This value is negative when
        the refund amount requested in the refund quote is more than the total refundable amount. This value is positive
        when the total refundable amount has increased, e.g. as a result of rounding.
    PaymentOption:
      type: object
      properties:
        provider_id:
          type: string
          description: Name of the payment method.
        provider_description:
          type: string
          description: Description for payment provider.
        amount:
          type: number
          format: double
          description: Amount to be refunded with this payment provider.
        offline:
          type: boolean
          description: >-
            Indicates the payment must be done offline due to constraints of the payment provider, such as partial
            refunds not being supported, or it being offline only such as cash on delivery of bank deposit.
        offline_provider:
          type: boolean
          description: Indicates if the payment provider is a strictly offline provider, such as cash on delivery or bank deposit.
        offline_reason:
          type: string
          description: Reason the payment option is offline only, if applicable.
      title: PaymentOption
    RefundMethod:
      type: array
      items:
        $ref: '#/components/schemas/PaymentOption'
      title: RefundMethod
    RefundQuote_Full:
      type: object
      properties:
        order_id:
          type: integer
          description: ID of the order to be refunded.
        total_refund_amount:
          $ref: '#/components/schemas/Amount'
        total_refund_tax_amount:
          type: number
          format: double
        order_level_refund_amount:
          type: number
          format: double
        rounding:
          type: number
          format: double
          description: >-
            Indicates rounding value to bring `refund_total` to an amount refundable with payment providers (in this
            case to 2 decimal places).
        adjustment:
          $ref: '#/components/schemas/AdjustmentAmount'
        tax_inclusive:
          type: boolean
          description: Indicate if `total_refund_amount` includes tax amount.
        refund_methods:
          type: array
          items:
            $ref: '#/components/schemas/RefundMethod'
          description: >
            An array of available refund methods.


            Note that `refund_methods` is an array of refund methods, with each refund method being an array of payment
            options.


            For example, if the order was placed by a combination of store credit and bank deposit the refund methods
            would be:


            ```json

            {
              "refund_methods": [
                [
                  {
                    "provider_id": "storecredit",
                    "provider_description": "Store Credit",
                    "amount": 119.35,
                    "offline": false,
                    "offline_provider": false,
                    "offline_reason": ""
                  }
                ],
                [
                  {
                    "provider_id": "custom",
                    "provider_description": "Custom",
                    "amount": 119.35,
                    "offline": true,
                    "offline_provider": true,
                    "offline_reason": "This is an offline payment provider."
                  }
                ],
                [
                  {
                    "provider_id": "bankdeposit",
                    "provider_description": "Bank Deposit",
                    "amount": 80.35,
                    "offline": true,
                    "offline_provider": true,
                    "offline_reason": "This is an offline payment provider."
                  },
                  {
                    "provider_id": "storecredit",
                    "provider_description": "Store Credit",
                    "amount": 39,
                    "offline": false,
                    "offline_provider": false,
                    "offline_reason": ""
                  }
                ]
              ]
            }

            ```


            In this case there are three refund methods available to the merchant:

            1. Refund up to the entire order amount to store credit.

            2. Mark an amount up to the full order amount as refunded externally, through a provider or means not
            represented directly in BC ("custom").

            3. Refund the amount paid by store credit to store credit, and the amount paid by bank deposit with a manual
            refund, which will be recorded as being refunded against the bank deposit.
      title: RefundQuote_Full
