openapi: 3.1.0
info:
  title: 'Admin Management: Order Operations'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/orders/{order_id}/transactions:
    get:
      operationId: transactions_getOrderTransactions
      summary: List Transactions
      description: >-
        Returns an **orderʼs** transactions.


        **Usage Notes**

        * Depending on the payment method, different information will be available (not all payment gateways return full
        card or fraud detail).



        Requires at least one of the following scopes:

        * `store_v2_transactions_read_only`

        * `store_v2_transactions`
      tags:
        - transactions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Response payload for the BigCommerce Order Transactions API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions_getOrderTransactions_Response_200'
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderTransactionsRequestNotFoundError'
        '503':
          description: |
            Service Unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderTransactionsRequestServiceUnavailableError'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/metafields:
    get:
      operationId: batchMetafields_getOrdersMetafields
      summary: List Order Metafields
      description: Get all order metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: |
            Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter using a comma-separated list of metafield keys. Could be used with vanilla `key` query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: |
            Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: >-
            Filter using a comma-separated list of metafield namespaces. Can be used with vanilla `namespace` query
            parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/OrdersMetafieldsGetParametersDirection'
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrdersMetafieldsGetParametersIncludeFieldsSchemaItems'
        - name: date_created
          in: query
          description: >-
            Filter items by date created. For example, `date_created=2019-09-04T00:00:00`. Returns metafields created on
            this date.
          required: false
          schema:
            type: string
        - name: date_modified
          in: query
          description: >-
            Filter items by date modified. For example, `date_modified=2019-09-04T00:00:00`. Returns metafields modified
            on this date.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >-
            Filter items by minimum date created. For example, `date_created:min=2019-09-04T00:00:00` or
            `date_created:min=2019-09-04`. Returns metafields created after this date.
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum date created. For example, `date_created:max=2019-09-04T00:00:00` or
            `date_created:max=2019-09-04`. Returns metafields created before this date.
          required: false
          schema:
            type: string
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum date modified. For example, `date_modified:min=2019-09-04T00:00:00` or
            `date_modified:min=2019-09-04`. Returns metafields modified after this date.
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum date modified. For example, `date_modified:max=2019-09-04T00:00:00` or
            `date_modified:max=2019-09-04`. Returns metafields modified before this date.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: batchMetafields_createOrdersMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            List of created `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrdersMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrdersMetafieldsPostRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    put:
      operationId: batchMetafields_updateOrdersMetafields
      summary: Update Multiple Metafields
      description: Update multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrdersMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrdersMetafieldsPutRequestBodyContentApplicationJsonSchemaItems'
      security:
        - X-Auth-Token: []
    delete:
      operationId: batchMetafields_deleteOrdersMetafields
      summary: Delete Multiple Metafields
      description: Delete all order metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrdersMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE'
      requestBody:
        description: List of metafield IDs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/metafields:
    get:
      operationId: metafields_getOrderMetafields
      summary: List Order Metafields
      description: >
        Gets a `Metafield` object list, by `order_id`.


        The maximum number of metafields allowed on each order, product, category, variant, or brand is 250 per client
        ID.
      tags:
        - metafields
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: |
            Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: namespace
          in: query
          description: |
            Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: direction
          in: query
          description: |
            Sort direction. Acceptable values are: `asc`, `desc`.
          required: false
          schema:
            $ref: '#/components/schemas/OrdersOrderIdMetafieldsGetParametersDirection'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            An array of metafields and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: metafields_createOrderMetafield
      summary: Create Metafields
      description: >-
        Creates an order `Metafield`.


        The maximum number of metafields allowed on each order, product, category, variant, or brand is 250 per client
        ID.
      tags:
        - metafields
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            A `Metafield` object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetafieldResponse'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderMetafieldRequestBadRequestError'
        '409':
          description: >
            The metafield conflicts with another metafield. This can result from duplicate unique key combinations of
            the appʼs client ID, namespace, key, resource type, and resource ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The `Metafield` is not valid. This is the result of missing required fields or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: |
          A `Metafield` object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetafieldBase_Post'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/metafields/{metafield_id}:
    get:
      operationId: metafields_getOrderMetafield
      summary: Get Metafield
      description: |
        Gets a `Metafield`, by `order_id`.
      tags:
        - metafields
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: metafield_id
          in: path
          description: |
            The ID of the `Metafield`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            A `Metafield` object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetafieldResponse'
        '404':
          description: |
            A metafield was not found with this query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      security:
        - X-Auth-Token: []
    put:
      operationId: metafields_updateOrderMetafield
      summary: Update Metafield
      description: >-
        Updates a `Metafield` object.


        The maximum number of metafields allowed on each order, product, category, variant, or brand is 250 per client
        ID.
      tags:
        - metafields
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: metafield_id
          in: path
          description: |
            The ID of the `Metafield`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: |
            A metafield and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetafieldResponse'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderMetafieldRequestBadRequestError'
        '404':
          description: |
            A metafield was not found with this query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      requestBody:
        description: |
          A `Metafield` object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetafieldPut'
      security:
        - X-Auth-Token: []
    delete:
      operationId: metafields_deleteOrderMetafield
      summary: Delete Metafield
      description: |
        Deletes a `Metafield`.
      tags:
        - metafields
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: metafield_id
          in: path
          description: |
            The ID of the `Metafield`.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '204':
          description: |
            An empty response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: |
            The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/settings:
    get:
      operationId: orderSettings_getGlobalOrderSettings
      summary: Get Global Order Settings
      description: Returns global order settings.
      tags:
        - orderSettings
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_Settings_getGlobalOrderSettings_Response_200'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
      security:
        - X-Auth-Token: []
    put:
      operationId: orderSettings_updateGlobalOrderSettings
      summary: Update Global Order Settings
      description: Updates global order settings.
      tags:
        - orderSettings
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_Settings_updateGlobalOrderSettings_Response_200'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '422':
          description: >-
            Order settings data is not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse422'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalOrderSettings'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/settings/channels/{channel_id}:
    get:
      operationId: orderSettings_getChannelOrderSettings
      summary: Get Channel Order Settings
      description: Returns order settings for a specific channel.
      tags:
        - orderSettings
      parameters:
        - name: channel_id
          in: path
          description: Channel ID
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_Settings_getChannelOrderSettings_Response_200'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
      security:
        - X-Auth-Token: []
    put:
      operationId: orderSettings_updateChannelOrderSettings
      summary: Update Channel Order Settings
      description: |-
        Updates order settings for a specific channel.

         **Note:** You must override both notifications `email_addresses` or neither, i.e. either both notification `email_addresses` are an array of valid email addresses, or both `email_addresses` must be null. You may not have one set to an array of addresses and the other set to `null`.
      tags:
        - orderSettings
      parameters:
        - name: channel_id
          in: path
          description: Channel ID
          required: true
          schema:
            type: string
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order_Settings_updateChannelOrderSettings_Response_200'
        '400':
          description: Bad request. Authentication Required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '422':
          description: >-
            Order settings data is not valid. This is the result of missing required fields, or of invalid data. See the
            response for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse422'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelOrderSettings'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/payment_actions/capture:
    post:
      operationId: paymentActions_captureOrderPayment
      summary: Capture Order Payment
      description: >-
        Capture the payment for an order. When there are no payment method validation issues, the capture process is
        successful, the `payment_status` updates to `capture pending`, and the payment request is scheduled. The payment
        request itself occurs asynchronously.

        Requires at least one of the following scopes:

        * `store_v2_orders`

        * `store_v2_transactions`
      tags:
        - paymentActions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: Resource Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment_Actions_captureOrderPayment_Response_201'
        '400':
          description: |-
            Malformed request syntax. Typically need to fix the JSON.
            Body to resend successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            If something happens during the request that causes it to fail, a 502 response will be returned. A new
            request should be made; however, it could fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '503':
          description: >-
            If this occurs, you should retry the request. If you cannot successfully make a request, please check the
            BigCommerce system status [here](https://status.bigcommerce.com/). A service is likely down, and you will
            need to make the request again when it is back up (in several hours, usually).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '504':
          description: >-
            If this occurs, you should retry the request. Typically retrying the request several times will result in a
            successful request; however, if you cannot successfully make a request, please check the BigCommerce system
            status [here](https://status.bigcommerce.com/). A service is likely down, and you will need to complete the
            request again when it is back up (in several hours, usually).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetailed_Full'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/payment_actions/void:
    post:
      operationId: paymentActions_voidOrderPayment
      summary: Void
      description: >-
        Void the payment for an order. When there are no payment method validation issues, the void process is
        successful, the `payment_status` updates to `void pending`, and the void payment request is scheduled. The
        payment request itself occurs asynchronously.


        Requires at least one of the following scopes:

        * `store_v2_orders`

        * `store_v2_transactions`
      tags:
        - paymentActions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '201':
          description: Resource Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment_Actions_voidOrderPayment_Response_201'
        '400':
          description: |-
            Malformed request syntax. Typically need to fix the JSON.
            Body to resend successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            If something happens during the request that causes it to fail, a 502 response will be returned. A new
            request should be made; however, it could fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '503':
          description: >-
            If this occurs, you should retry the request. If you cannot successfully make a request, please check the
            BigCommerce system status [here](https://status.bigcommerce.com/). A service is likely down, and you will
            need to make the request again when it is back up (in several hours, usually).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Base'
        '504':
          description: >-
            If this occurs, you should retry the request. Typically retrying the request several times will result in a
            successful request; however, if you cannot successfully make a request, please check the BigCommerce system
            status [here](https://status.bigcommerce.com/). A service is likely down, and you will need to complete the
            request again when it is back up (in several hours, usually).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetailed_Full'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/payment_actions/refund_quotes:
    post:
      operationId: paymentActions_createOrderRefundQuotes
      summary: Create Refund Quote
      description: >-
        Calculate the tax amount, total refund amount and get available payment options for an order refund by providing
        items and costs or quantities to refund.


        Requires at least one of the following scopes:

        * `store_v2_orders`

        * `store_v2_transactions`   


        **Notes:**

        * Create a refund quote before performing a refund request to best avoid a `422` error. Check the refund quote's
        response body for the `refund_methods` array. The `amount` given in the array must match the `amount` used in
        the refund request body.

        * Order refunds should be processed sequentially. Processing multiple concurrent refunds on the same order is
        not yet supported.
      tags:
        - paymentActions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested refund quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment_Actions_createOrderRefundQuotes_Response_200'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundQuote_Post'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/payment_actions/refunds:
    get:
      operationId: paymentActions_getOrderRefunds
      summary: List Refunds for Order
      description: |-
        Returns a list of refunds ordered by refund ID in ascending order for the given order.

        Requires at least one of the following scopes:
        * `store_v2_transactions_read_only`
        * `store_v2_transactions`
        * `store_v2_orders_read_only`
        * `store_v2_orders`
      tags:
        - paymentActions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: transaction_id
          in: query
          description: Filters by refund payment using the BigCommerce `transaction_id`.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of refunds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment_Actions_getOrderRefunds_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: paymentActions_createOrderRefund
      summary: Create Refund
      description: >-
        Creates a refund. When there are no payment method validation issues, the refund process is successful and the
        refund payment request is scheduled. The payment request itself occurs asynchronously.


        Requires at least one of the following scopes:

        * `store_v2_orders`

        * `store_v2_transactions`


        **Note:**

        Order refunds should be processed sequentially. Processing multiple concurrent refunds on the same order are not
        yet supported.
      tags:
        - paymentActions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: transaction_id
          in: query
          description: Filters by refund payment using the BigCommerce `transaction_id`.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment_Actions_createOrderRefund_Response_200'
        '422':
          description: |
            Unable to process a guest refund with store credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderRefundRequestUnprocessableEntityError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderRefundRequestServiceUnavailableError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest_Post'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/{order_id}/payment_actions/refunds/{refund_id}:
    get:
      operationId: paymentActions_getOrderRefundById
      summary: Get Order Refund
      description: >-
        Returns a single refund for the given order by refund ID. The response has the same shape as the [Get
        Refund](/developer/api-reference/rest/admin/management/order-operations/payment-actions/get-order-refund)
        endpoint.


        Requires at least one of the following scopes:

        * `store_v2_transactions_read_only`

        * `store_v2_transactions`


        **Note:** Use a refund ID that belongs to the order in the path. The refund ID is unique across the store, so a
        refund ID that belongs to a different order still resolves to that refund.
      tags:
        - paymentActions
      parameters:
        - name: order_id
          in: path
          description: |
            The ID of the `Order` to which the transactions belong.
          required: true
          schema:
            type: integer
        - name: refund_id
          in: path
          description: Refund ID.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The ID of the created refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundID_Get'
        '422':
          description: No refund exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/payment_actions/refunds/{refund_id}:
    get:
      operationId: paymentActions_getOrderRefund
      summary: Get Refund
      description: Returns a refund by refund ID.
      tags:
        - paymentActions
      parameters:
        - name: refund_id
          in: path
          description: Refund ID.
          required: true
          schema:
            type: integer
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The ID of the created refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundID_Get'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/orders/payment_actions/refunds:
    get:
      operationId: paymentActions_getOrdersRefunds
      summary: List Refunds
      description: |-
        Returns a list of refunds ordered by refund ID in ascending order.

        Requires at least one of the following scopes:
        * `store_v2_transactions_read_only`
        * `store_v2_transactions`
        * `store_v2_orders_read_only`
        * `store_v2_orders`
      tags:
        - paymentActions
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: order_id:in
          in: query
          description: Pass a comma-separated list of order IDs to filter the included orders. Accepts multiple values.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: id:in
          in: query
          description: Pass a comma-separated list of refund IDs to filter the included refunds. Accepts multiple values.
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: created:min
          in: query
          description: |-
            Filter results so they are later than or equal to provided date.


            Must be in url-encoded RFC 3339 format.
            e.g. `2020-01-15T01:02:34-01:00` is RFC 3339 format.
            Url-encoded this will be `2020-01-15T01%3A02%3A34%2B01%3A00`
          required: false
          schema:
            type: string
            format: date-time
        - name: created:max
          in: query
          description: |-
            Filter results so they are earlier than or equal to provided date.

            Must be in url-encoded RFC 3339 format.
            e.g. `2020-01-15T01:02:34-01:00` is RFC 3339 format.
            Url-encoded this will be `2020-01-15T01%3A02%3A34%2B01%3A00`
          required: false
          schema:
            type: string
            format: date-time
        - name: transaction_id
          in: query
          description: Filters by refund payment using the BigCommerce `transaction_id`.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Specifies the page number in a limited (paginated) list of items.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Controls the number of items per page in a limited (paginated) list of items.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of refunds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment_Actions_getOrdersRefunds_Response_200'
      security:
        - X-Auth-Token: []
tags:
  - name: transactions
    description: Retrieve the payment transactions recorded for an order.
  - name: batchMetafields
    description: Create, update, and delete order metafields in bulk.
  - name: metafields
    description: Attach custom metafield data to individual orders.
  - name: orderSettings
    description: Manage store-level order settings.
  - name: paymentActions
    description: Capture, void, and refund payments on an order.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
components:
  schemas:
    TransactionEvent:
      type: string
      enum:
        - purchase
        - authorization
        - capture
        - refund
        - void
        - pending
        - settled
      description: |
        Store event that created the transaction.
      title: TransactionEvent
    TransactionMethod:
      type: string
      enum:
        - credit_card
        - electronic_wallet
        - gift_certificate
        - store_credit
        - apple_pay_card
        - bigpay_token
        - apple_pay_token
        - token
        - custom
        - offsite
        - offline
        - nonce
      description: >
        The payment method: `credit_card` - a credit card transaction; `electronic_wallet` - an online wallet;
        `store_credit` - a transaction using store credit; `gift_certificate` - a transaction using a gift certificate;
        `custom` - manual payment methods; `token` - payment token; `nonce` - temporary payment token; `offsite` -
        online payment off the site; `offline` - payment method that takes place offline.
      title: TransactionMethod
    TransactionGateway:
      type: string
      enum:
        - 2checkout
        - adyen
        - amazon
        - authorizenet
        - bankdeposit
        - braintree
        - cheque
        - cod
        - custom
        - firstdatagge4
        - giftcertificate
        - hps
        - instore
        - klarna
        - migs
        - moneyorder
        - nmi
        - paypalexpress
        - paypalpaymentsprous
        - plugnpay
        - qbmsv2
        - securenet
        - square
        - storecredit
        - stripe
        - testgateway
        - usaepay
      description: |
        The payment gateway, where applicable.
      title: TransactionGateway
    TransactionStatus:
      type: string
      enum:
        - ok
        - error
      description: |
        Status of the transaction.
      title: TransactionStatus
    TransactionOffline:
      type: object
      properties:
        display_name:
          type: string
          description: |
            Display name for the offline payment.
      description: Offline payment (e.g., check or purchase order).
      title: TransactionOffline
    TransactionCustom:
      type: object
      properties:
        payment_method:
          type: string
          description: |
            Text entered for the payment method in the control panel.
      description: Custom payment from manual order.
      title: TransactionCustom
    TransactionAvsResult:
      type: object
      properties:
        code:
          type: string
          description: AVS code.
        message:
          type: string
          description: AVS message.
        street_match:
          type: string
          description: AVS Code for street matching result.
        postal_match:
          type: string
          description: AVS Code for postal matching result.
      description: Address Verification Service (AVS) result from the payment gateway.
      title: TransactionAvsResult
    TransactionCvvResult:
      type: object
      properties:
        code:
          type: string
          description: CVV code.
        message:
          type: string
          description: CVV message.
      description: Card Verification Value result from the payment gateway.
      title: TransactionCvvResult
    CreditCardCardType:
      type: string
      enum:
        - alelo
        - alia
        - american_express
        - cabal
        - carnet
        - dankort
        - diners_club
        - discover
        - elo
        - forbrugsforeningen
        - jcb
        - maestro
        - master
        - naranja
        - sodexo
        - unionpay
        - visa
        - vr
      description: >-
        **Allowed values**: alelo, alia, american_express, cabal, carnet, dankort, diners_club, discover, elo,
        forbrugsforeningen, jcb, maestro, master, naranja, sodexo, unionpay, visa, vr
      title: CreditCardCardType
    CreditCard:
      type: object
      properties:
        card_type:
          $ref: '#/components/schemas/CreditCardCardType'
          description: >-
            **Allowed values**: alelo, alia, american_express, cabal, carnet, dankort, diners_club, discover, elo,
            forbrugsforeningen, jcb, maestro, master, naranja, sodexo, unionpay, visa, vr
        card_iin:
          type: string
          description: |
            The IIN of a credit card number.
        card_last4:
          type: string
          description: |
            The last 4 digits of a credit card number.
        card_expiry_month:
          type: integer
          minimum: 1
          maximum: 12
          description: |
            The expiry month of a credit card.
        card_expiry_year:
          type: integer
          description: |
            The expiry year of a credit card.
      description: A credit card model.
      title: CreditCard
    TransactionGiftCertificateStatus:
      type: string
      enum:
        - active
        - pending
        - disabled
        - expired
      description: >
        The status of a gift certificate: `active` - gift certificate is active; `pending` - gift certificate purchase
        is pending; `disabled` - gift certificate is disabled; `expired` - gift certificate is expired.
      title: TransactionGiftCertificateStatus
    TransactionGiftCertificate:
      type: object
      properties:
        code:
          type: string
          description: |
            The gift-certificate code.
        original_balance:
          type: string
          title: float
          description: |
            The balance on a gift certificate when it was purchased.
        starting_balance:
          type: string
          title: float
          description: |
            The balance on a gift certificate at the time of this purchase.
        remaining_balance:
          type: string
          title: float
          description: |
            The remaining balance on a gift certificate.
        status:
          $ref: '#/components/schemas/TransactionGiftCertificateStatus'
          description: >
            The status of a gift certificate: `active` - gift certificate is active; `pending` - gift certificate
            purchase is pending; `disabled` - gift certificate is disabled; `expired` - gift certificate is expired.
      description: A gift-certificate model.
      title: TransactionGiftCertificate
    TransactionStoreCredit:
      type: object
      properties:
        remaining_balance:
          type: string
          title: float
          description: |
            Remaining balance of shopperʼs store credit.
      description: |
        A store credit model.
      title: TransactionStoreCredit
    TransactionCustomProviderFieldResult:
      type: object
      properties:
        receipt_number:
          type:
            - string
            - 'null'
          description: |
            The receipt number associated with the transaction.
        authorization_code:
          type:
            - string
            - 'null'
          description: |
            Authorization code for the transaction.
        fraud_response:
          type:
            - string
            - 'null'
          description: |
            The fraud response associated with the transaction.
        amount_received:
          type:
            - string
            - 'null'
          title: float
          description: |
            The amount received for the transaction, divided by 100 to convert to the correct currency format.
      description: Fields for custom payment providers.
      title: TransactionCustomProviderFieldResult
    Transaction:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/TransactionEvent'
          description: |
            Store event that created the transaction.
        method:
          $ref: '#/components/schemas/TransactionMethod'
          description: >
            The payment method: `credit_card` - a credit card transaction; `electronic_wallet` - an online wallet;
            `store_credit` - a transaction using store credit; `gift_certificate` - a transaction using a gift
            certificate; `custom` - manual payment methods; `token` - payment token; `nonce` - temporary payment token;
            `offsite` - online payment off the site; `offline` - payment method that takes place offline.
        amount:
          type: string
          title: float
          description: |
            Amount of money in the transaction.
        currency:
          type: string
          format: ISO-4217
          description: |
            Currency used for the transaction.
        gateway:
          $ref: '#/components/schemas/TransactionGateway'
          description: |
            The payment gateway, where applicable.
        gateway_transaction_id:
          type: string
          description: |
            The transaction ID returned by the payment gateway for this transaction item.
        test:
          type: boolean
          description: |
            True if the transaction performed was a test, or if the gateway is in test mode.
        status:
          $ref: '#/components/schemas/TransactionStatus'
          description: |
            Status of the transaction.
        fraud_review:
          type: boolean
          description: |
            Result of gateway fraud review, if any. Default is `false`.
        reference_transaction_id:
          type: integer
          description: |
            Identifier for an existing transaction upon which this transaction acts.
        offline:
          oneOf:
            - $ref: '#/components/schemas/TransactionOffline'
            - type: 'null'
          description: Offline payment (e.g., check or purchase order).
        custom:
          oneOf:
            - $ref: '#/components/schemas/TransactionCustom'
            - type: 'null'
          description: Custom payment from manual order.
        payment_method_id:
          type: string
          description: |
            The payment method ID used for this transaction.
        id:
          type: integer
          description: |
            Unique identifier for the transaction.
        order_id:
          type: string
          description: |
            Identifier for the BigCommerce Order with which this transaction is associated.
        date_created:
          type: string
          format: date-time
          description: |
            The date/time of the transaction in ISO-8601 format.
        payment_instrument_token:
          type:
            - string
            - 'null'
          description: >-
            This field contains the internal BigPay token for the stored card, mapped to the third-party token. When the
            optional feature to expose provider tokens is enabled, the payment provider's instrument token and customer
            identifier are exposed via `provider_instrument_token` and `provider_customer_id`. These tokens are
            read-only and do not return any information about the payment.
        provider_instrument_token:
          type:
