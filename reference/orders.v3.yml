      title: QuantityBoundItemItemType
    RefundItemAdjustment:
      type: object
      properties:
        amount:
          type: string
          title: float
          description: A negative 2 decimal place rounded value to deduct from the amount refunded.
        description:
          type: string
          minLength: 0
          maxLength: 255
          description: Description of reason for the adjustment.
      description: Use to reduce the amount refunded for an item.
      title: RefundItemAdjustment
    QuantityBoundItem:
      type: object
      properties:
        item_type:
          $ref: '#/components/schemas/QuantityBoundItemItemType'
          description: Type of refund.
        item_id:
          type: integer
          description: Order Product ID.
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/RefundItemAdjustment'
          description: Array of product refund deductions
        quantity:
          type: integer
        reason:
          type: string
          minLength: 0
          maxLength: 1000
          description: Reason for refund.
      required:
        - item_type
        - item_id
        - quantity
      description: |
        Quantity Bound Item

        Type of refund item that capture refunding of items in the order that are of type quantity.
        * `PRODUCT`
        * `GIFT_WRAPPING`
      title: QuantityBoundItem
    AmountBoundItemItemType:
      type: string
      enum:
        - ORDER
        - SHIPPING
        - HANDLING
        - TAX
        - FEE
      description: Type of refund.
      title: AmountBoundItemItemType
    Amount:
      type: string
      title: Amount
      description: >-
        A non-negative 2 decimal place rounded value that represents the amount that can be charged/refunded with
        payment providers. When creating refunds and refund quotes, this field becomes irrelevant when you select
        PRODUCT or GIFT_WRAPPING for `item_type`.
    AmountBoundItem:
      type: object
      properties:
        item_type:
          $ref: '#/components/schemas/AmountBoundItemItemType'
          description: Type of refund.
        item_id:
          type: integer
          description: Order address ID.
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          minLength: 0
          maxLength: 1000
          description: Explanation of refund.
      required:
        - item_type
        - item_id
        - amount
      description: |-
        Amount Bound Item

        Type of refund item that capture refunding of items in the order that are of type amount.
        * `ORDER`
        * `SHIPPING`
        * `HANDLING`
        * `TAX`
        * `FEE`
      title: AmountBoundItem
    TaxExemptItemItemType:
      type: string
      enum:
        - ORDER
      description: The type of refund. When `item_type` is set to `ORDER`, tax is not re-calculated.
      title: TaxExemptItemItemType
    TaxExemptItem:
      type: object
      properties:
        item_type:
          $ref: '#/components/schemas/TaxExemptItemItemType'
          description: The type of refund. When `item_type` is set to `ORDER`, tax is not re-calculated.
        item_id:
          type: number
          format: double
          description: Numeric ID of the product in the order.
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          minLength: 0
          maxLength: 1000
          description: Reason for the refund.
      description: >-
        Use this to refund a custom value at the order level. When `item_type` is set to `ORDER`, tax is not
        re-calculated.
      title: TaxExemptItem
    FeeItemItemType:
      type: string
      enum:
        - FEE
      description: The type of refund.
      title: FeeItemItemType
    FeeItem:
      type: object
      properties:
        item_type:
