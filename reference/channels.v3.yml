openapi: 3.1.0
info:
  title: 'Admin Management: Channels'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/channels:
    get:
      operationId: channels_getChannels
      summary: List Channels
      description: >-
        Returns a list of *Channels*.


        Will always return the default BigCommerce storefront with an ID of `1`. This storefront is created by default
        when you provision a BigCommerce store.
      tags:
        - channels
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: Channels subresources that can be included in the response.
          required: false
          schema:
            $ref: '#/components/schemas/ChannelsGetParametersInclude'
        - name: available
          in: query
          description: >-
            Filter items based on whether the channel is currently available for integration. Setting this query
            parameter to `true` will return channels with the status of `prelaunch`, `active` , `inactive`, and
            `connected`. Setting this query parameter to `false` will return channels with the status of `disconnected`,
            `archived`, `deleted`, and `terminated`.
          required: false
          schema:
            type: boolean
        - name: status:in
          in: query
          description: Filter items by a comma-separated list of statuses.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChannelsGetParametersStatusInSchemaItems'
        - name: type:in
          in: query
          description: Filter items by a comma-separated list of types.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChannelsGetParametersTypeInSchemaItems'
        - name: platform:in
          in: query
          description: >-
            Filter items by a comma-separated list of platforms. For a list of supported platforms, see
            [Platform](/developer/api-reference/rest/admin/management/channels#platform).
          required: false
          schema:
            type: array
            items:
              type: string
        - name: date_created
          in: query
          description: Filter items by date created. For example, `date_created=2024-05-14T09:34:00` or `date_created=2024-05-14`.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >-
            Filter items by minimum date created. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields created after this date.
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum date created. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields created before this date.
          required: false
          schema:
            type: string
        - name: date_modified
          in: query
          description: Filter items by date modified. For example, `date_created=2024-05-14T09:34:00` or `date_created=2024-05-14`.
          required: false
          schema:
            type: string
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum date modified. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields modified after this date.
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum date modified. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields modified before this date.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Controls the number of items per page for paginated responses.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Specifies the page number for a paginated response.
          required: false
          schema:
            type: integer
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channels_getChannels_Response_200'
        '422':
          description: Invalid value is provided to the query parameter(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - X-Auth-Token: []
    post:
      operationId: channels_createChannel
      summary: Create Channel
      description: Creates a *Channel*.
      tags:
        - channels
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channels_createChannel_Response_200'
        '422':
          description: >-
            The request is missing one or more required fields or invalid data is submitted. Commonly, an invalid
            combination of `type` and `platform` was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelReq'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/channels/{channel_id}:
    get:
      operationId: channels_getChannel
      summary: Get Channel
      description: Returns a *Channel*. Channel ID `1` returns the default BigCommerce storefront.
      tags:
        - channels
      parameters:
        - name: channel_id
          in: path
          description: The ID of a channel.
          required: true
          schema:
            type: integer
            format: int64
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: Channels subresources that can be included in the response.
          required: false
          schema:
            $ref: '#/components/schemas/ChannelsChannelIdGetParametersInclude'
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested channel, including its currency assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channels_getChannel_Response_200'
        '404':
          description: A *Channel* with the provided ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - X-Auth-Token: []
    put:
      operationId: channels_updateChannel
      summary: Update Channel
      description: >-
        Updates a *Channel*.


        ## Updatable Fields


        The following fields can be updated.

        * `name`

        * `external_id`

        * `status`

        * `is_listable_from_ui`

        * `is_visible`



        > #### Note

        > * Partial updates are supported. In most cases, if a field that *cannot* be updated is passed in, the API
        **will not** respond with an error. It returns a 200 response with the object, in which you will see the
        field(s) were not updated.

        > * `platform` and `type` cannot be updated after a channel is created.

        > * A channel with status `deleted` or `terminated` cannot be updated.
      tags:
        - channels
      parameters:
        - name: channel_id
          in: path
          description: The ID of a channel.
          required: true
          schema:
            type: integer
            format: int64
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channels_updateChannel_Response_200'
        '404':
          description: A *Channel* with the provided ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A *Channel* with the same combination of `name`, `platform`, and `type` already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            When an invalid value or invalid field is submitted, a 422 response will be sent. Note that attempt to
            update a deleted or terminated channel will also result in 422 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelReq'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/channels/{channel_id}/active-theme:
    get:
      operationId: activeTheme_getChannelActiveTheme
      summary: Get Channel Active Theme
      description: |-
        Returns details of the theme active on the specified channel.
        Does not support active Blueprint (legacy) themes.
      tags:
        - activeTheme
      parameters:
        - name: channel_id
          in: path
          description: The ID of a channel.
          required: true
          schema:
            type: integer
            format: int64
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The channel's active theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Active_Theme_getChannelActiveTheme_Response_200'
        '404':
          description: Active Theme of the *Channel* was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/channels/metafields:
    get:
      operationId: batchMetafields_getChannelsMetafields
      summary: List Channel Metafields
      description: Get all channel metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Specifies the page number in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Controls the number of items per page in a limited (paginated) list of products.
          required: false
          schema:
            type: integer
        - name: key
          in: query
          description: |
            Filter based on a metafieldʼs key.
          required: false
          schema:
            type: string
        - name: key:in
          in: query
          description: Filter based on comma-separated metafieldʼs keys. Could be used with vanilla `key` query parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: namespace
          in: query
          description: Filter based on a metafieldʼs namespace.
          required: false
          schema:
            type: string
        - name: namespace:in
          in: query
          description: >-
            Filter based on comma-separated metafieldʼs namespaces. Could be used with vanilla `namespace` query
            parameter.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: direction
          in: query
          description: 'Sort direction. Acceptable values are: `asc`, `desc`.'
          required: false
          schema:
            $ref: '#/components/schemas/ChannelsMetafieldsGetParametersDirection'
        - name: include_fields
          in: query
          description: Fields to include, in a comma-separated list. The ID and the specified fields will be returned.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChannelsMetafieldsGetParametersIncludeFieldsSchemaItems'
        - name: date_modified:min
          in: query
          description: >-
            Filter items by minimum date modified. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields modified after this date.
          required: false
          schema:
            type: string
        - name: date_modified:max
          in: query
          description: >-
            Filter items by maximum date modified. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields modified before this date.
          required: false
          schema:
            type: string
        - name: date_created:min
          in: query
          description: >-
            Filter items by minimum date created. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields created after this date.
          required: false
          schema:
            type: string
        - name: date_created:max
          in: query
          description: >-
            Filter items by maximum date created. For example, `date_created=2024-05-14T09:34:00` or
            `date_created=2024-05-14`. Returns metafields created before this date.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: |
            List of `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse'
      security:
        - X-Auth-Token: []
    post:
      operationId: batchMetafields_createChannelsMetafields
      summary: Create Multiple Metafields
      description: Create multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            List of created `Metafield` objects.  
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChannelsMetafieldsRequestBadRequestError'
        '422':
          description: Unprocessable entity (The following fields are invalid.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MetafieldPost'
      security:
        - X-Auth-Token: []
    put:
      operationId: batchMetafields_updateChannelsMetafields
      summary: Update Multiple Metafields
      description: Update multiple metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            List of updated `Metafield` objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponse_POST_PUT'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChannelsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields creation with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_POST_PUT'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MetafieldPut'
      security:
        - X-Auth-Token: []
    delete:
      operationId: batchMetafields_deleteChannelsMetafields
      summary: Delete Multiple Metafields
      description: Delete all channel metafields.
      tags:
        - batchMetafields
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Response object for metafields deletion with success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionDeleteResponseSuccess'
        '400':
          description: Bad Request. Input is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteChannelsMetafieldsRequestBadRequestError'
        '422':
          description: |
            Response object for metafields deletion with partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaFieldCollectionResponsePartialSuccess_DELETE'
      requestBody:
        description: List of metafield IDs.
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/channels/currency-assignments:
    get:
      operationId: currencyAssignments_getAllCurrencyAssignments
      summary: List Channels Currency Assignments
      description: Returns a list of currency assignments for all channels.
      tags:
        - currencyAssignments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of channel currency assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency_Assignments_getAllCurrencyAssignments_Response_200'
      security:
        - X-Auth-Token: []
    post:
      operationId: currencyAssignments_createMultipleChannelsCurrencyAssignments
      summary: Create Multiple Channels Currency Assignments
      description: >-
        Sets enabled currencies and default currency for multiple channels. Note that currencies must be added first in
        the **Settings > Setup > Currencies** settings from an active MSF-enabled BigCommerce store control panel before
        the currencies can be assigned to a channel.
      tags:
        - currencyAssignments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of channel currency assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency_Assignments_createMultipleChannelsCurrencyAssignments_Response_200'
        '422':
          description: The request is missing one or more required fields or invalid data is submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMultipleChannelsCurrencyAssignmentsReq'
      security:
        - X-Auth-Token: []
    put:
      operationId: currencyAssignments_updateMultipleChannelsCurrencyAssignments
      summary: Update Multiple Channels Currency Assignments
      description: >-
        Updates enabled currencies and default currency for multiple channels. Note that currencies must be added first
        in the **Settings > Setup > Currencies** settings from an active MSF-enabled BigCommerce store control panel
        before the currencies can be assigned to a channel.
      tags:
        - currencyAssignments
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: A list of channel currency assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency_Assignments_updateMultipleChannelsCurrencyAssignments_Response_200'
        '422':
          description: The request is missing one or more required fields or invalid data is submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMultipleChannelsCurrencyAssignmentsReq'
      security:
        - X-Auth-Token: []
