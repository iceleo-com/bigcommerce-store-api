                $ref: '#/components/schemas/Currency_Assignments_createSingleChannelCurrencyAssignments_Response_200'
        '422':
          description: The request is missing one or more required fields or invalid data is submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyRequiredWithoutChannelId'
      security:
        - X-Auth-Token: []
    put:
      operationId: currencyAssignments_updateSingleChannelCurrencyAssignments
      summary: Update Channel Currency Assignments
      description: >-
        Updates enabled currencies and default currency for a specific channel. Note that currencies must be added first
        in the **Settings > Setup > Currencies** settings from an active MSF-enabled BigCommerce store control panel
        before the currencies can be assigned to a channel.
      tags:
        - currencyAssignments
      parameters:
        - name: channel_id
          in: path
          description: The ID of a channel.
          required: true
          schema:
            type: integer
            format: int64
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            The [MIME type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of the response
            body.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The channel's currency assignments.
          content:
