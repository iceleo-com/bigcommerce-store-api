            This deprecated field was originally used to enable or disable a channel. Use the `status` field instead of
            `is_enabled`. If the channel status is `prelaunch`, `active`, or `connected`, then `is_enabled` will be
            `true`. If the status is `inactive`, `disconnected`, `archived`, `deleted`, or `terminated`, then
