    ChannelsGetParametersInclude:
      type: string
      enum:
        - currencies
      title: ChannelsGetParametersInclude
    ChannelsGetParametersStatusInSchemaItems:
      type: string
      enum:
        - prelaunch
        - active
        - inactive
        - connected
        - disconnected
        - archived
        - deleted
        - terminated
      title: ChannelsGetParametersStatusInSchemaItems
    ChannelsGetParametersTypeInSchemaItems:
      type: string
      enum:
        - marketplace
        - marketing
        - pos
        - storefront
      title: ChannelsGetParametersTypeInSchemaItems
    ChannelId:
      type: integer
      format: int64
      description: The ID of the channel.
      title: ChannelId
    ExternalId:
      type: string
      description: Associated ID within a system / platform outside of BC.
      title: ExternalId
    IsListableFromUI:
      type: boolean
      description: >-
        Indicates if a channel can create listings from the BigCommerce UI. Default value for this field is based on the
        channel type and platform combination if not specified on create.
      title: IsListableFromUI
    IsVisible:
      type: boolean
      description: >-
        Indicates if a channel is visible in the BigCommerce control panel. If `false`, the channel will not show in
        Channel Manager or in channels dropdowns elsewhere in the UI. Default value for this field is `true` if not
        specified on create.
      title: IsVisible
    ChannelStatus:
      type: string
      enum:
        - active
        - prelaunch
        - inactive
        - connected
        - disconnected
        - archived
        - deleted
        - terminated
      description: >-
        The status of the channel; channel `type`, `platform`, and `status` must be a [valid
        combination](/developer/api-reference/rest/admin/management/channels#status). `terminated` is not valid for
        `PUT` or `POST` requests. `deleted` is not valid for `POST` requests. `prelaunch` is not valid for `PUT`
        requests.
      title: ChannelStatus
    ChannelName:
      type: string
      description: >-
        Name of the channel as it will appear in the store control panel. The only characters it can include are Latin
        alphabet letters, Arabic numerals, dashes, and underscores.
      title: ChannelName
    ChannelType:
      type: string
      enum:
        - pos
        - marketplace
        - storefront
        - marketing
      description: >-
        The type of channel; channel `platform` and `type` must be a [valid
        combination](/developer/api-reference/rest/admin/management/channels#status).
      title: ChannelType
    ChannelPlatform:
      type: string
      description: >-
        The name of the platform for the channel; channel `platform` and `type` must be a [valid
        combination](/developer/api-reference/rest/admin/management/channels#status).
      title: ChannelPlatform
    ChannelDateCreated:
      type: string
      format: date-time
      description: Date on which the channel was first created.
      title: ChannelDateCreated
    ChannelDateModified:
      type: string
      format: date-time
      description: Date on which the channel was most recently changed.
      title: ChannelDateModified
    IconUrl:
