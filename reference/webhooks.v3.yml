        blocked_domains:
          type: array
          items:
            $ref: '#/components/schemas/HooksAdminGetResponsesContentApplicationJsonSchemaDataBlockedDomainsItems'
          description: List of domains (destinations) that are currently on the denylist and are not being sent webhooks.
      title: HooksAdminGetResponsesContentApplicationJsonSchemaData
    HooksAdminGetResponsesContentApplicationJsonSchemaMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
      title: HooksAdminGetResponsesContentApplicationJsonSchemaMeta
    Manage_Webhooks_getHooksAdmin_Response_200:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/HooksAdminGetResponsesContentApplicationJsonSchemaData'
        meta:
          $ref: '#/components/schemas/HooksAdminGetResponsesContentApplicationJsonSchemaMeta'
      title: Manage Webhooks_getHooksAdmin_Response_200
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: >-
        ### OAuth scopes


        None required. Create and manage webhooks with the default scope of an API account.


        ### Authentication header


        | Header | Argument | Description |

        |:-------|:---------|:------------|

        | `X-Auth-Token` | `access_token` | For more about API accounts that generate `access_token`s, see our [Guide to
        API Accounts](/developer/docs/overview/api-fundamentals/api-accounts#api-accounts). |


