    HooksAdminGetResponsesContentApplicationJsonSchemaDataBlockedDomainsItems:
      type: object
      properties:
        destination:
          type: string
          format: url
          description: Domain URL to which webhooks are sent.
        time_left:
          type: integer
          description: Remaining time in seconds that the domain is on the denylist.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/HooksAdminGetResponsesContentApplicationJsonSchemaDataBlockedDomainsItemsReasonsItems'
