openapi: 3.1.0
info:
  title: 'Integrations: Webhooks'
  version: 1.0.0
paths:
  /stores/{store_hash}/v3/hooks:
    get:
      operationId: manageWebhooks_getWebhooks
      summary: List Webhooks
      description: |-
        Returns a list of all webhooks on a store associated to the `client_id` used to authenticate the request.

        *Note: BigCommerce determines the `client_id` from the `access_token`.*
      tags:
        - manageWebhooks
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: |
            Page number.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: |
            Items count per page.
          required: false
          schema:
            type: integer
        - name: is_active
          in: query
          description: >
            Enables user to filter for webhooks that are active or not. A webhook subscription becomes deactivated after
            90 days of inactivity.
          required: false
          schema:
            type: boolean
        - name: scope
          in: query
          description: |
            Enables user to filter for webhooks by scope.
          required: false
          schema:
            type: string
        - name: destination
          in: query
          description: |
            Enables user to filter for webhooks by destination.
          required: false
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: The requested webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Webhooks_getWebhooks_Response_200'
        '401':
          description: Unauthorized - the v3 Auth client ID or token in the request are not a valid combination for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
      security:
        - X-Auth-Token: []
    post:
      operationId: manageWebhooks_createWebhooks
      summary: Create Webhook
      description: >-
        Creates a webhook. Only one webhook at a time can be created. Custom headers can be added. Destination URL must
        be served on port 443 (custom ports are not currently supported).
      tags:
        - manageWebhooks
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Webhooks_createWebhooks_Response_200'
        '400':
          description: Malformed request syntax. Typically need to fix the JSON request body to resend successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '401':
          description: Unauthorized - the v3 Auth client ID or token in the request are not a valid combination for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetailed_Full'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhook_Base'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/hooks/{webhook_id}:
    get:
      operationId: manageWebhooks_getWebhook
      summary: Get Webhook
      description: Return a webhook by ID.
      tags:
        - manageWebhooks
      parameters:
        - name: webhook_id
          in: path
          description: The ID of a Webhook.
          required: true
          schema:
            type: integer
            minimum: 1
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Webhooks_getWebhook_Response_200'
        '401':
          description: Unauthorized - the v3 Auth client ID or token in the request are not a valid combination for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '404':
          description: If the requested webhook is not found, return a 404 Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
      security:
        - X-Auth-Token: []
    put:
      operationId: manageWebhooks_updateWebhook
      summary: Update Webhook
      description: Updates a webhook. You can add custom headers. At least one field is required to perform an update.
      tags:
        - manageWebhooks
      parameters:
        - name: webhook_id
          in: path
          description: The ID of a Webhook.
          required: true
          schema:
            type: integer
            minimum: 1
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Webhooks_updateWebhook_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhook_Put'
      security:
        - X-Auth-Token: []
    delete:
      operationId: manageWebhooks_deleteWebhook
      summary: Delete Webhook
      description: >-
        Deletes a webhook. Only one webhook at a time can be deleted. When a webhook is deleted, it is returned in the
        response as a 200 OK.
      tags:
        - manageWebhooks
      parameters:
        - name: webhook_id
          in: path
          description: The ID of a Webhook.
          required: true
          schema:
            type: integer
            minimum: 1
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: The MIME type of the response body that the client accepts. Typically `application/json`.
          required: false
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Webhooks_deleteWebhook_Response_200'
      security:
        - X-Auth-Token: []
  /stores/{store_hash}/v3/hooks/admin:
    get:
      operationId: manageWebhooks_getHooksAdmin
      summary: Get Admin Info
      description: List all notification emails, webhooks, and denylisted domains associated with the API account.
      tags:
        - manageWebhooks
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
        - name: is_active
          in: query
          description: >
            Enables user to filter for webhooks that are active or not. A webhook subscription becomes deactivated after
            90 days of inactivity.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manage_Webhooks_getHooksAdmin_Response_200'
        '401':
          description: Unauthorized - the v3 Auth client ID or token in the request are not a valid combination for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
      security:
        - X-Auth-Token: []
    put:
      operationId: manageWebhooks_updateHooksAdmin
      summary: Upsert Email Notifications
      description: >
        Update email addresses that are sent notification emails when any domain associated with the API account is
        denylisted or when a webhook is deactivated. Supports `upsert` functionality in the case that no email address
        exists yet.
      tags:
        - manageWebhooks
      parameters:
        - name: store_hash
          in: path
          description: Permanent ID of the BigCommerce store.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Malformed request syntax. Typically need to fix the JSON request body to resend successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '401':
          description: Unauthorized - the v3 Auth client ID or token in the request are not a valid combination for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_Full'
        '422':
          description: >-
            This occurs when missing or unacceptable data is passed for one or more fields. Please correct the values
            for the fields listed in the errors object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetailed_Full'
      requestBody:
        description: List of notification emails.
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    format: email
      security:
        - X-Auth-Token: []
tags:
  - name: manageWebhooks
    description: Create, read, update, and delete the webhooks that notify your app of store events.
servers:
  - url: https://api.bigcommerce.com
    description: https://api.bigcommerce.com
