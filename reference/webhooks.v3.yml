        destination:
          type: string
          description: >-
            URL must be active, return a 200 response, and be served on port 443. Custom ports arenʼt currently
            supported.
        is_active:
          type: boolean
          description: >-
            Boolean value that indicates whether the webhook is active or not. A webhook subscription becomes
            deactivated after 90 days of inactivity.
        headers:
          oneOf:
            - $ref: '#/components/schemas/WebhookBaseHeaders'
            - type: 'null'
          description: >-
            Headers used to validate that webhooks are active. You can pass in any number of custom headers to validate
